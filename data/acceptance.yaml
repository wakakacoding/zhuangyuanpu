# 内容验收登记（R4-T1 起用，2026-10-24 建）
# 口径：区分「结构覆盖」（有 events 文件即计）与「内容验收」（按批次人工验收通过并在此登记）。
# 结构覆盖看 data/events/ 目录；本表只登记通过内容验收的人物，两者永远不相等是常态。
# 验收标准（R4-T1 各批次交付报告实测表）：
#   1) 四件套齐备：persons + events + anecdotes（works 缺为可接受阙如，须注明）
#   2) events 每条 source_ids 非空；年份严格升序
#   3) 繁简自检通过（展示层 0 繁体；sources[].quote 原文保真除外）
#   4) validate 0 错误
# 字段说明：
#   id            人物卡 id（须存在 data/persons/）
#   batch         验收批次标识（对应交付报告）
#   date          验收日期
#   report        验收依据的交付报告路径
#   four_set      四件套状态：full（persons+events+anecdotes+works）/ no_works（缺 works）
#   note          备注（异说、保留事项等）
