# 毕沅轶事（R4-T1 批次 5，2026-10-25）
person_id: bi_yuan
anecdotes:
- title: 状元出自军机处——清代唯一的「章京状元」路径
  content: 毕沅乾隆十八年中举后授内阁中书，充军机处章京——先入中枢机要部门历练， 二十五年才中状元。本传短短两句「授内阁中书，充军机处章京。二十五年 一甲一名进士」，藏着清代状元里罕见的履历顺序：别人是状元及第后选庶吉士
    入翰林，他是军机章京任上请假应试夺魁。军机章京须明习吏事、勤于案牍， 这段经历直接塑造了他后来「职事修举」的疆吏风格。
  tier: C
  source_ids:
  - src_qingshigao_biyuan
  note: 履历出《清史稿》本传；「唯一」为概括表述，清代状元中先充军机章京后夺魁者确属罕见，表述从严读作「罕见路径」。
- title: 幕府之盛与《续资治通鉴》——「爱才下士」的另一面
  content: 本传考语「沅以文学起，爱才下士，职事修举」。毕沅幕府是清代最著名的 学人幕府之一：章学诚、洪亮吉、孙星衍、黄景仁等都曾入幕；《续资治通鉴》 二百二十卷即以幕中学力辑成，毕沅领衔而实多出幕客之手，四库馆臣以来
    评价颇高。抚陕十年修华岳庙、收碑碣储学宫，金石之好与幕府养士互为表里。
  tier: C
  source_ids:
  - src_qingshigao_biyuan
  note: 幕府人物与《续资治通鉴》成书细节已核（2026-10-25）：乾隆三十七年始、历二十年、乾隆五十七年成书；邵晋涵覆审贡献最大，孙星衍、洪亮吉、钱坫分筹，钱大昕覆勘增补考异，章学诚商定义例未被采纳——幕客参与确证，本传未载而学界公认。
- title: 身后追夺——「功名遂不终」的史笔
  content: 嘉庆二年卒于湖广总督任上，赠太子太保，看似哀荣；嘉庆四年白莲教战事 收束后追论「教匪初起失察贻误，滥用军需帑项」，夺二等轻车都尉世职、 籍没其家。《清史稿》考语直书：「然不长于治军，又易为属吏所蔽，
    功名遂不终。」状元、学者、能吏三重身份在一场军务里全部失灵—— 评价一个人「不合适」而非「不称职」，是史传里很重的措辞。
  tier: C
  source_ids:
  - src_qingshigao_biyuan
  note: 追夺与考语均出《清史稿》本传原文。
