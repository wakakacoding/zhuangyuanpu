# 蔡齐轶事（R4-T1 批次 8，2026-10-25）
person_id: cai_qi
anecdotes:
- title: 「得人矣」——状元仪仗从蔡齐开始
  content: 大中祥符八年蔡齐举进士第一，真宗见他仪表俊伟举止端重，回头对宰相寇准说： 「得人矣。」下诏金吾卫给七名骑卒开道传呼。「状元给驺，自齐始也。」—— 状元游街的荣耀排场，制度起点在此。宋人笔记里的状元荣耀想象，
    多以此为原型。
  tier: C
  source_ids:
  - src_songshi_caiqi
  note: 事出《宋史》本传原文。
- title: 拒绝以文章换参政——罗崇勋的诱惑
  content: 章献太后出重金修景德寺，命蔡齐作记。内侍罗崇勋私下派人递话：「趣为记， 当得参知政事矣。」——快点写，参知政事（副相）就是你的。蔡齐拖着不写。 崇勋怀恨进谗，齐被罢出知河南府，鲁宗道固争留之不能得。放弃一个副相
    保住一支笔——宋代士大夫「不因内侍进」底线的实证。
  tier: C
  source_ids:
  - src_songshi_caiqi
  note: 事出《宋史》本传原文。
- title: 「以恩废法，如朝廷何」——对太后的姻亲说重话
  content: 王齐雄仗势杀人，因是太后姻家未遇赦即复官。蔡齐次日入奏：「齐雄恃势杀人， 不死，又亟授以官，是以恩废法也。」仁宗想降一等给官，齐再顶回去： 「以恩废法，如朝廷何！」——皇帝终于勉从，齐雄伏罪。本传论曰称其
    「以道事君」，这一节是注脚。
  tier: C
  source_ids:
  - src_songshi_caiqi
  note: 事出《宋史》本传原文。
