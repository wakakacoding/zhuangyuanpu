person_id: chen_liang
anecdotes:
  - title: 「吾欲为社稷开数百年之基，宁用以博一官乎」
    content: >-
      淳熙五年首上孝宗书，「孝宗赫然震动，欲榜朝堂以励群臣」，将擢官任用。陈亮却笑而辞曰：
      「吾欲为社稷开数百年之基，宁用以博一官乎！」随即渡江南归。上书言事而不受官，
      终南宋一朝罕有其比。此后他五次上书、三次下狱，五十岁才以状元收场，堪称科举史上
      最特立独行的状元——中状元本身反而是他生平志向的副产品。
    tier: C
    source_ids: [src_songshi_chenliang]
    note: 语出《宋史》本传，然属个人言行叙事，入轶事层呈现。
  - title: 三次下狱：孝宗「划其牍于地」、郑汝谐「天下奇材」论
    content: >-
      陈亮一生三次系狱，皆几死而得免。第一次醉中大言「言涉犯上」，笞掠无完肤，
      孝宗曰「秀才醉后妄言，何罪之有」，划其牍于地；第二次家僮杀人被疑主使，
      辛弃疾、罗点「素高亮才，援之尤力」；第三次毒羹疑案，乡人暴死被疑下毒，
      大理少卿郑汝谐阅其单辞大异曰：「此天下奇材也。国家若无罪而杀士，
      上干天和，下伤国脉矣。」力言于光宗得免。三狱相连，皆因才高招忌。
    tier: C
    source_ids: [src_songshi_chenliang]
    note: 事皆出《宋史》本传，属案件叙事，入轶事层；三次系狱的年份多不能确考。
  - title: 「推倒一世之智勇，开拓万古之心胸」——与朱熹的义利王霸之辨
    content: >-
      陈亮与朱熹有著名的「王霸义利之辨」，书信往复经年。本传记其学术自评：
      「研究义理之精微……则于诸儒诚有愧焉。至于堂堂之阵，正正之旗……推倒一世之智勇，
      开拓万古之心胸，自谓差有一日之长。」并注明「亮意盖指朱熹、吕祖谦等云」。
      事功之学与性理之学的百年公案，状元一方是主动挑战的那个。
    tier: C
    source_ids: [src_songshi_chenliang]
    note: 语出《宋史》本传；朱陈往复书信原文在《陈亮集》，本批未录原文。
