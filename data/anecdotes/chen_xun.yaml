person_id: chen_xun
anecdotes:
  - title: 内阁三状元——明代文官政治的一个奇观
    content: >-
      正统九年陈循入文渊阁时，内阁已是状元俱乐部：曹鼐（宣德八年癸丑科状元）、
      马愉（宣德二年丁未科状元）与陈循（永乐十三年乙未科状元）三人同掌机务。
      明代内阁三大臣皆为状元郎，此为仅见。土木之变后曹鼐死于行在，
      陈循成为这个「状元内阁」的最后当家者。
    tier: C
    source_ids: [src_mingshi_chenxun]
    note: 三人状元身份与同阁见本传及泰和县政府文（今人整理）；「三状元内阁」为后世概括。
  - title: 两救言官：「彼亦忠爱也」
    content: >-
      宣德朝御史张楷献诗忤旨将获罪，陈循进言「彼亦忠爱也」，张楷得释；
      御史陈祚上疏触帝怒，循婉为解说，陈祚得不死。救言官的记录与后来
      易储时「受金不敢诤」写在同一篇本传里——《明史》笔法：先给你看他的好，
      再给你看他的软。
    tier: C
    source_ids: [src_mingshi_chenxun]
    note: 事出《明史》本传。
  - title: 「循本以才望显，及是素誉隳焉」——状元父亲的乡试舞弊嫌疑案
    content: >-
      景泰四年顺天乡试，陈循子陈英与王文子王伦落第。两位阁臣指摘考官刘俨、黄谏
      取士不公、意欲加罪，激起给事中张宁等群劾——儿子落榜，父亲动用相权构陷
      考官，这是科举史上最著名的一桩「权贵干预录取」案。代宗最终两不追究：
      考官无罪，陈英王伦另行补试。《明史》记此案后下了六个字的考语：
      「循本以才望显，及是素誉隳焉。」
    tier: C
    source_ids: [src_mingshi_chenxun]
    note: 事出《明史》本传；《菽园杂记》亦载此事（笔记层）。
