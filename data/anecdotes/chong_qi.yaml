person_id: chong_qi
anecdotes:
  - title: 「立国二百数十年，止崇绮一人」——清代唯一的旗人状元
    content: >-
      《清史稿》本传：「是岁成一甲一名进士，立国二百数十年，满、蒙人试汉文获授修撰者，
      止崇绮一人，士论荣之。」清朝开国二百余年，满蒙旗人用汉文考中状元并授翰林院修撰者，
      唯崇绮一人。蒙古正蓝旗出身、大学士赛尚阿之子，他以一场殿试打破了「旗人不点状元」
      的不成文惯例——这个「唯一」是正史盖章的，不是后人追封的。
    tier: C
    source_ids: [src_qingshigao_chongqi_shijia]
    note: 语出《清史稿》本传 A 级；属身份定论叙事，入轶事层呈现。
  - title: 状元、国丈、殉节——一人串起同治朝全部悲剧
    content: >-
      同治十一年（1872），其女阿鲁特氏册立为皇后，崇锡三等承恩公——状元而为国丈，
      清代仅此一例。同治帝崩后皇后殉之，崇绮「不自安，故再引疾」；光绪二十六年（1900）
      义和团起，他再出为「大阿哥」溥儁师傅，事败随荣禄走保定，「居莲池书院，自缢死」，
      谥文节。其妻瓜尔佳氏先于京师陷落时「预掘深坑」，率子葆初及孙辈「分别男女入坑生瘗，
      阖门死难」。一人之身，系后党、废立、庚子三大政局节点；一门之死，
      为六百状元史最惨烈的收场。
    tier: C
    source_ids: [src_qingshigao_chongqi_shijia]
    note: 事出《清史稿》本传；崇绮信仰义和团、与徐桐比而言废立等政治污点一并直书，不隐。
