# 方逢辰轶事（R4-T1 批次 4，2026-10-24）
person_id: fang_feng_chen
anecdotes:
  - title: 一榜三残——唱名殿上的「最不像状元」现场
    content: >-
      淳祐十年唱名殿上，状元方梦魁「右足跛，左目瞽」；第四名四川人杨潮、
      南省元泉州人陈应雷「皆瞽一目」。一榜而三人独眼、魁首兼跛足，
      在状元史上绝无仅有。理宗不以为嫌，亲擢第一并赐名逢辰。
      《吹剑四录》这一条现场记录，让后人知道宋季殿试真的是「以文取士」：
      形貌有残疾的读书人，照样可以站上殿试最前列。
    tier: B
    source_ids: [src_chuijian_silu]
    note: >-
      唯一同时代出处，历代考述皆转引；引文据维基脚注转录，原书待核。
  - title: 「逢辰」——皇帝赐名的双重含义
    content: >-
      他原名梦魁——梦见自己夺魁。理宗见他对策鲠亮，唱名时说：这何须梦？
      亲擢第一并改名「逢辰」：适逢其辰，正面应了「梦魁」之兆。
      一个名字从此带上了君臣相遇的印记。后来他以「君锡」为字——
      锡者赐也，「君赐」二字把赐名那一刻固定了一生。
    tier: C
    source_ids: [src_chuijian_silu, src_jiaofengwenji_fangfengchen]
    note: >-
      赐名事实见吹剑四录；改名与字「君锡」的关联解读，据今人考述
      （快懂百科：「此后，他便以君锡为字」）。「梦魁」名义解读为撰写层，
      已注明非史料原语。
  - title: 深衣殓——不仕元的遗言
    content: >-
      墓志铭记其遗言：「以深衣殓，不尚异教。」深衣是汉家士人的礼服——
      一位官至尚书的状元，遗言只求穿回儒者的衣服下葬。元世祖曾诏御史中丞
      崔彧起用他，严辞拒之；弟弟方逢振同样不仕。兄弟二人在淳安讲学终老，
      学者称蛟峰先生——宋亡之后，讲席就是他的气节现场。
    tier: B
    source_ids: [src_muzhiming_fangfengchen]
    note: >-
      遗言与拒征皆出墓志铭与今人考述汇编；「深衣=汉家士人礼服」的阐释层
      为撰写语，已注明。崔彧起用事据维基（待核原书）。
