person_id: fei_hong
anecdotes:
  - title: 拒宁王：焚舟毁家挖祖坟，也不松口
    content: >-
      宁王朱宸濠谋复护卫，「辇白金巨万，遍赂朝贵」，遣人向费宏馈彩币珍玩，宏拒却之；
      姻亲说情不为动；兵部尚书陆完试探「宁王求护卫，可复乎」，宏峻答：
      「不知当日革之者何故？」及中官持奏至阁，极言不当予。此举得罪宁王党：
      正德九年被迫致仕，钱宁遣骑兵尾随至临清「焚其舟，资装尽毁」；归乡后宁王
      再遣人通好仍谢绝，宁王遂唆使奸人李镇作乱，「索宏不得，发宏先人冢，毁其家」。
      拒一次贿要付出焚舟、毁家、掘坟三级代价，费宏一步没退——
      直到正德十四年宁王反，朝廷方知他挡的是什么。
    tier: C
    source_ids: [src_mingshi_feihong, src_qianshan_feihong_jiawen]
    note: 主体事出《明史》本传 A 级；「辇白金巨万」等句为今人传记移录本传语。
  - title: 二十岁状元被父亲当众用竹棰责打
    content: >-
      铅山费氏家法森严。费宏二十二岁任翰林院修撰时，年轻气盛，与同僚博弈争执甚激；
      其父费璠在京闻之，遣使持家法竹棰责之——身为状元郎的费宏伏地领笞，
      并向同僚致歉。铅山费氏家训「清廉为做官之首」，后来费宏三入内阁、两任首辅
      而以清白终，其起点就是这顿当众的家法。此条不见正史，出今人地方文化整理，
      列传说层。
    tier: C
    source_ids: [src_qianshan_feihong_jiawen]
    note: C 级地方文化整理，原始出处待溯；采信从宽，入轶事层。
