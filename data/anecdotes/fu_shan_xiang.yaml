person_id: fu_shan_xiang
anecdotes:
  - title: 「棘闱先设女科场」——女状元说的最早文本
    content: >-
      清人汪堃《盾鼻随闻录》卷五《摭言纪略》：「贼令女百长逐馆搜查，凡识字女子概令考试，
      以江宁人傅善祥为女状元。又女榜眼钟姓，女探花林姓，均取入伪府授女掌簿伪职，林姓
      三日即自尽。」同书卷八又收上元生员吴家桢《金陵纪事杂咏》，其诗云：「棘闱先设女科场，
      女状元称傅善祥。」诗后自注：「贼将识字女子考试，取傅善祥为第一，唤入伪府，令司批答。」
      「女状元」一说，可考的最早文本即在此处。
    tier: C
    source_ids: [src_dunbi_suiwenlu, src_jinling_jishi_zayong]
    note: >-
      汪堃此书经罗尔纲考订为「以攻击仇人何绍基为目的来编造」的被查究之书，故列 C 级；
      然而卷八所收吴家桢诗的作者是上元生员，所咏皆天京时事，属同时代纪事诗（别立 B 级
      条目）——传说最早文本里混着亲历者的诗，这正是本案不能一刀断为伪造的原因。
  - title: 榜眼、探花有了姓名——「虚上加虚」的第二次加详
    content: >-
      《江南春梦庵笔记》：「癸丑尝设女科，以傅善祥、钟秀英、林丽花为鼎甲。傅善祥，上元
      书吏之女，自愿应试者；钟即钟芳礼所掠之女，皆非本姓也。发女榜后，俱入伪宫，隔数日
      发还，并传其父谢恩，人咸悔之，故甲寅岁无一应者矣。」汪书原只说「女榜眼钟姓、
      女探花林姓」，至此则姓名、出身、来历一应俱全。
    tier: C
    source_ids: [src_jiangnan_chunmeng]
    note: >-
      此条即罗尔纲「虚上加虚，假中更假」之说的对象。罗氏将两书作伪之处列表对勘，考出
      承袭来源，断《江南春梦庵笔记》为虚构之伪书（《太平天国史料辨伪集》）。
  - title: 洪宣娇主试、试题出自《论语》——第三次加详
    content: >-
      民国间通俗史书《太平天国野史》：「太平朝既开科举，复举行考试女子之典，正主试为
      洪宣娇……题为『唯女子与小人为难养也』全章，应试者二百余人。金陵傅槐女善祥所作，
      独力辟难养之说，引古来贤女内助之功……拔置第一，饰以花冠锦服，鼓吹游街三日，
      闾阎群呼为女状元。」考官（张婉如、王自珍）、试题、应试人数、游街三日、民谣
      「祥妹子做状元」，都在这一层添出。
    tier: C
    source_ids: [src_taiping_yeshi]
    note: >-
      商衍鎏《女状元傅善祥考伪》指出三处硬伤：太平天国只有杨宣娇而无洪宣娇；「主」字为
      太平天国避讳字，不能用作官名「主试」；《论语》为太平天国禁书，不会出作试题。
      好事者又就此伪造题目、伪造文章，层层加码，遂使人目眩惊奇。
  - title: 结局诸说：死难、逃去、嫁人、服毒
    content: >-
      亲历的记载只有一句：谢介鹤《金陵癸甲纪事略》记其人其事后，于结局写道「遂不知所终，
      或云逃去」。后世的版本却越来越满：一说天京事变中死于乱军、尸沉大江；一说逃出东王府，
      后嫁太平军将领谭绍光；一说为杨秀清报仇；一说任天王掌朝仪，至天京陷落时服毒自尽。
      人物越有名，结局越完备。
    tier: C
    source_ids: [src_minjian_chuanshuo, src_jinling_guijia]
    note: >-
      诸说皆后出，无同时代记载可依。本站取其「不知所终」四字入档案，余说仅存传说层，
      不作史实陈述。
