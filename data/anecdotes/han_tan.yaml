# 韩菼轶事（R4-T1 批次 6，2026-10-25）
person_id: han_tan
anecdotes:
- title: 从遗卷到会状连元——徐干学捞起的才士
  content: 韩菼应顺天乡试时名落正榜，尚书徐干学阅遗卷（落卷）把他拔了出来。 康熙十二年（1673）会试、殿试皆第一。「特工制举文」的人差点连乡试都过不了 ——科场衡文标准与考官眼力的老问题；而徐、韩两家的缘分后来还有下文：
    徐干学罢官被构陷时，素交皆引去，「菼旦暮造门，且就当事白其诬，乃已」。
  tier: C
  source_ids:
  - src_qingshigao_hantan
  note: 事出《清史稿》本传原文。
- title: 「达海造国书，一艺耳」——从祀文庙的门槛
  content: 祭酒阿理瑚请以故大学士达海（满文创制者）从祀文庙，下部议。韩菼一句话 拦下：「从祀鉅典，论定匪易。达海造国书，一艺耳。」——从祀孔庙是儒学 典礼，造字只是一技。在清初满汉礼仪政治里，这句「持不可」需要的不只是
    学理。
  tier: C
  source_ids:
  - src_qingshigao_hantan
  note: 事出《清史稿》本传原文。
- title: 「情私而语公」——公道话招来的疏远
  content: 江宁布政使张万禄侵吞帑金三十余万，总督阿山庇之。廷议时有人指阿山与张 有牵连、其辩解「妄语罪当死」，韩菼说：纵有连，「情私而语公」——关系是私的， 话是对的。这句公道话被忌者「增益其语入告」，皇帝从此疏远他。
    后来再谢病，诏责他教庶吉士「每日率以饮酒多废学」。病甚，饮不辍，至卒。 乾隆十七年追谥文懿，制义「清真雅正，开风气之先，为艺林楷则」—— 身后文章之价，与生前宦海之蹇，恰成对照。
  tier: C
  source_ids:
  - src_qingshigao_hantan
  note: 事出《清史稿》本传原文。
