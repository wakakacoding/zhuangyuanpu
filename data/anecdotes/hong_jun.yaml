person_id: hong_jun
anecdotes:
  - title: 状元使臣：以三码电法为朝廷省钱、以西籍证补元史
    content: >-
      光绪十三年（1887）洪钧出使俄、德、奥、荷四国。驻外期间他发现国外电文用三码、
      国内用四码，遂以干支代字改创三码电法，每年为朝廷节省电费白银以万计；
      又在翻译金楷利等人的帮助下，据拉施特《史集》、志费尼《世界征服者史》、
      多桑《蒙古史》等西籍，撰成《元史译文证补》三十卷——「元朝的状元，
      用欧洲的史料补中国的正史」，开中国史学界利用外国资料研究元史之先例。
    tier: C
    source_ids: [src_hongjun_zhuang]
    note: 主体（出使四国、撰《元史译文证补》）有《清史稿》本传 A 级支撑；三码电法细节为今人传记互证，C 级。
  - title: 《孽海花》的原型——洪钧、赛金花与一部谴责小说
    content: >-
      出使四国时，洪钧携妾傅彩云（即后来的赛金花）同行，其在欧洲社交界声名颇盛。
      洪钧卒后傅彩云出走，以赛金花之名重操旧业，庚子年间又与八国联军统帅瓦德西
      的交往成为世纪公案。曾朴《孽海花》即以洪钧与傅彩云为男女主角原型——
      清末四大谴责小说中唯一一部以状元外交官为原型的作品。历史人物进入文学
      经典的通道，往往不在其本职，而在其八卦。
    tier: C
    source_ids: [src_hongjun_zhuang]
    note: 傅彩云随使、后出走为诸源一致的记载；《孽海花》为小说，其中情节不作史实引用。
  - title: 「譔元史释文证补，取材域外」——本传里的一句考语
    content: >-
      《清史稿》本传记洪钧著述作「尝譔元史释文证补，取材域外，时论称之」，
      并注明书名以传文为准（后世通行作《元史译文证补》，两名并存）。
      正史给一位状元的学术定位只有一句「取材域外」四个字，但这四个字
      在晚清史学史上是一个流派的开端。
    tier: C
    source_ids: [src_qingshigao_hongjun]
    note: 语出《清史稿》本传；「譔」字为传文保真。书目细节见 works 表。
