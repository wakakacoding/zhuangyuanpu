person_id: huang_guan
anecdotes:
  - title: 翁氏先殉
    content: >-
      黄观在外募兵，南京城破之日，其妻翁氏携二女与家属十余人，于淮清桥投水。
      黄观在罗刹矶闻讯，知妻已死，乃具衣冠东向再拜，自投急湍。一门忠烈，
      妻女殉于城破之时，丈夫殉于闻讯之后——建文逊国的臣子录里，这是最齐整的一家。
    tier: B
    source_ids: [src_mingshi_huangguan]
    note: 《明史》载翁氏投水在前，黄观闻讯殉国在后。细节各书互有异同，大义则一。
  - title: 题名碑上的凿痕
    content: >-
      永乐朝革除建文名籍，黄观的状元之名从科举录上被抹去——同一科进士录里，
      头甲第一的位置空着。传说贵池乡里的私抄本却始终留着他的名字：官府能凿碑上的字，
      凿不动乡人的记忆。三百年后翻检方志，黄观的名字端端正正，写在贵池人物志的第一页。
    tier: C
    source_ids: [src_difang_wenshi]
    note: 革除名籍为史实（A 级见明史）；民间传抄留名为地方传说，C 级展示。
