# 黄裳轶事（R4-T1 批次 7，2026-10-25）
person_id: huang_shang
anecdotes:
- title: 「宜近不宜远，宜少不宜老，宜富不宜贫」——三舍法的讣告
  content: 政和宣和间三舍法（以学校升贡取代科举）推行全国，黄裳上书总结它的实际 效果：离家近的得利、远的吃亏；年纪小的得利、老的吃亏；富家得利、贫家 吃亏——「不如遵祖宗科举之制」。四库提要引福建通志记此事，评曰「人以为
    确论」「盖亦伉直有守之士」。这项制度在宣和三年（1121）罢行，历史在 十余年后给出了和黄裳相同的结论。
  tier: C
  source_ids:
  - src_siku_yanshanji
  note: 上书语出四库提要引《福建通志》（提要为转述层）；三舍法罢于宣和三年（1121）已核《宋史》原条：徽宗纪「宣和三年二月乙酉罢天下三舍」，选举志「诏罢天下州县学三舍法惟太学仍存，开封府及诸路并以科举取士」（2026-10-25
    已核）。
- title: 紫元翁与「九真人堕人间」——状元里的道学气
  content: 黄裳素喜道家秘书，自称紫元翁，「往往爱作尘外语」。同时人庄念祖述《方外志》 甚至说他是紫微天官九真人之一、因误校仙籍被贬落人间。四库提要对此断得干脆： 「说殊诞妄……故从而附㑹之耳。」——一位状元词人被传成谪仙，是宋人叙事里
    少见的浪漫，而提要的驳斥又干干净净。他的《减字木兰花》等词至今存于 《演山集》。
  tier: C
  source_ids:
  - src_siku_yanshanji
  note: 事出四库提要（转述庄念祖《方外志》）；词作存佚细节待核《演山集》原书。
- title: 宋刊原帙六十年——一部文集的家族接力
  content: 黄裳身后，其集六十卷见于陈振孙《直斋书录解题》。乾道初（约 1165）， 季子黄玠裒辑遗稿，建昌军教授廖挺订其舛误，刻于军学，前有王悦序， 称其「渊源六经，议论一出于正」。父亲离世三十余年后，儿子把他的六十卷
    刻进了官学——宋人文献传承的一次标准接力。
  tier: C
  source_ids:
  - src_siku_yanshanji
  note: 事出四库提要卷首。
