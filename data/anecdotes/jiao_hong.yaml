person_id: jiao_hong
anecdotes:
  - title: 「考场不失火，哪有状元焦」——还金与改期的传说
    content: >-
      相传焦竑万历十七年北上会试，舟泊于岸，晨起盥洗时见船头有金镯一只，珠宝镶嵌，绚丽夺目。
      他即令船工抛锚停航，遣仆登岸访求失主，亲还金镯，因此误了考期。待赶至京城，却闻考场失火、
      考期改延，得按期入试，殿试竟名列第一。消息传开，时人遂有「德高当报，考场不失火，
      哪有状元焦」之语。
    tier: C
    source_ids: [src_rizhao_jiaohong]
    note: >-
      出今人整理之日照乡贤叙事（焦竑祖籍山东日照，为乡里后世追述），经网络百科转录，属
      二手标目、原始出处待溯，故列 C 级。明人笔记、《明史》本传与《明儒学案》均不载还金
      与考场失火二事；《明儒学案》仅记其夺魁后「京兆欲为树棹楔，谢以赈饥」，此传说或即由
      「居乡行义」之实迹敷演而成，本站作传说层备录，不入史实字段。
  - title: 《养正图说》的进呈风波与《闺范》序一案
    content: >-
      《四库全书总目·玉堂丛语》提要引朱国桢《涌幢小品》：皇长子出阁定讲官六人，太仓相公
      （王锡爵）谓宜择近而易晓者勒为一书进览，诸公不复措意，独焦竑纂《养正图说》一册。
      同官郭明龙闻之不平，曰「当众为之，奈何独出一手」；其子携归，刻于南中，送之寓所，
      适司礼监陈矩至，取去数部呈御览。诸老益恚，谓其「由他途进，图大拜」。又载焦竑为
      吕坤《闺范》作序，郑国泰（郑贵妃之侄）乞取添入后妃一门，众大哗，谓郑氏著书而
      「弱侯交结作序」。焦竑后作《玉堂丛语》，即以「雠隙」终篇，馆臣谓其即感此二事借以寓意。
    tier: B
    source_ids: [src_siku_yutangcongyu, src_mingshi_jiaohong]
    note: >-
      出《四库全书总目》卷一百四十三子部小说家类存目《玉堂丛语》提要，其据为朱国桢《涌幢小品》
      （朱国桢与焦竑同时，属亲历者笔记），故列 B 级。两说可参《明史》本传「同官郭正域辈恶其
      不相闻，目为贾誉，竑遂止」——本传言「遂止」（未进呈），《涌幢小品》言已刻于南中并经
      陈矩呈御览，两说不尽合，本站并存备考。馆臣断语「当时物议，实有其因，未可尽委之排挤也」
      为清人之见，亦并存不作定论。
  - title: 积书数万卷，主盟金陵坛坫
    content: >-
      焦竑罢官家居二十余年，以此终老。黄宗羲《明儒学案》记：「先生积书数万卷，览之略遍。
      金陵人士辐辏之地，先生主持坛坫，如水赴壑，其以理学倡率，王弇州所不如也。」同时人黄汝亨
      所作祭文亦称：「天下人无问识不识，被先生容接，如登龙门。而官留都者自六官以下，
      有大议大疑，无不俯躬而奉教焉。」其门人徐光启为《澹园续集》作序，称其「以道德经术
      表标海内，巨儒宿学，北面人宗」。
    tier: B
    source_ids: [src_mingruxuean_jiaohong, src_huangruheng_jiaohong]
    note: >-
      以《明儒学案》卷三十五为骨干，参黄汝亨《祭焦弱侯先生文》，一为史家评断、一为同时代人
      祭文，故列 B 级（非民间传说）。案「王弇州」即王世贞，嘉靖、万历间文坛领袖；黄宗羲以
      焦竑之理学士林声望驾乎其上，可见其晚明南都文宗之地位。徐光启序语据今人转录，本批未核
      原书，故仅作旁证、未单列 source。
