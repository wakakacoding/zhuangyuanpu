person_id: kang_hai
anecdotes:
  - title: 「对山救我」——一个状元如何从刘瑾手里救人
    content: >-
      正德三年，李梦阳因代草弹劾刘瑾之疏下诏狱，刘瑾必欲置之于死。梦阳在狱中传出片纸，
      只书四字：「对山救我。」对山者，康海之别号也。康海与刘瑾同乡，但素来不肯往见；
      此日闻讯，即上马驰至瑾门。阍人不为通，他呼曰：「我天下魁人也，汝公乃我乡里！」
      刘瑾素闻康海之名而不得一见，闻之即摄衣出迎，留饮坐谈。席间康海谈笑睨瑾，问：
      「自古三秦豪杰有几？」又说当今三秦豪杰不过三人——一位是昔年秉铨衡的王恕，
      一位是「密勿亲信秉大钧者」（暗指刘瑾），第三人则不肯道。刘瑾追问不已，他方以
      祢衡、李白之事相讽，终使刘瑾曰「敬闻命矣」，次日即释李梦阳。逾年刘瑾败，
      康海竟以同乡之故坐瑾党削籍——救人之举，成了毕生之累。
    tier: B
    source_ids: [src_xianzhenglu_dongyizhuan, src_mingshi_kanghai]
    note: >-
      出黄佐《董大理怡传》文末论（《国朝献征录》卷六十八），文中所引为马理（谿田）
      亲告黄佐之语，属同时代人口述；《明史》本传仅存「书片纸招海曰『对山救我』……
      海乃谒瑾，瑾大喜，为倒屣迎」一句，本件据黄佐所转载详之，故列 B 级。
      案本传所记「海不肯往」（瑾欲招致而不往）与「海乃谒瑾」并不矛盾：前者为平时，
      后者为救梦阳之时。
  - title: 吕柟眼中的康海——「直节人也，致孝于亲，且笃交谊」
    content: >-
      吕柟（号泾野）与康海同是关中人，同年先后抡元（康海弘治十五年、吕柟正德三年），
      两人交谊颇深：吕柟曾为康海《武功县志》作序，自称「吾友康子德涵」；《四库全书总目》
      论《对山集》时也说「崔铣、吕柟皆以司马迁比之」。黄佐在史馆曾问吕柟「对山何如人」，
      吕柟答曰：「直节人也，致孝于亲，且笃交谊，尝拯空同于死狱，然性度高迈，偘偘面斥人短，
      坐是致怨。」——「面斥人短」四字，说尽了康海被废的原因，也解释了为何李梦阳后来
      不肯为他申辩。
    tier: B
    source_ids: [src_xianzhenglu_dongyizhuan, src_siku_wugongxianzhi, src_siku_duishanji, src_xianyangzhi_kanghai]
    note: >-
      吕柟评语出黄佐《董大理怡传》（《国朝献征录》卷六十八）；吕柟为《武功县志》作序见
      四库本《武功县志》卷首（署正德己卯冬十一月）；「崔铣、吕柟皆以司马迁比之」见
      《四库全书总目》卷一百七十一《对山集》提要。罢官后「有人劝其上书申辩以图起复，
      他断然拒绝」一节出咸阳地方志。本件为合引，故各项分别注其出处。
      又：站内关系边记「吕柟为康海作墓表」（CBDB 机器边），本批未获其原文，见交付报告遗留。
  - title: 《中山狼》到底骂的是谁？
    content: >-
      康海罢官归里后，作杂剧《东郭先生误救中山狼》，四折，演东郭先生救狼而险被狼所噬，
      终赖杖藜老人设计杀狼。剧中狼、老杏、老牛皆能言，是古戏中的独创；其主题在斥
      「忘恩负义」之徒，一句「那世上负恩的好不多也」，痛快淋漓。故事取材于其师马中锡的
      《中山狼传》。世传康海以此剧讥李梦阳——他救梦阳出狱，自己却因救人之故坐党废籍，
      而梦阳既起用，不为一言申辩。明人黄佐已记「其后空同反嫉害对山，知者至为《中山狼》
      传刺空同，然对山未尝仇空同也」；清人焦循《剧说》、王士禛《池北偶谈》皆主刺梦阳之说，
      朱彝尊《静志居诗话》则持异议。
    tier: C
    source_ids: [src_xianzhenglu_dongyizhuan, src_siku_duishanji, src_xianyangzhi_kanghai]
    note: >-
      「《中山狼》刺李梦阳」属明清以来聚讼之说，非定论：明人黄佐《董大理怡传》记当时
      已有「知者至为《中山狼》传刺空同」之说，并特为下一转语——「然对山未尝仇空同也」；
      清焦循《剧说》、王士禛《池北偶谈》主之，朱彝尊《静志居诗话》则疑其不然。
      《四库全书总目》论康海集亦但言其「以救李梦阳故，失身刘瑾」「放浪自恣」，
      未及其剧之寓意。本站作传说层备录，不作定论；剧作本身则入 works 栏。
      剧本今存《盛明杂剧》本与孟称舜《酹江集》本。
