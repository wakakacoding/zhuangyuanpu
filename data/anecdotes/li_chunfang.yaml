# 李春芳轶事（R4-T1 批次 4，2026-10-24）
person_id: li_chunfang
anecdotes:
  - title: 「如此，庶保令名」——同僚一句逼退首辅
    content: >-
      徐阶被言官攻去位，春芳叹「徐公尚尔，我安能久？容旦夕乞身耳」。本是牢骚，
      张居正接口：「如此，庶保令名。」——您退了正好保住名声。春芳当场愕然。
      史家多读作居正盼其让位；但本传紧接着写「三疏乞休，帝不允」，
      春芳并没有立刻走，又撑了三年，直到高拱回朝凌驾其上才真正求去。
      愕然之后仍尽力国事，是这位「安静宰相」性格的注脚。
    tier: C
    source_ids: [src_mingshi_lichunfang]
    note: 事出《明史》本传原文，对话完整；「史家多读作」句为通行解读，非本传语。
  - title: 青词宰相的迟到正名——《宗藩条例》
    content: >-
      「青词宰相」是明代清议里带贬意的名号：靠写斋醮文章爬上来的阁员。
      但春芳任礼部尚书时「考故事，为书上之」，把全国宗室的吉凶大礼、岁时给赐
      整理成严密的制度，《宗藩条例》由皇帝赐名颁行——明代宗室岁禄问题拖了
      近两百年，是他以宰相之才做了技术性收口。《明史》的考语公道：
      「其才力不及也，而廉洁过之。」
    tier: C
    source_ids: [src_mingshi_lichunfang]
    note: 事出本传；「青词宰相」合称见今人叙述（快懂百科等）。
  - title: 华阳洞天主人——《西游记》托名公案
    content: >-
      今存明刊本《西游记》卷首题「华阳洞天主人校」。华阳洞在句容茅山，
      李春芳少时家贫，相传曾借灯读书于洞中；于是清代以来有人提出：
      校者即李春芳。此说至今无定论，主流意见仍以校者身份不明为慎。
      一位状元首辅与一部神魔小说的千年联想，恰是「乡邦叙事如何攀附名人」
      的标准样本——本站录此存公案，不强断。
    tier: C
    source_ids: [src_xinghua_lichunfang]
    note: >-
      「华阳洞天主人校」题名见于明刊本（版本事实）；「校者即春芳」为清以来
      推测说，鲁迅《中国小说史略》持保留态度（转述，待核原书）。
      「借灯读书」为地方叙事层。
