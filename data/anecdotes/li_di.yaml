# 李迪轶事（R4-T1 批次 6，2026-10-25）
person_id: li_di
anecdotes:
- title: 袖中册子——「颇、牧在禁中」
  content: 真宗问关右驻兵几何，李迪答：臣昔在陕西，把兵粮数目记在方寸小册上备调发， 「今犹置佩囊中」。当场探出册子，命黄门取纸笔，某处当留兵若干、余悉赴塞下， 一一具疏。帝顾曰：「真所谓颇、牧在禁中矣。」——廉颇李牧就在您身边。
    未几曹玮三都谷果大胜，迪又以「以逸待劳」四字释其必胜之由。 状元而通兵略，宋初罕见。
  tier: C
  source_ids:
  - src_songshi_lidi
  note: 事出《宋史》本传原文。
- title: 「陛下有几子？」——一句话救下太子
  content: 周怀政之诛，真宗怒甚欲责及太子（后来的仁宗），群臣莫敢言。李迪从容奏曰： 「陛下有几子？乃欲为此计。」——您有几个儿子，竟要这样办？上大悟， 独诛怀政等。不引经不据典，一句家常话点醒盛怒中的皇帝，是「从容」二字
    的千古示范。
  tier: C
  source_ids:
  - src_songshi_lidi
  note: 事出《宋史》本传原文。
- title: 「天下惜之」而已——丁谓的冷血名对
  content: 李迪贬衡州团练副使，丁谓派人迫害。有人劝：李迪若贬死，天下舆论怎么看您？ 丁谓答：「异日诸生记事，不过曰『天下惜之』而已。」——后世读书人记下这事， 也不过写一句「天下惜之」罢了。把士论看得如此之轻的人，次年自己贬崖州，
    路过雷州求见寇准被拒。史家把这组对照留在同一卷里。
  tier: C
  source_ids:
  - src_songshi_lidi
  note: 事出《宋史》本传原文；丁谓贬崖州、寇准拒见事为同卷通行叙述（细节待核本传寇准篇）。
