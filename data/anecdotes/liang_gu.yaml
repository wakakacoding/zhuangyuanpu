person_id: liang_gu
anecdotes:
  - title: 让还恩荫进士，自赴乡举——「父子状元」的第二种打开方式
    content: >-
      父梁颢状元及第后早逝，梁固初以父遗荫赐进士出身——功名到手的捷径就在脚下。
      他服阕后诣登闻院，把到手的功名让还朝廷，愿自赴乡举从头考起，获准。
      大中祥符年间再登高第（科年科目两说并存），世称「父子状元」。
      靠继承得来的进士不要，要自己去挣一个——这个选择让「父子状元」四个字
      从门第佳话变成了本事佳话。
    tier: C
    source_ids: [src_songshi_liang]
    note: 事出《宋史》本传（让还恩荫事见传文）；科年科目异说已注 events。
  - title: 天禧大礼奏颂甚工，「无几卒」——比父亲更短命的天才
    content: >-
      梁固官至著作郎、直史馆。天禧年间大礼成，他奏颂甚工，文名正盛，
      「无几卒」——没多久就死了，年三十三（CBDB 作 987–1019，异说并存）。
      父亲四十二岁暴病卒于开封府任上，儿子三十三岁卒于直史馆任上，
      这对父子状元的生命时钟，一个比一个紧。南宋洪迈考梁颢年岁时曾连带
      记「子固亦进士甲科，至直史馆，卒年三十三」——考据父案，顺带留下了
      儿子的生命刻度。
    tier: C
    source_ids: [src_songshi_liang, src_chaoye_zaji]
    note: 卒年三十三出《宋史》本传；洪迈《容斋四笔》语见梁灏故事出处（chaoye_zaji 为李心传《朝野杂记》——洪迈语另见容斋四笔，本条以宋史+朝野杂记两源支撑）。
