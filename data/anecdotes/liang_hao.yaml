person_id: liang_hao
anecdotes:
  - title: 「若梁灏，八十二」——《三字经》里的状元
    content: >-
      《三字经》：「若梁灏，八十二。对大廷，魁多士。彼既成，众称异。尔小生，宜立志。」
      谓梁灏八十二岁夺魁，为蒙学劝学之名段。其说源出北宋陈正敏《遁斋闲览》
      （约成书于崇宁、大观间）：「梁灏八十二岁，雍熙二年状元及第……后终秘书监，
      卒年九十余。」
    tier: C
    source_ids: [src_sanzijing, src_dunzhai_xianlan]
    note: 正史载其夺魁时年二十三、卒年四十二，「八十二」说系讹传，异说并存备考；洪迈《容斋四笔》已据国史辨之。
  - title: 谢启联与登第诗——谣言的自洽伪证
    content: >-
      《遁斋闲览》载梁灏谢启联：「白首穷经，少伏生之八岁；青云得路，多太公之二年。」
      伏生年九十传《尚书》，太公八十遇文王——联语上下各自暗扣「八十二」，与谣传年龄
      严丝合缝。又载登第诗：「天福三年来应试，雍熙二载始成名。饶他白发巾中满，
      且喜青云足下生。」以后晋天福三年（938）起算，应举四十七年——而梁颢生于
      建隆四年（963），天福三年时尚未出世，诗、事皆伪。
    tier: C
    source_ids: [src_dunzhai_xianlan]
    note: 伪证文本自身暗含反证：天福三年（938）应试与雍熙二年（985）夺魁、生年（963）三者不能并立。
  - title: 《梁状元一世不伏老》——舞台上的八十二岁
    content: >-
      明·冯惟敏杂剧《梁状元一世不伏老》（一题《玉殿传胪记》，《远山堂剧品》著录），
      敷衍《遁斋闲览》之说：梁颢少年中举，此后十余次会试不第，双鬓皤然志不移，
      终以八十二岁夺魁，皇帝亲御正殿传胪唱名「第一甲第一名梁颢」。祁彪佳称
      「得此剧，大为击节」。
    tier: C
    source_ids: [src_bufulao]
    note: 戏曲演绎属传说层再创作，与史实隔离存放；本事的史实底座见 events 栏及考证故事。
