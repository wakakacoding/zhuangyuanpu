person_id: lin_zhao_tang
anecdotes:
  - title: 道光朱批「今科得一佳元，一字笔误偏旁，非关学问」
    content: >-
      相传道光三年殿试阅卷，道光帝见林召棠卷有一字竖笔提笔稍快、带出小挑勾（笔误偏旁），
      朱批：「今科得一佳元，一字笔误偏旁，非关学问」，钦点一甲第一名。此批语为粤地
      状元叙事常见引语，多家媒体与政府志页转录。
    tier: C
    source_ids: [src_wuchuan_renwu_lin]
    note: >-
      朱批原文未见清宫档案或国史原典公布，均出后世方志系与今人记述转引，原始出处待溯，
      故列 C 级（二手标目）。本条不作为科年、名次的依据——两者已由 B 级县志影印条覆盖。
  - title: 关帝庙即席联——「匹马斩颜良，河北英雄皆丧胆」
    content: >-
      相传林召棠回乡省亲途经苏州，衣着朴素如落第书生，当地人有意试他，借新建成关帝庙
      缺门联，请其即席挥毫。林召棠提笔直书：「匹马斩颜良，河北英雄皆丧胆；单刀会鲁肃，
      江南士子尽寒心。」语带双关（苏州地处江南），众人叹服。
    tier: C
    source_ids: [src_wuchuan_renwu_lin]
    note: >-
      出粤地方志系记述与媒体转录的民间传说（湛江新闻网、中国地情网均有载），无同时代
      文献佐证，列 C 级传说层备录，不入史实字段。
  - title: 「我是耕田识字夫」——自刻印章与《治家格言》
    content: >-
      林召棠一生甘于淡泊，自奉俭朴，自撰《治家格言》教训儿孙，有「日食饭当思耕田人之苦，
      日着衣当思织布人之劳」之句，并自刻印章「我是耕田识字夫」。晚年居家，在村边金莲庵旁
      建泡影园，自作楹联「卧听大海风潮上，曾阅莲花世界来」，春秋佳日招朋辈游赏赋诗。
    tier: B
    source_ids: [src_wuchuan_renwu_lin]
    note: >-
      印章、格言、泡影园联语均为方志系统记述（县志传与政府志页同源转录），属地方志记载
      层，列 B 级；「格言」文字两处转录略有出入（「辛苦/之苦」），取志页文字。
  - title: 义仓与「宾兴」——状元回乡的实事
    content: >-
      林召棠归里后在村中首创「义仓」救济贫民，为县倡议举办「宾兴」（奖学基金），并作
      《吴川县宾兴刍议》。道光二十二年（1842）同年翰林黄广荫致书劝他复出，他以
      「圣眷方殷，臣心似水，向高尚若是」辞谢；黄广荫又从京都领取吴川盐围补给银寄赠，
      他均不受，此款存省多年，后托翰林陈兰彬送返朝廷。
    tier: B
    source_ids: [src_wuchuan_renwu_lin]
    note: >-
      义仓、宾兴、辞谢黄广荫、盐围银不受诸事均见政府人物志页（方志系统），列 B 级。
      陈兰彬（首任驻美公使，亦吴川人）为其送返银款一事，可与站内陈兰彬资料互证，
      惟本站暂无陈兰彬人物卡，先备录于此。
