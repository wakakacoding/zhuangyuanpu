person_id: luo_hongxian
anecdotes:
  - title: 万金求一言而不得——「君不闻志士不忘在沟壑耶」
    content: >-
      罗洪先初请告归，路过仪真，同榜进士项乔时任分司。当地有富人犯死罪，拿出万金，
      求洪先向项乔说一句话为之地步。洪先拒绝不听；项乔微讽他何不圆融些，洪先厉声曰：
      「君不闻志士不忘在沟壑耶！」——「志士不忘在沟壑」语出《孟子》，意思是志士即便
      死在沟壑之中，也不失其志。后来江涨坏了他的居室，巡抚马森要为他营建，他也固辞不受。
      万历间他谥「文恭」，后人每以此语状其一生之守。
    tier: B
    source_ids: [src_mingshi_luohongxian]
    note: >-
      出《明史》本传，属正史所载琐事，故列 B 级。「江涨坏其室，巡抚马森欲为营之，固辞不可」
      本传与徐阶《墓志铭》并载。案《明儒学案》卷十八另记其「请告归，过仪真，一病几殆」，
      与项乔分司之事同出一时。
  - title: 衡岳拒丹——「吾道自足，宁须此」
    content: >-
      罗洪先被黜为民之后，游南岳衡山。山中有僧楚石，据说不下山已八年；见洪先至，
      乃迎见，自言曾受异僧所授外丹，「无足传者，今以授公」。洪先答曰：「吾道自足，
      宁须此乎？」拒而不受。又有友人作书以仙学相招，他亦作长书作答，却之。当时士大夫
      见他静坐经年、甘于淡泊，或疑其近于禅，久之乃知其「真能主静归寂，本无欲以措之经世，
      卓然得致良知之真传也」。
    tier: B
    source_ids: [src_nianangong_muzhiming, src_mingruxuean_luohongxian]
    note: >-
      出徐阶《念庵罗公墓志铭》，属墓志类当事人同时代材料，故列 B 级。《明儒学案》卷十八
      亦记其「辟石莲洞居之，默坐半榻间，不出户者三年」，并载其自答「事能前知，人或讶之，
      答曰：是偶然，不足道」，可与本件并观。
  - title: 五岁之梦与「事能前知」——学案追述中的神异笔墨
    content: >-
      《明儒学案》记罗洪先年五岁时，梦通衢之上市人扰扰，乃大呼曰：「汝往来者皆在吾梦中耳！」
      既觉，以告其母李宜人，「识者知非埃壒人也」。同书又记其居石莲洞日，「事能前知」，
      人或讶之，他答曰：「是偶然，不足道。」——梦兆、前知这类笔墨，是明清学案为理学人物
      立传时的常见笔法，未必可据为事实。
    tier: C
    source_ids: [src_mingruxuean_luohongxian]
    note: >-
      出《明儒学案》卷十八，属清初学案对前代学者的追述，其中神异叙述不当作史实，
      故降列 C 级并特为标出。本站取此条之意有二：① 见学案叙人之体例；② 其中「是偶然，
      不足道」一句，恰与罗洪先本人反对虚夸的态度相合，可与《明史》「甘淡泊……靡不精究」
      并读。史料层面不作任何推论。
