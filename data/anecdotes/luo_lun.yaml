person_id: luo_lun
anecdotes:
  - title: 「家贫日中不能举火，而对客谈学不倦」
    content: >-
      《明儒学案》记罗伦居家之况：「家贫，日中不能举火，而对客谈学不倦。高守赠以绨袍，
      遇道殣，辄解以瘗之。」又记其欲仿古置义田以赡族人，邑令助以「堂食之钱」，他辞曰：
      「食以堂名，退食于公之需也，执事且不可取，何所用与？」谢而弗受。《明史》本传亦记
      「衣食粗恶，或遗之衣，见道堇，解以覆之。晨留客饮，妻子贷粟邻家，及午方炊，不为意」。
      黄宗羲由此断曰：「冻馁几于死亡，而一无足以动于中。若先生庶几可谓之无欲矣。」
    tier: B
    source_ids: [src_mingruxuean_luolun, src_mingshi_luolun, src_siku_yifengji]
    note: >-
      以《明儒学案》卷四十五为骨干，参《明史》本传与《四库全书总目》所引，三者皆史传、
      书目系统之材料（非民间传说），故列 B 级。《四库总目》评其「刚毅之气，形于楮墨」、
      《明儒学案》引章懋语「先生方可谓之正君善俗，如我辈只修政立事而已」，皆就其品格而言。
      其「辞堂食之钱」一事尤可与前朝王曾「不受郊迎」一类士风相参。
  - title: 「还金镯，救二命」——赴试途中折返五日的传说
    content: >-
      传称成化二年罗伦北上会试，途中仆人在某家门首拾得金镯一只，行五日方告之。罗伦大怒，
      即欲返原地送还，仆以将误考期相劝，罗伦曰：「这金镯必是人家婢女或仆人不小心失落，
      若被主人逼问拷打致死，是谁的罪过？我宁愿不参加会试，也不能使人因而致死。」遂主仆折返。
      果有婢女泼水时遗失金镯，被主母疑其私藏而鞭笞流血，几次寻死；主母之夫又疑其妻私赠他人，
      其妻衔冤欲自缢。罗伦送还金镯，两命俱全。再赶赴京城，殿试对策直斥时弊，竟擢第一。
    tier: C
    source_ids: [src_luoshi_xiangxian_luolun]
    note: >-
      出今人整理之罗氏乡贤与民间善书叙事，经网络转录，属二手标目、原始出处待溯，故列 C 级。
      明人笔记、《明史》本传与《明儒学案》均不载此事。
      ⚠ **本批对照**：焦竑条亦收同型传说（「船头金镯，还主误考期，考场失火改期」，
      见 `src_rizhao_jiaohong`）——两位不同时代、籍贯、行事的状元共有「途中还金」母题，
      当属民俗叙事套式（近于「阴德报状元」类型），非史实互证，两处均仅作传说层备录。
  - title: 泉州仙公山祈梦题诗与「梅石开，状元来」
    content: >-
      泉州双髻山（仙公山）为九仙祈梦之地，至今流传罗伦祈梦之传说：他赴京赶考前至此祈梦，
      在丰山洞中住了九天九夜而一梦无成，第十天清晨愤而题诗于壁：「千里路途来求梦，九霄无梦
      是无缘。神仙不管凡间事，回去江西中状元。」掷笔而去，行至山下遇雷，返洞取伞时见壁上诗
      已被改动二字——「无缘」改「有缘」、「不管」改「专管」，墨汁犹未干。后罗伦果中状元。
      又清·周学曾《晋江县志·学校志》载民间旧有「梅石开，状元来」之谶，谓罗伦至而石开、
      香闻数里，其后百五十余年，本邑庄际昌殿试第一以应之。罗伦身后，泉州士人于其讲学处建祠，
      嘉靖八年改净真观地建「一峰书院」（以近旁有石若梅花，又称梅石书院），与宋守王十朋、
      真德秀合祀。
    tier: C
    source_ids: [src_quanzhou_luolun]
    note: >-
      祈梦题诗出《双髻仙山志》（今人李佳福主编），「梅石开」之谶与一峰书院出清·周学曾
      《晋江县志·学校志》，皆经今人整理转录、原书未见，属二手标目、原始出处待溯，故列 C 级。
      案祈梦题诗之说，与罗伦「刚介绝俗」「不作和同之语」之性格适成对照，当系民间为其行迹
      所造之神话；而一峰书院受祀一事有《晋江县志》所载及后世碑记可稽，史料性质高于前者，
      然本批均未核原书，故一并作传说层备录。**留意**：罗伦谪所泉州与其「江西中状元」之
      题诗末句合读，可见传说实基于其谪官泉州之真实经历而生。
