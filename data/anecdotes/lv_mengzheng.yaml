# 吕蒙正轶事（R4-T1 批次 8，2026-10-25）
person_id: lv_mengzheng
anecdotes:
- title: 「不记人脸」——状元参政的第一课
  content: 初入朝堂，有朝士隔着帘子指认：「此子亦参政耶？」——这小子也配参政？ 吕蒙正装没听见走过去。同列不平要追问姓名，他拦住：「若一知其姓名， 则终身不能忘，不若毋知之为愈也。」——知道了名字就一辈子忘不掉，
    不如不知道。「时皆服其量。」宽恕的极限不是原谅，是不留记忆。
  tier: C
  source_ids:
  - src_songshi_lvmengzheng
  note: 事出《宋史》本传原文。
- title: 破镜之喻——「吾面不过楪子大」
  content: 有朝士藏古镜一面，自称能照二百里，想献给吕蒙正求引荐。蒙正笑答： 「吾面不过楪子大，安用照二百里哉？」——我的脸不过碟子大，要照二百里的 镜子干什么。「闻者叹服。」拒贿史上最幽默的一句。
  tier: C
  source_ids:
  - src_songshi_lvmengzheng
  note: 事出《宋史》本传原文。
- title: 灯夕唱反调——「都城外不数里，饥寒而死者甚众」
  content: 上元灯夕，太宗设宴自述太平气象，君臣称颂。吕蒙正避席而出：「臣尝见都城外 不数里，饥寒而死者甚众，不必尽然。愿陛下视近以及远。」「上变色不言。 蒙正侃然复位。」——满殿灯火之下说都城外有人冻饿而死。宰相在皇帝的
    嘉年华上泼冷水的标本，也是他「质厚宽简」考语之外的另一面。
  tier: C
  source_ids:
  - src_songshi_lvmengzheng
  note: 事出《宋史》本传原文。
- title: 寒窑宰相与千古名篇——本传之外的补充
  content: 吕蒙正幼年被父亲逐出、与母寄居破窑的窘乏，本传有载（「颇沦踬窘乏」）； 后世据此敷衍出《破窑记》杂剧与署名吕蒙正的《寒窑赋》——「天有不测风云， 人有旦夕祸福」的名句流传极广。然《寒窑赋》实为托名（宋人文集及宋元书目
    均不载，待核考证文献），本站按轶事层存录此公案，不计入确定著作。
  tier: C
  source_ids:
  - src_songshi_lvmengzheng
  note: 破窑经历出本传；元杂剧《吕蒙正风雪破窑记》今存本署王实甫，作者有王实甫/关汉卿/无名氏三说（学界无定论，2026-10-25 已核）；《寒窑赋》托名已确证为伪托（2026-10-25 已核）：宋元史籍文集目录均不载（《宋史·艺文志》无，《古文观止》《宋文鉴》《全宋文》均不收），最早实物为明末刘宪章书迹，故事蓝本出自元杂剧，文风与吕蒙正不符——本站按轶事层存录此公案，不计入确定著作。
