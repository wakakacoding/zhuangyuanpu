person_id: lv_nan
anecdotes:
  - title: 正德三年那一榜：杨慎的卷子被火烧了？
    content: >-
      科举史上流传着一个说法：正德三年戊辰科（1508）殿试原本取杨慎为第一，因杨慎的
      试卷被火焚毁而落第，状元遂归吕柟。三年之后，杨慎于正德六年再试，仍然抡元。
      这一说把「状元」讲成了一桩意外，也把杨慎讲成了一位被命运开了玩笑的才子。
    tier: C
    source_ids: [src_minjian_chuanshuo]
    note: >-
      此说不见于《明史》《明儒学案》及明代登科记录，属流传之辞（本站无可靠一手出处，
      故列 C 级传说）。今人研究者已明辨其非：杨慎正德六年之捷，其师李东阳方任内阁
      首辅并主殿试之审，师徒相得，本无需假手「火焚试卷」之说。故事虽婉转，实为
      将「杨状元」神话化的后世附会，姑存传说层，不作史实依据。
  - title: 讲学所至：盗贼诫其使、梓人还其物
    content: >-
      吕柟讲学之效，明人记作两桩异闻。其一：高陵有大吏张甚，其使者路过高陵，必诫之曰
      「吕公在，汝不得作过也」。其二：有梓人张提听吕柟讲学，自悟其非，曾妄取他人财物，
      追还本主。另有隐士仇栏于道上遮道问学，朝鲜国闻其名，奏请以其文为式国中。
    tier: B
    source_ids: [src_mingruxuean_lvnan]
    note: >-
      出黄宗羲《明儒学案》卷八，属明代学术掌故，故列 B 级。三事皆以「讲学所及」
      为叙述骨架，细节未必一一可核（如朝鲜奏请之具体年份、文书），本站照录原文，
      不作增益。
