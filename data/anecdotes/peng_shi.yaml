# 彭时轶事（R4-T1 批次 6，2026-10-25）
person_id: peng_shi
anecdotes:
- title: 释褐逾年参大政，「前此未有也」
  content: 正统十三年中状元，次年土木之变郕王（景帝）监国，令彭时与商辂同入阁预机务。 他正逢继母之丧力辞，不允乃拜命。本传点睛：「释褐逾年参大政，前此未有也。」 脱下布衣才一年多就参预国家大政，明代此前没有先例——国难把两个年轻翰林
    直接推进了权力中枢，彭时与商辂（本站已录）的同框自此开始。
  tier: C
  source_ids:
  - src_mingshi_pengshi
  note: 事出《明史》本传原文。
- title: 「彭公，真君子也」——政敌李贤服其谅直
  content: 天顺朝李贤当国数召独对，雅重彭时退必咨之；时引义争可否或至失色。 「贤初小忤，久亦服其谅直，曰：『彭公，真君子也。』」门达构陷李贤时， 帝惑之曰「去贤，行专用时矣」——离间的话传到彭时耳中，他矍然曰：
    「李公有经济才，何可去？」因力直之，且曰「贤去，时不得独留」。 被许诺独得重用，却替「挡路」的同事辩护到底。
  tier: C
  source_ids:
  - src_mingshi_pengshi
  note: 事出《明史》本传原文。
- title: 伏文华门泣请——钱太后合葬祔庙之议
  content: 慈懿太后（钱皇后）崩，周太后不愿其与英宗合葬。彭时引汉文帝尊薄太后而 吕后仍祔长陵、宋仁宗追尊李宸妃而刘后仍祔太庙两例，力主「梓宫当合葬裕陵， 主当祔庙」。帝重违太后意，「时偕朝臣伏文华门泣请。帝与太后皆感动，
    始从时议」。明代宫廷礼制最著名的一战，状元出身的阁臣以眼泪和故事赢下的。
  tier: C
  source_ids:
  - src_mingshi_pengshi
  note: 事出《明史》本传原文。
