person_id: qian_qi
anecdotes:
  - title: 乾隆御制三元诗——「国朝经百载，春榜得三元」
    content: >-
      钱棨胪唱之日，乾隆帝亲制诗记盛：「龙虎传胪唱，太和晓日𬚧。国朝经百载，春榜得三元。
      文运风云壮，清时礼乐蕃。载咨申四义，敷奏近千言。讵止求端楷，所期进谠论。
      王曾如可继，违弼我心存。」诗以宋代三元状元王曾相拟，视为太平盛世的文运祥瑞。
      相传此诗曾刻碑立于苏州文庙；其乡试座主翁方纲又广征贺诗，汇编为《三元诗集》。
    tier: B
    source_ids: [src_manhan_qianqi]
    note: >-
      御制诗全文见《满汉大臣列传》本传（A 级），此处作轶事呈现。「刻碑苏州文庙」「翁方纲
      汇编《三元诗集》」出后世记述（如《清稗类钞》系），本条未单独核原书，故整条列 B 级、
      诗句以本传为准。
  - title: 三元坊——地名比牌坊活得久
    content: >-
      钱棨夺魁后，在其进学之地苏州府学一带建「三元坊」以为纪念。石牌坊后已拆除，
      但「三元坊」作为地名沿用至今（今苏州人民路沧浪亭北一段），苏州地铁亦有同名站点。
      另据今人记述，钱棨县、府、院试连得案首（俗称「小三元」），合乡、会、殿三试第一，
      故有「六元状元」之称——县府院「小三元」不见于国史列传，出后世方志与今人整理。
    tier: B
    source_ids: [src_manhan_qianqi]
    note: >-
      「三元坊」地名可今证（地名沿用与地铁站点）；「六元」（小三元+大三元）说法出《吴县志》
      系记述与今人整理，原始童试试卷序列无从复核，故整条列 B 级，站内标签「六元状元」
      依此口径备录。人物卡 bio_short 已有「六元状元」表述，与本条分层一致。
