person_id: qin_da_shi
anecdotes:
  - title: 「一朝天子一朝臣」——乾隆问秦桧后人
    content: >-
      《清朝野史大观》载：秦大士在朝时，乾隆偶问：「汝家果秦桧后人乎？」
      秦无他言，但对曰：「一朝天子一朝臣。」——不认祖，不辩解，一句话把
      忠奸之辨从血统转到了时政。此答为清代君臣问答掌故中最著名的一则，
      是否实有其事不可考，然流传之广已使秦大士成为「历史包袱处理学」的代言人。
    tier: C
    source_ids: [src_yeshi_daguan_qindashi]
    note: 野史掌故；秦大士与秦桧的亲缘关系本身诸说并存（见第 3 条）。
  - title: 「人于宋后羞称桧，我到坟前愧姓秦」——袁枚代拟的一联
    content: >-
      民间通行说法：秦大士游西湖岳王坟，被友人逼题对联，遂写下「人从宋后羞名桧，
      我到坟前愧姓秦」。但《清稗类钞》记得更细：秦大士被人纠缠题句、大为不快，
      是袁枚替他代吟了这副对子，还评「微子才，殆矣」——没有袁枚解围，
      秦大士几乎下不来台。名联的著作权属袁枚，传说的著作权属民间。
      两说并存，本站从《清稗类钞》。
    tier: C
    source_ids: [src_qingbeileichao_qindashi]
    note: 通行「秦大士亲题」说无早期文献佐证；徐珂记为袁枚代拟。
  - title: 秦桧之后？——野史、考古与一段悬而未决的身世
    content: >-
      秦大士是否秦桧后裔，三说并存：其一，正史无文；其二，野史记其为秦桧兄、
      主战派秦梓之后；其三，2000 年代文物普查在南京江宁洪幕山林场发现秦大士墓碑，
      该地正在秦桧家族墓葬区范围内，考古意见据此倾向其为秦桧一系之后——若然，
      则「一朝天子一朝臣」的回答便有了更重的分量。身世悬案至今未定谳，
      本站不作独断，诸说并陈。
    tier: C
    source_ids: [src_yeshi_daguan_qindashi]
    note: 考古发现为新闻媒体报道，本批未核考古报告原文；存疑待考。
