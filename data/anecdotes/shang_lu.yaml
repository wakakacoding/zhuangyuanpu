person_id: shang_lu
anecdotes:
  - title: 「朕所取士」
    content: >-
      夺门之变后，徐有贞、石亨构陷于谦，商辂被牵连下狱。英宗翻阅旧档，看到商辂的名字，
      想起这是自己正统年间亲擢的状元，犹豫良久，终究说了一句惋惜的话。就这一念之仁，
      商辂从鬼门关捡回性命，削籍为民，回乡闲居十年。同案的于谦死了，商辂活着——
      生死之间，有时候只隔着皇帝记忆里一场殿试。
    tier: B
    source_ids: [src_mingshi_shanglu]
    note: 《明史·商辂传》载英宗惜之，得免死为民；具体问答措辞各本记载略异，大意如此。
  - title: 三元牌坊下的话
    content: >-
      商辂晚年归乡，严州府城里立着为他而建的三元牌坊。乡人传说，有少年在牌坊下立志
      「他日亦作三元」，商辂听见了，只淡淡说了一句勉励的话，并无倨傲之色。乡邦记忆里
      的三元公，从来不是牌坊上那个冷冰冰的名字，而是会给后辈让路的老先生。
    tier: C
    source_ids: [src_difang_wenshi]
    note: 地方传说，C 级展示。严州三元坊今已不存，淳安有商辂故里遗存。
