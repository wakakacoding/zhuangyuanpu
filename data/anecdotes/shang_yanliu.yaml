person_id: shang_yanliu
anecdotes:
  - title: 末科探花，把科举写进了学术史
    content: >-
      光绪三十年（1904）甲辰恩科，商衍鎏中一甲第三名探花——中国科举史上最后一科
      的最后几位鼎甲之一。与状元刘春霖、榜眼朱汝珍同榜。科举废后，
      他在 1958 年以七十五岁高龄出版《清代科举考试述录》——以末科进士的亲历
      与文献互证，系统记述清代科举制度全貌，成为该领域研究要籍。
      科举制度的终点，由科举制度最后一个亲历者完成了学术化的存档。
    tier: C
    source_ids: [src_keju_shulu]
    note: 事出《清代科举考试述录》（商衍鎏自著，B 级）。
  - title: 探花为何在状元谱里——一个口径说明
    content: >-
      本站以状元为主体的 599 人名录中，商衍鎏是仅有的两位特例之一（role: tanhua）。
      收录理由有二：其一，他是末科鼎甲，且以亲历者身份完成了科举制度最重要的
      学术记录之一，抽掉他，末科叙事不完整；其二，其《清代科举考试述录》
      为本站科举制度类事实的重要二手依据。他计入人物卡总数，
      但不并入状元统计——单列不混，口径先行。
    tier: C
    source_ids: [src_keju_shulu, src_timin_beilu]
    note: 口径说明条目；统计口径见 stats 页与 about 页。
