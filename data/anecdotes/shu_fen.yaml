# 舒芬轶事（R4-T1 批次 7，2026-10-25）
person_id: shu_fen
anecdotes:
- title: 「吾官此，即死此耳」——翰林院里的担架
  content: 谏南巡被杖三十，「芬创甚，几毙，舁至翰林院中」。掌院怕担干系，命把他 撵出去。芬说：「吾官此，即死此耳。」——我的官职在这里，就死在这里。 谪福建市舶副提举时，他是裹着伤上路的。本传这九个字，是明武宗朝文臣
    风骨的定格。
  tier: C
  source_ids:
  - src_mingshi_shufen
  note: 事出《明史》本传原文。
- title: 「匹夫不可夺志」——酒杯边的动员
  content: 陆完迎劝诸谏官「勿归过君上，沽直名」，芬等不应对。良胜、潮扼腕恨完， 芬邀博士陈九川来，酌酒对饮，只说一句：「匹夫不可夺志，君辈可遂已乎？」 ——平民的志尚不可夺，你们难道就算了？次日偕诸曹连疏再入，跪阙五日、
    杖三十。一句酒桌上的话，顶得上一篇檄文。
  tier: C
  source_ids:
  - src_mingshi_shufen
  note: 事出《明史》本传原文。
- title: 夜计己过与《周礼》之恨——「忠孝状元」的另一面
  content: 本传：「芬丰神玉立，负气峻厉，端居竟日无倦容，夜则计过自讼。」白天 端坐整日，夜里检点自己的过失；学术上贯通诸经兼通天文律历，尤精《周礼》， 病重时儿子请示遗言，「惟以未及表章《周礼》为恨」。两次廷杖没夺走的
    志向，最后留给学术——身后谥文节，学者称梓溪先生。
  tier: C
  source_ids:
  - src_mingshi_shufen
  note: 事出《明史》本传原文。
