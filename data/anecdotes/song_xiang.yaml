# 宋庠轶事（R4-T1 批次 5，2026-10-25）
person_id: song_xiang
anecdotes:
- title: 一梦《小戴礼》——本传里的感生叙事
  content: 本传开篇：父宋杞为九江掾，与妻钟氏祷于庐阜，「钟梦道士授以书曰：『以遗尔子。』 视之，《小戴礼》也，已而庠生。他日见许真君像，即梦中见者。」母亲梦见道士 授《礼记》而生宋庠，后来见到许真君像正是梦中人。正史本传收录感生传说
    是史家惯例，读作「神道设教的出生叙事」即可，不必当传记事实。
  tier: C
  source_ids:
  - src_songshi_songxiang
  note: 事出《宋史》本传原文；性质为感生传说层，史家神道叙事惯例。
- title: 改名公案——「宋郊」为何变成「宋庠」
  content: 庠初名郊。李淑恐其先己，「以奇中之」，进言：「宋，受命之号；郊，交也。 合姓名言之为不祥。」——宋是本朝国号，郊与「效」通，姓名连读成了 不祥之谶。帝初不为意，他日以谕之，因改名庠。政敌从姓名里找攻击点，
    宋代党争钻营的一个刁钻样本；宋庠的传世名字竟是政敌「送」的。
  tier: C
  source_ids:
  - src_songshi_songxiang
  note: 事出《宋史》本传原文。
- title: 「逆诈恃明，残人矜才，吾终身不为也」
  content: 本传载庠天资忠厚，尝自道：「逆诈恃明，残人矜才，吾终身不为也。」 ——事先揣测别人欺诈而自恃聪明、待人苛刻而炫耀才智，这两件事终身不做。 配套的事迹：京东转运使沈邈曾数次以事侵庠；后来沈邈之子犯事，
    府属欲痛治以法，「庠独不肯，曰：『是安足罪也！』人以此益称其长者。」 被得罪过的人的孩子犯了事，唯独他不肯落井下石。
  tier: C
  source_ids:
  - src_songshi_songxiang
  note: 事出《宋史》本传原文。
