# 轶事卡：孙伏伽（B=笔记类一手出处 / C=民间传说）
person_id: sun_fujia
anecdotes:
  - title: 「隋进士」异说：两朝科场第一人？
    content: >-
      《唐摭言》记：「进士，隋大业中所置也。如侯君素、孙伏伽，皆隋之进士也明矣。」
      若依此说，孙伏伽早在隋朝已登进士第，入唐再夺武德五年榜首，一人身跨两朝
      科场。然两唐书本传仅言其仕隋为小史、累补万年县法曹，不及隋进士事——
      异说并存，聊备一格。
    tier: B
    source_ids: [src_tang_zhiyan]
    note: >-
      徐松《登科记考》亦留意到其武德五年应举时身份不合常格（或已无官身），
      按语云「其时草昧初开，未可以常格论之」。
  - title: 拦马谏猎（传说）
    content: >-
      民间演绎的谏猎远比正史激烈：太宗挟弓矢鹰犬欲出，孙伏伽拦在马前，
      把缰绳缠在腰间跪谏：「陛下今日要出，请从老臣身上踏过。」太宗佯怒，
      喝令拖出去斩，伏伽曰：「愿从关龙逢、比干游于地下。」太宗大笑收兵，
      还留他手谈一局。
    tier: C
    source_ids: [src_minjian_chuanshuo]
    note: >-
      正史仅载其上书谏马射、「太宗览之大悦」；拦马、问斩、下棋等细节均为
      后世传说附会，作传说收录，不作史实。
  - title: 同榜佳话：三兄弟雪夜遇商人
    content: >-
      武德五年榜进士四人（一说十四人），其中李义琛与弟义琰、从弟上德兄弟
      三人同登，轰动一时。《唐摭言》记其家贫赴举，至潼关遇大雪，逆旅不纳；
      一咸阳商人怜而延留，赠以薪粮。后义琛官咸阳，召商人与之抗礼以报。
      一榜三李，与榜首孙伏伽同辉。
    tier: B
    source_ids: [src_tang_zhiyan, src_dengke_jikao]
    note: 《登科记考》引《摭言》考辨「上德似非义琰从弟」，亲缘细节存疑，其事两相印证。
