person_id: tai_buhua
anecdotes:
  - title: 「此事是我发之，甘受诛戮，决不敢累诸公」
    content: >-
      元统元年文宗皇后加太皇太后徽号、权臣燕铁木儿伯颜裂土封王，泰不华率同列上疏谏止。
      太后怒，欲杀倡言者。泰不华当廷对众官说：「此事是我发之，甘受诛戮，
      决不敢累诸公。」太后怒解，反叹「风宪有臣如此，岂不能守祖宗之法乎」，
      赐金币表彰直言。状元骨头硬的不少，把「独死」二字说在当廷的，数他最直接。
    tier: C
    source_ids: [src_taizhou_taibuhua_zhuan, src_yuanshi_taibuhua]
    note: 语出《元史》本传（今人移录待核册页）；入言行轶事层。
  - title: 养子成才：义塾里读出来的右榜状元
    content: >-
      泰不华父塔不台任台州录事判官，遂入籍临海；父去世时他年幼家贫，
      被台州名儒周仁荣收养教育。周仁荣的义塾建于唐代郑虔故宅原址，
      掘基时出土郑虔旧砚两方，故名「双砚堂」——泰不华很可能就是在这座
      「双砚堂」里读书长大。十七岁江浙乡试第一，十八岁（至治元年，1321）
      廷试右榜状元。蒙古族状元由汉儒义塾培养而成，这个组合本身就是元代的缩影。
    tier: C
    source_ids: [src_taizhou_taibuhua_zhuan]
    note: 收养师承出《元史》本传；「双砚堂」细节出《辍耕录》（今人移录），列 C 级。
  - title: 王林洋中槊死，谥忠介
    content: >-
      至正十二年（1352）三月，台州路达鲁花赤任上，泰不华发兵扼守黄岩澄江，
      遣义士王大用到方国珍处约降，方国珍扣留王大用，以二百艘小船突入港口，
      泰不华被围，「于王林洋临阵中槊死」，年四十九。追赠江浙行省平章政事，
      封魏国公，谥忠介。元代右榜状元战死海疆者，唯此一人。
    tier: C
    source_ids: [src_taizhou_taibuhua_zhuan, src_yuanshi_taibuhua]
    note: 阵亡与恤典出《元史》本传；入死节叙事轶事层。
