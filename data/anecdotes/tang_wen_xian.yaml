# 唐文献轶事（R4-T1 批次 8，2026-10-25）
person_id: tang_wen_xian
anecdotes:
- title: 直犯权相救郭正域——「何辞以谢天下」
  content: 万历三十一年妖书案发，沈一贯借机倾陷郭正域，狱事急。唐文献偕同僚四人 直入一贯府第：「郭公将不免，人谓公实有意杀之。」一贯惶恐酹地为誓。 文献再逼一步：「亦知公无意杀之也，第台省承风下石，而公不早讫此狱，
    何辞以谢天下。」一贯敛容谢之，狱得稍解。「然文献等以是失政府意」—— 救人的代价是失去首辅的信任。
  tier: C
  source_ids:
  - src_mingshi_tangwenxian
  note: 事出《明史》本传原文。
- title: 掖着廷杖的人出宫——状元的同窗之义
  content: 同年生给事中李沂弹劾太监张鲸，被廷杖。唐文献把人从殿前搀扶出来， 「资给其汤药」。后来荆州推官华钰忤税监下诏狱，「文献力周旋，得无死」。 本传给他的性格定语是「以名节相矜许」——出赵用贤（东林先驱）之门的人，
    对受难者从不缺席。
  tier: C
  source_ids:
  - src_mingshi_tangwenxian
  note: 事出《明史》本传原文。
