person_id: wang_ang
anecdotes:
  - title: 「最委屈的状元」——后世送他的名号
    content: >-
      因为状元的来路特殊，王昂在后世常被称作「最委屈的状元」：考官原本取中的第一是皇子
      赵楷，皇帝为避嫌把他提了上来，于是他的状元头衔永远附带着一个「因为」。与之配套流传
      的还有「赵楷偷偷参加科举、发榜后向父皇道出实情」的情节——那一层已属传说，
      详见本站《秘试夺魁：皇子赵楷的特例》。
    tier: C
    source_ids: [src_minjian_chuanshuo]
    note: >-
      「委不委屈」是后世的评说，非宋代记载；「偷偷参加科举」一节亦不见于正史
      （《宋史·徽宗本纪》明载三月癸巳「令嘉王楷赴廷对」）。本条仅存传说层。
  - title: 《催妆词》——一位状元留下的唯一作品
    content: >-
      王昂以文学称于时，而今存可考的作品只有一阕《催妆词》：「喜气满门阑，光动绮罗香陌。
      行紫薇花下，悟身非凡客。不须脂粉污天真，嫌太怕红白。留取黛眉浅处，共画章台春色。」
      写新嫁娘理妆，轻倩可喜。他的一生却比这阕词沉重：中状元时天下尚是盛世气象，
      十六年后已要在东京接伴金国使臣，再十余年便死于南渡之后。
    tier: C
    source_ids: [src_zhuangyuan_dangan]
    note: 词据今人状元档案著录录入，原始出处（词集或笔记）待溯；本站存其目，不作全集考订。
