# 王拱辰轶事（R4-T1 批次 7，2026-10-25）
person_id: wang_gong_chen
anecdotes:
- title: 十九岁大魁天下，仁宗赐名
  content: 王拱辰原名拱寿，十九岁举进士第一，「仁宗赐以今名」——拱辰，取《论语》 「为政以德，譬如北辰，居其所而众星共之」。皇帝亲自为状元改名的先例 在宋代不多见；这位少年状元后来用「北辰」的标准要求自己：御史中丞任上
    拉皇帝衣襟（引裾）谏罢夏竦，老臣任上抗章争保甲之害。
  tier: C
  source_ids:
  - src_songshi_wanggongchen
  note: 事出《宋史》本传原文；「北辰」出《论语·为政》为释名解读层。
- title: 混同江上的琵琶——外交礼遇的双刃
  content: 出使契丹，契丹主设宴垂钓，每得鱼必亲自酌酒、鼓琵琶侑饮，并对其相夸示： 「此南朝少年状元也，入翰林十五年，故吾厚待之。」使还，御史赵抃弹劾他 擅当非正之礼：「异时北使援此以请，将何辞拒之？」——对方给出的礼遇，
    恰是日后无法拒绝的先例。一次风光，成了御史台里的罪状。
  tier: C
  source_ids:
  - src_songshi_wanggongchen
  note: 事出《宋史》本传原文。
- title: 进奏院案的阴影——「为公议所薄」
  content: 苏舜钦进奏院赛神会一案，拱辰风僚属举劾，同席者俱逐。《宋史》直书其 动机：舜钦、益柔皆范仲淹所荐，舜钦又是杜衍的女婿，「故因是倾之， 由此为公议所薄」。本传论曰又给了他公道：「拱辰争保甲，言尤剀切，
    皆谔谔不少贬，为国老成，望始重矣。」——年轻时的党争污点与晚年的 保甲直争，史官都记下了。
  tier: C
  source_ids:
  - src_songshi_wanggongchen
  note: 事出《宋史》本传原文。
