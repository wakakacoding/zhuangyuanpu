person_id: wang_shipeng
anecdotes:
  - title: 「民事堂」——一个签判厅的名字与三篇赋
    content: >-
      王十朋状元及第后特添差绍兴府签判，署中签判厅旧借寓小能仁寺，岁久圮废，他始重建于
      车水坊，题其堂曰「民事堂」，取「民之事，吾职也」之意，并作《民事堂赋》。又与
      《会稽风俗赋》《蓬莱阁赋》合为《会稽三赋》三卷，于《梅溪集》外别行。清人修《四库
      全书》著录其书，称「十朋文章典雅，足以标举兹邦之胜」。后来他历守饶、夔、湖、泉
      四郡，所至皆以民事为先：输租使民自概量，讼至庭则温词晓以理义，本传记「所至人绘而
      祠之，去之日老稚攀留涕泣，越境以送，思之如父母」——「民事堂」三字，可说贯穿了
      他后半生的为政。
    tier: B
    source_ids: [src_siku_huijisanfu, src_wangshipeng_muzhiming, src_songshi_wangshipeng]
    note: >-
      本件据《四库全书总目》卷七十《会稽三赋》提要（记民事堂为绍兴中添差签判厅之公堂、
      十朋始重建于车水坊）与汪应辰《墓志铭》（记其签判绍兴、四郡治行）综合成文，
      非单一笔记所载，故系于 B 级作「传记类材料」看。《民事堂赋》原文见《梅溪集》后集卷一。
  - title: 《东坡诗集注》——旧题王十朋，四库馆臣考为书肆依托
    content: >-
      旧题王十朋所撰的《东坡诗集注》三十二卷，流传颇广，明清之间注苏诗者多称「王注」。
      但清修《四库全书》时馆臣细核其书，指出三处破绽：其一，《梅溪集》前集载序八篇、
      后集载序三篇，独无此书之序；其二，集中有读苏文三则，却「无一字及苏诗」；其三，
      书前赵夔序称崇宁年间与苏轼之子苏过（小坡）游从问诗，而由崇宁元年下推三十年已是
      绍兴元年，苏过已卒七八年，赵夔何能见而问之。据此馆臣断曰：「殆必一时书肆所为，
      借十朋之名以行耳。」——一位以「不欺」名其书室的状元，身后却有一部托名之书行世，
      这桩公案至今仍为学界聚讼之题。
    tier: B
    source_ids: [src_siku_dongposhijizhu, src_songshi_wangshipeng]
    note: >-
      出《四库全书总目》集部别集类《东坡诗集注》提要，属清人考据（学术考证类材料），
      故列 B 级。馆臣此考为其后诸家讨论的起点，今人研究对「王十朋与百家注东坡诗」
      之关系仍有异说，本站两说并存、不作定论；works 栏该条 status 记「待考」。
      案：王十朋书室扁曰「不欺」，见《宋史》本传。
  - title: 《荆钗记》里的那个王十朋
    content: >-
      南戏《荆钗记》以王十朋与钱玉莲「荆钗定盟」为骨，敷演「妻投瓯江」「十朋拒婚」等情节，
      流传极广，民间遂多以为状元王十朋便是剧中人。旧说此剧乃史浩门客所作，以诬王十朋——
      缘由仍是十朋任侍御史时疏论史浩八罪、浩罢知绍兴府一事。而剧中「十朋读书江心寺」
      「书券舍土」「钱玉莲投江自尽」诸节，与其生平全不相符。
    tier: C
    source_ids: [src_wenzhouzhi_wangshipeng]
    note: >-
      出《温州市志》（1998）人物卷王十朋条（经温州图书馆「瓯越记忆」转录），属二手标目、
      原始出处待溯，故列 C 级。地方志整理者已辨其非：王十朋夺魁时已四十六岁，二子闻诗、
      闻礼皆已长大，妻贾氏出身乐清望族（司理贾如规侄女）、先王氏卒于泉州——剧中「新婚
      即别」「妻死改嫁」之类的关目皆与本事不合。清王应奎《柳南续笔》亦据传奇举其说，
      本站仅作传说层备录，不入史实字段。
