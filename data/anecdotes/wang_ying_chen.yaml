person_id: wang_ying_chen
anecdotes:
  - title: 十八岁状元，得罪秦桧十七年
    content: >-
      绍兴五年（1135）汪应辰廷对擢第一，年方十八——南宋最年轻的状元之一，
      高宗览其策「以为老成之士」，及唱名乃一少年，大加称异。然而少年状元
      的第一课是站队：绍兴九年他上疏论和议之可畏，忤秦桧，出通判建州，
      此后「奉祠屏居常山永年院」，蓬蒿满径、饘粥不继，凡三任祠官，
      一困十七年。秦桧死，方召还。十八岁登顶、三十五岁才回到起点的仕途，
      是「早慧」二字最贵的注脚。
    tier: C
    source_ids: [src_songshi_wangyingchen]
    note: 事出《宋史》本传；「饘粥不继」等句为传文移录。
  - title: 「汪应辰治蜀甚有声」——帝手书褒谕的治绩
    content: >-
      乾道元年（1165）汪应辰以敷文阁直学士为四川制置使、知成都府。至蜀免利路民
      饷运、徙沿边戍兵就粮内郡；蜀大旱则请度牒为籴本赈济，「全蜀蒙惠」，
      帝称「汪应辰治蜀甚有声」。蜀帅任上是南宋士大夫治绩的最高考场之一，
      状元出身的他考出了满分。
    tier: C
    source_ids: [src_songshi_wangyingchen]
    note: 事出《宋史》本传。
  - title: 师友圈：从赵鼎到张栻——状元背后的理学谱系
    content: >-
      汪应辰未第时从喻樗学，喻樗以「此儿骨相非贫士」奇之，且预判「赵鼎当国」
      而属其往见；后果为赵鼎所知，引为上客。鼎贬死朱崖，应辰「千里往吊，
      为文祭之，几遭罗织」。中年又与张栻、吕祖谦诸儒往复论学，
      朱熹集中与汪尚书书简数十通。一个状元串起两宋之际政学两界的半张人名表
      ——关系网的富矿，本站网络图人物条目即据此绘制。
    tier: C
    source_ids: [src_songshi_wangyingchen]
    note: 事出《宋史》本传；与张栻吕祖谦朱熹往复见各家文集，本批未录原文。
