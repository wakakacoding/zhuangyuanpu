person_id: wang_zeng
anecdotes:
  - title: 「状元试三场，一生吃著不尽」——一句答语见其志
    content: >-
      王曾连中三元，中山刘子仪（刘筠）时以学士之职戏之曰：「状元试三场，一生吃著不尽。」
      王曾正色答：「曾平生之志不在温饱。」一句戏语、一句答语，把「三元及第」这个
      科举史上最耀眼的功名，轻描淡写地放在了「温饱」之外的坐标上。
    tier: B
    source_ids: [src_dongxuan_bilu_wangzeng, src_jiuwen_zhengwu_wangzeng]
    note: >-
      出北宋魏泰《东轩笔录》，经南宋李心传《旧闻证误》卷一引录。李心传按语据国史考订：
      刘筠（子仪）天禧四年始为翰林学士，其时王曾已执政多年，故对话年份有误——所疑者
      在系年，非在语句，两说并存备考。语中「青州发解，及南省、廷试皆为第一」另为
      「连中三元」之宋代文献直证。
  - title: 易服乘驴，由他门入城——状元不受郊迎
    content: >-
      王曾状元及第还青州，郡府帅闻其归，命父老妓乐迎于郊外。王曾却换去官服、乘一头
      小驴，从另一道城门进城，径往谒见太守。太守惊问：「闻君来，已遣人奉迎，门司未报
      君至，何为抵此？」王曾实告之曰：「不才幸忝科第，敢烦太守父老致迓，是重其过也。」
      太守叹曰：「君真所谓状元矣。」
    tier: B
    source_ids: [src_nenggaizhai_manlu_wangzeng]
    note: >-
      出南宋吴曾《能改斋漫录》，本件据宋·祝穆《古今事文类聚》前集卷二十六所引录入。
      后世《宋稗类钞》及今人地方史志转述此事的文字与此略同（易「乘小驴」为「骑小毛驴」、
      增「变姓名」等细节），本站以宋人所引为正。
  - title: 「青州益都」还是「泉州晋江」——一个状元的籍贯之争
    content: >-
      宋以后，福建泉州晋江一带的宗族叙事以王曾为乡贤，称其生于晋江二十九都旌贤乡
      王厝，为五代闽王王审邽之裔，因父官青州、八岁丧亲寄养叔父家贫不能归晋江，
      遂定居青州益都。另有一说称其祖上为太原王氏，唐末五代避难居青州。
      而《宋史》《隆平集》及宋代诸书一致记作「青州益都人」。
    tier: C
    source_ids: [src_jinjiang_shizhi_wangzeng]
    note: >-
      晋江之说属地方乡贤叙事（二手标目，据《晋江史志》转引），且「王审邽后裔」一节于
      宋代文献无征；「太原王氏」说亦属后世追述，原始出处待溯。本站正史系统取「青州益都」
      之说，二说仅作异说备录。又：《宋史》载仁宗改王曾葬地之乡为「旌贤乡」，与晋江
      「旌贤乡」地名偶合，二者未必有关，姑并存而已。
