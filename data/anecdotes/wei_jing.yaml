person_id: wei_jing
anecdotes:
  - title: 状元上任第一件事：三次上表辞掉额外的俸禄
    content: >-
      卫泾中状元后授承事郎，「添差」镇东军签判——添差是宋代只拿俸禄不做事的
      虚衔。他向孝宗陈说添差徒挂虚名的弊端，一连三次上表，要求去掉自己的添差，
      依资历待次补缺。孝宗因其言行一致特允所请。多数状元的仕途从领双份俸禄开始，
      他从退掉一份开始。
    tier: C
    source_ids: [src_kunshan_weijing_zhuan]
    note: 事出今人汇编（据行状年谱），诸源一致。
  - title: 不拜宰相：六和塔下徘徊三个月
    content: >-
      宋有惯例：状元任满须向执政宰相通书致谢，方能获召入朝。卫泾不谒宰相王淮——
      结果虽有降召之命，有司不让他进入国门，他「整天徘徊在六和塔下，
      将近三个月不能够被召见」。三个月的冷板凳换来的是直声满朝，
      也提前预演了他此后四十年「孤立自守，不畏强御」的仕途风格。
      他自言：「官职自有定分，名谊千古不磨。」
    tier: C
    source_ids: [src_kunshan_weijing_zhuan]
    note: 事出今人汇编；「官职自有定分」为其自述语。
  - title: 「后乐居士」——罢官十年，把范仲淹的话过成了日子
    content: >-
      遭弹劾罢官家居十年，卫泾在昆山石浦辟修西园，取范仲淹「先天下之忧而忧，
      后天下之乐而乐」句意名其堂曰「后乐」，自号后乐居士，诗文结集为《后乐集》。
      谥号文节、堂号后乐——一个状元身后被记住的，不是那场殿试，
      而是他给自己书房起的名字。
    tier: C
    source_ids: [src_kunshan_weijing_zhuan]
    note: 号与集名诸源一致；《后乐集》五十卷传世。
