# 轶事卡：文天祥（B=同时代人所记笔记传记 / C=民间传说）
person_id: wen_tianxiang
anecdotes:
  - title: 生祭：学生「劝死」老师
    content: >-
      至元十六年（1279），文天祥被押解北上，途经江西。门生王炎午作《生祭文丞相文》千余言，
      誊抄数十份，张贴于押解船必经的赣江水陆要道——老师还活着，学生已经提前致祭，
      字字「劝」其速死以全大节。生祭而非死祭，千古未有。
    tier: B
    source_ids: [src_wuwengao]
    note: 文天祥就义后，王炎午又作《望祭文丞相文》。师生二人以一死一生，各全其义。
  - title: 溪水盲弈
    content: >-
      刘岳申《文丞相传》记其性善弈：暑月与棋友入赣江游泳，众人浸于水中，仅凭口述着法对弈
      （所谓「盲棋」），终日不倦。正史之外，铁血丞相亦有此顽童一面。
    tier: B
    source_ids: [src_liu_yueshen]
    note: 与《宋史》「性豪华，自奉甚厚，声伎满前」互证——起兵后方「痛自贬损」。版本待补。
  - title: 「状元宰相」俗誉
    content: >-
      民间向以「状元宰相」称文天祥——状元出身而拜相者，史上寥寥；状元拜相而殉国者，
      惟此一人。后世祠庙楹联多从此立意。
    tier: C
    source_ids: [src_minjian_chuanshuo]
    note: 属民间口碑定型，非具体史实条目，作传说收录。
