# 文震孟轶事（R4-T1 批次 7，2026-10-25）
person_id: wen_zhenmeng
anecdotes:
- title: 十赴会试的状元——三十年的科场马拉松
  content: 弱冠举乡试后「十赴会试」，直到天启二年四十九岁才殿试第一。以《春秋》 举于乡的经学功底在落第二十年间不曾荒废，最终以《春秋》名家身份被点名 进讲（崇祯帝令择人讲《春秋》，温体仁忌而隐不举，次辅钱士升指及之，
    「及进讲，果称帝旨」）。落第一十年与大魁之后，讲的都是同一部经。
  tier: C
  source_ids:
  - src_mingshi_wenzhenmeng
  note: 事出《明史》本传原文。
- title: 以目视帝足——「真讲官」的课堂纪律
  content: 崇祯帝听讲时把脚跷到膝上，文震孟正讲到《五子之歌》「为人上者，奈何不敬」， 便停下看着皇帝的脚。「帝即袖掩之，徐为引下。」——不点破，不训斥， 用经文原文完成提醒。时称「真讲官」。状元讲官与年轻皇帝的这场无声互动，
    是明末经筵史上最体面的一幕。
  tier: C
  source_ids:
  - src_mingshi_wenzhenmeng
  note: 事出《明史》本传原文。
- title: 三个月的阁臣——「惜三月而斥，未竟其用」
  content: 崇祯八年七月特擢入阁，十一月落职闲住，在阁仅三月。不肯投刺司礼太监 （「阁臣被命，即投刺司礼大奄……震孟独否」），又与温体仁同直，体仁 所拟不当则径抹去，「震孟大愠，以诸疏掷体仁前」。刚方贞介之人在崇祯朝的
    阁位上，三个月已是极限。本传十六字定评：「刚方贞介，有古大臣风， 惜三月而斥，未竟其用。」
  tier: C
  source_ids:
  - src_mingshi_wenzhenmeng
  note: 事出《明史》本传原文。
