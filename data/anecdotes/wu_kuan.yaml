person_id: wu_kuan
anecdotes:
  - title: 「东宫讲学……岂容复以他事妨诵读」——为太子教育抗争宦官
    content: >-
      吴宽侍武宗东宫时，「宦官多不愿让太子接近儒臣，多次用他事间断讲读」（本传文意）。
      他率僚属上疏：「东宫讲学，寒暑风雨则止，朔望令节则止，一年不过数月，一月不过数日，
      一日不过数刻。是进讲之时少，辍讲之日多，岂容复以他事妨诵读。古人八岁就傅，
      即居宿于外，欲离近习，亲正人耳。庶民且然，况太子天下本哉？」帝嘉纳之。
      一纸疏文把「讲学日少」的算术账算得明明白白，是明代教育史上常被引用的一疏。
    tier: C
    source_ids: [src_mingshi_wukuan]
    note: 疏文全录《明史》本传（原文繁体保真见该出处 quote 字段）；属言行叙事，入轶事层。
  - title: 谢迁举以自代而终不入阁：「吾初望不及此也」
    content: >-
      「当时词臣中声望最重者，吴宽第一，谢迁其次。」谢迁入阁后数次向首辅刘健推荐
      吴宽共政，刘健坚决不同意；谢迁说「吴公科第、年齿、声望都在我谢迁之前，
      我实在自愧不如」；及谢迁引退举宽自代，仍不果用。「朝野内外都为他惋惜，
      而吴宽很安然，说：『吾初望不及此也。』」状元出身、官至礼部尚书、
      声望第一而终身不入阁，明中期政坛一桩著名的公论遗憾。
    tier: C
    source_ids: [src_mingshi_wukuan]
    note: 事出《明史》本传，叙述为本站译写；原文繁体见出处 quote。
  - title: 友人贺恩病，迁至邸旦夕视之；死，为衣素一月
    content: >-
      本传：「友人贺恩疾，迁至邸，旦夕视之。恩死，为衣素一月。」又「有田数顷，
      尝以周亲故之贫者」。吴宽行履高洁、不为激矫，丧友服素一月，在明代士大夫
      交谊记载中是很重的一份情义。
    tier: C
    source_ids: [src_mingshi_wukuan]
    note: 事出《明史》本传。
