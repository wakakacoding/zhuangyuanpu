# 吴潜轶事（R4-T1 批次 8，2026-10-25）
person_id: wu_qian
anecdotes:
- title: 「臣无弥远之材，忠王无陛下之福」——一句密奏的代价
  content: 理宗将立度宗（忠王赵禥）为太子，吴潜密奏反对，只说了两句话：「臣无弥远 之材，忠王无陛下之福。」——当年史弥远擅行废立扶植理宗，我没有那样的 材干；忠王也没有陛下您的福气。前半句自贬，后半句判了未来皇帝的命。
    「帝怒潜」，寻以论劾落职，一路贬到循州。四年后度宗即位，国事日非， 这句预言成了南宋亡国叙事里的著名伏笔。
  tier: C
  source_ids:
  - src_songshi_wuqian
  note: 事出《宋史》本传原文；「亡国伏笔」为史论概括层。
- title: 预知死日——「夜必雷风大作」
  content: 贬循州后，吴潜预先知道自己的死期，对人说：「吾将逝矣，夜必雷风大作。」 当夜果然雷风大作，四鼓开霁，他撰遗表、作诗颂，「端坐而逝」。循州人听说 「咨嗟悲恸」。本传以近乎志怪的笔法为这位状元丞相收束——天象与人事的
    最后一重呼应。
  tier: C
  source_ids:
  - src_songshi_wuqian
  note: 事出《宋史》本传原文；「预知死日」为传文明文，性质属天人感应叙事层。
- title: 蠲免五百四十九万——被遗忘的宰相治绩
  content: 吴潜判庆元府（宁波）时，积钱一百四十七万三千八百余缗代全郡百姓输帛， 「前后所蠲五百四十九万一千七百有奇」。状元宰相的历史形象多系于其词 与其贬死，这条实打实的民生数字反而少有人提——本传把它写得很具体，
    数字精确到十位。
  tier: C
  source_ids:
  - src_songshi_wuqian
  note: 事出《宋史》本传原文。
