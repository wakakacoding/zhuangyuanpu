person_id: xiao_guo_liang
anecdotes:
  - title: 梅花鹿救状元——永泰乡里的传说
    content: >-
      相传萧母曾从猎人枪口下救下一只梅花鹿。萧国梁周岁「祝周」之日，一只梅花鹿突然闯入，
      以角挑起坐有他的椅轿往对山跑去，众人追赶，刚追出数十步，「轰」然巨响，祖屋后山
      滑坡，整座屋子被压垮，而人幸免。乡里由此说：这只鹿是来报恩的，萧家出了大福之人。
    tier: C
    source_ids: [src_minjian_chuanshuo]
    note: >-
      此说见于永泰地方传说与今人乡土考述，无同时代文献可依，本站列传说层。
      同系传说还有「萧母帘下识黄定」一说（据《黄氏家谱》转录），谓萧母见黄定气宇轩昂，
      断其必至子之地位，后黄定果于乾道八年夺魁——亦属家族传说，一并备考。
  - title: 七年三状元——「相去之间不百里，七年三度状元来」
    content: >-
      乾道二年（1166）萧国梁、五年（1169）郑侨、八年（1172）黄定，永福一县七年之内连出
      三位状元，三人分居翀峰、龟岭、龙屿，相距不足百里。宋人张世南《游宦纪闻》录当时
      永福县令赋诗云：「翀峰龟岭与龙屿，三处山川实壮哉。相去之间不百里，七年三度状元来。」
      永泰后人又建三元祠祀三状元，并将其读书之翀峰改称「青云山」，主峰唤作「状元峰」。
    tier: B
    source_ids: [src_youhuan_jiwen]
    note: >-
      萧、郑、黄三科之状元名分有《宋会要辑稿》历代登科名录可稽，本卡所录为宋人笔记中的
      即时咏叹；「状元峰」「青云山」地名与三元祠为后世附会之作，属纪念性遗迹。
  - title: 「萧状元墓」——一座八百年的衣冠冢
    content: >-
      《永福旧志》记「宋侍讲萧公国梁墓在龙溪县东厢，新亭道左」；明清漳州府志系统称为
      「萧状元墓」，墓碑今横书「漳潮萧氏祖坟」六字。墓在今漳州市区新华东路教子桥，
      为市级文物保护单位，萧氏宗亲称之为衣冠冢。此外永泰故里亦有「东状元坊」，
      「在县治东，为宋乾道二年状元之萧国梁立」。
    tier: B
    source_ids: [src_yongfu_jiuzhi, src_zhangzhou_fuzhi]
    note: >-
      墓之性质（实葬或衣冠）、墓址沿革均据方志与今人踏查，本站照录；实葬地说与
      衣冠冢说并存。
