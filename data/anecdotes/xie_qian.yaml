# 谢迁轶事（R4-T1 批次 5，2026-10-25）
person_id: xie_qian
anecdotes:
- title: 「李公谋，刘公断，谢公尤侃侃」——弘治三贤相的民谣定格
  content: 弘治朝内阁刘健、李东阳、谢迁三人同辅政，时人为之语曰：「李公谋，刘公断， 谢公尤侃侃。」李东阳善谋，刘健能断，谢迁则敢言善论——「侃侃」二字 出《论语》「侃侃如也」，和乐而直言貌。天下称贤相。一条民谣把三个人的
    性格各钉在一个字上，明人舆论对朝政的品评精度可见一斑。
  tier: C
  source_ids:
  - src_mingshi_xieqian
  note: 事出《明史》本传原文引时人语；「侃侃」典出《论语·乡党》为解读层。
- title: 危局围棋——刘瑾构陷下的自若
  content: 正德四年余姚之士案发，刘瑾欲逮刘健、谢迁籍其家，词连二人；焦芳厉声 「纵轻贷，亦当除名」。同时夺诰命者六百七十五人，余姚人从此毋选京官。 「当是时，人皆为迁危，而迁与客围棋、赋诗自若。」政治风暴的中心，
    当事人在与客人下棋赋诗——本传这十三字，是明史中著名的定力书写。
  tier: C
  source_ids:
  - src_mingshi_xieqian
  note: 事出《明史》本传原文，对话与细节俱在。
- title: 七十九岁的强起——嘉靖朝的礼遇极限
  content: 嘉靖六年费宏举谢迁自代、杨一清欲借其阻张璁，世宗遣行人赍手敕到余姚 起用，「迁年七十九矣，不得已拜命」。到京后张璁已入阁、杨一清以官尊 无相下意，迁居位数月力求去；世宗待之愈厚：天寒免朝参、除夕赐御制诗、
    病则遣医赐药饵光禄致酒饩，「使者相望于道」。以请老之身受帝王季节性的 恩宠问候，明代致仕老臣礼遇的标本。
  tier: C
  source_ids:
  - src_mingshi_xieqian
  note: 事出《明史》本传；「礼遇极限」为概括语，非本传语。
