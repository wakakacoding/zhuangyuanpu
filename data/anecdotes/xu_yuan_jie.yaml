# 徐元杰轶事（R4-T1 批次 6，2026-10-25）
person_id: xu_yuan_jie
anecdotes:
- title: 「侯不来，我辈鱼肉矣」——南剑州父老的一句话
  content: 淳祐元年徐元杰知南剑州，峡阳寇作，擒渠魁八人斩之余释不问；郡有延平书院， 亲为诸生讲说；民讼率呼至以理化诲。本传记下父老相语：「侯不来，我辈鱼肉矣。」 丁母忧去官时「众遮道跪留」——百姓拦路跪留一位离任知州，宋代地方官考绩里
    最重的一条。
  tier: C
  source_ids:
  - src_songshi_xuyuanjie
  note: 事出《宋史》本传原文。
- title: 一疏寝起复——攻史嵩之的朝野传诵
  content: 丞相史嵩之丁父忧，理宗诏起复，中外莫敢言。徐元杰适轮对，不诋讦而只讲 「为陛下爱惜民彝，为大臣爱惜名节」，句句留余地而处处是锋芒。「疏出， 朝野传诵」，未几夜降御笔黜四不才台谏，起复之命遂寝。一篇奏疏让宰相
    守制之议翻盘，南宋士论力量的标本。
  tier: C
  source_ids:
  - src_songshi_xuyuanjie
  note: 事出《宋史》本传原文。
- title: 指爪忽裂以死——南宋第一政治疑案
  content: 淳祐五年六月，徐元杰轮当侍立前一日还正常谒见官员、准备次日奏事，当夜 俄热大作，「指爪忽裂，以死」。太学诸生伏阙诉其为中毒，喊出南宋士论最有名 的句子之一：「今蛮烟瘴雨不在领海，而在陛下之朝廷。」三学相继讼冤、台谏
    交疏论奏，然「狱迄无成，海内人士伤之」。赐谥忠愍。谁是下毒者，史无定论—— 本站录案存疑，不强断。
  tier: C
  source_ids:
  - src_songshi_xuyuanjie
  note: 事出《宋史》本传原文；「南宋三大疑案」之并称、具体嫌疑对象诸说均为后人 叙述层，本传未指名，存疑不录。
