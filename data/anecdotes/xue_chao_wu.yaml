person_id: xue_chao_wu
anecdotes:
  - title: 一句本纪、两行考据——史料最薄的状元之一
    content: >-
      《元史》顺帝纪至正十四年三月己巳：「廷试进士六十二人，赐薛朝晤、牛继志
      进士及第，余授官出身有差。」本纪不写左右榜。清人方志考据确证：
      是科右榜（蒙古色目）状元乃薛朝晤，左榜（汉人南人）状元系牛继志——
      「终元之世，左榜状元十六人，见于帝纪、选举志及科目附录诸篇，可复按也」。
      薛朝晤生平仅知字子颙、辽东人、依例授集贤修撰，余事不详。一位状元
      在史册上的全部存在感，就靠一条本纪加两行考据支撑——元代右榜状元
      史料之薄，于此可见。
    tier: C
    source_ids: [src_zhidian_niujizhi_bang, src_yuanshi_xuechaowu]
    note: 考辨型条目；左右榜判定依据清人方志考据（B 级），本纪原文为 A 级。
