person_id: yang_shen
anecdotes:
  - title: 滚滚长江东逝水，本不是说三国
    content: >-
      「滚滚长江东逝水，浪花淘尽英雄」——几乎人人会背，几乎人人都以为是《三国演义》的卷首词。
      它确实是，但那是清初毛纶、毛宗岗父子评本借用的。词的真正出处是杨慎戍滇期间所作的
      《廿一史弹词》第三段「说秦汉」的开场。一个被流放的罪臣，在云南的暮色里替整部二十四史
      写开场白：是非成败转头空——他写的既是秦汉，也是他自己。
    tier: B
    source_ids: [src_shengan_ji]
    note: 词属杨慎《廿一史弹词》无疑；毛氏父子借作三国卷首词亦是事实。两层均成立。
  - title: 傅粉簪花，游行城市
    content: >-
      贬谪云南的杨慎，一度放浪形骸到令人侧目：酒醉后以胡粉傅面，梳双丫髻、簪花，
      让门生抬着、妓女捧着酒，吹吹打打游行于街市。旁人视为疯癫，王世贞在《艺苑卮言》
      里记下了这一幕——那不是疯，是一个状元对朝廷最决绝的羞辱：你们夺走我的仕途，
      我便连「体面」也一并还给你们。
    tier: B
    source_ids: [src_yiyuan_zhiyan]
    note: 此事见王世贞《艺苑卮言》，属文坛掌故，非政史定评。
  - title: 永昌百姓叫他「杨状元」
    content: >-
      在永昌卫戍地，当地人不管他犯的是什么罪，只知道这是京城来的状元老爷，
      孩子们围着听他讲中原的书。保山至今有杨升庵的纪念地。传说他教当地读书人作文，
      滇南文风为之一开。这类地方记忆无正史依据，却自有它的真实——
      三十五年的戍所，最后成了他的讲台。
    tier: C
    source_ids: [src_difang_wenshi]
    note: 地方文史记忆，C 级展示，不作定论依据。
