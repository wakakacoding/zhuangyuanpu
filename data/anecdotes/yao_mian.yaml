# 姚勉轶事（R4-T1 批次 4，2026-10-24）
person_id: yao_mian
anecdotes:
  - title: 「雪坡」之号——一个被丢弃婴儿的自救记号
    content: >-
      地方志叙事：姚勉初生时被弃于山野雪地，获救存活；成年后自号「雪坡」，
      以志不忘。这个号成了他一生开头那段命悬一线的记号。叙事本身无原始
      文献可核，属地方传说层——但它与《新昌县志》「少颖悟，日诵数千言，
      居常作文有魁天下之志」同出自乡邦书写：一个差点冻死在雪里的孩子，
      后来把「魁天下之志」写进了作文。
    tier: C
    source_ids: [src_yifeng_yaomian]
    note: >-
      「弃之雪地」出宜丰县政府人物页（转引地方志系统），无更早文献；
      本卡明确标注传说性质，不与史实混写。
  - title: 六品小官弹劾宰相——宝祐四年的封事
    content: >-
      秘书省正字，从八品，本职是校雠典籍。宝祐四年，太学生陈宗等因论丁大全
      被逐，姚勉「途闻之」，辞召上封事，直指宰相「朋奸罔上」。丁大全其人，
      时人以「丁大全」谐音呼「丁大全（钉大全）」尚不敢明言，姚勉是白纸黑字。
      结果是他自己也归了乡——但《四库总目》记住的是这封封事：
      「论时政之谬、辨宰相之奸，皆侃侃而不阿。」
    tier: C
    source_ids: [src_yifeng_yaomian, src_xuepoji_yaomian]
    note: >-
      事出宜丰县政府页与《全宋文》小传系统；「谐音呼」一节系民间语源，
      无文献依据，本卡不采（写作自查删除项：初稿曾引入，已删）。
  - title: 讲《否》卦的老师——借经筵骂权相
    content: >-
      姚勉给太子讲《周易》，讲到否卦：天地不交，「不利君子贞」。他放下经文，
      借题指斥当国者——满座都知道说的是贾似道。经筵本该是皇帝家教的私课，
      他把它变成了朝堂之外的公开弹章。下场是「被劾为吴潜党」罢归：
      老师罢官，学生（忠王赵禥）两年后即位为度宗，再也没能请回这位老师。
    tier: C
    source_ids: [src_yifeng_yaomian]
    note: >-
      事出宜丰县政府页与《全宋词》小传（「帝过东宫，勉讲否卦，因指斥权奸，
      忤贾似道」）；「满座都知道」以下为撰写层渲染，已用「借题指斥」口径
      压回史实层。
