person_id: yuan_fu
anecdotes:
  - title: 创书院贵溪之南，祠先儒陆九渊
    content: >-
      本传：「所至诣学宫讲说，创书院贵溪之南，祠先儒陆九渊。」贵溪为陆九渊故里，
      袁甫于江东任上在其地创建书院、奉祀陆九渊，是为象山书院重建之源。
      父袁燮师陆学（甬上四先生之一），己又师杨简，袁甫以状元之身担陆学第二代传人，
      书院与家学互为表里。后世通称象山书院者，本传原文只作「书院」。
    tier: C
    source_ids: [src_songshi_yuanfu]
    note: 事出《宋史》本传；「象山书院」之称与白鹿洞书院修缮说均出自后世方志与今人叙述，本批未取。
  - title: 「前后持节江东五年，所活殆不可数计」——荒政能臣
    content: >-
      移提举江东常平适逢岁旱，「亟发库廪之积」赈济，前后持节江东五年，
      「所活殆不可数计」。状元而以荒政著称者，历代不多。史臣论赞称：
      「袁甫学有本原，善达其用，持节所过，其民至今思之。」
    tier: C
    source_ids: [src_songshi_yuanfu]
    note: 语出《宋史》本传及卷末论赞。
  - title: 生卒年两说：1174–1240 与 1179–1257
    content: >-
      袁甫生卒年通行两说：1174–1240（享年六十七，弘治《徽州府志》卷四，转引《全宋诗》小传；
      嘉熙四年三月卒于任）与 1179–1257（今人工具书一说）。本卡取前者，因其有「年六十七」
      与嘉熙四年卒年两处互证，且与卒于权兵部尚书任上的记载吻合；后者无原始出处可核，
      存此备考。
    tier: C
    source_ids: [src_songshi_yuanfu]
    note: 异说说明条目，非叙事轶事；两说并存，本卡采前说。
