person_id: zhang_jiucheng
anecdotes:
  - title: 「王良尚羞与嬖奚乘」——却权贵之荐
    content: >-
      张九成游学京师时，有权贵托人致币曰：「肯从吾游，当荐之馆阁。」九成笑曰：「王良尚羞与
      嬖奚乘，吾可为贵游客耶？」「王良」事出《孟子·滕文公下》：赵简子使王良为嬖奚御车，
      嬖奚终日不获一禽而反以为「天下之贱工」——九成用此典，谓士之择主犹善御者之择所与乘，
      不肯屈己以就权门。此语为宋人述其气节者所常举。
    tier: B
    source_ids: [src_songshi_zhangjiucheng, src_songyuanxuean_hengpu]
    note: >-
      出《宋史》卷三百七十四本传原文（《宋元学案》卷四十分亦系此事于其未第时），属正史所载之
      记事，非民间传说，故列 B 级。此事与其廷试对策「去谗节欲，远佞防奸」及后来面折秦桧
      「未有枉己而能直人」一贯，可窥其立身本末。
  - title: 「露花倒影柳三变，桂子飘香张九成」——状元策招来的一句嘲诗
    content: >-
      陆游《老学庵笔记》记张九成对策中有「桂子飘香」之语，李清照（李易安）遂作「露花倒影
      柳三变，桂子飘香张九成」一联以嘲之——上句讥柳永词句之丽，下句讥九成对策之涉于纤细。
      清修《四库全书》，馆臣为九成辩曰：「今读其策，其铺陈繁缛处，乃正为耽恋湖山、忘亲忍辱者
      痛加提唤，其用意最为深切，又岂可以是相讥。」故《四库总目》断曰「更掎摭琐屑，不足为九成病矣」。
    tier: B
    source_ids: [src_siku_hengpuji, src_songshi_zhangjiucheng]
    note: >-
      出《四库全书总目》卷一百五十八《横浦集》提要，其中转引陆游《老学庵笔记》与李易安句；
      陆游（1125—1210）去九成之世未远，所记属宋人笔记，故本件列 B 级。李清照此联唯见于此
      一系之转述，本批未见《老学庵笔记》原书核对，文字以馆臣所引为准。
  - title: 谪居南安的「玉带」梦与身后之兆
    content: >-
      海宁乡贤叙事记：绍兴二十九年三月十五夜，张九成梦为青衣人引至一处寺院，拜见已逝父母，
      见屋中挂有自己画像，并被告知将入居于此，「见玉带即来」。醒后命门人郎晔记梦，以为吉兆。
      其后与门生读江少虞《事实类苑》至「丁晋公取玉带事」，痛斥丁谓为奸邪，愤而掷书入内，
      当晚旧疾复发，口不能言，次日卒——乡里遂谓前梦「玉带」于此应验。
    tier: C
    source_ids: [src_haizhou_zhangjiucheng]
    note: >-
      出今人整理之海宁（其葬地所在）乡贤叙事，经网络转录，属**二手标目、原始出处待溯**，
      故列 C 级。所据当为《横浦先生家传》（附见宋刻《横浦先生文集》）一类家传材料，而本批
      未获原文核对。案《宋史》本传与《要录》皆仅作「（数月），病卒」，《宋元学案》作
      「二十九年六月四日卒」，均无梦兆之说，本站仅作传说层备录，不入史实字段。
