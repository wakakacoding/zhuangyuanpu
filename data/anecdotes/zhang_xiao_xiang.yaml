# 张孝祥轶事（R4-T1 批次 4，2026-10-24）
person_id: zhang_xiao_xiang
anecdotes:
  - title: 「宿酲未解，立就万言」——谪仙式的廷试
    content: >-
      廷试那天，张孝祥前夜的酒还没醒。「濡毫答圣问，立就万言，未尝加点」，
      卷面「纸高轴大」，字画遒劲如颜真卿。高宗读其卷首大加称奖，「疑其为谪仙，
      亲擢首选」。这则笔记层的细节与正史「高宗读埙策皆秦桧语，于是擢孝祥第一」
      并读方见全貌：高宗既要有扫秦党面子的政治决断，也确实被这卷当场挥就的
      文字与书法折服——后者才是「词翰俱美」四字的来处。
    tier: B
    source_ids: [src_sichaojianwenlu_zhangxiaoxiang]
    note: >-
      事出《四朝见闻录》系统（陆游撰，一说叶绍翁《四朝闻见录》，两书名近易混，
      作者归属待核原书定谳），性质属笔记而非正史，故不入 events 主干。
  - title: 新科状元的「三问」——为岳飞鸣冤的风险账
    content: >-
      登第后上疏为岳飞辩冤，「亟复其爵，厚恤其家，表其忠义，播告中外」。
      友人劝其藏锋，孝祥答：「无锋无芒，我举进士干什么？有锋有芒却要藏起来，
      我举进士干什么？知秦桧当政我怕他，我举进士干什么？」三问俱在，
      秦党的报复随之而至——拒婚曹泳、父系诏狱，本人迟迟不得授官。
      疏文原文存《金佗稡编》系统，其「非国家之福也」「陛下所不知也」的措辞
      有意绕开秦桧、只诉皇帝，进退有据。
    tier: C
    source_ids: [src_songshi_zhangxiaoxiang]
    note: >-
      「三问」对话据淮安清江浦区检察室 2018 年科普页等今人转述（待核原始出处，
      疑出自清人笔记或地方文献），疏文据杭州日报 2025-12-05 转引《金佗稡编》
      系统（待核原书）。本传只记张祁系狱与秦桧之怒，未载上疏事，故整体列 C 级。
  - title: 一首词让主帅罢席——《六州歌头》的现场
    content: >-
      建康留守宴席上，张孝祥即席赋《六州歌头》：「长淮望断，关塞莽然平……
      使行人到此，忠愤气填膺，有泪如倾。」主人张浚读罢，为之罢席。
      此时符离新败，和议使节正纷驰于道，一位留守在宴会上把主战派最后的悲愤
      当众唱了出来。清陈廷焯《白雨斋词话》评「淋漓痛快，笔饱墨酣，
      读之令人起舞」——南宋爱国词的现场感，无过此席。
    tier: B
    source_ids: [src_chaoyeyiji_zhangxiaoxiang, src_yinxianzhi_zhangxiaoxiang]
    note: >-
      「张浚罢席」出《朝野遗记》（说郛引），鄞县志卷二十八亦录「主人为之罢席」；
      词作系年两说（隆兴元年至二年间），events 取弹性表述。
