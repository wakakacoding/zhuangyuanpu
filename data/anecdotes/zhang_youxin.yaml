person_id: zhang_youxin
anecdotes:
  - title: 「张三头」——唐代「三元」叙事的谱系本源
    content: >-
      张又新初为京兆解头（乡试级第一）、元和九年进士状头（殿试级第一）、
      十二年博学宏词敕头（制科级第一），时号「张三头」。这个「三头」与后世
      「解元、会元、状元」的三元及第并非同一套考试——唐无会试，
      宏词科是进士及第后的仕进加试。后世把「张三头」追认为唐代三元及第第一人，
      是拿明清制度去套唐代故事的常见错位；但作为「连拿三个第一」的叙事原型，
      张又新确实是这锅百年老汤的第一味料。
    tier: C
    source_ids: [src_tangcai_zhuanjiao_zhangyouxin]
    note: 「张三头」之号出《唐摭言》（唐末五代王定保）；条目据《中国文学家大辞典》。
  - title: 「八关十六子」——状元里的朋党干将
    content: >-
      《旧唐书·裴度传》：「李逢吉之党李仲言、张又新、李续等，内结中官，外扇朝士，
      立朋党以沮度，时号『八关十六子』。」张又新谄事宰相李逢吉，「以凶险敢言」
      为其所重，长庆年间合谋排挤不附李逢吉的朝士，构陷贾餗、李绅。
      六百状元里被正史明确列入朋党名录的，他是知名度最高的一位——
      三头是才学的顶格，八关十六子是操守的底格，一人占全。
    tier: C
    source_ids: [src_tangcai_zhuanjiao_zhangyouxin]
    note: 「八关十六子」语出《旧唐书·裴度传》；生平综述据《中国文学家大辞典》。
  - title: 《煎茶水记》——给天下名泉排名的状元
    content: >-
      张又新性嗜茶，「尝天下煎茶之水，品第其名次，凡二十等」，作《煎茶水记》——
      庐山康王谷水帘水第一、无锡惠山寺石泉水第二……直排到第二十。
      这是继陆羽《茶经》之后中国茶史第二部重要著作。一个对「第一」有执念的人
      （三头），转头把全天下的水也排出了座次——科举思维渗透到品泉，
      唐人的严谨与执拗都可爱。另：他「志不在任官，惟得美妻」的择偶宣言
      与婚后失望的故事亦见《本事诗》《唐诗纪事》，人设相当完整。
    tier: C
    source_ids: [src_tangcai_zhuanjiao_zhangyouxin, src_jianchashuiji]
    note: 《煎茶水记》原文已录 src_jianchashuiji（本站既有出处）；择偶轶事见《本事诗·情感第一》，本批未录原文。
