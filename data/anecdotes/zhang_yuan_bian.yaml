# 张元忭轶事（R4-T1 批次 6，2026-10-25）
person_id: zhang_yuan_bian
anecdotes:
- title: 藏灯帐中——羸弱少年的夜读
  content: 本传：「元忭素羸弱，母戒毋过劳，乃藏灯幕中，俟母寝始诵。」体弱的孩子 被母亲禁止熬夜用功，他把灯藏进帐幕，等母亲睡着再起来读书。史家用这十三个 字写完了他的少年：孝顺与求知在同一盏灯里。
  tier: C
  source_ids:
  - src_mingshi_zhangyuanbian
  note: 事出《明史》本传原文。
- title: 遥诔杨继盛——十余岁的政治表态
  content: 「十余岁时以气节自负，闻杨继盛死，为文遥誄之，慷慨泣下。」杨继盛劾严嵩 冤死时，张元忭还是个十余岁的少年，却已经写文章遥祭、为之流泪。二十年后 他中状元入翰林，气节底色未变——抗疏救御史胡涍也是同一性格的延伸。
  tier: C
  source_ids:
  - src_mingshi_zhangyuanbian
  note: 事出《明史》本传原文；杨继盛背景为通行史实。
- title: 「吾无以下见父母矣」——一个状元的终身之憾
  content: 张元忭一生两条线：为父万里护行白冤、为母心动驰归五日而诀；父亲削籍之冤 却始终未能昭雪。服阕复官后再请复父官，格不从，「元忭泣曰：『吾无以下见 父母矣。』遂悒悒得疾卒」。中状元、谥文恭，都填不上这块空——《明史》把他
    放进儒林传，考语「笃于孝行，躬行实践」。
  tier: C
  source_ids:
  - src_mingshi_zhangyuanbian
  note: 事出《明史》本传原文。
