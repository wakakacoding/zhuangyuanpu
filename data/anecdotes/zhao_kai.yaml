person_id: zhao_kai
anecdotes:
  - title: 「微服应举」——民间叙事里的皇子状元
    content: >-
      流传最广的版本是这样的：政和八年，赵楷化名应举，从乡试、省试一路过关斩将，直至殿试
      夺魁；发榜之后向父皇道出实情，徽宗又惊又喜，怕天下人议论，遂将第二名王昂提为状元。
      此说层层加码，把「奉诏赴廷对」说成「私自应举」，把「殿试」说成「偷赴锁厅试」，
      连「连皇帝都吓了一跳」的桥段也配齐了。
    tier: C
    source_ids: [src_minjian_chuanshuo]
    note: >-
      《宋史·徽宗本纪》所载与此相反：三月癸巳「令嘉王楷赴廷对」，是奉诏应试；放榜时
      有司申报的名字写作「嘉王楷」，用的是真名真身份。自诏令至放榜仅十五日，无乡试、
      省试次第可寻。本条仅作传说收录，不作史实依据。
  - title: 「身份最尊贵的状元」——一个被追认的名号
    content: >-
      今日通俗读物与短视频常径称赵楷为「中国历史上身份最尊贵的状元」「唯一的皇子状元」。
      事实上本科名分状元是王昂，赵楷的名次是第二；他得到的是考官唱名第一、皇帝不予批准，
      「状元」这顶帽子是后来的读者替他戴上的。名分追认这一类现象，与「王维是开元九年状元」
      「梁灏八十中状元」同属一系：人人都觉得「应该如此」，于是「如此」自己长了出来。
    tier: C
    source_ids: [src_minjian_chuanshuo]
    note: >-
      本站档案将赵楷 rank_detail 记为「殿试唱名第一，以宗室避嫌抑置第二；本科名分状元为
      王昂」，两说并置，不替他追认名分。
  - title: 王府画目至数千计——《画继》里的郓王
    content: >-
      南宋邓椿《画继》把他列在「侯王贵戚」之首：「禀资秀拔，为学精到。政和八年，射策于庭，
      名标第一，多士推服。性极嗜画，颇多储积。凡得珍图，即日上进，而御府所赐，亦不为少，
      复皆绝品，故王府画目，至数千计。又复时作小笔花鸟便面，克肖圣艺。」末句「乃知父尧子舜，
      趣尚一同」，是说他的画笔像他的父亲——徽宗的夸法，向来如此。
    tier: B
    source_ids: [src_huaji]
    note: >-
      画史系统中另记其为「徽宗第二子」，与《宋史·宗室传》「帝第三子」异——因次兄衮王柽
      早薨，不同系统的排行记载遂有差别，两说并存。另，元人《图绘宝鉴》称他「善画花鸟，
      极为精到，尤善墨花，但用墨粗，欠生动耳」，评语与《画继》同一路。
