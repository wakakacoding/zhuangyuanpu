person_id: zhong_fang_li
anecdotes:
  - title: 「女榜眼钟秀英是钟芳礼所掠之女」——传说里的一个陌生人
    content: >-
      《江南春梦庵笔记》说太平天国癸丑女试的榜眼钟秀英，是「钟芳礼所掠之女」。于是这位
      督理织营的恩赏丞相，在传说里被写成了一名掠女的军官。商衍鎏《女状元傅善祥考伪》
      驳之曰：「钟芳礼虽在南京，既无家室，亦焉能置掠女于女馆？且遍考太平天国文件笔记，
      绝无军官掠女的行为。」——人真，事伪。
    tier: C
    source_ids: [src_jiangnan_chunmeng, src_shang_taiping_keju]
    note: >-
      该传说的整体背景（「女科」「女状元」为伪书所造）见本站《傅善祥》一篇。
      本条只取与钟芳礼本人相关的一节：其名被借去做了传说中女榜眼的「父」，而其人其时
      正在天京掌织营。
  - title: 「太平天国状元」——名录里的一个待考条目
    content: >-
      部分名录将钟芳礼列为太平天国癸好三年（1853）科状元，本站索引亦存此条；而罗尔纲
      《太平天国史》为其立传，通篇只记御林侍卫、恩赏丞相、督理织营、副掌率、顺天燕、
      义爵诸官爵，不及科第。一位督织营的丞相与一位「状元」，两种身份至今无法合并。
    tier: C
    source_ids: [src_luoergang_zhuan54, src_zhuangyuan_dangan]
    note: >-
      天朝科考名目为天试、东试、北试、翼试，历科状元姓名多有传留，而钟氏之名不见于
      《钦定士阶条例》与亲历者的天京纪事。本站两说并存，标为存疑待考，不作定论。
