person_id: chen_xun
events:
  - year: 1385
    year_precision: exact
    type: 出生
    title: 生于江西泰和
    description: >-
      陈循，字德遵，号芳洲，江西承宣布政使司吉安府泰和县人。生于洪武十八年（1385）。
    source_ids: [src_mingshi_chenxun]
  - year: 1414
    year_precision: exact
    type: 中举
    title: 永乐十二年江西乡试第一（解元）
    description: >-
      甲午科江西乡试第一名举人。次年连捷。
    source_ids: [src_mingshi_chenxun]
  - year: 1415
    year_precision: exact
    type: 夺魁
    title: 永乐十三年乙未科状元
    description: >-
      本传：「永乐十三年进士第一。授翰林修撰。习朝廷典故。」《大政纪》记会试时
      主考原取其为会元，陈循以乡曲避嫌自请改置第二，进呈后帝亲擢第一——
      避嫌与会元让贤细节见《大政纪》（B 级备考）。
    source_ids: [src_mingshi_chenxun]
  - year: 1425
    year_precision: exact
    type: 升迁
    title: 洪熙元年进侍讲；宣德初直南宫，日承顾问
    description: >-
      「帝幸北京，命取秘阁书诣行在，遂留侍焉。洪熙元年，进侍讲。宣德初，
      受命直南宫，日承顾问。赐第玉河桥西，巡幸未尝不从。进侍讲学士。」
      宣德间两救言官：御史张楷献诗忤旨，循曰「彼亦忠爱也」，遂得释；
      御史陈祚上疏触帝怒，循婉为解，得不死。
    source_ids: [src_mingshi_chenxun]
  - year: 1444
    year_precision: exact
    type: 升迁
    title: 入文渊阁典机务；明年进户部右侍郎兼学士
    description: >-
      正统九年入文渊阁。时三杨相继谢世，礼部援故事请以杨溥老宜优闲、
      令循等预议——状元陈循与曹鼐（宣德八年状元）、马愉（宣德二年状元）
      同掌内阁，明代内阁「三状元同阁」之局。
    source_ids: [src_mingshi_chenxun]
  - year: 1449
    year_precision: exact
    type: 升迁
    title: 土木之变居中赞画，进户部尚书
    description: >-
      「土木之变，人心汹惧，循居中，所言多采纳，进户部尚书，兼职如故。
      额森犯京师，请敕各边精骑入卫，驰檄回番以疑敌，帝皆从其计。」
      于谦「欲迁者可斩」之议，陈循表态「于侍郎言是」（今人传记所记，
      本传不载此语）。
    source_ids: [src_mingshi_chenxun]
  - year: 1451
    year_precision: exact
    type: 升迁
    title: 进少保兼文渊阁大学士；易储受金不敢诤
    description: >-
      景泰二年十二月进少保兼文渊阁大学士。帝欲易太子，先期赐循及高谷白金百两
      ——「比下诏议，循等遂不敢诤」。加兼太子太傅，进华盖殿大学士兼文渊阁如故。
      同年其子陈英与王文子应顺天乡试被黜，相与构陷考官刘俨、黄谏，
      为给事中张宁等所劾，帝亦不罪——「循本以才望显，及是素誉隳焉」。
    source_ids: [src_mingshi_chenxun]
  - year: 1457
    year_precision: exact
    type: 罢官
    title: 英宗复位，杖百戍铁岭卫
    description: >-
      夺门之变后于谦、王文死，陈循受牵连「杖循百，戍铁岭卫」。
      本传论曰「其严谴则石亨辈为之，非帝意也」。
    source_ids: [src_mingshi_chenxun]
  - year: 1461
    year_precision: exact
    type: 罢官
    title: 石亨败，自贬所上书自讼，诏释为民
    description: >-
      天顺五年石亨诬事泄，陈循自铁岭上书自讼，历数石亨等侥幸之罪，
      诏释为民，仍居铁岭。
    source_ids: [src_mingshi_chenxun]
  - year: 1462
    year_precision: exact
    type: 卒
    title: 卒于铁岭；成化间平反，复官赐祭
    description: >-
      释为民一年后卒（天顺六年，1462）。成化中于谦案昭雪，陈循子引例请恤，
      「乃复官赐祭」。
    source_ids: [src_mingshi_chenxun]
