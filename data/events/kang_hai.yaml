person_id: kang_hai
events:
  - year: 1475
    year_precision: exact
    type: 出生
    title: 生于陕西武功浒西庄，父镛
    description: >-
      行状：「距生成化乙未六月二十日，享年六十有六。」成化乙未即成化十一年。行状记其
      先世「其先河南固始人」，传记则明言「先籍河南固始人，今籍则陕西武功县」；咸阳方志
      作「西安府武功县浒西庄人」。《康公海传》记其幼时「数岁与群儿嬉，嬉师焉。父镛授之业，
      辄退而嬉，怒欲棰之，明日课所业，无可棰乃已」，稍长语及业师牛傅「未尝不潸然泣也」。
    source_ids: [src_xianzhenglu_kanghai, src_xianyangzhi_kanghai]
  - year: 1494
    year_precision: about
    type: 应试
    title: 入县学，提学杨一清见其文，以天下士许之
    description: >-
      行状：「时提学杨邃庵先生奇其才，即以天下士许之。」杨邃庵即杨一清，时督学陕西。
      咸阳方志记其弘治七年（1494）入县学，本批据此系年，仍以约年视之。行状另记其
      「为文脱去近习，上追汉魏」。
    source_ids: [src_xianzhenglu_kanghai, src_xianyangzhi_kanghai]
  - year: 1498
    year_precision: exact
    type: 中举
    title: 弘治十一年戊午科陕西乡试中式
    description: >-
      行状：「以诗经中弘治戊午乡试。」戊午即弘治十一年。咸阳方志记其「24 岁与三原马理
      同举于乡」，与生年 1475 推得之虚岁相合；同榜马理（号谿田）后以理学名关中，
      与康海终身交好，亦是与吕柟（泾野）并称的关中人物。
    source_ids: [src_xianzhenglu_kanghai, src_xianyangzhi_kanghai]
  - year: 1502
    year_precision: exact
    type: 夺魁
    title: 弘治十五年壬戌科状元，孝宗谓「我明百五十年无此文体」
    description: >-
      行状：「壬戌进士第一，除翰林院修撰。是时孝宗皇帝拔奇抡才，右文兴治，厌一时为文
      之陋，思得为才雅士，见先生策，谓辅臣曰：我明百五十年无此文体，是可以变今追古矣。
      遂列置第一，而天下传诵则效，文体为之一变，朝野景慕若麟凤龟龙，间世而一睹焉。」
      本传但记「弘治十五年殿试第一，授修撰」。咸阳方志补记其兼经筵讲官、与修宪宗、
      孝宗两朝实录。是年之后，与李梦阳、何景明辈倡「文必秦汉，诗必盛唐」，
      号为「十才子」「七才子」。
    source_ids: [src_xianzhenglu_kanghai, src_mingshi_kanghai, src_xianyangzhi_kanghai]
  - year: 1506
    year_precision: about
    type: 授官
    title: 自关中北上，复任翰林院修撰，在史馆三年
    description: >-
      行状：「修撰一年归关中三年，北上复为修撰。其在翰林，能面道人过失，论古今文艺
      不少假借，一时在翰林者罔不敛衽服之。」《康公海传》记其在史馆「凡论著必宗经，
      而子史以宋人言为俚、以唐为巧、以秦汉为伯仲」，故同进者忌之，「伪以国老文就而正之，
      实祸之也」，海不疑而笔削以授，遂「十存一二焉」。系年据「修撰一年归关中三年」之次第。
    source_ids: [src_xianzhenglu_kanghai]
  - year: 1510
    year_precision: exact
    type: 罢官
    title: 刘瑾败，坐瑾党削籍为民，禁锢终身
    description: >-
      本传：「逾年，瑾败，海坐党，落职。」行状详其始末：先是正德三年（1508）李梦阳
      因代草劾瑾之疏下诏狱，自狱中传帖呼「对山救我」，康海亲往刘瑾所言说，明日梦阳获释
      （见轶事栏）；及瑾败，忌者谓海交瑾，「故失财而复获」——此指海遭内艰归时在顺德
      遇盗失财、后捕盗者追还之事——遂罢其官而禁锢。陕西地方志另记「有人劝其上书申辩
      以图起复，他断然拒绝」，从此放形物外。时正德五年（1510）八月。
    source_ids: [src_mingshi_kanghai, src_xianzhenglu_kanghai, src_xianyangzhi_kanghai]
  - year: 1512
    year_precision: about
    type: 隐居
    title: 归里三十年，寄情声伎，与王九思同治北曲
    description: >-
      本传：「海、九思同里、同官，同以瑾党废。每相聚沜东鄠、杜间，挟声伎酣饮，制乐造
      歌曲，自比俳优，以寄其怫郁。」《康公海传》记其自道「辞章小技耳，壮夫不为」，
      乃「求律于太常氏，又自审定黄钟而用之」，宣以七音、舞以羽钥，自是「有安石东山之兴」。
      咸阳方志记其广蓄优伶、亲操琵琶，与王九思共创「康王腔」，参与秋神报赛，
      剧作有《东郭先生误救中山狼》《王兰卿贞烈传》两种。系年约在罢官之后数年。
    source_ids: [src_mingshi_kanghai, src_xianzhenglu_kanghai, src_xianyangzhi_kanghai]
  - year: 1519
    year_precision: exact
    type: 著作
    title: 《武功县志》七篇刻成，吕柟、何景明为之序
    description: >-
      四库提要：「是志仅七篇，曰地理，曰建置，曰祠祀，曰田赋，曰官师，曰人物，曰选举
      ……王士祯谓其文简事核，训词尔雅。石邦教称其义昭劝鉴，尤严而公，乡国之史莫良于此。
      志刻于正德己卯。」正德己卯即正德十四年（1519）。卷首吕柟序自称「吾友康子德涵」，
      署「正德己卯冬十一月甲寅泾野吕柟书」；何景明序署「正德十四年己卯冬十二月五日
      大复山人汝南何景明撰并书」——二序为康海与吕柟交谊的确证。
    source_ids: [src_siku_wugongxianzhi]
  - year: 1524
    year_precision: exact
    type: 著作
    title: 散曲集《沜东乐府》二卷刻成
    description: >-
      咸阳方志记其「散曲有《沜东乐府》二卷……初刊本为嘉靖三年（1524）从弟康浩所刻，
      卷首有康海自序，后有康浩跋。此书收录小令 230 首，套数 32 套，大部分为叹世、闲适
      之作」；《续修四库全书·集部·曲类》亦著录此书。康海家设家班，其曲「作每出，
      二青衣不逾时辄能奏成」，与王九思同为明代北曲一支劲军。
    source_ids: [src_xianyangzhi_kanghai]
  - year: 1540
    year_precision: exact
    type: 卒
    title: 十二月十四日卒于家，享年六十六；遗命以山人巾服成殓
    description: >-
      行状：「嘉靖庚子十二月十四日前翰林院修撰对山康先生卒。」庚子即嘉靖十九年；
      行状又记其「距生成化乙未六月二十日，享年六十有六」，与生卒日互校相合。
      咸阳方志记「殁时，遗命以山人巾服成殓。检其遗资，『借金百余』，而大小鼓却存有
      300 多副」；《静志居诗话》亦谓「没时家无长物，腰鼓多至三百副」。**享年三说并存**：
      行状作六十六、同书所收无名氏《康公海传》作「年六十四」、陕西方志又作六十五，
      本站从行状。又农历十二月十四日已入公历 1541 年 1 月，故后世亦有作「卒于 1541 年」者。
    source_ids: [src_xianzhenglu_kanghai, src_xianyangzhi_kanghai]
