# 王拱辰事件档案（R4-T1 批次 7，2026-10-25）
person_id: wang_gong_chen
events:
- year: 1012
  year_precision: about
  type: 出生
  title: 生于开封咸平，初名拱寿
  description: 本传：「王拱辰，字君贶，开封咸平人。元名拱寿。」生年据「年七十四」 （哲宗立是年薨，1085）逆推 1012，与卡一致。
  source_ids:
  - src_songshi_wanggongchen
- year: 1030
  year_precision: exact
  type: 夺魁
  title: 天圣八年十九岁举进士第一，仁宗赐名拱辰
  description: 「年十九，举进士第一，仁宗赐以今名。」天圣八年庚午科状元——宋代最年轻 的状元之一，皇帝亲自为他改名（拱寿→拱辰，取「为政以德，譬如北辰」意）。
  source_ids:
  - src_songshi_wanggongchen
- year: 1041
  year_precision: exact
  type: 授官
  title: 庆历元年为翰林学士
  description: 「庆历元年，为翰林学士。」十九岁及第，入翰林时尚不满三十。后来契丹主 称他「南朝少年状元也，入翰林十五年」即此。
  source_ids:
  - src_songshi_wanggongchen
- year: 1043
  year_precision: about
  type: 授官
  title: 驳契丹塘泊之论，答关南十县国书
  description: 契丹使刘六符夸言塘泊「一苇可杭」，仁宗以问，拱辰断为虚声恫吓「设险守国， 先王不废」。及契丹求关南十县、斥太宗伐燕无名，「举朝莫知所答」，拱辰援 石岭关旧事作报书「既交石岭之锋，遂有蓟门之役」，契丹得报继好如初。
    帝喜曰「非拱辰深练故实，殆难答也」。
  source_ids:
  - src_songshi_wanggongchen
- year: 1044
  year_precision: about
  type: 授官
  title: 拜御史中丞，引裾谏罢夏竦
  description: 拜御史中丞。夏竦除枢密使，拱辰言「竦经略西师，无功称而归。今置诸二府， 何以厉世」。极论时帝未省遽起，「拱辰前引裾，乃纳其说，竦遂罢」—— 拉住皇帝衣襟的直臣。
  source_ids:
  - src_songshi_wanggongchen
- year: 1044
  year_precision: about
  type: 贬谪
  title: 进奏院风波——倾杜衍范仲淹，「为公议所薄」
  description: 苏舜钦会宾客于进奏院，王益柔醉作《傲歌》，拱辰讽僚属举劾，同席者俱逐。 本传直言动机：「舜钦、益柔皆仲淹所荐，而舜钦，衍婿也，故因是倾之， 由此为公议所薄。」——《宋史》不为贤者讳的一笔，也是庆历党争的注脚。
  source_ids:
  - src_songshi_wanggongchen
- year: 1056
  year_precision: exact
  type: 授官
  title: 聘契丹，混同江上主亲鼓琵琶以侑饮
  description: 至和三年复拜三司使，聘契丹。见其主于混同江，设宴垂钓，每得鱼必酌拱辰酒、 亲鼓琵琶侑饮，谓其相曰「此南朝少年状元也，入翰林十五年，故吾厚待之」。 使还，御史赵抃论其当非正之礼，「异时北使援此以请，将何辞拒之」——
    外交场合的礼遇之辩。
  source_ids:
  - src_songshi_wanggongchen
- year: 1068
  year_precision: about
  type: 贬谪
  title: 王安石恶其异己，出知应天府
  description: 神宗登极恩当转仆射，欧阳修以为宰相官不应序进，但迁太子少保。熙宁元年 复召还，「王安石参知政事，恶其异己，乘二相有故，出为应天府」。
  source_ids:
  - src_songshi_wanggongchen
- year: 1078
  year_precision: about
  type: 授官
  title: 抗言保甲之害，「此老臣所以报国也」
  description: 三路籍民为保甲日聚教之，禁令苛急，往往去为盗。拱辰抗言其害，请财损下户 以纾之。主者指为沮法，拱辰曰「此老臣所以报国也」，上章不已。「帝悟， 于是第五等户得免」——一争之下，最穷的一等户免于保甲。
  source_ids:
  - src_songshi_wanggongchen
- year: 1085
  year_precision: exact
  type: 卒
  title: 哲宗立，是年薨年七十四，谥懿恪
  description: 哲宗立徙节彰德加检校太师，「是年薨，年七十四。赠开府仪同三司，谥懿恪」。 本传论曰：「拱辰争保甲，言尤剀切，皆谔谔不少贬，为国老成，望始重矣。」
  source_ids:
  - src_songshi_wanggongchen
