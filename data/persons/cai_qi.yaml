bio_short: 大中祥符八年状元，「状元给驺自齐始」。拒内侍罗崇勋以参政为饵的诱记，谏止杨太妃同裁制军国，抵太后姻亲王齐雄罪（「以恩废法，如朝廷何」），磨去枢密题名「逆准不书」还寇准清白。所荐庞籍等后为名臣。谥文忠。
