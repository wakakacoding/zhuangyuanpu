bio_short: >-
  嘉庆十八年（1813）广西乡试解元，二十五年（1820）会元、状元连捷，
  为中国科举史上最后一位「三元及第」。乾隆朝大学士陈宏谋玄孙。
  历官翰林院修撰，外放后官至布政使（具体履历待考）。道光二十九年（1849）卒。
