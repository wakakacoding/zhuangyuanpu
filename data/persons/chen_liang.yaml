bio_short: 南宋思想家、永康事功学派之集大成者。五上孝宗书力主恢复，三陷大狱皆几死得免；绍熙四年以君道师道对策，光宗御笔擢为第一。授佥书建康府判官厅公事，未至官一夕而卒。与朱熹义利王霸之辨往复经年，自谓「推倒一世之智勇，开拓万古之心胸」。卒谥文毅，有《龙川集》传世。
