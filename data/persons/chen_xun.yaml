bio_short: 永乐十三年状元，景泰朝首辅，明代第一位官至一品的状元。土木之变居中赞画，所言多采纳；也先犯京师请敕各边精骑入卫。夺门之变后受于谦案牵连，杖百戍铁岭卫，石亨败后释为民，成化间平反赐祭。《明史》记其易储时受金「不敢诤」、其子乡试被黜构陷考官，「刻躁为士论所薄」——功过并书。
