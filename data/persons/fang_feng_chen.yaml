bio_short: >-
  南宋最「不像状元相」的状元。初名梦魁，淳祐十年（1250）廷对敷陈鲠亮，
  理宗亲擢第一并赐名逢辰——唱名之日，这位新状元「右足跛，左目瞽」，
  同榜第四名与南省元亦各眇一目，一榜三残而魁首无双，宋季科举不拘形貌
  的实证。仕秘书省正字、校书郎，以言事忤权相继而罢；景定间知瑞州，
  咸淳七年除吏部侍郎，德祐初拜礼部尚书，未及赴而宋亡。元世祖诏起，
  严辞拒之，归里以讲学终老，学者称蛟峰先生。生平以格物为本、笃行为要，
  所至以教务为先，创石峡书院，婺州、鄱江、东湖诸书院皆其讲席；
  著《孝经解》《易外传》《尚书释传》《学庸注释》诸书。弟方逢振同榜进士，
  亦以义不屈元。
