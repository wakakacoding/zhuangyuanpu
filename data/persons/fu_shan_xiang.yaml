bio_short: >-
  金陵人。太平天国定都天京后经招考入东王府任内簿书，为东王杨秀清批判文书。太平天国官书
  《天父圣旨》作「伏善祥」，可证其人与其职。所谓「女科状元」首见于清人汪堃《盾鼻随闻录》，
  经《江南春梦庵笔记》加详、《太平天国野史》小说化而成通说；学界聚讼百年，本站列为
  存疑条目，以考证故事详列异说，不作定论。
