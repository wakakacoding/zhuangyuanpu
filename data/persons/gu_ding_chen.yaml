bio_short: 弘治十八年状元。进《步虚词》七章，「词臣以青词结主知，由鼎臣倡也」。嘉靖十七年入阁，夏言当国下充位而已。官侍从时屡陈东南赋役之弊促成欧阳铎厘定，又倡筑昆山城，嘉靖末倭乱起而昆山获全，乡人立祠。
