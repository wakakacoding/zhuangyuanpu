bio_short: 徐乾学自遗卷拔起，康熙十二年会试殿试皆第一。特工制举文，纂《孝经衍义》、总裁《一统志》，官至礼部尚书。以「情私而语公」一语为忌者所增益，恩眷渐衰，饮不辍至卒。乾隆间追谥文懿，制义「清真雅正，开风气之先」。
