bio_short: 元丰五年进士第一。宋史无传（《演山集》四库提要明言）。累官礼部尚书，赠资政殿大学士，谥忠文。政和宣和间上书斥三舍法「宜近不宜远，宜少不宜老，宜富不宜贫」，人以为确论。自称紫元翁，著《演山集》六十卷宋刊原帙。
