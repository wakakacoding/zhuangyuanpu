bio_short: >-
  万历十七年（1589）己丑科状元。江宁人，原籍山东日照。少从督学御史耿定向学，复质疑于罗汝芳，
  为耿定向所遴十四郡名士之长，读书崇正书院。及第授翰林修撰，益讨习国朝典章；万历二十二年
  大学士陈于陛议修国史，欲以专领其事，他逊谢，仅成《经籍志》，而私撰《国朝献征录》一百二十卷，
  为明代人物文献之总汇。充东宫讲官，屡启皇长子问难之风，讲次群鸟飞鸣则辍讲肃立。二十五年
  主顺天乡试，被劾所取险怪，谪福宁州同知，再镌秩，遂不复出。博极群书，自经史至稗官杂说
  无不淹贯，家积书数万卷，主盟金陵文坛，黄宗羲谓其「以理学倡率，王弇州所不如」。讲学以
  罗汝芳为宗，与耿定向兄弟、李贽友善，时人以禅学相讥。万历四十八年卒，年八十，福王时追谥文端。
