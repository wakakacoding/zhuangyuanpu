bio_short: >-
  弘治十五年（1502）壬戌科状元。殿试对策称旨，孝宗谓辅臣「我明百五十年无此文体，
  是可以变今追古矣」，遂列第一，天下传诵，文体为之一变；授翰林院修撰，兼经筵讲官，
  与李梦阳辈倡「文必秦汉，诗必盛唐」，为「十才子」「七才子」之一。正德三年李梦阳下狱，
  书片纸呼「对山救我」，康海亲谒刘瑾说之，梦阳得释；逾年瑾败，坐瑾党削籍为民，
  归里三十年，寄情声伎，与王九思同治北曲，自比俳优。著《武功县志》，义例分明，
  明清推为名志第一；散曲有《沜东乐府》，杂剧有《东郭先生误救中山狼》《王兰卿贞烈传》。
  嘉靖十九年（1540）卒，年六十六。吕柟称其「直节人也，致孝于亲，且笃交谊」。
