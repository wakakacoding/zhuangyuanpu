bio_short: >-
  「青词宰相」中评价最平正的一位。字子实，号石麓，扬州兴化人。嘉靖二十六年（1547）
  状元，简入西苑撰青词大被帝眷，自学士至柄政六迁皆出特旨、未尝一由廷推。任礼部尚书
  时考订宗藩故事成《宗藩条例》，解岁禄之困。隆庆间代徐阶为首辅，「益务以安静，称帝意」，
  谏止翔凤楼之修，与高拱、张居正共决俺答封贡。然居正一句「如此，庶保令名」令他愕然
  求去，终为高拱所凌，隆庆五年致仕。归乡时父母俱存，晨夕置酒为乐，乡里艳之。
  《明史》考语：「其才力不及也，而廉洁过之。」卒赠太师，谥文定。
