bio_short: >-
  梁颢长子。初以父荫赐进士出身，服阕诣登闻院让还前命，愿赴乡举——让官应举，
  时论高其节。大中祥符元年举服勤词学科擢甲第（《宋史》本传；名录作二年己酉科
  状元，两说并存），官至著作郎、直史馆。卒年三十三。与父颢世称「父子状元」，
  李心传载国朝父子状元凡三家，梁氏居其一。
