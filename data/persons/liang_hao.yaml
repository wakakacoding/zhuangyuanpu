bio_short: >-
  北宋状元，夺魁时年仅二十三（《建炎以来朝野杂记》），《三字经》「若梁灏，
  八十二」实系讹传，源出陈正敏《遁斋闲览》，洪迈《容斋四笔》已据国史辨之。
  官至翰林学士、权知开封府，景德元年暴疾卒，年四十二（今本《宋史》讹作
  「九十二」，点校本校勘记已正）。子梁固亦夺魁，世称「父子状元」。
