bio_short: >-
  中国历史上最后一位状元。光绪三十年（1904）甲辰恩科夺魁，次年科举即废，人称「第一人中最后人」。
  以小楷书法名世，时有「大楷学颜，小楷学刘」之誉。七七事变后拒任伪职，鬻字为生，全节而终。
