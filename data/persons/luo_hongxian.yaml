bio_short: >-
  嘉靖八年（1529）己丑科状元，授翰林院修撰，世宗批其文「学正有见，言谠而意必忠」。
  幼慕同邑罗伦之为人，年十五读《传习录》而好之，师事同邑李中；虽宗良知之学，
  而未尝及王守仁之门。嘉靖十九年冬与唐顺之、赵时春上疏请皇太子御文华殿受朝贺，
  忤旨，三人并黜为民。归后辟石莲洞，默坐三年不出户，以「主静」补良知之说，
  与王畿「现成良知」之论终不相合；均邑中田赋、赈饥、画策御流寇，皆以经世为归。
  晚岁严嵩欲以边才起用，力辞。平生考图观史，增订元人朱思本《舆地图》为《广舆图》，
  为中国现存最早的刻本综合地图集。嘉靖四十三年（1564）卒，年六十一；隆庆改元，
  赠光禄寺少卿，谥文恭（《明史》作文庄）。
