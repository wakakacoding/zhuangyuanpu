# 罗洪先（1504–1564）—— 嘉靖八年己丑科状元，江右王门学者、地图学家，学者称念庵先生
# 卒年：《明史》本传作「隆庆初，卒」为误——徐阶所撰墓志明记「甲子八月十五，卒于松原之新第，
# 年六十一」，甲子即嘉靖四十三年（1564）；《明儒学案》卷十八亦作「四十三年卒，年六十一」。
# 谥号两说：《明史》作「文庄」，徐阶《念庵罗公墓志铭》与《明儒学案》卷十八并作「文恭」。
# 本站从墓志、学案作「文恭」，本传「文庄」之异说见 events 与交付报告考订节。
# 籍贯：墓志「厥初豫章人，三徙而居吉水之橙溪」，橙溪即今吉水县谷村一带。
# 师承：本传作「师事同邑李中」，而《明儒学案》另记其「年二十五师事黄宏纲、何廷仁」；
# 四库馆臣辨之曰「不及见王守仁，而受学于其乡人李中，中之学出于杨珠」——非阳明亲传弟子。
