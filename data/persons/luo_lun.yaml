bio_short: >-
  成化二年（1466）丙戌科状元。吉安永丰人。家贫，樵牧挟书，诵不辍。廷试对策万馀言，直斥时弊，
  名震都下，擢进士第一，授翰林修撰。逾二月，大学士李贤奔丧毕奉诏还朝，他诣其第劝阻不听，
  乃上疏历陈起复之非，援杨溥故事、宋仁宗起复富弼而弼辞诸例，谓「君能教臣以孝，臣有孝可移于君」；
  疏入，谪福建市舶司副提举。在泉州两袖清风，尝拒迁市舶司于福州之议，聚徒讲学于郡北净真观。
  明年以学士商辂言召复原职，改南京，居二年引疾归，遂不复出。以金牛山人迹不至，筑室著书其中，
  四方从学者甚众；里居倡行乡约，相率无敢犯。为人刚正，严于律己，家贫日中不能举火而对客谈学不倦。
  成化十四年卒，年四十八；嘉靖初追赠左春坊谕德，谥文毅。有《一峰集》十卷，后附《梦稿》二卷。
