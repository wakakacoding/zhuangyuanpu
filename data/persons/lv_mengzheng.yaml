bio_short: 太平兴国二年状元，幼年被逐、寒窑苦读。三入相（国朝以来惟赵普与蒙正），奏定宰相子止授九品京官之制。古镜「安用照二百里」、灯夕直谏「都城外不数里饥寒而死者甚众」。荐侄吕夷简、识富弼于少年。谥文穆。
