bio_short: >-
  正德三年（1508）戊辰科状元，陕西高陵人，学者称泾野先生。初字大栋，后改字仲木，
  因居泾水之阳而号泾野。授翰林修撰，忤刘瑾引疾去；乾清宫灾应诏陈六事，皆武宗荒政。
  世宗初召还，嘉靖三年（1524）以大礼议下诏狱，谪解州判官，摄行州事三年，行《吕氏乡约》、
  《文公家礼》，兴解梁书院。历南京太常寺少卿、国子监祭酒、南京礼部右侍郎。时天下言
  学者不归王守仁即归湛若水，独守程、朱不变者惟柟与罗钦顺。嘉靖二十一年（1542）卒，
  年六十四，谥文简。
