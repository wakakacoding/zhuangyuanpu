bio_short: 正统十三年状元，释褐逾年即入阁，「前此未有也」。天顺朝与李贤同心辅政，宪宗朝力定两宫尊号、力争慈懿太后合葬祔庙（伏文华门泣请）。立朝三十年，卒赠太师谥文宪，「有古大臣风」。
