bio_short: 「六元状元」，清代第一个连中三元者。县试、府试、院试小三元，乡试解元、会试会元、殿试状元大三元，六个第一集于一身。乾隆帝赋《御制三元诗》记盛，翁方纲辑《三元诗集》。嘉庆四年擢内阁学士兼礼部侍郎、提督云南学政，卒于任上。生年 1734/1743 两说并存。
