bio_short: >-
  宣德十年（1435）浙江乡试解元，正统十年（1445）会元、状元连捷，为明代正式
  「三元及第」唯一一人（黄观因靖难被革除名籍）。土木之变后主守京师，夺门之变
  遭石亨构陷削籍，成化初复官，官至谨身殿大学士。卒赠太傅，谥文毅。
