bio_short: >-
  史载有姓名可考的第一位状元。隋末以小史累补万年县法曹；武德元年（618）
  上疏谏三事，高祖擢为治书侍御史，赐帛三百匹；武德四年谏止流徙王世充、
  窦建德余党，并请置谏官。武德五年（622）壬午科进士第一。贞观朝历大理
  少卿、民部侍郎，十四年拜大理卿，以直谏、慎刑著称。后出为陕州刺史，
  永徽五年（654）致仕，显庆三年（658）卒。
