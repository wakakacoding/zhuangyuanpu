bio_short: >-
  字叔兴，江都（今扬州）人，一说祖籍成都（CBDB 径作成都人）；一说为神宗朝宰相王珪之侄。
  以文学称于时。政和八年（1118）殿试原拟第二，因榜首为徽宗第三子嘉王赵楷、帝为避嫌
  不欲宗室先多士，遂擢为榜首。入仕除秘书省校书郎；宣和六年（1124）充接伴大金国贺正旦
  人使（《三朝北盟会编》作礼部员外郎、九月，今人标目作祠部员外郎、十月），后坐「不谨」
  停职；绍兴二年（1132）以起居舍人并试中书舍人，以疾不拜，改徽猷阁待制知台州，是年卒。
  生年有 1090（今人标目）与 1089（CBDB）两说，并存。
