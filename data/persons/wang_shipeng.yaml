bio_short: >-
  绍兴二十七年（1157）丁丑科状元。秦桧死后高宗亲策进士，他对策以「揽权」为说，
  上临定其文，以为经学淹通、议论醇正，遂擢第一，学者争传其策、以拟汉之晁错与董仲舒。
  历秘书省校书郎兼建王府小学教授、起居舍人兼侍讲、侍御史；力主备金，荐用张浚、刘锜，
  并论三衙管军、诸军承受、皇城逻卒之弊，其言大略施行。为侍御史时疏论史浩八罪，
  浩与史正志、林安宅并罢。符离师溃后上疏自劾，出知饶州，历饶、夔、湖、泉四郡，
  布上恩、恤民隐，所至人绘而祠之，饶民断桥以留。乾道七年（1171）除太子詹事，
  力疾造朝，卒于家，年六十；绍熙三年（1192）谥忠文。书室扁曰「不欺」，
  朱熹、张栻雅敬之。
