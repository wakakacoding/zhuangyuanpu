# 王十朋（1112–1171）—— 绍兴二十七年丁丑科状元，南宋名臣，谥忠文
# 籍贯：《宋史》本传与汪应辰《墓志铭》一致作「温州乐清人」；墓志另记「其先自钱塘徙，
# 至朝散公始业儒有声」，为族源而非籍贯，故字段仍取「温州乐清县」。
# 生卒：生年不见本传与墓志明文，据卒「年六十」（乾道七年 1171）逆推为 1112；
# 出生月日（十月二十八日）见今人年谱与温州方志，非本批所引来源明文，故不写入字段。
# 字号：字龟龄（《宋史》本传首句与墓志同），号梅溪（本传「聚徒梅溪，受业者以百数」）。
