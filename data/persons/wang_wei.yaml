bio_short: >-
  盛唐诗人、画家，世称「诗佛」。开元九年（721）进士擢第，正史未载其状元名次；
  「状元」说出自唐人小说《集异记》郁轮袍故事，存疑备考。安史乱中陷贼受伪职，
  收京后以《凝碧池》诗获宥，官至尚书右丞，世称王右丞。
