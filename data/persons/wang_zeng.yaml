bio_short: >-
  咸平五年（1002）壬寅科状元。青州发解、南省、廷试皆为第一，是宋代继孙何之后第二位
  「连中三元」者，殿试所试《有物混成赋》，杨亿见而叹为「王佐器也」。仁宗初立，草遗诏
  坚持留「权」字以限太后之权，定两宫垂帘之仪，挫败丁谓「柄归宦官」之谋，朝廷倚以为重；
  两度拜相，封沂国公。宝元元年（1038）卒于判郓州任上，年六十一，赠侍中，谥文正。
  嘉祐八年（1063）诏择将相配享仁宗庙，以曾为第一。
