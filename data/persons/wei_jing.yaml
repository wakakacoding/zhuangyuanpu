bio_short: 南宋淳熙十一年状元，昆山历史上第一位状元。三上表辞添差虚衔、任满不谒宰相王淮，直声早著；开禧三年参与谋诛韩侂胄，进参知政事，后为史弥远所忌出知潭州。与朱熹友善，韩死奏请召还朱熹，已卒则移檄刊刻其四书注。家居十年名堂「后乐」，自号后乐居士。卒赠太师，谥文节，《宋史》不为其立传，沈德潜叹「可怪也」。
