bio_short: >-
  宝祐四年（1256）廷对策万余言，理宗亲擢第一。德祐元年（1275）倾家财起兵勤王，
  官至右丞相兼枢密使。五坡岭被俘，囚大都四年，拒降，至元十九年十二月（1283）
  就义于柴市。《正气歌》《过零丁洋》光照千古。
