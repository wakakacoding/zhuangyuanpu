bio_short: 文征明曾孙，弱冠举乡试后十赴会试，天启二年四十九岁大魁。劾魏忠贤「傀儡登场」遭廷杖，崇祯朝「真讲官」，八年入阁三月为温体仁所排落职，哭甥恸卒。福王时追谥文肃。
