bio_short: 明成化八年会试廷试皆第一，明代少见的会元状元。两朝东宫讲官，孝宗旧学之师，官至礼部尚书兼翰林院学士。词臣望重第一而终身不入阁，谢迁两荐不果，自安曰「吾初望不及此也」。卒赠太子太保，谥文定。工书法，最好苏学，为吴门文苑领袖，有《匏翁家藏集》七十卷。
