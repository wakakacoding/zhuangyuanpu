rank_detail: 一甲第一名（状元）——原拟第二，因榜首宗室赵汝愚以故事降居第二而递升
bio_short: >-
  字挺之，福州永福翀峰（今永泰县岭路乡）人，一说今莆田涵江大洋乡人，两说并存。
  乾道二年（1166）殿试原拟第二，因榜首宗室赵汝愚曾挂仕版、按故事当逊避而降居第二，
  遂升为第一人。历官左宣义郎、秘书郎、著作郎、太子侍讲兼礼部郎中、广东通判，知泉州、
  建宁，终知漳州，举家入漳，卒葬龙溪新亭（今漳州「萧状元墓」）。乾道五年（1169）
  以校书郎论汉武帝虚耗之弊、盐铁坑冶取民无艺，孝宗多采其说。与杨万里交好，
  万里有《别萧挺之泉州二首》。有文集十一种，皆不传。生卒年俱不详。
