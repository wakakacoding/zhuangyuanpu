bio_short: >-
  少师杨廷和之子，正德六年（1511）状元。嘉靖三年（1524）大礼议中率百官伏左顺门哭谏，
  两遭廷杖，谪戍云南永昌，戍边三十五年，卒于戍所。著作等身，为明代记诵之博、
  著述之富第一人；《临江仙·滚滚长江东逝水》出其所著《廿一史弹词》。
