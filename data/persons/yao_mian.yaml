bio_short: >-
  两斗奸相、两罢其官的硬骨头状元。字述之，号雪坡，瑞州新昌（今江西宜丰）人。
  少颖悟，「日诵数千言，居常作文有魁天下之志」，师从江西诗派乐雷发。
  宝祐元年（1253）廷对第一，言朝政纲领「惟在用人、听言」。丁父忧服阕除秘书省
  正字，值太学生论丁大全被逐，上封事语甚切直，遂归；开庆间吴潜入相召为校书郎
  兼太子舍人，为太子讲《易》否卦，借题指斥权奸，忤贾似道，被劾为吴潜党而罢。
  四十六岁病卒，未赴处州通判之任。《四库总目》评其文：「论时政之谬、
  辨宰相之奸，皆侃侃而不阿。」方逢辰称其「磊落有奇节」，文如「长江大河，
  一泻千里」。有《雪坡舍人集》五十卷。
