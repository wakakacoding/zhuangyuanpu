bio_short: 南宋嘉定七年状元，宝文阁直学士袁燮之子，师杨简，甬上陆学二传。历知徽、衢州及江东提举常平、提点刑狱，荒政活民「所活殆不可数计」；创书院贵溪之南，祠先儒陆九渊。官至权兵部尚书暂兼吏部尚书，卒赠通奉大夫，谥正肃。有《蒙斋集》（四库辑本）传世。
