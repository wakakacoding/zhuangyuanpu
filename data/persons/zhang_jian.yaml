bio_short: >-
  光绪二十年（1894）状元，年四十一，屡蹶场屋后终成。同年即逢甲午战败，遂弃官
  办实业，创大生纱厂，兴通州师范学校，以一人之力造「中国近代第一城」南通。
  民初任农商总长。民国十五年（1926）卒于南通。
