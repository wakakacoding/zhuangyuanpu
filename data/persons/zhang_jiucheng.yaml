bio_short: >-
  绍兴二年（1132）壬子科状元。其先开封人，徙居钱塘；少游京师，从杨时学，为程门再传。
  高宗策进士，诏直言者置高等，他对策陈「金人有必亡之势，中国有必兴之理」，力请去谗节欲、
  远佞防奸、还二圣之车，并戒阉寺干政，遂擢首选；杨时遗书称「廷对自中兴以来未之有，
  非刚大之气，不为得丧回屈，不能为也」。授镇东军签判，争盐禁忤提刑，投檄归，从学者日众。
  赵鼎荐召，历著作郎、宗正少卿、权礼部侍郎兼侍讲、兼权刑部侍郎，平反大辟冤狱而辞赏。
  金人议和，面折秦桧「未有枉己而能直人」，谪守邵州，再落职；又以与径山宗杲往来被论谤讪
  朝政，谪居南安军十四年，执书就明、倚立庭砖，双趺隐然。桧死起知温州，痛陈户部督军粮之弊，
  丐祠归，绍兴二十九年卒，年六十八。宝庆初赠太师、封崇国公，谥文忠。著《横浦集》《孟子传》，
  为横浦学派之宗，全祖望谓「龟山弟子以风节光显者，无如横浦」。
