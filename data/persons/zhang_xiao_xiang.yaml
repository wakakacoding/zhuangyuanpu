# 籍贯考订：索引与原卡作「芜湖」，《宋史》本传作「历阳乌江人」（今安徽和县乌江镇，
#   属马鞍山市）；鄞县志系统作「生于明州鄞县桃源乡，少随父迁寓芜湖」。
#   三说各有依据：历阳乌江为本贯（正史口径，采为字段），鄞县为出生地，
#   芜湖为成长地与卒地（「于湖」之号即古于湖县，指芜湖）。本批 native_hist
#   由「芜湖」改为「历阳乌江」，点位由芜湖移至和县；原「芜湖」说写入 events
#   与注释不废。geo_map「历阳乌江」若缺须同步补条目。
# 生卒考订：本传「以疾卒，年三十八」；乾道五年（1169）进显谟阁直学士致仕、
#   归次芜湖中暑卒（鄞县志卷二十八），逆推生年 1132，与「年十六领乡书」自洽。
#   索引原 death_year: 1170 系卒年误记，本批改为 1169（享年三十八）。
