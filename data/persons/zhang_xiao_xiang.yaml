bio_short: >-
  南宋前期最负盛名的状元词人。字安国，号于湖居士，历阳乌江（今安徽和县）人，
  生于鄞县，少寓芜湖。读书过目不忘，下笔顷刻数千言，十六岁领乡书。绍兴二十四年廷试，
  高宗抑秦桧之孙秦埙而亲擢第一；登第旋上书为岳飞辩冤，拒不婚于秦党，父张祁被诬系诏狱。
  秦桧死后起复，历知抚州、平江府，治有声绩；力主恢复，兼领建康留守时席上赋《六州歌头》，
  张浚为之罢席。仕途两起两落，终官荆湖北路安抚使，筑寸金堤、置万盈仓。乾道五年致仕，
  归次芜湖中暑卒，年三十八，孝宗有用才不尽之叹。词上承苏轼、下开辛派先河，与张元干并称。
