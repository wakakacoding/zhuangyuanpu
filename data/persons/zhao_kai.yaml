bio_short: >-
  宋徽宗第三子，初名焕，累封魏国公、高密郡王、嘉王，后改王郓。政和八年（1118）三月
  奉诏赴廷对，御集英殿策进士，有司奏其第一；徽宗不欲宗室先多士，以第二人王昂为榜首。
  此为科举史上唯一「唱名第一而不得状元」的皇子，也是「皇族不点状元」之制的由来。
  靖康之变与诸王同迁北地，金天会八年（1130）六月卒于韩州。
