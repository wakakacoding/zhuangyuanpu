bio_short: >-
  广西人，癸好三年（1853）时年约五十，乡村小贩出身，信从天王宗旨入拜上帝会，
  为平地山老兄弟。金田起义授御林侍卫；克复南京后封恩赏丞相，督理织营（以军制编组织工
  五营集体织造）、总理「杂行」五十九行日用生产。丁巳七年（1857）任副掌率，封顺天燕，
  与蒙得恩共同总理国务，为天京事变后朝中要人之一；庚申十年（1860）诏升封义爵，
  其后事迹不详。具体籍贯县份与生卒年俱待考。
