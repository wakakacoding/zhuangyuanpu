# 张孝祥 B 级出处：六州歌头创作情境（建康留守席上，张浚罢席）
id: src_chaoyeyiji_zhangxiaoxiang
title: 朝野遗记（说郛引）·张浚闻六州歌头罢席条
tier: B
quote: >-
  张孝祥在建康留守席上赋《六州歌头》一阕，感激淋漓，主人为之罢席。
url: null
note: >-
  「主人」即张浚。此条《说郛》引《朝野遗记》，转见《白雨斋词话》「淋漓痛快，笔饱墨酣」
  之评所本；今人考此词作于隆兴元年（1163）至二年间张浚都督江淮、孝祥兼领建康留守时。
  引文据上海民政局长三角文学页与搜狗百科《于湖词》条转引转录，原书未核，待核。
  词作系年两说并存：一作隆兴二年（上海市民政局页），一作符离败后一年内（同前），
  events 取「约 1163–1164」之弹性表述。
