id: src_chengzhai_ji
title: 诚斋集
tier: B
juan: 卷六
quote: >-
  别萧挺之泉州二首：郎署春同宿，州麾晚卜邻。出山成底事，藉手得斯人。名实今无对，
  云霄早致身。再逢应互笑，谁发不如银。／八叶今成九，一枝谁敢双。野人应补外，贤者亦为邦。
  夹岸梅临水，孤帆雪涌江。别愁才半掬，不遣我心降。
url: https://zh.wikisource.org/wiki/誠齋集_(四部叢刊本)/卷第六
note: >-
  南宋·杨万里撰别集。「挺之」即萧国梁之字，诗作于淳熙元年（1174）萧氏赴泉州任时；
  同卷紧接「甲午出知漳州」诸诗，知杨万里次年亦出知漳州，二人同时外放。诗中
  「名实今无对」「八叶今成九」（用萧氏「八叶传芳」之典）皆推重之语，是萧国梁交游
  最可靠的一手材料。
