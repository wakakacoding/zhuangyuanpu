# 方逢辰 B 级出处：《吹剑四录》——唱名「三残」现场记录
id: src_chuijian_silu
title: 吹剑四录（俞文豹撰）·唱名条
tier: B
quote: >-
  唱名状元严州方梦魁，赐名逢辰，右足跛，左目瞽。第四名川人杨潮，南省元泉州陈应雷
  皆瞽一目。
url: null
note: >-
  宋·俞文豹撰。「右足跛、左目瞽」这一状元史上的著名细节，唯一同时代笔记出处；
  理宗赐名「逢辰」亦由此条坐实（今人考述皆转引此条）。引文据维基百科脚注转录，
  原书未核，待核。一人「足跛目眇」而夺魁，在同榜前三之外另有两人「瞽一目」，
  淳祐十年这一榜的特殊性由此条独存。
