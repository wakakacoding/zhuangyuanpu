id: src_ctext_qianqi
title: 钱棨年谱序列（中国哲学书电子化计划数据页汇编）
tier: B
juan: null
quote: >-
  乾隆五十八年（1793 年），50 岁的钱棨因革职留任已经八年，被准许开复职位。
  乾隆六十年（1795 年），52 岁的钱棨先是被拔擢为正六品的春坊中允。
  嘉庆二年（1797 年），54 岁的钱棨擢升为正五品的春坊右庶子。
  嘉庆三年（1798 年）三月，55 岁的钱棨升任从四品的翰林院侍讲学士。
url: https://ctext.org/datawiki.pl?if=gb&res=749525
note: >-
  ctext 数据页所辑钱棨年谱序列，四条年龄记载一致，逆推生于 1743/1744 年。
  与官方媒体通说 1734 相差九岁；其原始谱牒（当即石韫玉所撰墓志一类）本批未获原文，
  待核。同页另录互动百科系 1742 一说。
