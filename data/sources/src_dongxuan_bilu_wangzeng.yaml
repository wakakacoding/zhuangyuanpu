id: src_dongxuan_bilu_wangzeng
title: 东轩笔录（王曾条）
tier: B
juan: null
quote: >-
  王沂公青州發解，及南省、廷試皆為第一。中山劉子儀時為學士，戲語之曰：「狀元試三場，
  一生喫著不盡。」公正色曰：「曾平生之志不在溫飽。」
url: null
note: >-
  北宋魏泰撰，属宋人笔记（笔记类一手材料，故列 B 级）。本条经南宋李心传《旧闻证误》
  卷一引录，本件即据该转引录入，原书卷次待核。价值有二：① 「青州发解，及南省、廷试皆
  为第一」是「连中三元」在宋代文献中的直接表述；② 「平生之志不在温饱」一语的最早出处。
  李心传按语指出刘子仪（刘筠）任翰林学士在天禧四年，其时王曾已执政，对话年份有误
  —— 所疑者为系年，非语句本身，故本条入轶事栏而附以按语。
