id: src_dunbi_suiwenlu
title: 盾鼻随闻录
tier: C
juan: 卷五《摭言纪略》
quote: >-
  贼令女百长逐馆搜查，凡识字女子概令考试，以江宁人傅善祥为女状元。又女榜眼钟姓，
  女探花林姓，均取入伪府授女掌簿伪职，林姓三日即自尽。
url: null
note: >-
  清·汪堃撰，咸丰年间成书。「太平天国开女科、取女状元」之说，以此书为最早文本。
  罗尔纲考此书系「以攻击仇人何绍基为目的来编造」的被禁之书（《太平天国史料辨伪集》），
  故本件列 C 级，仅作传说源流收录，不作史实依据。卷八另收上元生员吴家桢
  《金陵纪事杂咏》，属同时代纪事诗，别立 src_jinling_jishi_zayong 一条，
  须与伪书本身分别看待。
