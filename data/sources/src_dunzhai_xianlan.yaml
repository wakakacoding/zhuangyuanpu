id: src_dunzhai_xianlan
title: 遁斋闲览
tier: C
juan: null
quote: >-
  梁灏八十二岁，雍熙二年状元及第。其谢启云：「白首穷经，少伏生之八岁；青云得路，
  多太公之二年。」后终秘书监，卒年九十余。
url: null
note: >-
  北宋·陈正敏（号遁翁，福建延平人）撰笔记，十四卷，约成书于徽宗崇宁、大观间
  （1102–1110），原书久佚，此条赖洪迈《容斋四笔》卷十四转引存世——「八十中状元」
  说可考的最早源头。距雍熙二年（985）夺魁已逾一百二十年。另载梁灏登第诗
  「天福三年来应试，雍熙二载始成名」，为同一传说之配套文本。
