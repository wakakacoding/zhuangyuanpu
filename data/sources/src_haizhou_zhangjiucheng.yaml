id: src_haizhou_zhangjiucheng
title: 海宁乡贤叙事·宋状元张九成传略（今人整理）
tier: C
juan: null
quote: >-
  紹興二十九年三月十五夜，張九成晚間做夢被一青衣人引至一座寺院，拜見了已逝的父母，並在一間屋子裡
  看見掛有自己畫像，並告訴他日將入駐於此，「見玉帶即來」。夢醒之後張九成命門人郎曄記錄此夢，
  以為玉帶是吉兆，不久病就會痊癒。……一日，與學生們讀江少虞所編的《事實類苑》一書，
  讀到「丁晉公取玉帶事」痛斥丁謂為奸邪之人，很不高興的拋下書卷回到屋內。當晚，舊疾復發，
  口不能言，次日病逝，正應夢中「玉帶」之事。
url: null
note: >-
  出今人整理之海宁（张九成葬地所在）乡贤叙事，经网络转录，属**二手标目、原始出处待溯**，故列 C 级。
  案张九成卒于临安府盐官县（今浙江海宁），墓在盐官镇西；此文所据当为《横浦先生家传》
  （附见宋刻《横浦先生文集》）一类家传材料，然本批**未获家传原文核对**，故其所记梦兆诸事
  一律入传说层，不入史实字段。其中「闰六月诏复敷文阁待制、赠左朝请大夫」「宗杲禅师亲至墓前致祭」
  「宝庆元年八月史浩请旨追赠太师、封崇国公、谥文忠」等语，与《宋史》「宝庆初，特赠太师，
  封崇国公，谥文忠」尚可相参，然细节无本批所引来源支撑，未采。
