id: src_hongjun_zhuang
title: 洪钧出使与《元史译文证补》（今人传记汇编）
tier: C
juan: null
quote: >-
  光绪十三年（1887），洪钧充任出使俄国、德国、奥匈帝国、荷兰四国外交大臣。
  出使期间，他见国外电文多用三码而国内用四码电，遂创三码电法，为朝廷节省电文开支。
  在翻译金楷利（Kreyher）等帮助下，据拉施特《史集》、志费尼《世界征服者史》、
  多桑《蒙古史》诸西籍译著，撰成《元史译文证补》三十卷（其中十卷有目无文），
  开中国史学界利用外国资料研究元史之先例。其妾傅彩云（后称赛金花）随行，
  曾朴《孽海花》即以洪钧、傅彩云为主线。
url: null
note: >-
  今人传记汇编（互动百科、黄山市文旅局、青州文旅诸源互证），细节层（三码电法、
  诸西籍书目）各源一致。原始文献为《洪文卿公年谱》与《元史译文证补》陆润庠序，
  本批未获原文，故列 C 级；事件主体（出使四国、撰《元史译文证补》、卒年 1893）
  已有 A 级《清史稿》本传支撑（见 src_qingshigao_hongjun）。
