id: src_huaji
title: 画继
tier: B
juan: 卷二（侯王贵戚）
quote: >-
  郓王，徽宗皇帝第二子也。禀资秀拔，为学精到。政和八年，射策于庭，名标第一，多士推服。
  性极嗜画，颇多储积。凡得珍图，即日上进，而御府所赐，亦不为少，复皆绝品，故王府画目，
  至数千计。又复时作小笔花鸟便面，克肖圣艺。
url: http://www.guoxue123.com/zhibu/0201/04hj/002.htm
note: >-
  南宋·邓椿撰。成书距政和八年仅数十年，属同时代人的专门记载，故列 B 级。
  两处可注意：其一，「射策于庭，名标第一，多士推服」是「唱名第一」在画史系统中的
  独立见证；其二，本书称郓王为「徽宗第二子」，与《宋史·宗室传》「第三子」不同——
  因次兄衮王柽早薨，不同系统的排行记载遂有差别，两说并存备考。
