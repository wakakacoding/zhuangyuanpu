id: src_huangruheng_jiaohong
title: 祭焦弱侯先生文（黄汝亨《寓林集》卷十五）
tier: B
juan: 卷十五
quote: >-
  萬曆己未冬十一月，前翰林院修撰弱侯焦先生捐館舍……先生素無疾，強飯，每與予對食，脫粟或數盂。
  面奕奕有光，似未衰者。行年八十，士大夫方歌頌為壽，夜銜杯而曉聞易簀，灑然於始終去來之際，
  何其順化也。
url: null
note: >-
  明·黄汝亨（1558—1626）撰。黄汝亨与焦竑同为万历间南京士林中人，此文为焦竑卒年之**同时代一手材料**，
  所记「万历己未（四十七年，1619）冬十一月」与《明史》「万历四十八年」、《明儒学案》「泰昌元年」相左，
  不可遽废——本站卒年仍从《明史》《明儒学案》两源系于 1620，此说并存备考（详见交付报告 §2.1）。
  又「行年八十」一语可与《明史》「年八十」互证其寿数（《明儒学案》作「年八十一」，差一岁）。
  同文另记：「天下人无问识不识，被先生容接，如登龙门。而官留都者自六官以下，有大议大疑，
  无不俯躬而奉教焉。」可见其晚年主盟南都士林之望，已入轶事栏。
  ⚠ **待核**：本 quote 据《寓林集》卷十五原文之今人整理转录（国学大师网「中国历代年表」焦竑条所引），
  尚未核对原刻本书影；按纪律不作 A 级使用，列 B 级并存备考。
