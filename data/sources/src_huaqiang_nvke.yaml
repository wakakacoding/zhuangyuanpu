id: src_huaqiang_nvke
title: 太平天国女科考释
tier: B
juan: null
quote: >-
  关于太平天国实行女科考试并诞生女状元傅善祥的史料现觅得至少 9 种。……分析 9 条史料，
  推论太平天国开女科及女状元傅善祥一说事出有因，而较为接近历史真相的推论是：太平天国
  女科系东王选拔人才的一次考试而非太平天国正式开科取士。
url: null
note: >-
  华强、赵晓光撰，载《扬州大学学报（人文社会科学版）》2010 年第 14 卷第 5 期，第 90–94 页。
  属「事出有因」说的代表：承认相关史料有多种且部分互证，但把「女科」定性为东王选拔人才的
  一次考试。此说与简又文「女馆中考选识字女子入掌簿书」的替代解释，实际上相去不远。
