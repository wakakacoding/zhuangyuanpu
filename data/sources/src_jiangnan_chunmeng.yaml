id: src_jiangnan_chunmeng
title: 江南春梦庵笔记
tier: C
juan: null
quote: >-
  癸丑尝设女科，以傅善祥、钟秀英、林丽花为鼎甲。傅善祥，上元书吏之女，自愿应试者；
  钟即钟芳礼所掠之女，皆非本姓也。发女榜后，俱入伪宫，隔数日发还，并传其父谢恩，
  人咸悔之，故甲寅岁无一应者矣。
url: null
note: >-
  旧题沈懋良撰。罗尔纲将本书与《盾鼻随闻录》作伪之处列表对勘，考出承袭来源，
  断为「虚上加虚，假中更假」的伪书（《太平天国史料辨伪集》）：汪书只说「女榜眼钟姓、
  女探花林姓」，本书则把姓名、出身、来历一一补足——传说的第二次加详。
