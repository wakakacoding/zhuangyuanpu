id: src_jianyan_yiluo
title: 建炎以来系年要录
tier: B
juan: 卷五十五
quote: >-
  中书舍人兼侍读胡安国试给事中、起居郎修政局参详官胡世将、起居舍人王昂并试中书舍人……
  昂以疾不拜，后二日改徽猷阁待制知台州。
url: https://www.guoxuemi.com/sk/123725wmzc/216972/
note: >-
  南宋·李心传撰编年史，孝宗以前部分多直录宋代官修史文，故列 B 级。此条系于绍兴二年
  （1132）五月，可定王昂由起居舍人改知台州之年；今人谓其卒于是年，即由此推得。
  文中「昂以疾不拜」四字，与今人标目所引全同，可互证。
