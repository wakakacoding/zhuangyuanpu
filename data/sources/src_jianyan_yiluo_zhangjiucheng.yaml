id: src_jianyan_yiluo_zhangjiucheng
title: 建炎以来系年要录
tier: B
juan: 卷一百八十二（并参卷八十四、九十、九十九、一百二十、一百二十一、一百二十三、一百四十九、一百七十一）
quote: >-
  紹興二十九年己丑六月……秘閣修撰、提舉江州太平興國宮張九成卒，年六十八。
url: null
note: >-
  南宋·李心传撰编年史，孝宗以前部分多直录宋代官修史文，故列 B 级。此条为张九成**卒年与享年
  之直接依据**（《宋史》本传不载），诗文集小传与今人年表皆据此立说，本站生年 1092 亦由
  「年六十八」逆推而得。
  同书另有数条可定其仕履之年：绍兴五年以太常博士召（卷八十四、九十）、六年迁著作郎（卷九十九）、
  八年权礼部侍郎兼侍讲并兼权刑部侍郎（卷一百二十、一百二十一、一百二十三）、十三年谪居南安军
  （卷一百四十九）、二十六年起知温州（卷一百七十一）——本批系年多据此，各见 events 对应条。
  ⚠ **待核**：本条 quote 系据《要录》卷一百八十二原文之今人转录（《全宋诗》《全宋文》小传及
  维基百科「张九成」条注所引，文字一致），尚未核对原书影印；卷次无误，文字待终校。
