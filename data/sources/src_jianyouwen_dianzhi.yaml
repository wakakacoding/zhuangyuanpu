id: src_jianyouwen_dianzhi
title: 太平天国典制通考
tier: B
juan: null
quote: >-
  然细考太平文献，全找不到天朝特开女科之事，且天朝历科状元姓名，大都传留，但未见有傅姓
  女子。再观干王洪仁玕新制定的「士阶条例」，亦无特设女科之规定。可见天朝绝无女科之制度。
  ……其一、二、三名沿成例称为三元，时人或以此称之，必非如正式朝试之殿选也。
url: null
note: >-
  简又文著。持彻底否定说，并给出替代解释：各王府多用女官，初于女馆中考选识字女子入掌
  簿书，前三名沿旧例被称为三元，时人遂有「女状元」之称——「女状元」是俗称，不是名分。
