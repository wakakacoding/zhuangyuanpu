id: src_jinjiang_shizhi_wangzeng
title: 晋江史志·状元宰相王曾（籍贯异说）
tier: C
juan: null
quote: >-
  王曾（978-1038年），字孝先。泉州晋江廿九都旌贤乡王厝人。祖上世居泉州王厝埕，为王审邦
  之裔孙……王曾因父官于山东省青州县，8岁时丧父母，寄养于叔父王宗元家，家贫不能归来
  晋江，即定居青州益都。
url: https://www.jinjiang.gov.cn/yxjj/szjj/rwcq/202607/t20260701_3305395.htm
note: >-
  地方史志之乡贤叙事，属二手标目，故列 C 级（本件据晋江市人民政府网站转引《晋江史志》
  2007 年第 1 期）。其说以王曾为五代闽国王审邽之裔、籍贯泉州晋江，与《宋史》《隆平集》
  及宋代诸书一致记载的「青州益都人」相异，且「王审邦（审邽）」世系于宋代文献无征。
  另有「祖上太原王氏，唐末五代避居青州」一说，同属后世追述。本站正史系统取「青州益都」
  之说，本件仅作异说备录，原始出处待溯。
