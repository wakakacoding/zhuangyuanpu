id: src_jinling_guijia
title: 金陵癸甲纪事略
tier: B
juan: null
quote: >-
  女簿书，东贼逼取民女识字者充之，以代己批判。有傅善祥者，金陵人，二十余岁，自恃其才。
  东贼闻之，选入伪府，凡贼文书，皆归批判，颇当贼意。由是贼伪官均尚文，有不合善祥式者
  辄批骂，恃宠骄傲，屡言「老长毛狗屁不通」，忤东贼，乃借善祥吸食黄烟，枷发女馆以禁之。
url: null
note: >-
  清·谢介鹤撰。作者被太平军掳入天京粮馆，天京陷落前离去，属亲历者记载，故列 B 级。
  全篇记女簿书制度与傅善祥其人，而不及「女科」「状元」二字——这是本案中最要紧的一条
  沉默。结局则别记「遂不知所终，或云逃去」（转引），未言死难。
