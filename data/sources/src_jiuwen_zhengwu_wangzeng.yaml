id: src_jiuwen_zhengwu_wangzeng
title: 旧闻证误（王曾条按语）
tier: B
juan: 卷一
quote: >-
  王沂公青州發解，及南省、廷試皆為第一。……〈出魏泰《東軒筆錄》〉按，國史，沂公以咸平
  五年第進士，後十八年，劉子儀始為學士。按劉子儀咸平元年及第，在沂公前四年耳。天禧四
  年，子儀為學士，此時沂公執政久矣。
url: null
note: >-
  南宋李心传撰。其按语引「国史」定王曾「以咸平五年第进士」——这是本站系王曾夺魁于
  咸平五年（1002）的国史系统依据（《宋史》本传仅作「咸平中」）。同时指出《东轩笔录》
  所记刘子仪与王曾对话的年份有误（刘筠天禧四年始为学士），属考异性质，两说并存。
