id: src_kunshan_weijing_zhuan
title: 昆山地方志与纪念文献·卫泾传记汇编（今人整理）
tier: B
juan: null
quote: >-
  卫泾，字清叔，嘉兴华亭人，徙居平江昆山。淳熙十一年（1184）进士第一，为昆山
  历史上第一个状元。……中状元后授承事郎，添差镇东军签判。他特地向孝宗对策，
  陈说「添差」只拿俸禄、徒挂虚名的弊端，一连三次上表，要求去掉自己镇东军签判
  的添差，让自己「待次」。……按惯例，状元初任期将满时，要向执政的宰相通书致谢，
  然后才能遇次榜延唱颁召命。当时宰相王淮把持朝政，卫泾任满后没有通书致谢，
  所以虽然有降召之命，有司不让他进入国门。于是卫泾只能整天徘徊在六和塔下，
  将近三个月不能够被召见。……皇上因卫泾三世同居，书「友顺」二字赐之。
url: null
note: >-
  昆山市纪委「鹿城清风」卫泾专题文、昆山融媒体、上图/嘉兴图书馆人名规范库诸源互证。
  「《宋史》不为立传」（沈德潜语）——卫泾无正史本传，本条为其生平最系统的今人汇编
  （据《后乐集》附录行状、年谱与地方志综撰）。添差辞官、不通书王淮、六和塔下
  徘徊三月诸事各源一致，列 B 级；生卒 1159–1226、谥文节同。
