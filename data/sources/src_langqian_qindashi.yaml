id: src_langqian_qindashi
title: 郎潜纪闻三笔·秦大士未贵时之志节
tier: B
juan: 卷二
quote: >-
  侍讲学士江宁秦公大士，乾隆十七年殿试第一人也。
  精篆隶行草之学，未贵时，卖字以自给，求者踵至。
  客有知公贫，以厚币请者，微察其有德色，遽还之，客谢罪至再，终不许。
url: https://zh.wikisource.org/wiki/%E9%83%8E%E6%BD%9B%E7%B4%80%E8%81%9E%E4%B8%89%E7%AD%86/%E5%8D%B7%E4%BA%8C
note: >-
  清陈康祺笔记，维基文库简体页核读，2026-10-18。
  同条另记「祷于神，愿减算以博一第」，作者已批为热中，不采为史实。
