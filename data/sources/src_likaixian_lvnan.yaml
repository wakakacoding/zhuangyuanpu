id: src_likaixian_lvnan
title: 李开先·泾野吕亚卿传
tier: B
juan: null
quote: >-
  涇野姓呂，諱柟，字大棟，既而改字仲木，西安之高陵人也。居涇水之陽，四方學者共稱為涇野
  先生。……以壬寅六月左臂癰發，坐臥北泉精舍，至七月一日卒……生則成化己亥四月二十一日，
  享年六十四。
url: null
note: >-
  明·李开先撰，明人所作传记（同时代后学，属传记材料，列 B 级）。本件据通行转录录入，
  原书卷次待核。核心价值有三：① 「字大栋，既而改字仲木」——说明「大栋」为初字、「仲木」
  为后改之字，非异说并存，本站字段取「仲木」而以此条说明来历；② 生卒月日（成化十五年
  四月二十一日生、嘉靖二十一年七月一日卒）；③ 「居泾水之阳，四方学者共称为泾野先生」
  ——别号来历。另：李舜臣《刻泾野先生文集序》误其卒年为「癸卯」（1543），一并备考。
