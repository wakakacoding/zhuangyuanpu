id: src_longpingji_wangzeng
title: 隆平集·王曾传
tier: B
juan: 卷五·宰臣
quote: >-
  王曾字孝先，青州益都人。咸平中登進士甲科，所試有物混成賦，天下以為賦格。累擢知制誥、
  翰林學士。大中祥符九年，參知政事。時王欽若方挾祥瑞迎合人主意，陰排異己者，以細故
  罷曾政事。天禧中，復參知政事，兼太子賓客。仁宗即位，以為宰相，忤太后意，罷知青州。
  景祐二年，復相，封沂國公。與呂夷簡議論不協，求退，出判鄆州，加資政殿大學士。卒，年
  六十，贈侍中，諡文正。有文集五十卷。子緯，幼，以姪繹為後。……天書降，詔作玉清昭應宮，
  廷臣莫有言者，曾陳五害以諫。
url: null
note: >-
  旧题北宋曾巩撰，四库全书本。成书于北宋中期，多据当时国史、日历。本传价值在三处异文：
  ① 卒年作「六十」，与《宋史》「年六十一」并存备考；② 文集作「五十卷」，与后世著录
  「五十七卷」异；③ 子嗣作「子纬」，与《宋史》「养子曰縡」用字不同。又「大中祥符九年，
  参知政事」为《宋史》本传所未系的参知政事年份，「天禧中复参知政事」亦然，两处均据
  本传补系。作者归属学界有争议（或谓非曾巩手笔），不影响其为北宋同时期材料之性质。
