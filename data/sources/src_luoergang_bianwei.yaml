id: src_luoergang_bianwei
title: 太平天国史料辨伪集
tier: B
juan: null
quote: >-
  虚上加虚，假中更假……我们遍考曾亲在天京参加过太平天国工作者的记载，如谢介鹤的
  《金陵癸甲纪事略》、张汝南的《金陵省难纪略》、知非子的《金陵杂记》、佚名的《粤逆纪略》、
  马寿龄的《金陵癸甲新乐府》，以及张德坚根据情报编纂的《贼情汇纂》，都没有记载这一件事。
  《金陵癸甲纪事略》是记有傅善祥事的，但只说她是东王女簿书，而没有说她是女状元。
url: null
note: >-
  罗尔纲著。所收《太平天国史料里的第一部伪书——〈江南春梦庵笔记〉考伪》《一部太平天国的
  禁书》等文，考定《江南春梦庵笔记》为虚构之伪书、《盾鼻随闻录》为以攻讦仇人为目的而被
  查究的禁书。此段「遍考亲历记载而无女科」的排查清单，是本案否定说的方法论起点。
