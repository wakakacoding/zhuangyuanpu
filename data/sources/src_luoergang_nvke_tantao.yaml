id: src_luoergang_nvke_tantao
title: 太平天国开「女科」事探讨
tier: B
juan: null
quote: >-
  我本人在两年后，因看到新史料对这个看法已有改变。以后，对这问题的处理，还曾经一改再改。
  说来十分抱歉，我没有向读者交代，而研讨这问题的著者都提到我。
url: null
note: >-
  载《学术月刊》1984 年第 7 期，第 36–43 页。作者自述四十年间对该问题的数次反复：
  四十年代据伪书采信「女科」，1951 年考出伪书问题而致疑，两年后又因新史料改变看法，
  此后「一改再改」。本件是理解本案「异说并存」格局的关键文献——连最权威的研究者也在改口。
