id: src_luoergang_taiping_shi
title: 太平天国史
tier: B
juan: 第二册（中华书局 1991 年版，第 1288 页）
quote: >-
  太平天国在建都天京后，举行女试。天京女子傅善祥中式第一名，派往东王府任东殿内簿书，
  替东王杨秀清批判军国大事。时人传有「棘闱先设女科场，女状元称傅善祥」的诗句咏其事。
url: null
note: >-
  罗尔纲著。此为作者最终的表述：用「女试」而不用「女科」，承认 1853 年确有一次招考女子
  之事，但不承认太平天国开过制度化的女子科举。罗氏并指出：以「女科天试没有省试、县试」
  为由的否定论证站不住脚——太平天国后来正式开天试、东试、北试、翼试，此前亦未开省试、县试。
  同书另一处曾记：「天朝有女官之制，故亦有女科。癸好三年开女科，以傅善祥、钟秀英、
  林丽花为鼎甲。」系四十年代据伪书所作、后经删改的旧说，一并登记，以见其自相修正之迹。
