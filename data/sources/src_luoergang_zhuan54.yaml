id: src_luoergang_zhuan54
title: 太平天国史·卷五十四（李俊昌、唐正才、钟芳礼、宾福寿传）
tier: B
juan: 卷五十四（传第十三）
quote: >-
  钟芳礼，广西人，年约五十，在乡村做小贩，信从天王的革命宗旨，加入拜上帝会，是平地山
  老兄弟。金田起义，授御林侍卫，太平天国癸好三年二月，克复南京，封恩赏丞相。……南京是
  当时织造锦缎的著名产区。太平天国克复南京后，就设立织营……任命芳礼督理织营事务，
  以黄为正为副理。……丁巳七年夏，时当天京天变后，石达开又出走，天王特任芳礼为副掌率，
  封顺天燕，与蒙得恩共同总理国务。……庚申十年九月十三日，幼主诏平在山勋旧俱升封义爵，
  芳礼亦与其列。其后不再闻他的事迹。
url: http://guoxue123.com/new/0001/tptgs/41.htm
note: >-
  罗尔纲撰，现代学术考证之作。此传是钟芳礼最完整的生平依据，且通篇不载其有科第、状元
  之事——本站索引所录「太平天国癸好三年状元」一说，与此传不符，故两说并存、标为存疑。
  又，癸好三年时他「年约五十」，可推其生年约在嘉庆初；具体籍贯县份亦仅记「广西人」。
  本站据国学导航电子本转录，纸质版册页待补。
