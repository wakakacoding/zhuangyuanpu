id: src_luoshi_xiangxian_luolun
title: 罗伦乡贤叙事辑录（今人整理）
tier: C
juan: null
quote: >-
  憲宗成化二年，羅倫赴京會考進士……途中隨從僕人經過一家門前，拾到一只金手鐲，行走五天路程後，
  羅倫偶然憂慮路費不夠，僕人才告訴羅倫拾到金鐲，羅倫聽了非常生氣，馬上要返回原地送還失主……
  羅倫說：「這金鐲，必定是人家婢女或僕人不小心失落，如果被他主人逼問拷打致死，是誰的罪過呢？
  我寧願不參加會試，也不能使人因而致死。」於是主僕兩人風塵僕僕，竟然又返回原來地處。
  果然是那家婢女，因潑棄洗面水時，不小心遺失在地……幸而羅倫趕到，送還金鐲，才保全了兩條人命。
  事後再趕回京都會試，殿試策問時，羅倫率直針對時弊對答，一時名望大震京都，果然被選拔為第一名狀元。
url: null
note: >-
  出今人整理之罗氏乡贤与民间善书叙事（江西永丰罗氏后裔及善书系统所传），经网络转录，
  属**二手标目、原始出处待溯**，故列 C 级。所记「还金镯救二命」一事，明人笔记、《明史》本传
  与《明儒学案》均不载。
  ⚠ **对照发现**：本批焦竑条亦收一型近似传说（「船头金镯、还主误考期、考场失火改期」，
  见 `src_rizhao_jiaohong`）——两个时代、籍贯、行事皆不同的状元，共有「途中还金」这一母题，
  可见其为民俗叙事之套式（近于「阴德报状元」故事类型），本批两处均仅作传说层备录，
  不相互援引为史实。
  另：此系统叙事又称「罗伦……字应魁，一字彝正」，与索引所载「应魁」相合，可供字号考订参考。
