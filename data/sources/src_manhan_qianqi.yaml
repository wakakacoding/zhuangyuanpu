id: src_manhan_qianqi
title: 满汉大臣列传·钱棨传
tier: A
juan: null
quote: >-
  钱棨，江苏长洲人。乾隆四十四年乡试中式第一名举人。四十六年会试第一名进士。殿试一甲一名，授职修撰。
  胪唱日，御制诗云：龙虎传胪唱，太和晓日𬚧。国朝经百载，春榜得三元。文运风云壮，清时礼乐蕃。
  载咨申四义，敷奏近千言。讵止求端楷，所期进谠论。王曾如可继，违弼我心存。
  五十一年八月，充顺天乡试同考官。五十二年九月，奉旨在尚书房行走。
  五十四年三月……棨等奉旨俱著革职留任，八年无过，方准开复。
  五十八年，擢右赞善。六十年，擢中允，瀳升侍读，充日讲起居注官。
  嘉庆二年，擢右庶子，寻转左庶子。三年三月，擢侍讲学士，寻转侍读学士。五月，充云南乡试正考官。
  七月，命提督云南学政。四年三月，擢内阁学士兼礼部侍郎，仍留学政任。
  寻以按试徵江、临安等府，触受瘴湿，成蛊疾。七月旋省，犹力疾视事。八月卒。
url: https://www.shidianguji.com/book/CADAL02026450/chapter/1lmc00d5h6qer
note: >-
  《满汉大臣列传》属清国史馆纂修列传系统（识典古籍收录 CADAL 影印之整理本），官方史传，故列 A 级。
  引文据网络整理本核读，2026-10-24，未核纸书。整理本「太和晓日𬚧」之「𬚧」为生僻用字，
  通行录文或作「暾」；「瀳升」即「荐升」。本传不记生年与名、字、号，科年第（乡试第一名、
  会试第一名、殿试一甲一名）三连俱明书，是「三元」之 A 级依据；县府院试「小三元」不在本传。
