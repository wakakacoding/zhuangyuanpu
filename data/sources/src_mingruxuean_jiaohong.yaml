id: src_mingruxuean_jiaohong
title: 明儒学案·泰州学案四（文端焦澹园先生竑）
tier: B
juan: 卷三十五
quote: >-
  焦竑字弱侯，號澹園，南京旗手衛人。萬曆己丑進士第一人。京兆欲為樹棹楔，謝以賑饑。原籍山東，
  亦欲表於宅，改置義田。授翰林修撰。癸巳開史局，南充意在先生。先生條四議以進，史事中止，
  私成《獻徵錄》百二十卷。甲午簡為東宮講讀官，嘗於講時有鳥飛鳴而過，皇太子目之，先生即輟講，
  皇太子改容複聽，然後開講。取故事可為勸戒者，繪圖上之，名《養正圖解》。丁酉主順天試，
  先生以陪推點用，素為新建所不喜，原推者複搆之，給事中項應祥、曹大鹹糾其所取險怪，先生言：
  「分經校閱，其所摘，非臣所取。」謫福寧州同知，移太仆寺丞。後陞南京司業，而年已七十矣。
  先生積書數萬卷，覽之略遍。金陵人士輻輳之地，先生主持壇坫，如水赴壑，其以理學倡率，
  王弇州所不如也。泰昌元年卒，年八十一。贈諭德。崇禎末，補諡文端。
url: https://zh.wikisource.org/wiki/明儒學案/泰州學案四
note: >-
  明末清初黄宗羲撰。价值有四：① 补本传所无的仕履细节与卒年异说（「泰昌元年卒，年八十一」
  与「崇祯末补谥文端」，后者与本传「福王时追谥文端」异）；② 记「南京旗手卫人」并揭「原籍山东」，
  为籍贯二籍并陈之直接依据；③ 记夺魁后「京兆欲为树棹楔，谢以赈饥」「原籍山东欲表于宅，
  改置义田」二事，为考见其人品格之要据（本传不载）；④ 记史局开于「癸巳」（万历二十一年，
  本传作二十二年）、书作《养正图解》（本传作《养正图说》），两处异文并存备考。
  又：「谪福宁州同知，移太仆寺丞。后升南京司业，而年已七十矣」一节，为本传所无之晚年履历。
