id: src_mingruxuean_luohongxian
title: 明儒学案·文恭罗念庵先生洪先
tier: B
juan: 卷十八·江右王门学案三
quote: >-
  文恭羅念菴先生洪先。羅洪先字達夫，別號念菴，吉水人。父循，山東按察副使。……
  嘉靖八年，舉進士第一。外舅太僕曾直聞報喜曰：「幸吾婿建此大事。」先生曰：
  「丈夫事業更有許大在，此等三年遞一人，奚足為大事也。」授翰林修撰。明年告歸。……
  十八年召拜左春坊左贊善，踰年至京。上常不御朝，十二月先生與司諫唐順之、較書趙時春
  請以來歲元日，皇太子御文華殿，受百官朝賀。上曰：「朕方疾，遂欲儲貳臨朝，
  是必君父不能起也。」皆黜為民。三十七年，嚴相嵩起唐順之為兵部主事，次及先生。
  先生以畢志林壑報之。……四十三年卒，年六十一。隆慶改元，贈光祿少卿，諡文恭。
  ……先生之學，始致力於踐履，中歸攝於寂靜，晚徹悟於仁體。……闢石蓮洞居之，
  默坐半榻間，不出戶者三年。……先生於陽明之學，始而慕之，已見其門下承領本體太易，
  亦遂疑之。及至功夫純熟，而陽明進學次第，洞然無間。
url: null
note: >-
  清·黄宗羲撰。本件三处价值：① **篇题即作「文恭罗念庵先生洪先」**，篇末又作「谥文恭」，
  与《明史》「文庄」互异，是本站处理谥号异说的主要依据之一；
  ② 「四十三年卒，年六十一」与徐阶墓志合，可订《明史》「隆庆初卒」之误（按四库全书本
  此句作「四十二年卒」，与生年 1504 所推岁数不合，当为版本之讹，本站从通行本作「四十三年」）；
  ③ 「先生之学，始致力于践履，中归摄于寂静，晚彻悟于仁体」与「辟石莲洞」一节，
  为罗洪先学术定位的经典表述，另记其在阳明门下「始而慕之，已见其门下承领本体太易，
  亦遂疑之」的独特路径。
