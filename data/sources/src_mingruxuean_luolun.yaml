id: src_mingruxuean_luolun
title: 明儒学案·诸儒学案上三（文毅罗一峰先生伦）
tier: B
juan: 卷四十五
quote: >-
  羅倫字彛正，學者稱一峯先生。吉之永豐人。舉成化丙戍進士，對策大廷，引程正公語：
  人主一日之間，接賢士大夫之時多，親宦官宮妾之時少。執政欲節其下句，先生不從。奏名第一。
  授翰林修撰。會李文達奪情，先生詣其私第，告以不可。待之數日，始上疏歷陳起復之非，
  為君者當以先王之禮教其臣，為臣者當據先王之禮事其君。疏奏遂落職，提舉泉州市舶司。
  明年召還，復修撰，改南京，尋以疾辭歸，隱於金牛山，注意經學。《周易》多修傳註，間補己意。
  《禮記》彙集儒先之見，而分章記禮，則先生獨裁。《春秋》則不取褒貶凡例之說，以為《春秋》
  緣人以立法，因時以措宜，猶化工焉，因物而賦物也，以凡例求《春秋》者，猶以畫筆摹化工，
  其能肖乎？戊戌九月二十四日卒，年四十八。正德十六年，贈左諭德，諡文毅。
  先生剛介絕俗，生平不作和同之語，不為軟巽之行。……家貧，日中不能舉火，而對客談學不倦。
  高守贈以綈袍，遇道殣，輒解以瘞之。嘗欲倣古置義田，以贍族人，邑令助之堂食之錢，先生曰：
  「食以堂名，退食於公之需也，執事且不可取，何所用與？」謝而弗受。凍餒幾於死亡，
  而一無足以動於中。若先生庶幾可謂之無欲矣。先生與白沙稱石交，白沙超悟神知，先生守宋人
  之途轍，學非白沙之學也，而皭然塵垢之外，所見專而所守固耳。章楓山稱：「先生方可謂之
  正君善俗，如我輩只修政立事而已。」其推重如此。
url: https://www.51hanyu.com/guji/mingruxuean/7583
note: >-
  明末清初黄宗羲撰。价值有五：① **卒日与享年**「戊戌九月二十四日卒，年四十八」——生年
  1431 即由此逆推；② **谥赠之年**「正德十六年，赠左谕德，谥文毅」，与本传「嘉靖初」异说并存；
  ③ **殿试细节**「引程正公语：人主一日之间，接贤士大夫之时多，亲宦官宫妾之时少。执政欲节其下句，
  先生不从」——为本传所无，可考其对策万言而遭删节之实；④ **上疏前之礼数**「先生诣其私第，
  告以不可，待之数日，始上疏」——见其非徒激切，先去而后言；⑤ 记其归隐后经学之著
  （《周易》多修传注、《礼记》汇集儒先之见、《春秋》不取褒贬凡例之说），并录「要语」一门
  （「治己必先治心，心者舟之柁也」等），为研究其学之第一手。
  另「先生与白沙称石交」一节，可与陈献章《白沙集》互参。
