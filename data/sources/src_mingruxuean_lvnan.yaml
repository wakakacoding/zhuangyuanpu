id: src_mingruxuean_lvnan
title: 明儒学案·河东学案下（文简吕泾野先生柟）
tier: B
juan: 卷八
quote: >-
  呂柟字仲木，號涇野，陝之高陵人。正德戊辰舉進士第一，授翰林修撰。逆瑾以鄉人致賀，卻之，
  瑾不悅。已請上還宮中，禦經筵，親政事，益不為瑾所容，遂引去。瑾敗，起原官。……乾清宮災，
  應詔言六事：一、逐日臨朝，二、還處宮寢，三、躬親大祀，四、日朝兩宮，五、遣去義子、
  番僧、邊軍，六、撤回鎮守中官。皆武宗之荒政。不聽，複引去。……甲申以修省自劾，語涉大禮，
  下詔獄。降解州判官……移宗人府經歷，陞南考功郎中，尚寶司卿，南太常寺少卿，入為國子祭酒，
  轉南禮部右侍郎。……會奉先殿災，九卿自陳，貴溪遂准先生致仕。壬寅七月朔卒，年六十四，
  賜諡文簡。
url: null
note: >-
  明末清初黄宗羲撰。价值有三：① 补《明史》本传所无的月日与谥号（「壬寅七月朔卒，
  年六十四，赐谥文简」）；② 乾清宫应诏「六事」之目全列，为《明史》本传「陈六事」
  之具体内容；③ 仕履序列作「南太常寺少卿」，与《明史》「南京太仆寺少卿」异，为
  太常/太仆之辨的第二证。另载其「九载南都，与湛甘泉、邹东廓共主讲席，东南学者尽出
  其门」及讥议良知之学诸语，为学术定位之据。
