id: src_mingshi_chenxun
title: 明史·卷一百六十八·陈循传
tier: A
juan: 列传第五十六
quote: >-
  陈循，字德遵，泰和人。永乐十三年进士第一。授翰林修撰。习朝廷典故。
  ……正统九年入文渊阁典机务。……土木之变，人心汹惧，循居中，所言多采纳，
  进户部尚书，兼职如故。额森犯京师，请敕各边精骑入卫，驰檄回番以疑敌，
  帝皆从其计。……二年十二月进少保兼文渊阁大学士。帝欲易太子，内畏诸阁臣，
  先期赐循及高谷白金百两……比下诏议，循等遂不敢诤。加兼太子太傅……
  进华盖殿大学士兼文渊阁如故。循子英及王文子伦应顺天乡试被黜，
  相与构考官刘俨、黄谏，为给事中张宁等所劾，帝亦不罪。英宗复位，
  于谦、王文死，杖循百，戍铁岭卫。循在宣德时，御史张楷献诗忤旨，
  循曰「彼亦忠爱也」，遂得释；御史陈祚上疏触帝怒，循婉为解得不死。
  ……亨等既败，循自贬所上书自讼……诏释为民。一年卒。成化中于谦事雪，
  循子引例请恤，乃复官赐祭。
url: https://zh.wikisource.org/zh-hans/明史_(四库全书本)/卷168
note: >-
  清·张廷玉等修。本传全录景泰朝得失：土木之变「居中所言多采纳」、
  易储时受金「不敢诤」、其子乡试被黜构陷考官、「刻躁为士论所薄」——
  功过并书，本站照录不讳。杖百戍铁岭、成化平反的结局亦见传末。
