id: src_mingshi_jiaohong
title: 明史·焦竑传
tier: A
juan: 卷二百八十八·列传第一百七十六（文苑四）
quote: >-
  焦竑，字弱侯，江寧人。為諸生，有盛名。從督學御史耿定向學，復質疑於羅汝芳。舉嘉靖四十三年鄉試，
  下第還。定向遴十四郡名士讀書崇正書院，以竑為之長。及定向裏居，復往從之。萬歷十七年，始以殿試
  第一人官翰林修撰，益討習國朝典章。二十二年，大學士陳於陛建議修國史，欲竑專領其事，竑遜謝，
  乃先撰《經籍志》，其他率無所撰，館亦竟罷。翰林教小內侍書者，眾視為具文，竑獨曰：「此曹他日
  在帝左右，安得忽之。」取古奄人善惡，時與論說。
  皇長子出閣，竑為講官。故事，講官進講罕有問者。竑講畢，徐曰：「博學審問，功用維均，敷陳或未盡，
  惟殿下賜明問。」皇長子稱善，然無所質難也。一日，竑復進曰：「殿下言不易發，得毋諱其誤耶？
  解則有誤，問復何誤？古人不恥下問，願以為法。」皇長子復稱善，亦竟無所問。竑乃與同列謀先啟其端，
  適講《舜典》，竑舉「稽於眾，舍己從人」為問。皇長子曰：「稽者，考也。考集眾思，然後舍己之短，
  從人之長。」又一日，舉「上帝降衷，若有恒性」。皇長子曰：「此無他，即天命之謂性也。」時方十三齡，
  答問無滯，竑亦竭誠啟迪。嘗講次，群鳥飛鳴，皇長子仰視，竑輟講肅立。皇長子斂容聽，乃復講如初。
  竑嘗采古儲君事可為法戒者為《養正圖說》，擬進之。同官郭正域輩惡其不相聞，目為賈譽，竑遂止。
  竑既負重名，性復疏直，時事有不可，輒形之言論，政府亦惡之，張位尤甚。二十五年主順天鄉試，
  舉子曹蕃等九人文多險誕語，竑被劾，謫福寧州同知。歲餘大計，復鐫秩，竑遂不出。
  竑博極群書，自經史至稗官、雜說，無不淹貫。善為古文，典正馴雅，卓然名家。集名《淡園》，
  竑所自號也。講學以汝芳為宗，而善定向兄弟及李贄，時頗以禪學譏之。萬歷四十八年卒，年八十。
  熹宗時，以先朝講讀恩，復官，贈諭德，賜祭蔭子。福王時，追謚文端。子潤生，見《忠義傳》。
url: https://zh.wikisource.org/wiki/明史/卷288
note: >-
  清·张廷玉等撰，中华书局点校本。本传为本站焦竑条目之主干出处。三处已作考订处置：
  ① **籍贯**：本传作「江宁人」，《明儒学案》卷三十五作「南京旗手卫人」并记「原籍山东」——
  本站二籍并陈为「江宁 / 日照」，与 `data/geo_map.yaml` 配对条（note 已记「第二籍日照」）一致；
  ② **卒年**：本传作「万历四十八年卒，年八十」，与《明儒学案》「泰昌元年卒，年八十一」为
  同年（1620）异元号、异岁数；黄汝亨《祭焦弱侯先生文》则作「万历己未（四十七年，1619）冬十一月」。
  三说并存，本站从本传系于 1620（详见交付报告 §2.1）；
  ③ **集名**：本传作《淡园》，通行本与《明儒学案》并作《澹园》，「淡」「澹」通假，本站从「澹园」。
  另本传记其讲筵往复四则（赐明问、不耻下问、《舜典》稽于众、群鸟飞鸣辍讲），为明代经筵史料之
  生动一例，已入 events 与人物卡小传。
