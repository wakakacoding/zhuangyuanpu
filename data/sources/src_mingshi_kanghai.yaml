id: src_mingshi_kanghai
title: 明史·康海传
tier: A
juan: 卷二百八十六·列传第一百七十四（文苑二），附见《李梦阳传》
quote: >-
  康海，字德涵，武功人。弘治十五年殿試第一，授修撰。與夢陽輩相倡和，訾議諸先達，
  忌者頗眾。正德初，劉瑾亂政。以海同鄉，慕其才，欲招致之，海不肯往。會夢陽下獄，
  書片紙招海曰：「對山救我。」對山者，海別號也。海乃謁瑾，瑾大喜，為倒屣迎。
  海因設詭辭說之，瑾意解，明日釋夢陽。逾年，瑾敗，海坐黨，落職。
  ……海、九思同里、同官，同以瑾黨廢。每相聚沜東鄠、杜間，挾聲伎酣飲，制樂造歌曲，
  自比俳優，以寄其怫鬱。九思嘗費重貲購樂工學琵琶。海搊彈尤善。
url: null
note: >-
  清·张廷玉等撰，中华书局点校本。本传极简：**不载生卒、不载著述**，仅附见《李梦阳传》后
  （《四库全书总目·武功县志》提要亦称「《明史·文苑传》附见《李梦阳传》中」），
  并明列其为「十才子」「（前）七才子」之一。故本站康海的生卒、著述与晚年行迹，
  须以《国朝献征录》所收行状、传记及陕西方志为据（见 src_xianzhenglu_kanghai 等）。
  本传可据者三事：① 弘治十五年殿试第一、授修撰；② 因同乡刘瑾欲招致而「不肯往」，
  及李梦阳下狱书「对山救我」而往谒瑾、旋释梦阳，逾年瑾败坐党落职；③ 与王九思同里同官、
  同以瑾党废，相聚沜东「挟声伎酣饮，制乐造歌曲，自比俳优，以寄其怫郁」——此即
  其罢官后三十年放浪生涯之正史表述。
