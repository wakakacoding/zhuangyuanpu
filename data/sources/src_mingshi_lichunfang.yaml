# 李春芳 A 级主干出处：《明史》卷一百九十三·李春芳传
id: src_mingshi_lichunfang
title: 明史·卷一百九十三·李春芳传
tier: A
juan: 列传第八十一
quote: >-
  李春芳，字子实，扬州兴化人。嘉靖二十六年举进士第一，除修撰。简入西苑撰青词，大被帝眷，
  与侍读严讷超擢翰林学士。寻迁太常少卿，拜礼部右侍郎，俱兼学士，直西苑如故。佐理部事，
  进左侍郎，转吏部，代讷为礼部尚书。时宗室蕃衍，岁禄苦不继。春芳考故事，为书上之。
  诸吉凶大礼及岁时给赐，皆严为之制。帝嘉之，赐名《宗藩条例》。寻加太子太保。
  四十四年命兼武英殿大学士，与讷并参机务。世宗眷侍直诸臣厚，凡迁除皆出特旨。
  春芳自学士至柄政，凡六迁，未尝一由廷推。春芳恭慎，不以势凌人。居政府持论平，
  不事操切，时人比之李时；其才力不及也，而廉洁过之。时徐阶为首辅，得君甚。
  春芳每事必推阶，阶亦雅重之。隆庆元年春，有诏修翔凤楼，春芳曰：「上新即位，
  而遽兴土木，可乎？」事遂止。……始阶以人言罢，春芳叹曰：「徐公尚尔，我安能久？
  容旦夕乞身耳。」居正遽曰：「如此，庶保令名。」春芳愕然，三疏乞休，帝不允。
  ……俺答款塞求封，春芳偕拱、居正即帝前决之。……时春芳已累加少师兼太子太师，
  进吏部尚书，改中极殿，度拱辈终不容己，两疏请归养，不允。南京给事中王祯希拱意，
  疏诋之，春芳求去益力。赐敕乘传，遣官护行，有司给夫廪如故事。阅一岁，拱复为居正所挤，
  几不免。而春芳归，父母尚无恙，晨夕置酒食为乐，乡里艳之。父母殁数年乃卒，年七十五，
  赠太师，谥文定。
url: https://zh.wikisource.org/wiki/明史/卷193
note: >-
  清·张廷玉等修。本传为生卒、夺魁、青词入直、首辅进退之主干依据：
  卒「年七十五」，万历十二年（1584）卒（今人通说），逆推生年 1510；
  索引原 birth_year: 1511 与「年七十五」逆推不合（1511 生则虚岁七十四），
  本批改从 1510，异说记于 persons 注释。
