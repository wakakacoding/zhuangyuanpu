id: src_mingshi_luohongxian
title: 明史·罗洪先传
tier: A
juan: 卷二百八十三·列传第一百七十一（儒林二）
quote: >-
  羅洪先，字達夫，吉水人。父循，進士。歷兵部武選郎中。……洪先幼慕羅倫爲人。年十五，
  讀王守仁《傳習錄》好之，欲往受業，循不可而止。乃師事同邑李中，傳其學。嘉靖八年
  舉進士第一，授修撰，即請告歸。……十八年簡宮僚，召拜春坊左贊善。明年冬，與司諫唐順之、
  校書趙時春疏請來歲朝正後，皇太子出御文華殿，受群臣朝賀。時帝數稱疾不視朝，
  諱言儲貳臨朝事，見洪先等疏，大怒曰：「是料朕必不起也。」降手詔百餘言切責之，
  遂除三人名。……素與順之友善。順之應召，欲挽之出，嚴嵩以同鄉故，擬假邊才起用，皆力辭。
  洪先雖宗良知學，然未嘗及守仁門……時王畿謂良知自然，不假纖毫力。洪先非之曰：
  「世豈有現成良知者耶？」……山中有石洞，舊爲虎穴，葺茅居之，命曰石蓮。謝客，
  默坐一榻，三年不出戶。……隆慶初，卒，贈光祿少卿，諡文莊。
url: null
note: >-
  清·张廷玉等撰，中华书局点校本。本传为本站罗洪先条目的主干出处，但两处与它源互异，
  本站已在考订后处理：
  ① **卒年**：本传作「隆庆初，卒」，而徐阶所撰墓志明记「甲子八月十五，卒于松原之新第，
  年六十一」，「甲子」即嘉靖四十三年（1564），去隆庆元年（1567）尚三年——本传当系将
  赠谥之年混入卒年；《明儒学案》卷十八亦作「四十三年卒，年六十一」。本站卒年从 1564。
  ② **谥号**：本传作「文庄」，徐阶《念庵罗公墓志铭》与《明儒学案》卷十八并作「文恭」。
  两说并存，本站从墓志、学案作「文恭」，并明注本传「文庄」之异说（详见交付报告考订节）。
  ③ 本传另记其「甘淡泊，炼寒暑，躍马挽强，考图观史，自天文地志、礼乐典章、河渠边塞、
  戰陣攻守，下逮阴阳算數，靡不精究」，为《广舆图》之学的注脚。
