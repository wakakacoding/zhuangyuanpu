id: src_mingshi_luolun
title: 明史·罗伦传
tier: A
juan: 卷一百七十九·列传第六十七
quote: >-
  羅倫，字彜正，吉安永豐人。五歲嘗隨母入園，果落，眾競取，倫獨賜而後受。家貧樵牧，挾書誦不輟。
  及為諸生，誌聖賢學，嘗曰：「舉業非能壞人，人自壞之耳。」知府張瑄憫其貧，周之粟，謝不受。
  居父母喪，逾大祥，始食鹽酪。
  成化二年，廷試，對策萬餘言。直斥時弊，名震都下。擢進士第一，授翰林修撰。逾二月，大學士
  李賢奔喪畢，奉詔還朝。倫詣賢沮之，不聽。乃上疏曰：「臣聞朝廷援楊溥故事，起復大學士李賢。
  臣竊謂賢大臣，起復大事，綱常風化系焉，不可不慎。……」（疏凡千餘言，略）疏入，謫福建
  市舶司副提舉。御史陳選疏救，不報。御史楊瑯復申救，帝切責之。尚書王翺以文彥博救唐介事諷賢，
  賢曰：「潞公市恩，歸怨朝廷，吾不可以效之。」亡何，賢卒。明年以學士商輅言召復原職，改南京。
  居二年，引疾歸，遂不復出。
  倫為人剛正，嚴於律己。義所在，毅然必為，於富貴名利泊如也。裏居倡行鄉約，相率無敢犯。
  衣食粗惡。或遺之衣，見道堇，解以覆之。晨留客飲，妻子貸粟鄰家，及午方炊，不為意。
  以金牛山人跡不至，築室著書其中，四方從學者甚眾。十四年卒，年四十八。嘉靖初，從御史唐龍請，
  追贈左春坊諭德，謚文毅。學者稱一峰先生。
url: https://zh.wikisource.org/wiki/明史/卷179
note: >-
  清·张廷玉等撰，中华书局点校本。本传为本站罗伦条目之主干出处，四事已作考订处置：
  ① **谥赠之年**：本传作「嘉靖初，从御史唐龙请，追赠左春坊谕德，谥文毅」，而《明儒学案》
  卷四十五作「正德十六年，赠左谕德，谥文毅」——嘉靖元年即正德十六年之次年，两说相邻，
  并存备考（已入 events[8]）；
  ② **上疏之期**：本传作「逾二月」，而《四库全书总目》卷一百七十一《一峰集》提要作
  「释褐甫三月」，并存备考；
  ③ **贬所之名**：本传作「福建市舶司副提举」，《四库总目》与《明儒学案》并作「泉州市舶副提举」
  ——福建市舶司治泉州，两说所指为一，本站从本传而注异称；
  ④ 本传不载生年，据《明儒学案》「戊戌九月二十四日卒，年四十八」逆推 1431。
