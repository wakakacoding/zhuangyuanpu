id: src_mingshi_lvnan
title: 明史·吕柟传
tier: A
juan: 卷二百八十二·列传第一百七十（儒林一）
quote: >-
  呂柟，字仲木，高陵人，別號涇野，學者稱涇野先生。正德三年登進士第一，授修撰。劉瑾以柟
  同鄉欲致之，謝不往。又因西夏事，疏請帝入宮親政事，潛消禍本。瑾惡其直，欲殺之，引疾去。
  瑾誅，以薦復官。乾清宮災，應詔陳六事，其言除義子，遣番僧，取回鎮守太監，尤人所不敢
  言。是年秋，以父病歸。……大禮議興，與張、桂忤。以十三事自陳，中以大禮未定，諂言日進，
  引為己罪。上怒，下詔獄，謫解州判官，攝行州事。恤煢獨，減丁役，勸農桑，興水利，築堤
  護鹽池，行《呂氏鄉約》及《文公家禮》，求子夏後，建司馬溫公祠。……晉南京太僕寺少卿。
  太廟災，乞罷黜，不允。選國子監祭酒，晉南京禮部右侍郎，署吏部事。帝將躬祀顯陵，累疏
  勸止，不報。值天變，遂乞致仕歸。年六十四卒，高陵人為罷市者三日。解梁及四方學者聞之，
  皆設位，持心喪。訃聞，上輟朝一日，賜祭葬。
url: null
note: >-
  清·张廷玉等撰，中华书局点校本。本传为本站吕柟条目的主干出处。三处需注意：
  ① 字仅作「仲木」，「大栋」之说不见于本传（见李开先传条）；
  ② 「南京太仆寺少卿」与《明儒学案》《国朝献征录》所载行状、《明实录类纂》三源
  作「南京太常寺少卿」互异，本站据三源从「太常寺」，本传「太仆」疑传写之误；
  ③ 卒年作「年六十四」而未系月日，月日据李开先传与《明儒学案》补。
  又：本传载万历、崇祯间李祯、赵锦等先后请以吕柟从祀孔庙，下部议未及行——身后
  从祀之议可备一说。
