# 彭时 A 级主干出处：《明史》卷一百七十六·彭时传（维基文库核对，2026-10-25）
id: src_mingshi_pengshi
title: 明史·卷一百七十六·彭时传
tier: A
juan: 列传第六十四
quote: >-
  彭時，字純道，安福人。正統十三年進士第一，授修撰。明年，郕王監國，令同商輅入閣預機務。
  聞繼母憂，力辭，不允，乃拜命。釋褐逾年參大政，前此未有也。……天順元年，徐有貞既得罪，
  岳正、許彬相繼罷。帝坐文華殿召見時，曰：「汝非朕所擢狀元乎？」時頓首。明日仍命入閣，
  兼翰林院學士。閣臣自三楊後，進退禮甚輕。爲帝所親擢者，唯時與正二人。而帝方向用李賢，
  數召賢獨對。賢雅重時，退必咨之。時引義爭可否，或至失色。賢初小忤，久亦服其諒直，
  曰：「彭公，真君子也。」……憲宗即位，議上兩宮尊號。中官夏時希周貴妃旨，言錢後久病，
  不當稱太后。……時曰：「先帝存日未嘗行，今誰敢草？若人臣阿意順從，是萬世罪人也。」
  中官厲聲怵以危語。時拱手向天曰：「太祖、太宗神靈在上，孰敢有二心！錢皇后無子，
  何所規利而爲之爭？臣義不忍默者，欲全主上聖德耳。若推大孝之心，則兩宮並尊爲宜。」
  賢亦極言之，議遂定。……（成化）四年，慈懿太后崩，詔議山陵。時及商輅、劉定之言：
  「太后作配先帝，正位中宮，陛下尊爲太后，詔示天下。……今梓宮當合葬裕陵，主當祔廟，
  此不易之禮。比聞欲別卜葬地，臣等實懷疑懼。……」於是諸大臣相繼言之。帝猶重違太后意，
  時偕朝臣伏文華門泣請。帝與太后皆感動，始從時議。……十一年正月，以秩滿進少保。
  逾月卒，年六十。贈太師，謚文憲。時立朝三十年，孜孜奉國，持正存大體，公退未嘗以政語
  子弟。有所論薦，不使其人知。燕居無惰容，服御儉約，無聲樂之奉，非其義不取，有古大臣風。
url: https://zh.wikisource.org/wiki/明史/卷176
note: >-
  清·张廷玉等修。本传为夺魁（正统十三年 1448 进士第一）、释褐逾年参大政、
  两宫尊号之争、慈懿太后合葬祔庙之议（伏文华门泣请）、成化十一年卒年六十、
  赠太师谥文宪诸事之主干依据。享年六十逆推生 1416，与卡一致。
  quote 据维基文库逐字核对（繁体原文照录），中略处以……标示。
