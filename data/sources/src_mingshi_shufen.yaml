# 舒芬 A 级主干出处：《明史》卷一百七十九·舒芬传（维基文库核对，2026-10-25）
id: src_mingshi_shufen
title: 明史·卷一百七十九·舒芬传
tier: A
juan: 列传第六十七
quote: >-
  舒芬，字國裳，進賢人。年十二，獻《馴雁賦》於知府祝瀚，遂知名。正德十二年舉進士第一，
  授修撰。時武宗數微行，畋遊無度。……芬上言：「陛下三年之內當深居不出，雖釋服之後，
  固儼然煢疚也。且自古萬乘之重，非奔竄逃匿，未有不嚴侍衛者。又等威莫大於車服，以天子
  之尊下同庶人，舍大輅袞冕而羸車褻服是禦，非所以辨上下、定禮儀。」不聽。……又明年
  三月，帝議南巡。時寧王宸濠久蓄異謀，與近幸相結，人情惶懼。言官伏闕諫，忤旨被責讓。
  芬憂之，與吏部員外郎夏良勝、禮部主事萬潮、庶吉士汪應軫要諸曹連章入諫，眾許諾。芬遂
  偕編修崔桐，庶吉士江暉、王廷陳、馬汝驥、曹嘉及應軫上疏曰：「古帝王所以巡狩者，協律度，
  同量衡，訪遺老，問疾苦，黜陟幽明，式序在位，是以諸侯畏焉，百姓安焉。若陛下之出，
  不過如秦皇、漢武，侈心爲樂而已，非能行巡狩之禮者也。博浪、柏谷，其禍亦可鑑矣。……
  尚有事堪痛哭不忍言者：宗藩蓄劉濞之釁，大臣懷馮道之心。以祿位爲故物，以朝署爲市廛，
  以陛下爲弈棋，以革除年間爲故事。」疏入，陸完迎謂曰：「上聞有諫者輒恚，欲自引決。
  諸君且休，勿歸過君上，沽直名。」芬等不應而出。……芬因邀博士陳九川至，酌之酒曰：
  「匹夫不可奪志，君輩可遂已乎？」明日遂偕諸曹連疏入。帝大怒，命跪闕下五日，期滿復
  杖之三十。芬創甚，幾斃，舁至翰林院中。掌院者懼得罪，命摽出之，芬曰：「吾官此，
  即死此耳。」竟謫福建市舶副提舉，裹創就道。世宗即位，召復故官。……旋遭母喪歸，
  卒於家，年四十四。世稱「忠孝狀元」。芬豐神玉立，負氣峻厲，端居竟日無倦容，夜則計過
  自訟。以倡明絕學爲己任。其學貫串諸經，兼通天文律歷，而尤精於《周禮》。……疾革，
  其子請所言，惟以未及表章《周禮》爲恨。學者稱「梓溪先生」。萬曆中，追謚文節。
  先是，修撰羅倫以諫謫福建提舉，逾六十年而芬繼之。與倫同鄉同官，所謫地與官又同，
  福建士大夫遂祀芬配倫雲。
url: https://zh.wikisource.org/wiki/明史/卷179
note: >-
  清·张廷玉等修。本传为十二岁献《驯雁赋》、正德十二年（1517）进士第一、谏武宗
  微行南巡（跪阙五日杖三十、「吾官此即死此耳」）、大礼议再杖、卒年四十四
  「忠孝状元」、精《周礼》、万历中追谥文节、与罗伦同乡同官同谪地诸事之主干
  依据。享年四十四逆推生 1484，卒 1527（嘉靖六年），与卡一致。
  quote 据维基文库逐字核对（繁体原文照录），中略处以……标示。
