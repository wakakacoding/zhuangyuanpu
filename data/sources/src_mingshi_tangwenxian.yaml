# 唐文献 A 级主干出处：《明史》卷二百一十六·唐文献传（维基文库核对，2026-10-25）
id: src_mingshi_tangwenxian
title: 明史·卷二百一十六·唐文献传
tier: A
juan: 列传第一百〇四
quote: >-
  唐文獻，字元徵，華亭人。萬曆十四年進士第一。授修撰，歷詹事。沈一貫以「妖書」事
  傾尚書郭正域，持之急。文獻偕其僚楊道賓、周如砥、陶望齡往見一貫曰：「郭公將不免，
  人謂公實有意殺之。」一貫踞蹐，酹地若爲誓者。文獻曰：「亦知公無意殺之也，第臺省
  承風下石，而公不早訖此獄，何辭以謝天下。」一貫斂容謝之。……然文獻等以是失政府
  意。久之，拜禮部右侍郎，掌翰林院事。初，文獻出趙用賢門，以名節相矜許。同年生
  給事中李沂劾張鯨被廷杖，文獻掖之出，資給其湯藥。荊州推官華鈺忤稅監逮下詔獄，
  文獻力周旋，得無死。掌翰林日，當考察，執政欲庇一人，執不許。卒官。贈禮部尚書，
  謚文恪。
url: https://zh.wikisource.org/wiki/明史/卷216
note: >-
  清·张廷玉等修。本传为万历十四年（1586）进士第一、妖书案中直犯沈一贯救
  郭正域、出赵用贤门以名节相矜、掖廷杖的李沂出宫资给汤药、救华钰于诏狱、
  掌翰林考察拒执政请托、卒官赠礼部尚书谥文恪诸事之主干依据。
  生年 1549 为通行说（本传不载年数），卒 1605 通行说，persons 注记备考。
  quote 据维基文库逐字核对（繁体原文照录）。
