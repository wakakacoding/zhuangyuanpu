# 文震孟 A 级主干出处：《明史》卷二百五十一·文震孟传（维基文库核对，2026-10-25）
id: src_mingshi_wenzhenmeng
title: 明史·卷二百五十一·文震孟传
tier: A
juan: 列传第一百三十九
quote: >-
  文震孟，字文起，吳縣人，待詔征明曾孫也。祖國子博士彭，父衛輝同知元發，並有名行。
  震孟弱冠以《春秋》舉於鄉，十赴會試。至天啟二年，殿試第一，授修撰。時魏忠賢漸用事，
  外廷應之，數斥逐大臣。震孟憤，於是冬十月上《勤政講學疏》，言：「今四方多故，無歲不
  蹙地陷城，覆軍殺將，乃大小臣工臥薪嘗膽之日。而因循粉飾，將使祖宗天下日銷月削。……
  陛下昧爽臨朝，寒暑靡輟，政非不勤，然鴻臚引奏，跪拜起立，如傀儡登場已耳。請按祖宗制，
  唱六部六科，則六部六科以次白事，糾彈敷奏，陛下與輔弼大臣面裁決焉。……」疏入，
  忠賢屏不即奏。乘帝觀劇，摘疏中「傀儡登場」語，謂比帝於偶人，不殺無以示天下，帝頷之。
  一日，講筵畢，忠賢傳旨，廷杖震孟八十。首輔葉向高在告，次輔韓爌力爭。……內批俱貶秩
  調外。言官交章論救，不納。震孟亦不赴調而歸。……崇禎元年以侍讀召。……帝嘗足加於膝，
  適講《五子之歌》，至「爲人上者，奈何不敬」，以目視帝足，帝即袖掩之，徐爲引下。
  時稱「真講官」。……八年正月，賊犯鳳陽皇陵。震孟歷陳致亂之源，因言：「當事諸臣，
  不能憂國奉公，一統之朝，強分畛域，加膝墜淵，總由恩怨。……」帝優旨報之，然亦不能
  盡行也。……七月，帝特擢震孟禮部左侍郎兼東閣大學士，入閣預政。兩疏固辭，不許。
  閣臣被命，即投刺司禮大奄，兼致儀狀，震孟獨否。……震孟既入直，體仁每擬旨必商之，
  有所改必從，喜謂人曰：「溫公虛懷，何云奸也？」同官何吾騶曰：「此人機深，詎可輕信？」
  越十餘日，體仁窺其疏，所擬不當，輒令改，不從，則徑抹去。震孟大慍，以諸疏擲體仁前，
  體仁亦不顧。……體仁遽以聞。帝果怒，責吾騶、震孟徇私撓亂。吾騶罷，震孟落職閒住。
  方震孟之拜命也，即有旨撤鎮守中官。及次輔王應熊之去，忌者謂震孟爲之。由是有譖其
  居功者，帝意遂移。震孟剛方貞介，有古大臣風，惜三月而斥，未竟其用。歸半歲，會甥
  姚希孟卒，哭之慟，亦卒。廷臣請恤，不允。十二年，詔復故官。十五年，贈禮部尚書，
  賜祭葬，官一子。福王時，追謚文肅。
url: https://zh.wikisource.org/wiki/明史/卷251
note: >-
  清·张廷玉等修。本传为文徵明曾孙家世、弱冠举乡试十赴会试、天启二年（1622）
  殿试第一、劾魏忠贤「傀儡登场」廷杖、「真讲官」、《春秋》进讲、崇祯八年入阁、
  与温体仁不合三月而斥、崇祯十五年赠礼部尚书、福王时追谥文肃诸事之主干依据。
  生年 1574 为通行逆推（本传不载年数）。quote 据维基文库逐字核对（繁体原文照录），
  中略处以……标示。
