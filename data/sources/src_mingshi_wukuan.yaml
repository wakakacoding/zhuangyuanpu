id: src_mingshi_wukuan
title: 明史·卷一百八十四·吴宽传
tier: A
juan: 列传第七十二
quote: >-
  吳寬，字原博，長洲人。以文行有聲諸生間。成化八年，會試、廷試皆第一，授修撰。
  侍孝宗東宮，秩滿進右諭德。孝宗即位，以舊學遷左庶子，預修《憲宗實錄》，進少詹事兼侍讀學士。
  弘治八年擢吏部右侍郎。丁繼母憂，吏部員缺，命虛位待之。服滿還任，轉左，改掌詹事府，入東閣，
  專典誥敕，仍侍武宗東宮。宦豎多不欲太子近儒臣，數移事間講讀。寬率其僚上疏曰：
  「東宮講學，寒暑風雨則止，朔望令節則止，一年不過數月，一月不過數日，一日不過數刻。
  是進講之時少，輟講之日多，豈容復以他事妨誦讀。古人八歲就傅，即居宿於外，欲離近習，
  親正人耳。庶民且然，矧太子天下本哉？」帝嘉納之。
  十六年進禮部尚書，餘如故。……時詞臣望重者，寬為最，謝遷次之。遷既入閣，嘗為劉健言，
  欲引寬共政，健固不從。……及遷引退，舉寬自代，亦不果用。中外皆為之惜，而寬甚安之，
  曰：「吾初望不及此也。」年七十，數引疾，輒慰留，竟卒於官。贈太子太保，諡文定。
  授長子奭中書舍人，補次子奐國子生，異數也。
  寬行履高潔，不為激矯，而自守以正。於書無不讀，詩文有典則，兼工書法。有田數頃，
  嘗以周親故之貧者。友人賀恩疾，遷至邸，旦夕視之。恩死，為衣素一月。
url: null
note: 清·张廷玉等修。本传载卒「年七十」——卒年 1504（弘治十七年）据《明孝宗实录》及王鏊《神道碑》（「阅月卒，弘治甲子七月十日也」），逆推生 1435。生卒具体系年不出本传，事件表引 A 级本传 + 神道碑（B 级）两源。
