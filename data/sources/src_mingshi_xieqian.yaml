# 谢迁 A 级主干出处：《明史》卷一百八十一·谢迁传（维基文库核对，2026-10-25）
id: src_mingshi_xieqian
title: 明史·卷一百八十一·谢迁传
tier: A
juan: 列传第六十九
quote: >-
  謝遷，字於喬，餘姚人。成化十年鄉試第一。明年舉進士，復第一。授修撰，累遷左庶子。
  弘治元年春，中官郭鏞請豫選妃嬪備六宮。遷上言：「山陵未畢，禮當有待。祥禫之期，
  歲亦不遠。陛下富於春秋，請俟諒陰既終，徐議未晚。」尚書周洪謨等如遷議，從之。
  帝居東宮時，遷已為講官，及是，與日講，務積誠開帝意。前夕必正衣冠習誦，及進講，
  敷詞詳切，帝數稱善。進少詹事兼侍講學士。八年詔同李東陽入內閣參預機務。遷時居憂，
  力辭，服除始拜命。進詹事兼官如故，皇太子出閣，加太子少保、兵部尚書兼東閣大學士。
  上疏勸太子親賢遠佞，勤學問，戒逸豫，帝嘉之。……孝宗晚年慨然欲厘弊政。而內府諸庫
  及倉場、馬坊中官作奸骫法，不可究詰。御馬監、騰驤四衛勇士自以禁軍不隸兵部，
  率空名支餉，其弊尤甚。遷乘間言之，帝令擬旨禁約。……遷儀觀俊偉，秉節直亮。
  與劉健、李東陽同輔政，而遷見事明敏，善持論。時人為之語曰：「李公謀，劉公斷，
  謝公尤侃侃。」天下稱賢相。武宗嗣位，屢加少傅兼太子太傅。數諫，帝弗聽。因天變求去甚力，
  帝輒慰留。及請誅劉瑾不克，遂與健同致仕歸，禮數俱如健。而瑾怨遷未已。焦芳既附瑾入內閣，
  亦憾遷嘗舉王鏊、吳寬自代，不及己，乃取中旨勒罷其弟兵部主事迪，斥其子編修丕為民。
  ……當是時，人皆為遷危，而遷與客圍棋、賦詩自若。瑾誅，復職，致仕。世宗即位，遣使存問，
  起迪參議，丕復官翰林。遷乃遣子正入謝。……嘉靖二年復詔有司存問。六年，大學士費宏舉遷自代，
  楊一清欲阻張璁，亦力舉遷。帝乃遣行人賫手敕即家起之，命撫、按官敦促上道。遷年七十九矣，
  不得已拜命，比至，而璁已入閣，一清以官尊於遷無相下意。遷居位數月，力求去。帝待遷愈厚，
  以天寒免朝參，除夕賜御製詩。及以病告，則遣醫賜藥餌，光祿致酒餼，使者相望於道。
  遷竟以次年三月辭歸。十年卒於家，年八十有三。贈太傅，謚文正。
url: https://zh.wikisource.org/wiki/明史/卷181
note: >-
  清·张廷玉等修。本传为生卒（嘉靖十年 1531 卒、年八十三 → 生 1449）、
  连中二元（成化十年乡试第一、十一年会试状元）、弘治内阁、刘瑾之祸、
  嘉靖再起诸事之主干依据。quote 据维基文库逐字核对（繁体原文照录），
  中略处以……标示。
