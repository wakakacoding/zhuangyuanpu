id: src_mingshi_yiwenzhi_luohongxian
title: 明史·艺文志（罗洪先著作著录）
tier: A
juan: 志第七十二（艺文一·经部）；志第七十三（艺文二·地理类）
quote: >-
  （经部·易类）羅洪先《易解》一卷。……（经部·礼类）羅洪先《周禮疑》一卷。
  ……（地理类）羅洪先《增補硃思本廣輿圖》二卷。
url: null
note: >-
  清·张廷玉等撰。本件为罗洪先三种著作在正史艺文志中的著录原文，是本站 works 栏
  三处「待考」条目的依据。三点说明：① 三目分见经、史两部，可见其著述以经学与舆地为主；
  ② 《增补朱思本广舆图》之名说明《广舆图》为增订元人朱思本《舆地图》而成（此事亦见
  四库与国图藏本著录）；③ 本件仅著录书名卷数，不涉成书年月，故 events 中《广舆图》
  一条系年从宽（about），初刻之年史无明文。
