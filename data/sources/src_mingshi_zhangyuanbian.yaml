# 张元忭 A 级主干出处：《明史》卷二百八十三·儒林二（鄧以贊传附张元忭，维基文库核对，2026-10-25）
id: src_mingshi_zhangyuanbian
title: 明史·卷二百八十三·儒林二（鄧以贊传附张元忭）
tier: A
juan: 列传第一百七十一
quote: >-
  （鄧以贊，字汝德，新建人。）張元忭，字子藎，紹興山陰人。二人皆生有異質，又好讀書。
  ……元忭素羸弱，母戒毋過勞，乃藏燈幕中，俟母寢始誦。十餘歲時以氣節自負，聞楊繼盛死，
  為文遙誄之，慷慨泣下。父天復，官雲南副使，擊武定賊鳳繼祖有功。已，賊還襲武定，官軍
  敗績，巡撫呂光洵討滅之。至隆慶初，議者追理前失亡狀，逮天復赴雲南對簿，元忭適下第還，
  萬里護行，發盡白。已，復馳詣闕下白冤，當事憐之，天復得削籍歸。（隆慶五年，以贊舉會試
  第一，廷試第三，授編修，）而元忭以廷試第一，授修撰。……元忭嘗抗疏救御史胡涍，又請
  進講《列女傳》於兩宮，修《二南》之化，皆不省。萬歷十年奉使楚府還，過家省母，既行心動，
  輒馳歸，僅五日，母卒。元忭奉二親疾，湯藥非口嘗弗進，居喪毀瘠，遵用古禮，鄉人多化之。
  服闋，起故官，進左諭德，直經筵。先是，元忭以帝登極恩，請復父官，詔許給冠帶。至是復
  申前請，格不從。元忭泣曰：「吾無以下見父母矣。」遂悒悒得疾卒。天啟初，追謚文恭。
  以贊、元忭自未第時即從王畿遊，傳良知之學，然皆篤於孝行，躬行實踐。以贊品端誌潔，
  而元忭矩矱儼然，無流入禪寂之弊。元忭子汝霖，江西參議。汝懋，御史。
url: https://zh.wikisource.org/wiki/明史/卷283
note: >-
  清·张廷玉等修。张元忭无独立本传，事附鄧以贊传（儒林二）。本传为藏灯诵书、
  遥诔杨继盛、万里护父、隆庆五年廷试第一、孝行事亲、请复父官不遂而卒、
  天启初追谥文恭诸事之主干依据。生卒本传不载年数（通行说 1538–1588，
  persons 注记备考）。quote 据维基文库逐字核对（繁体原文照录，
  括注鄧以贊文字以（）标示，略处以……标示）。
