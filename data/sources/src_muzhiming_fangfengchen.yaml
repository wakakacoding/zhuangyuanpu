# 方逢辰 B 级主干出处：文及翁撰墓志铭（生卒与年谱之直接依据）
id: src_muzhiming_fangfengchen
title: 故侍读尚书方公墓志铭（文及翁撰）
tier: B
quote: >-
  考之年谱，公生于嘉定辛巳九月二十九日午时，卒于至元辛卯正月初三日申时。
  遗言以深衣殓，不尚异教。
url: null
note: >-
  文及翁撰（原文附《蛟峰先生文集》末，今未见全篇）。生卒年月日时之唯一一手依据：
  嘉定辛巳（1221）九月廿九日生，至元辛卯（1291）正月初三卒，享年七十一。
  引文据维基百科方逢辰条脚注转录，原碑/原文未核，待核。
  官至「侍读尚书」与传世职名（户部尚书／礼吏部尚书不受）微异，从墓志题衔存录。
