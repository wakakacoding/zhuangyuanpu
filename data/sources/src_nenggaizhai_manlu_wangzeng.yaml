id: src_nenggaizhai_manlu_wangzeng
title: 能改斋漫录（王曾不受郊迎条）
tier: B
juan: null
quote: >-
  不受郊迎　王沂公曾狀元及第還青州，故郡府帥聞其歸，乃命父老娼樂迎於郊。公乃易服乘小驢
  由他門入，遽謁守。守驚曰：「聞君來，已遣人奉迎，門司未報君至，何為抵此？」公以實告之
  曰：「不才幸忝科第，敢煩太守父老致迓，是重其過也。」
url: null
note: >-
  南宋吴曾撰，宋人笔记（笔记类一手材料，故列 B 级）。本件据宋·祝穆《古今事文类聚》
  前集卷二十六「不受郊迎」条所引录入（该条注出《吴曾漫录》），原书卷次待核。
  后世《宋稗类钞》及今人地方史志转述此事的文字与此略同，唯易「乘小驴」为「骑小毛驴」，
  本站以宋人所引为正。此为「状元归乡不受郊迎」故事之最早可溯出处。
