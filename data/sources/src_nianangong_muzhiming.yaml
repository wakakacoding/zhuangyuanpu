id: src_nianangong_muzhiming
title: 念庵罗公墓志铭（徐阶撰）
tier: B
juan: 见《罗念庵先生文录》光绪十二年刊本；门人胡直《念庵先生行状》为其所据
quote: >-
  公諱洪先，字達夫，念菴其號。厥初豫章人，三徙而居吉水之橙溪。曾祖良，廣海衛經歷，
  祖玉，以子貴，贈奉直大夫兵部員外郎。考循，舉進士，仕至山東按察副使。嘗抗逆瑾，
  侃侃著風節。娶李氏，封宜人。以宏治甲子十月十四日生公。公年十五即下視舉子業，
  得傳習錄，手鈔而讀之，晝夜不置。嘉靖己丑，舉進士第一，世宗批其文學正有見，
  言讜而意必忠，宜擢之首者。授翰林院修撰。……邑故多虛糧，言於有司，盡丈邑中，
  計畝而稅，宿弊頓革。建同水鄉水次倉，去邑之虛丁二萬。民以不困於賦役。歲饑，
  移書郡縣，得粟數千石，率士友躬賑給之。閩廣寇流吉安，握兵者不能制。公為劃策，
  嚴守而力戰，寇遁。嘗遊衡嶽，僧楚石授公外丹，公謝曰：吾道自足，寧須此。
  友人以仙學招者，作長書去之。……甲子八月十五，卒於松原之新第，年六十一。……
  今皇登極，公論明矣，乃公則已先卒，僅贈奉議大夫、光祿寺少卿，諡文恭。……
  乙丑七月十九日，世光葬公桐江赤石潭沖天飛鳳形山之原。
url: null
note: >-
  明·徐阶撰（署「赐进士及第、特进光禄大夫柱国、少师兼太子太师、吏部尚书、建极殿大学士、
  知制诰、知经筵事、国史总裁华亭徐阶」），与罗洪先「友三十年」，墓志据其门人胡直所撰
  行状而作，属当事人同时代材料，列 B 级。本件为本站罗洪先条目的第二主干，价值有四：
  ① **生卒月日独见于此**：弘治甲子（十七年）十月十四日生、嘉靖甲子（四十三年）八月十五
  卒于松原新第，年六十一——与生年 1504 相校相合（虚岁六十一），并据此订正《明史》
  「隆庆初卒」之误；
  ② 赠谥作「文恭」，且明记「赠奉议大夫、光禄寺少卿」，为《明史》「文庄」异说之对立证据；
  ③ 均田赋、建同水乡水次仓、去虚丁二万、岁饥移书得粟赈给、闽广寇入吉安为画策战守
  诸事，本传仅存梗概而墓志较详，且「得粟数千石」与《明史》「得粟数十石」异文并存；
  ④ 游衡岳拒僧楚石外丹、作长书拒友人仙学之招，见其学之守。
  又：嘉靖八年殿试世宗批语（「文学正有见，言谠而意必忠，宜擢之首者」）为他书所无。
