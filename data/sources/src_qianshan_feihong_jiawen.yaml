id: src_qianshan_feihong_jiawen
title: 铅山县政府·孝友堂费氏家风（今人整理）
tier: C
juan: null
quote: >-
  费宏在二十二岁任翰林院修撰时，因年轻气盛，与同僚博弈争之甚激。其父费璠在京闻之，
  即遣使持家法竹棰责之，身为状元郎的费宏伏地领笞并向同僚致歉。
  ……宁王宸濠为恢复护卫扩充实力，向费宏馈赠珍玩，费宏拒绝接受，并旗帜鲜明地
  阻止宸濠恢复护卫的计划。……宸濠指使他人夜半纵火，焚烧费宏船只。
url: null
note: >-
  铅山县人民政府官网「孝友堂里的费氏家风」文（2019），属今人地方文化整理——
  二级出处（C 级，原始出处待溯）。宁王拒贿、焚舟诸事主体已见《明史》本传
  （src_mingshi_feihong，A 级）；本条仅用于「父责状元」家法轶事——此条不见正史，
  列 C 级传说层。
