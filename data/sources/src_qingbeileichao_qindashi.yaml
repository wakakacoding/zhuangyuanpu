id: src_qingbeileichao_qindashi
title: 清稗类钞·姓名类「秦大士以姓得利得害」条
tier: C
juan: 姓名类
quote: >-
  秦大士秦淮绝句，有「淮水而今尚姓秦」句，一时脍炙人口，则以其姓得利也。
  某年，偕袁子才游西湖，过岳王坟，睹秦桧像，人泥其题句，秦大不怿，
  子才为代吟曰：「人于宋后羞称桧，我到坟前愧姓秦。」大士以姓几受奇窘，
  微子才，殆矣。
url: null
note: >-
  民国·徐珂编。「愧姓秦」一联的最早可考文本，且明记此联为袁枚代拟而非秦大士自作——
  与民间通行传说（秦大士亲题）相反，本站从此说并两存。秦大士《游秦淮》诗
  「淮水而今尚姓秦」见袁枚《随园诗话》卷十三。
