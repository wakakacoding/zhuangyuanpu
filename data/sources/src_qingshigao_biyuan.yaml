note: >-
  民国·赵尔巽等修。本传为夺魁（乾隆二十五年 1760 一甲一名）、军机章京出身、
  抚陕十年（水利屯垦）、湖广总督任上白莲教之役、嘉庆二年（1797）卒、
  嘉庆四年追论夺世职籍家诸事之主干依据。quote 据维基文库逐字核对
  （繁体原文照录），中略处以……标示。
