# 毕沅 A 级主干出处：《清史稿》卷三百三十二·毕沅传（维基文库核对，2026-10-25）
id: src_qingshigao_biyuan
title: 清史稿·卷三百三十二·毕沅传
tier: A
juan: 列传一百十九
quote: >-
  畢沅，字纕蘅，江南鎮洋人。乾隆十八年舉人，授內閣中書，充軍機處章京。二十五年
  一甲一名進士，授修撰。再遷庶子。三十一年，授甘肅鞏秦階道。從總督明山出關勘屯田，
  調安肅道。擢陝西按察使。上東巡，覲行在，備言甘肅旱。諭治賑，並免逋賦四百萬。
  擢布政使，屢護巡撫。師徵金川，遣沅督餉，軍無匱，授巡撫。河、洛、渭並漲，朝邑被水。
  治賑，全活甚眾。幕民墾興平、盩厔、扶風、武功荒地，得田八十餘頃。濬涇陽龍洞渠，
  溉民田。嘉峪關外鎮西、迪化士子赴鄉會試者，奏請給驛馬。置姬氏五經博士，奉祀文、武、
  成、康四王及周公陵墓。修華嶽廟暨漢、唐以來名跡，收碑碣儲學宮。屢署總督。
  四十一年，賜孔雀翎。四十四年，丁母憂，去官。四十五年，陝西巡撫缺員，諭：「沅在西安久，
  守制將一年。命往署理，非開在任守制例也。」四十六年，甘肅冒賑事發，御史錢灃劾沅瞻徇，
  降三品項戴。四十八年，復還原品，尋實授巡撫。……沅先後撫陝西十年，嘗奏：「足民之要，
  農田為上。關右大川，若能就近疏引，築堰開渠，以時蓄洩，自無水旱之虞。……耕作與畜牧相兼，
  實為邊土無窮之利。」議未行。五十年，調河南巡撫。……五十一年，賜黃馬褂。授湖廣總督。
  ……五十三年，复授湖廣總督。江決荊州，發帑百萬治工。……五十九年，陝西安康、四川大寧
  邪教並起，稱傳自湖北，沅赴襄陽、鄖陽按治，降授山東巡撫。上以明年歸政，令督撫察民欠
  錢糧豁免，奏蠲山東積逋四百八十七萬、常平社倉米穀五十萬四千餘石。六十年，仍授湖廣總督。
  湖南苗石三保等為亂，命赴荊州、常德督餉，以運輸週妥，賜孔雀翎。嘉慶元年，枝江民聶人傑等
  挾邪教為亂，破保康、夾鳳、竹山，圍襄陽，沅自辰州至枝江捕治。當陽又陷，复移駐荊州，
  上命解沅總督。旋克當陽，獲亂渠張正謨等，復命沅為總督如故，予二等輕車都尉世職。
  尋奏亂渠石三保、吳半生、吳八月等皆就獲，惟石柳鄧未獲；……尋獲石柳鄧。上命沅馳赴湖南
  鎮撫。疏言：「樊城為漢南一都會，請建磚城，以工代賑。」二年，請以提督移辰州，增設總兵
  駐花園汛。尋報疾作，手足不仁，賜活絡丸。旋卒，贈太子太保。四年，追論沅教匪初起失察貽誤，
  濫用軍需帑項，奪世職，籍其家。沅以文學起，愛才下士，職事修舉；然不長於治軍，又易為
  屬吏所蔽，功名遂不終。
