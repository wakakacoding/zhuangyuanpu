id: src_qingshigao_chongqi
title: 清史稿·崇绮传
tier: A
juan: 列传二百五十五
quote: >-
  崇绮，字文山，阿鲁特氏，蒙古正蓝旗人，大学士赛尚阿子。
  是岁成一甲一名进士，立国二百数十年，满、蒙人试汉文获授修撰者，止崇绮一人，士论荣之。
  事败，随荣禄走保定，居莲池书院，自缢死。
url: https://guoxue.jxxyjl.com/qingshigao/2621.html
note: >-
  「是岁」承上文同治三年。本站人物卡科年作同治四年（1865），两说并存，不改卡上科年。
  生卒年本传未写。引文据网络整理本核读，2026-10-17，未核中华书局点校本纸书。
