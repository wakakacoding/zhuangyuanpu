id: src_qingshigao_chongqi_shijia
title: 清史稿·卷四百六十八·崇绮传（阖门死难节）
tier: A
juan: 列传二百五十五
quote: >-
  崇绮，字文山，阿鲁特氏，蒙古正蓝旗人，大学士赛尚阿子。以穆后父贵，升隶满洲镶黄旗。
  ……同治三年……是岁成一甲一名进士，立国二百数十年，满、蒙人试汉文获授修撰者，
  止崇绮一人，士论荣之。十一年，诏册其女为皇后，锡三等承恩公。……
  义和团起，朝贵崇奉者十之七八，而崇绮亦信仰之。事败，随荣禄走保定，
  居莲池书院，自缢死。荣禄以闻，赐奠醊，入祀昭忠祠，谥文节。
  崇绮妻，瓜尔佳氏，先于京师陷时，预掘深坑，率子散秩大臣葆初及孙员外郎廉定，
  笔帖式廉容、廉密，监生廉宏，分别男女入坑生瘗，阖门死难，各奖恤有差。
url: https://zh.wikisource.org/wiki/清史稿/卷468
note: >-
  赵尔巽等修。本传两段核心：其一「立国二百数十年，满、蒙人试汉文获授修撰者止崇绮一人」
  ——清代唯一旗人状元的正史定论；其二庚子之变阖门死难——妻率子孙生瘗、本人保定自缢，
  为状元史上最惨烈的家族结局。
