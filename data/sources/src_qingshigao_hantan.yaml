# 韩菼 A 级主干出处：《清史稿》卷二百六十六·韩菼传（维基文库核对，2026-10-25）
id: src_qingshigao_hantan
title: 清史稿·卷二百六十六·韩菼传
tier: A
juan: 列传五十三
quote: >-
  韓菼，字元少，江南長洲人。讀書通五經，恬曠好山水。朋遊飲酒，歡諧終日，而製行清嚴。
  特工製舉文。應順天鄉試，尚書徐乾學拔之遺卷中。康熙十二年，會試、殿試皆第一，授修撰，
  充日講起居注官。聖祖知其能文，命撰太極圖說以進，复諭進所作制舉文，召入弘德殿講大學。
  初世祖命纂孝經衍義未成，至是以菼專任纂修。十四年，典順天試。……二十四年，上親試
  翰林，菼列第二，遷侍講學士。尋擢內閣學士。二十六年，再假歸，築室西山。點勘諸經註疏，
  旁逮諸史。居八年，三十四年，召至京，命以原官總裁一統志。遷禮部侍郎，兼掌院學士。
  祭酒阿理瑚請以故大學士達海從祀文廟，下部議，菼謂：「從祀鉅典，論定匪易。達海造國書，
  一藝耳。」持不可。……三十九年，充經筵講官，授禮部尚書，教習庶吉士。四十一年，上疏
  乞解職，專意纂輯承修諸書，詔慰留之，並賜「篤志經學、潤色鴻業」榜。四十二年，再稱疾，
  上不悅，敕仍留原任。四十三年，再疏乞退，仍不允。是歲秋，卒，卹如禮。菼負文章名，
  而立朝樹風概，敢言，與人有始終。其再假歸也，乾學方罷官家居，領書局洞庭山中。兩江
  總督傅臘塔構乾學，將興大獄，素交皆引去。菼旦暮造門，且就當事白其誣，乃已。其復起也，
  上遇之厚，嘗曰：「韓菼天下才，美風度，奏對誠實。」又曰：「菼學問優長，文章大雅，
  前代所僅有。所撰擬能道朕意中事。」會江寧布政使張萬祿蝕帑金三十餘萬金，總督阿山庇之，
  謂費由南巡。下廷臣議，有言阿山與有連，妄語罪當死。菼謂縱有連，情私而語公。忌者增益
  其語入告，上由是疏菼。及再謝病，詔責其教習庶吉士，每日率以飲酒多廢學；九卿集議，
  不爲國事直言，惟事瞻徇。菼意不自得，病甚，飲不輟，至卒。乾隆十七年，高宗諭獎「菼
  雅學績文，湛深經術。所撰制義，清真雅正，開風氣之先，爲藝林楷則」。追諡文懿。
url: https://zh.wikisource.org/wiki/清史稿/卷266
note: >-
  民国·赵尔巽等修。本传为遗卷中式（徐乾学拔之）、康熙十二年（1673）会试殿试皆第一、
  纂孝经衍义、总裁一统志、达海从祀之议、礼部尚书、上疏乞退、康熙四十三年（1704）卒、
  乾隆十七年追谥文懿诸事之主干依据。quote 据维基文库逐字核对（繁体原文照录），
  中略处以……标示。
