id: src_qingshigao_hongjun
title: 清史稿·洪钧传
tier: A
juan: 列传二百三十三
quote: >-
  洪钧，字文卿，江苏吴县人。同治七年一甲一名进士，授修撰。
  出使俄德奥比四国大臣，晋兵部左侍郎。
  十九年，卒，予优恤。
  钧嗜学，通经史，尝譔元史释文证补，取材域外，时论称之。
url: http://www.readcn.cn/qingshigao/8579.html
note: >-
  引文据网络整理本核读，2026-10-18，未核中华书局点校本纸书。
  本传不记生年、字陶士、号文卿、歇县祖籍。人物卡旧字段保留，不在本条改。
