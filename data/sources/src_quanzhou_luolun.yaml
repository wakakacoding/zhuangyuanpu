id: src_quanzhou_luolun
title: 泉州掌故与一峰书院（《双髻仙山志》《晋江县志》等转引）
tier: C
juan: null
quote: >-
  何氏九仙祈夢勝地泉州雙髻山俗稱仙公山，至今仍廣泛流傳著一則羅倫祈夢高中狀元的傳說：羅倫赴京
  趕考前，特地到泉州仙公山祈夢，求問前程，他在「豐山洞」裡一連住了九天九夜，卻一夢無成。
  第十天清晨，他向廟祝借來文房四寶，氣忿地在洞壁上題詩一首：「千里路途來求夢，九霄無夢是無緣。
  神仙不管凡間事，回去江西中狀元。」題畢擲筆而去，歸至山下，天上響起一陣雷，當他返回洞中取
  匆忙間落下的雨傘時，突然發現牆上的詩被改動了兩個字：「無緣」改為「有緣」，「不管」改為「專管」，
  且墨汁未乾。後來羅倫果然蟾宮折桂，一舉奪魁。
  ……明嘉靖八年，巡按御使聶豹、提學副使郭持平、知府顧可久……改淨真觀地建一峰書院，
  祀市舶司提舉羅文毅公倫。（清·周學曾纂修：《晉江縣志·學校志》）
  ……成化丙戌（二年），巡撫御使朱公賢奏請遷（泉州市舶司於）福之柏衙，制從之。提舉羅公倫云：
  「衙門設立自有其地；遷移亦有其數。蓋以柏衙僻陋，非可設之地；歲數未窮，非可遷之時」，
  遂寢其事。（王紕編：《福建市舶提舉司記》，轉引自沈玉水《泉州掌故録粹》）
url: null
note: >-
  出《双髻仙山志》（今人李佳福主编）、清·周学曾《晋江县志·学校志》、王纰《福建市舶提举司记》
  （转引自沈玉水《泉州掌故录粹》）三系，皆经今人整理转录、原本未见，属**二手标目、原始出处待溯**，
  故列 C 级。价值有三：① 祈梦题诗传说为罗伦谪居泉州行迹之民俗记忆；② 《晋江县志》所载嘉靖八年
  建一峰书院（后改梅石书院）为罗伦身后在泉州受祀之据，且载「梅石开，状元来」之谶与万历十七年
  晋江庄际昌夺魁相应之说；③ 迁市舶司之争（拒迁福州柏衙）为其居官泉州之具体政绩，可与本传
  「谪福建市舶司副提举」相参。三事原书均待核，故史实字段仅取其可与正史相参者，余入轶事栏。
