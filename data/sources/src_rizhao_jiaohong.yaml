id: src_rizhao_jiaohong
title: 日照焦氏乡贤叙事（今人整理）
tier: C
juan: null
quote: >-
  1589年（萬曆十七年），50歲的焦竑再次進京參加會試。傳說他沿水路北上，曉行夜宿，泊舟於岸。
  次日早晨，焦竑盥洗完畢，忽見船頭有金鐲一隻，珠寶鑲嵌，絢麗奪目。他毅然令船工拋錨停航，
  派僕人登岸尋找失主。後來果然查到失主，當面還鐲，誤了考期。誰料焦竑趕到京城，卻得知考場失火，
  考期推遲。他高興至極，按期進場。殿試完畢，名列第一。焦竑考中狀元的消息傳開後，人們說：
  「德高當報。考場不失火，哪有狀元焦！」
url: null
note: >-
  出今人整理之日照乡贤叙事（焦竑祖籍山东日照，为乡里后世追述），经网络百科转录，
  属**二手标目、原始出处待溯**，故列 C 级。所记「还金」「考场失火改期」二事，
  明人笔记、《明史》本传与《明儒学案》均不载；然《明儒学案》记其晚年「认宗」原籍后
  「改置义田」以赡族人，「还金」一类乡里传说或即由「居乡行义」之实迹敷演，本站仅作
  传说层备录，不入史实字段。
