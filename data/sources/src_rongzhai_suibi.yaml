id: src_rongzhai_suibi
title: 容斋四笔·梁状元八十二岁
tier: B
juan: 卷十四
quote: >-
  陈正敏《遁斋闲览》：「梁灏八十二岁，雍熙二年状元及第。其谢启云：『白首穷经，
  少伏生之八岁；青云得路，多太公之二年。』后终秘书监，卒年九十余。」此语既著，
  士大夫亦以为口实。予以国史考之：梁公字太素，雍熙二年廷试甲科，景德元年以翰林
  学士知开封府，暴疾卒，年四十二。子固亦进士甲科，至直史馆，卒年三十三。史臣谓：
  「梁方当委遇，中途夭谢。」又云：「梁之秀颖，中道而摧。」明白如此，遁斋之妄不
  待攻也。
url: null
note: >-
  南宋·洪迈撰考据笔记。「梁状元八十二岁」条为千年辨伪第一锤：洪迈以内制之臣亲见
  国史，引《梁颢传》原文证陈正敏之妄。《四库全书总目》举此条为全书「辩证考据，
  颇为精确」之代表。笔记体考据，引据为国史（已佚），定 B 级。
