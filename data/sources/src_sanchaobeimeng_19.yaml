id: src_sanchaobeimeng_19
title: 三朝北盟会编·卷十九（宣和六年金人贺正旦）
tier: B
juan: 卷十九
quote: 二十七日庚午，礼部员外郎王昂，充接伴大金国贺正旦人使。
url: https://zh.wikisource.org/zh-hans/三朝北盟會編/卷019
note: >-
  南宋·徐梦莘编，专录宋金交涉文献。此条系于宣和六年（1124）九月二十七日，是王昂
  接伴金使一事同时代的原始记载，可补今人标目之误漏两处：其一职衔作「礼部员外郎」
  （今人标目作祠部员外郎），其二月份在九月（今人标目作十月）。两说并存备考。
  其后以「不谨」停职一节，未见于此卷，待溯他书。
