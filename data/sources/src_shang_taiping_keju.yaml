id: src_shang_taiping_keju
title: 太平天国科举考试纪略
tier: B
juan: 「女状元傅善祥考伪」一节
quote: >-
  然遍考太平天国文献，实找不到天朝有开女科的制度。不知是由汪堃的《盾鼻随闻录》伪造于前，
  还是沈懋良的《江南春梦庵笔记》沿袭于后，竟编出一个女状元来。好事者又就此而伪造题目，
  伪造文章，五花八门，遂使人目眩惊奇，讶为千古未有的创举。
url: null
note: >-
  商衍鎏著，中华书局 1961 年版。作者为光绪三十年（1904）甲辰恩科探花，本站另立有其
  人物档案（shang_yanliu）。以末科进士的亲历身份反考太平天国科考，是本案最著名的辨伪之作；
  文中自述其论证系在罗尔纲 1951 年看法的基础上「再作进一步的分析」。
