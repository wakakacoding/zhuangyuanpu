# 张孝祥 B 级出处：绍兴二十四年殿试「宿酲未解、立就万言」细节
id: src_sichaojianwenlu_zhangxiaoxiang
title: 四朝见闻录（陆游）·张孝祥廷对条
tier: B
quote: >-
  高宗酷嗜翰墨。于湖张氏孝祥，廷对顷，宿酲犹未解，濡毫答圣问，立就万言，未尝加点。
  上讶一卷纸高轴大，试取阅之，读其卷首，大加称奖，而又字画遒劲，卓然颜鲁。
  上疑其为谪仙，亲擢首选。
url: null
note: >-
  宋·陆游撰（一说叶绍翁《四朝闻见录》同名异书，此条历代广泛征引，作者归属两说并存，
  待核原书定谳）。殿试「宿酲未解、立就万言」的著名细节出此。
  引文据杭州日报 2025-12-05《绍兴二十四年的那场科举》等今人转引转录，原书未核，待核。
  性质属笔记层，故不入 events 主干描述，仅作轶事与故事素材。
