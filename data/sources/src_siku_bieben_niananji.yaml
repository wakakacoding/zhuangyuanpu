id: src_siku_bieben_niananji
title: 四库全书总目·别本罗念庵集十三卷提要
tier: B
juan: 卷一百七十七·集部三十（别集类存目）
quote: >-
  別本羅念菴集十三卷（浙江汪汝瑮家藏本）明羅洪先撰。洪先有冬遊記，已著錄。是編為
  嘉靖癸亥其同年滁陽胡松所刻。凡書二卷，雜著一卷，序記、傳狀、銘、表各一卷，
  祭文及雜文二卷，古、律詩二卷，蓋初刊之本，非其全帙也。
url: null
note: >-
  清·纪昀等撰。本件记「别本」十三卷为嘉靖癸亥（四十二年，1563）其同年滁阳胡松所刻，
  是罗洪先别集的最初刊本（刻于其生前一年），并详列其分类卷数，可与卷一百七十二
  「念庵集二十二卷」条相参，见别集早晚两本的规模差异。另：《念庵集》提要两处称
  「洪先有《冬游记》已著录」，本件亦同——可据以确认《冬游记》确经四库著录
  （其本书卷次待核），本站 works 栏据此著录。
