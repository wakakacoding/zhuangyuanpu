id: src_siku_dongposhijizhu
title: 四库全书总目·东坡诗集注提要（旧题王十朋撰）
tier: B
juan: 集部·别集类（宋）；卷次待核
quote: >-
  臣等謹案《東坡詩集注》三十二卷，舊本題宋王十朋撰。十朋有《會稽三賦》，已著錄。
  是集前有趙夔序，稱分五十類。此本實止二十九類，蓋有所合併。十朋序題百家注，
  此本所引數亦不足……考十朋《梅溪前集》載序八篇，《後集》載序三篇，獨無此序。
  又有讀蘇文三則，亦無一字及蘇詩。《梅溪集》為其子聞詩聞禮所編，十朋著述蒐輯無遺，
  不應獨漏此序。又趙夔序稱「崇寧間，僕年志於學，逮今三十年……累與小坡叔黨遊從至熟，
  扣其所未知者，叔黨亦能為僕言之」云云。考《宋史》載：軾如杭州，蘇過年十九，
  其時在元祐五、六年間。又稱過歿時年五十二，則當在宣和五、六年。若從崇寧元年下推三十年，
  已為紹興元年，過之歿七、八年矣，夔安能見過而問之？則併夔序亦出依託。核書中體例，
  與杜詩千家注相同，殆必一時書肆所為，借十朋之名以行耳。
url: null
note: >-
  清·纪昀等撰。本件是「旧题王十朋《东坡诗集注》」一案的馆臣原考：以①《梅溪集》前后集
  载序十一篇而无此序、② 读苏文三则无一字及苏诗、③ 赵夔序所述游从年限与苏过卒年
  不合三条立论，判为「书肆所为，借十朋之名以行」。此考为后世聚讼之始，至今学界仍有异说，
  本站两说并存、不作定论：works 栏该条 status 记「伪托（旧题）」，并在轶事栏存其公案。
