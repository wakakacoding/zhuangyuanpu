id: src_siku_duishanji
title: 四库全书总目·对山集十卷提要
tier: B
juan: 卷一百七十一·集部二十四（别集类）
quote: >-
  《對山集》·十卷（湖北巡撫採進本）明康海撰。海有《武功縣誌》，已著錄。其詩文集自明以來
  凡四刻。一為張太微所選，一為王世懋所選，互有去取。國朝康熙中，其裏人馬氏始裒其全集
  刻之江寧。此本乃乾隆辛巳其裏人編修孫景烈以所藏張太微本又加刊削而刻之。海以救李夢陽故，
  失身劉瑾。瑾敗，坐廢。遂放浪自恣，徵歌選妓，於文章不復精思，詩尤頹縱。……
  明人論海集者是非不一，要以俞汝成「文過於詩」語為不易之評。其《擬廷臣論寧夏事狀》
  及《鑄錢論》諸篇，尤頗切時弊。崔銑、呂柟皆以司馬遷比之，誠為太過。然其逸氣往來，
  翛然自異，固在李夢陽等割剝秦漢者上也。
url: null
note: >-
  清·纪昀等撰。三点价值：① 《对山集》版本四刻源流（张太微选本、王世懋选本、康熙马氏
  江宁全集本、乾隆辛巳孙景烈削本）与四库所据之本；② 馆臣对康海诗文的评断——「要以
  俞汝成『文过于诗』一语为不易之评」，同时又承认其「逸气往来，翛然自异，固在李梦阳等
  割剥秦汉者上也」，为处理「前七子之一」这一文学定位的分寸依据；③ 「崔铣、吕柟皆以
  司马迁比之」一句，可与吕柟评康海「直节人也」（见 src_xianzhenglu_dongyizhuan）并观，
  见二人文谊。另：康海别有十九卷本《对山集》，《明史·艺文志》未著录，本站 works 栏
  并存两说。
