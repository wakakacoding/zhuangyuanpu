id: src_siku_hengpuji
title: 四库全书总目·横浦集提要
tier: B
juan: 卷一百五十八·集部十一（别集类十一）
quote: >-
  《橫浦集》·二十卷〈江蘇巡撫採進本〉宋張九成撰。九成有《孟子傳》，已著錄。是集乃其門人
  郎昱所編。凡賦詩四卷、雜文十六卷。九成少師楊時，於程門為再傳弟子。後從僧宗杲問道，
  其學乃全入於禪。朱子作《雜學辨》，所駁正者凡四家，九成實居其一。見於《語錄》者掊擊尤力。
  比其沒也，猶謂「可惜將了許多鶻兀道理到地下去」。蓋身後猶憾之不置。《宋史》本傳亦稱其早
  與學佛者游，故議論多偏。然其立身自有本末。其廷試對策，極陳恢復大計，規戒高宗安於和議之非。
  又指陳時弊，言皆痛切。於閹宦干政，尤反覆申明。其在當時，可稱讜論。劉安世喜言禪，蘇軾喜言禪，
  李綱亦喜言禪，言禪不可以立訓，要不以是掩其大節也。陸游《老學菴筆記》謂九成對策有「桂子飄香」語。
  李易安作「露花倒影柳三變，桂子飄香張九成」之句以嘲之。更掎摭瑣屑，不足為九成病矣。
  至洪邁《容齋隨筆》記洪皓沒後，道出南安，九成往祭。其文但稱年月官爵，而無詞。情旨倍覺哀愴，
  以為前人未有此格。然九成乃一時避禍，不敢措詞，非有意立異。
url: https://zh.wikisource.org/zh-hans/四庫全書總目提要/卷158
note: >-
  清·纪昀等撰。价值有三：① 著录《横浦集》二十卷之编者（门人郎昱／一作郎晔）与卷次结构
  （赋诗四卷、杂文十六卷）；② 记「九成少师杨时，于程门为再传弟子」「后从僧宗杲问道，其学乃全入于禅」
  ——为南宋道学谱系中其位置之定评；③ 保存陆游《老学庵笔记》「露花倒影柳三变，桂子飘香张九成」
  之嘲与洪迈《容斋随笔》「洪皓丧过南安，九成往祭，文但称年月官爵而无辞」二事，并加馆臣之辨
  （前事「不足为九成病」，后事「乃一时避祸，不敢措词」）——本批据此入轶事栏。
