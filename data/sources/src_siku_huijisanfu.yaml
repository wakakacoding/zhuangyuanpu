id: src_siku_huijisanfu
title: 四库全书总目·会稽三赋三卷提要
tier: B
juan: 卷七十·史部地理类
quote: >-
  《會稽三賦》·三卷（禮部尚書曹秀先家藏本）宋王十朋撰。十朋字龜齡，樂清人。
  紹興二十七年進士第一，官至龍圖閣學士，諡文忠。事跡具《宋史》本傳。所著有《梅溪集》。
  此賦三篇，又於集外別行。一曰《會稽風俗賦》，仿《三都賦》之體，歷敘其地山川、物產、
  人物、古跡；一曰《民事堂賦》，民事堂者，紹興中添差簽判廳之公堂也。元借寓小能仁寺，
  歲久圯廢，十朋始重建於車水坊；一曰《蓬萊閣賦》，其閣以元稹詩「謫居猶得住蓬萊」句得名。
  皆在會稽，故統名曰《會稽三賦》。初，嵊縣周世則嘗為注《會稽風俗賦》，郡人史鑄病其不詳，
  又為增注，並注後二賦。末有嘉定丁丑鑄自跋。
url: null
note: >-
  清·纪昀等撰。三点价值：① 记《会稽三赋》三篇之目与命名所由（会稽风俗赋、民事堂赋、
  蓬莱阁赋），并明「民事堂」为绍兴中添差签判厅之公堂、十朋始重建于车水坊——可与
  王十朋初授绍兴府签判之事互证；② 明言「绍兴二十七年进士第一」，是科年的一处馆臣表述；
  ③ **谥作「文忠」**，与《宋史》本传「谥曰忠文」互异。明代文献与后世祠名（泉州王忠文祠）
  皆作「忠文」，本站从《宋史》；此「文忠」当系传写偶倒，两说并存备考。
