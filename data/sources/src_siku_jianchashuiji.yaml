id: src_siku_jianchashuiji
title: 四库全书总目·煎茶水记提要
tier: B
juan: 卷一百十五
quote: >-
  煎茶水记一卷，唐张又新撰。又新字孔昭，深州陆泽人。元和九年进士第一。
  （案：本传但称元和中及进士高第，知为九年者据此书中所述，
  知为第一者，据元人所编氏族大全称其状元及第也。）
url: https://zh.wikisource.org/zh-hans/%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E7%B8%BD%E7%9B%AE%E6%8F%90%E8%A6%81/%E5%8D%B7115
note: >-
  提要自己写明：九年据《煎茶水记》自述，第一名据元人《氏族大全》，不是本传原文。
  引文据维基文库核读，2026-10-17。现代学术考证按 B。
