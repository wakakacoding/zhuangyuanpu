id: src_siku_jingye_zineipian
title: 四库全书总目·泾野子内篇提要
tier: B
juan: 卷九十三·子部三·儒家类
quote: >-
  《涇野子內篇》二十七卷〈陝西巡撫采進本〉。明呂柟撰。柟師事渭南薛敬之，其學以薛瑄為宗。
  是書乃其門人所編語錄。凡雲槐精舍語二卷，東林書屋語一卷，端溪問答一卷，解梁書院語、
  柳灣精舍語二卷，鷲峰東所語十二卷，太常南所附邵伯舟中語三卷，太學語二卷，春官外署語
  二卷，禮部北所語一卷。其子畇等類而刻之。柟為學在格物以窮理，先知而後行。……其踐履最為
  篤實。嘗斥王守仁言良知之非。
url: null
note: >-
  清·纪昀等撰。① 著录《泾野子内篇》二十七卷，并详列门人所编各卷名目（云槐精舍语、
  解梁书院语、鹫峰东所语等），可与《明史》本传所载仕履互为印证；② 馆臣评其学「不失
  河津之渊源」，指其源出薛瑄——即《明史》「接河东薛瑄之传」之说；③ 「尝斥王守仁言良知
  之非」，是其在阳明学、甘泉学之外独守程朱的第三证。《泾野集》三十六卷亦经四库著录，
  提要称其学「大旨不失醇正」。
