id: src_siku_meixiji
title: 四库全书总目·梅溪集五十四卷提要
tier: B
juan: 卷一百五十九·集部十二（别集类）
quote: >-
  《梅溪集》·五十四卷（兵部侍郎紀昀家藏本）宋王十朋撰。十朋有《會稽三賦》，已著錄。
  是集為正統五年溫州教授何㶇所校，知府劉謙刻之，黃淮為序。凡奏議五卷，而冠以廷試策。
  前集二十卷，後集二十九卷，而附以汪應辰所作墓志。後有紹熙壬子其子宣教郎聞禮跋，
  稱文集合前後並奏議五十四卷。……而《文獻通考》作《梅溪集》三十二卷，續集五卷，
  並載劉珙之序。今無此序，卷數更多寡不符。應辰墓志則稱《梅溪》前後集五十卷，
  與此本亦不相應。疑珙所序者初稿，應辰所志者晚年續增之稿，而此本則十朋沒後其子聞詩、
  聞禮所編次之定稿也。……十朋立朝剛直，為當代偉人。應辰稱其於文專尚理致，
  不為浮虛靡麗之詞。……今觀全集，淳淳穆穆，有元祐之遺風。
url: null
note: >-
  清·纪昀等撰。本件解决三件事：① 《梅溪集》由王十朋子闻诗、闻礼编次，正统五年（1440）
  温州教授何㶇校、知府刘谦刻、黄淮序，凡奏议五卷冠以廷试策，前集二十卷、后集二十九卷，
  附汪应辰所撰墓志；② 卷数三说（四库本五十四卷／《文献通考》三十二卷续集五卷／
  汪应辰墓志五十卷）之辨，馆臣疑为初稿、续增稿、定稿之别，本站并存；③ 馆臣引出
  「汪应辰所作墓志」，与站内关系边「汪应辰为王十朋作墓志铭」（CBDB）互为印证。
