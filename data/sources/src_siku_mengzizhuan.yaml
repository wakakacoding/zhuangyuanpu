id: src_siku_mengzizhuan
title: 四库全书总目·孟子传提要
tier: B
juan: 卷三十五·经部三十五（四书类一）
quote: >-
  《孟子傳》·二十九卷〈內府藏本〉宋張九成撰。九成字子韶，自號無垢居士。其先開封人，徙居錢塘。
  紹興二年進士第一人，授鎮東軍僉判，曆宗正少卿，兼侍講，權刑部侍郎。忤秦檜，誣以謗訕，
  謫居南安軍。檜死，起知溫州，匄祠歸。卒，贈太師崇國公，諡文忠。事蹟具《宋史》本傳。
  《宋史·藝文志》載九成《孟子拾遺》一卷，今附載《橫浦集》中。《文獻通考》載九成《孟子解》十四卷，
  朱彝尊《經義考》注雲「未見」。此本為南宋舊槧，實作「孟子傳」，不作「孟子解」。又《盡心篇》已佚，
  而《告子篇》以上已二十九卷，則亦不止十四卷，蓋《通考》傳寫誤也。九成之學出於楊時，又喜與僧宗杲遊，
  故不免雜於釋氏。所作《心傳》、《日新》二錄，大抵以禪機詁儒理。故朱子作《雜學辨》，頗議其非。
  惟注是書，則以當時馮休作《刪孟子》，李覯作《常語》，司馬光作《疑孟》，晁說之作《詆孟》，
  鄭厚叔作《藝圃折衷》，皆以排斥《孟子》為事，故特發明於義利經權之辨……又辨治法者多，辨心法者少，
  故其言亦切近事理，無由旁涉於空寂。在九成諸著作中，此為最醇。
url: https://zh.wikisource.org/w/index.php?title=四庫全書總目提要/卷035
note: >-
  清·纪昀等撰。价值有三：① 著录《孟子传》二十九卷（内府藏本），并辨《文献通考》「孟子解十四卷」
  系传写之误、今本《尽心篇》已佚；② 揭其撰此书之动机——因冯休《删孟子》、李觏《常语》、
  司马光《疑孟》等排斥孟子之作而「特发明于义利经权之辨」，为宋人孟学史上之重要一环；
  ③ 定评「在九成诸著作中，此为最醇」，与其《心传》《日新》二录之「以禅机诂儒理」相对，
  可考其学之两面。**卷次与 quote 已与《孟子传》四库本卷首提要互校一致。**
