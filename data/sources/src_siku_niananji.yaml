id: src_siku_niananji
title: 四库全书总目·念庵集二十二卷提要
tier: B
juan: 卷一百七十二·集部二十五（别集类）
quote: >-
  念菴集二十二卷（江西巡撫採進本）明羅洪先撰。洪先有冬遊記，已著錄。洪先不及見王守仁，
  而受學於其鄉人李中，中之學出於楊珠，故其說仍以良知為宗。後作守仁年譜，乃自稱曰門人，
  不免講學家門戶之習。其學惟靜觀本體，亦究不免於入禪。然人品高潔，嚴嵩欲薦之而不得，
  則可謂鳳翔千仭者矣。其集初刻於撫州，再刻於應天，最後諸門人編為此本，而門人胡序之，
  稱其學凡三變，文亦因之：初效李夢陽，既而厭之，乃從唐順之等相講磨，晚乃自行己意。
  其答友人書，取譬於水，謂古之人有能者，必其中有自得實見，斯道之流行無所不在，
  雖欲不為波濤湍瀾之致不可得。斯亦有見之言也。此本為雍正癸卯其六世孫繼洪等重刻。
url: null
note: >-
  清·纪昀等撰。三点价值：① 师承链条最清楚——「不及见王守仁，而受学于其乡人李中，
  中之学出于杨珠，故其说仍以良知为宗」，可与《明史》「师事同邑李中，传其学」互证，
  且据此纠正「阳明亲传弟子」的常见误解；② 「人品高洁，严嵩欲荐之而不得」，
  与《明儒学案》「三十七年严相嵩起唐顺之为兵部主事，次及先生。先生以毕志林壑报之」
  相合；③ 别集版本源流（初刻抚州、再刻应天、门人编定本、雍正癸卯六世孙继洪重刻）
  与「其学凡三变」的文学分期。
