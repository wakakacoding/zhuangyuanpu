id: src_siku_wangwenzheng_bilu
title: 四库全书总目·王文正笔录提要
tier: B
juan: 卷一百四十·子部五十·小说家类一
quote: >-
  《王文正筆錄》一卷〈江蘇巡撫采進本〉。宋王曾撰。曾字孝先，青州益都人。咸平五年鄉貢、
  試禮部、廷對皆第一。官至右僕射，兼門下侍郎平章事，集賢殿大學士。封沂國公。諡文正。
  事蹟具《宋史》本傳。此乃所記朝廷舊聞，凡三十餘條，皆太祖、太宗、真宗時事，其下及
  仁宗初者，僅一二條而已。曾練習掌故，所言多確鑿可據，故李燾作《通鑒長編》，往往全采
  其文。
url: null
note: >-
  清·纪昀等撰。提要明记「咸平五年乡贡、试礼部、廷对皆第一」——是「连中三元」的第三个
  文献依据（前二为《宋史》本传、《东轩笔录》引国史），且系年明确作「咸平五年」。
  馆臣对本书亦有指摘（王继忠一条纪年与褒贬有误），一并备考。
