id: src_siku_wugongxianzhi
title: 四库全书总目·武功县志三卷提要（附吕柟、何景明原序）
tier: B
juan: 史部十一·地理类三（都会郡县之属）
quote: >-
  臣等謹案《武功縣志》三卷，明康海撰。海字德涵，武功人，宏治壬戌進士第一，授翰林院修撰，
  以救李夢陽事，坐劉瑾黨削籍。……是志僅七篇，曰地理，曰建置，曰祠祀，曰田賦，曰官師，
  曰人物，曰選舉……王士禎謂其文簡事核，訓詞爾雅。石邦教稱其義昭勸鑒，尤嚴而公，
  鄉國之史莫良于此，非溢美也。志刻於正德己卯，萬曆間再經刊行，旋復散佚。乾隆二十六年，
  武功知縣瑪星阿得抄本于孫景烈，因為重刊。
  （原序·吕柟）是志也，撰之者吾友康子德涵，刻之者邑侯西蜀馮玉仲，則斯政教也為有歸矣。
  正德己卯冬十一月甲寅涇野吕柟書。
  （原序·何景明）正德十四年己卯冬十二月五日大復山人汝南何景明撰并書。
url: null
note: >-
  清·纪昀等撰（据文渊阁四库全书本卷首提要，后附吕柟、何景明原序）。列 B 级。三点价值：
  ① **吕柟序自称「吾友康子德涵」**，并为其志作序（正德己卯冬十一月），为两位状元交游
  之确证，可与站内关系边「吕柟为康海作墓表」（CBDB 机器边）及吕柟评康海「直节人也」
  并读；
  ② 志凡七篇、有明确分工（山川城郭古迹宅墓入地理，官署学校津梁市集入建置，户口物产附田赋，
  艺文用《吴郡志》例散附各条），是明代方志「削繁滥」的名例；
  ③ **刻于正德己卯（十四年，1519）**，为 events 中该著作条的系年依据，另有何景明序
  系于同年十二月。
