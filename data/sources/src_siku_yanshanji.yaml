# 黄裳主干出处：《四库全书总目·演山集提要》（维基文库演山集卷首核对，2026-10-25）
# 注意：北宋黄裳（字冕仲）宋史无传——四库提要明言「裳宋史無傳」，此为最高可得主干，定 B 级
id: src_siku_yanshanji
title: 四库全书总目·演山集提要
tier: B
juan: 别集类
quote: >-
  〈臣〉等謹案演山集六十卷宋黄裳撰裳字冕仲南平人元豐五年進士第一累官禮部尚書
  贈資政殿大學士諡忠文其集見於陳振孫書録解題者六十巻今此本巻目相符蓋猶宋時原本
  ……裳宋史無傳其行事頗見於他書福建通志稱政和宣和間三舍法行裳上書謂宜近不宜逺
  宜少不宜老宜富不宜貧不如遵祖宗科舉之制人以爲確論蓋亦伉直有守之士故其詩文俱
  骨力堅勁不爲委靡之音同時莊念祖述方外志乃謂裳爲紫㣲天官九真人之一因誤校籍墮
  人間云云説殊誕妄蓋以裳素喜道家元祕之書又自稱紫元翁徃徃愛作塵外語故從而附㑹
  之耳
url: https://zh.wikisource.org/wiki/演山集_(四庫全書本)/全覽1
note: >-
  清·纪昀等撰提要。黄裳（北宋，字冕仲）宋史无本传——提要明言「裳宋史無傳」，
  此为生卒以外生平之最高可得主干：字冕仲、南平人（南剑州，卡作剑浦县即州治，
  两说并注）、元丰五年（1082）进士第一、累官礼部尚书、赠资政殿大学士、谥忠文；
  政和宣和间三舍法行时上书斥其弊「宜近不宜远，宜少不宜老，宜富不宜贫，不如遵
  祖宗科举之制」，人以为确论。自称紫元翁。生卒 1044–1130 为通行说（提要未载，
  persons 注记备考）。quote 据维基文库卷首逐字核对（原文无标点，照录）。
