id: src_siku_yifengji
title: 四库全书总目·一峰集提要
tier: B
juan: 卷一百七十一·集部二十四（别集类二十四）
quote: >-
  《一峰集》·十卷〈浙江汪汝瑮家藏本〉明羅倫撰。倫字彝正，別號一峰，江西永豐人。成化丙戌進士第一，
  授修撰。釋褐甫三月，以疏劾大學士李賢，謫泉州市舶副提舉。明年詔還，復原官，改南京供職。
  尋以疾辭歸，退居金牛山，授徒講學以終。事蹟具《明史》本傳。倫與陳獻章稱石交，然獻章以超悟為宗，
  而倫篤守宋儒之途轍，所學則殊。《明儒學案》云：「倫剛介絕俗，生平不作合同之語，不為軟巽之行。
  凍餒幾於死亡，而無足以動其中，庶可謂之無欲。」今覽其文，剛毅之氣，形於楮墨。詩亦磊砢不凡，
  雖執義過堅，時或失於迂闊。又喜排疊先儒傳注成語，少淘汰之功，或失於繁冗。然亦多心得之言，
  非外強中乾者比也。後載《夢稿》二卷，記夢之詞至三百餘首，隱約幻渺，幾莫測其用意所在，
  亦文集中罕見之體。以其人足重，故得附本集以傳，今亦姑仍舊本錄之焉。
url: https://zh.wikisource.org/zh-hans/四庫全書總目提要/卷171
note: >-
  清·纪昀等撰。价值有四：① 著录《一峰集》十卷（浙江汪汝瑮家藏本）并附《梦稿》二卷之体例；
  ② 述其仕履次第最简赅（「释褐甫三月」上疏——与本传「逾二月」异说并存；「谪泉州市舶副提举」
  ——与本传「福建市舶司」为一事之两称）；③ 评骘其文「刚毅之气，形于楮墨」「多心得之言，
  非外强中乾者比」，并录《明儒学案》「刚介绝俗……庶可谓之无欲」之语；④ 记其与陈献章（白沙）
  「石交」而学途各别——「献章以超悟为宗，而伦笃守宋儒之途辙」，为明初朱、陈两系分野之要证。
