id: src_siku_yutangcongyu
title: 四库全书总目·玉堂丛语提要
tier: B
juan: 卷一百四十三·子部五十三（小说家类存目一）
quote: >-
  《玉堂叢語》·八卷〈江蘇巡撫採進本〉明焦竑撰。竑有《易筌》，已著錄。是編仿《世說》之體，
  採摭明初以來翰林諸臣遺言往行，分條臚載。凡五十有四類，而終以讎隙。案朱國楨《湧幢小品》曰：
  焦弱侯率直任真，元子初出閣，定講官六人。癸未則郭明龍，丙戌唐抑所、袁玉蟠、蕭元圃、全元洲，
  己丑則弱侯。太倉相公謂宜擇其近而易曉者勒一書進覽。無何，太倉去國，諸公不復措意。惟弱侯纂
  《養正圖說》一冊。郭聞之不平，曰當眾為之，奈何獨出一手？後其子攜歸，刻於南中，送之寓所。
  正在案璫，陳矩適至，取去數部呈御覽。諸老大恚，謂由他途進圖大拜。又載其序呂坤《閨範》，
  鄭國泰乞取添入后妃一門，眾大譁，謂鄭氏著書，弱侯交結作序云云。竑作是書，以讎隙終篇，
  蓋感此二事，藉以寓意。然陳矩為司禮太監，鄭國泰為貴妃之侄，何以二書適入二人之手，
  俱得進於宮禁？當時物議，實有其因，未可盡委之排擠也。
url: https://zh.wikisource.org/wiki/四庫全書總目提要/卷143
note: >-
  清·纪昀等撰。此提要引朱国桢《涌幢小品》为据，朱国桢与焦竑同时，所记属亲历者笔记，故本件列 B 级
  （书目本身为清人考据，引文来源为明人笔记）。价值有二：① 为《养正图说》进呈一事之唯一详载——
  本传仅记「同官郭正域辈恶其不相闻，目为贾誉，竑遂止」，此则详其独纂、刻于南中、经司礼监陈矩
  呈御览、诸老恚恨之始末，可补本传；② 记《闺范》序一案，为焦竑晚年物议之第二事，本传不载。
  案《涌幢小品》云「刻于南中」而本传云「拟进之……遂止」，两说于「是否入宫禁」上相异，本站并存备考
  （已入轶事栏）。馆臣断语「当时物议，实有其因，未可尽委之排挤也」为清人之见，亦并存。
