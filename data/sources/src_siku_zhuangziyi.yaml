id: src_siku_zhuangziyi
title: 四库全书总目·庄子翼提要
tier: B
juan: 子部道家类（卷次待核）
quote: >-
  《莊子翼》八卷、《莊子闕誤》一卷、《附錄》一卷〈安徽巡撫採進本〉明焦竑撰。是編成於萬厯戊子，
  體例與《老子翼》同。前列所載書目，自郭象注以下凡二十二家；旁引他說互相發明者，自支遁以下
  凡十六家；又章句音義，自郭象以下凡十一家。……蓋明人著書好誇博奧，一核其實，多屬子虛，
  萬厯以後風氣類然，固不足深詰也。……然明代自楊愼以後，博洽者無過於竑，其所引據究多古書，
  固較流俗注本爲有根柢矣。
url: null
note: >-
  清·纪昀等撰。此提要为「明代自杨慎以后，博洽者无过于焦竑」这一评价之**原始出处**，故取作其学术地位之据；
  同卷另有《老子翼》三卷、《老子考异》一卷提要，馆臣称其「竑之去取亦特精审」「竑于二氏之学本深于儒学，
  故其说儒理者多涉悠谬，说二氏之理者转具有别裁云」——可与《明史》「时颇以禅学讥之」互参，
  为焦竑「儒佛兼综」之学术面貌之两面。
  ⚠ 卷次与 quote 系据四库全书本《庄子翼》卷首提要原文（维基文库《四库全书总目提要》与《庄子翼》
  卷首所载互校）；**卷次数字本批未逐字复核**，故 `juan` 暂记类目待补。
