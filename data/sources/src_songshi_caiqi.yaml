# 蔡齐 A 级主干出处：《宋史》卷二百八十六·蔡齐传（维基文库核对，2026-10-25）
id: src_songshi_caiqi
title: 宋史·卷二百八十六·蔡齐传
tier: A
juan: 列传第四十五
quote: >-
  蔡齊，字子思，其先洛陽人也。曾祖綰，爲萊州膠水令，因家焉。齊少孤，依外家劉氏。
  舉進士第一。儀狀俊偉，舉止端重，真宗見之，顧宰相寇準曰：「得人矣。」詔金吾給
  七騶，傳呼以寵之。狀元給騶，自齊始也。……錢惟演守河陽，請曲賜鎮兵錢，章獻太后
  將許之。齊曰：「上新即位，惟演外戚，請偏賞以示私恩，不可許。」遂劾奏惟演。……
  太后大出金帛修景德寺，遣內侍羅崇勳主之，命齊爲文記之。崇勳陰使人誘齊曰：「趣爲
  記，當得參知政事矣。」齊久之不上，崇勳讒之，罷爲龍圖閣學士、知河南府。……太后
  崩，遺詔以楊太妃爲皇太后，同裁制軍國事。閣門趣百官賀，齊使台吏毋追班，乃入白
  執政曰：「上春秋富，習知天下情偽，今始親政事，豈宜使女后相踵稱制乎！」遂罷預政。
  ……有飛語傳荊王元儼爲天下兵馬都元帥者，捕得繫獄，連逮甚眾。帝怒，使齊按問之。
  齊曰：「此小人無知，不足治，且無以安荊王。」帝悟，遽釋之。……蜀大姓王齊雄坐
  殺人除名。齊雄，太后姻家，未更赦，復官。齊曰：「果如此，法撓矣！」明日，入奏事
  曰：「齊雄恃勢殺人，不死，又亟授以官，是以恩廢法也。」……帝勉從之，乃抵齊雄罪。
  ……郭皇后廢，將立富人陳氏女爲后，齊極論之。拜禮部侍郎、參知政事。……尋出知
  潁州，卒，年五十二，贈兵部尚書，諡曰文忠。潁人見其故吏朱采會喪，猶號泣思之。
  齊方重有風采，性謙退，不妄言。……丁謂秉政，欲齊附己，齊終不往。……所薦龐籍、
  楊偕、劉隨、段少連，後率爲名臣。
url: https://zh.wikisource.org/wiki/宋史/卷286
note: >-
  元·脱脱等修。本传为举进士第一（大中祥符八年 1015，本传未系年，科年第录口径）、
  「状元给驺自齐始」、拒罗崇勋诱记（不当参政交易）、谏止杨太妃同裁制军国、
  安荆王（不兴大狱）、抵王齐雄罪（以恩废法如朝廷何）、极论废后立陈氏女、
  荐庞籍诸名臣、卒年五十二谥文忠诸事之主干依据。享年五十二逆推生 988（卒 1039
  宝元元年），与卡一致。quote 据维基文库逐字核对（繁体原文照录），中略处以……标示。
