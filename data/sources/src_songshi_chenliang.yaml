id: src_songshi_chenliang
title: 宋史·卷四百三十六·陈亮传
tier: A
juan: 列传第一百九十五
quote: >-
  陳亮，字同父，婺州永康人。生而目光有芒，為人才氣超邁，喜談兵，論議風生，下筆數千言立就。
  嘗考古人用兵成敗之跡，著《酌古論》。郡守周葵得之，相與論難，奇之，曰：「他日國士也。」
  ……隆興初，與金人約和，天下忻然幸得蘇息，獨亮持不可。婺州方以解頭薦，因上《中興五論》，奏入，不報。
  ……淳熙五年，更名同，詣闕上書……孝宗赫然震動，欲榜朝堂以勵群臣……
  侍郎何澹嘗為考試官，黜亮，亮不平，語數侵澹。澹聞而銜之，即繳狀以聞。事下大理，笞掠亮無完膚，誣服為不軌。
  事聞，孝宗知為亮，嘗陰遣左右廉知其事。及奏入取旨，帝曰：「秀才醉後妄言，何罪之有！」劃其牘於地，亮遂得免。
  ……亮家僮殺人於境……其家疑事由亮……而屬臺官論亮情，重下大理。時丞相淮知帝欲生亮，而辛棄疾、羅點素高亮才，援之尤力，復得不死。
  ……鄉人會宴，末胡椒特置亮羹胾中，蓋村俚敬待異禮也。同坐者歸而暴死，疑食異味有毒，已入大理。
  會呂興、何念四毆呂天濟且死，恨曰：「陳上舍使殺我。」……少卿鄭汝諧閱其單辭，大異曰：
  「此天下奇材也。國家若無罪而殺士，上干天和，下傷國脈矣。」力言於光宗，遂得免。
  未幾，光宗策進士，問以禮樂刑政之要，亮以君道、師道對……時光宗不朝重華宮，群臣更進迭諫，皆不聽，
  得亮策，乃大喜，以為善處父子之間。奏名第三，御筆擢第一。既知為亮，則大喜曰：「朕擢果不謬。」
  孝宗在南內，寧宗在東宮，聞知皆喜，故賜第告詞曰：「爾蚤以藝文首賢能之書，旋以論奏動慈宸之聽。
  親閱大對，嘉其淵源，擢置舉首，殆天留以遺朕也。」授僉書建康府判官廳公事。未至官，一夕，卒。
  ……卒之後，吏部侍郎葉適請於朝，命補一子官，非故典也。端平初，諡文毅，更與一子官。
url: https://zh.wikisource.org/wiki/宋史/卷436
note: 元·脱脱等修。本传完整覆盖五上孝宗书、三次下狱、绍熙四年御笔擢第一诸事；生年不见明文（1143 据叶适墓志逆推/学界通说），卒年本传记「未至官一夕卒」，系年据李幼武《陈亮言行录》「次年卒，享年五十有五」。
