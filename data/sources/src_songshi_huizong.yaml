id: src_songshi_huizong
title: 宋史·徽宗本纪三
tier: A
juan: 卷二十一
quote: >-
  三月丙戌，诏监司、郡守自今须满三岁乃得代，仍毋得通理。癸巳，令嘉王楷赴廷对。……戊戌，
  御集英殿策进士。戊申，赐礼部奏名进士及第、出身七百八十三人。有司以嘉王楷第一，
  帝不欲楷先多士，遂以王昂为榜首。
url: https://zh.wikisource.org/wiki/宋史/卷021
note: >-
  元·脱脱等撰。此为「唱名第一而抑置第二」的本纪依据，全句系于重和元年三月。须留意纪年：
  是年三月年号仍作政和八年，十一月方改元重和，史家以年终年号系年，故与本传「政和八年」
  的记年并不冲突。由癸巳诏令赴廷对、戊戌御殿策进士、戊申放榜三个干支日，可知自诏令至
  放榜仅十五日，本科并无可考的乡试、省试次第。
