id: src_songshi_liang
title: 宋史·梁颢传（附梁固传）
tier: A
juan: 卷二百九十六·列传第五十五
quote: >-
  颢字太素，郓州须城人。……雍熙二年，复举进士，廷试，方禹中献赋。太宗召升殿，
  询其门第，赐甲科。……景德元年，权知开封。颢美风姿，强力少疾，闺门雍睦。
  与人交久而无改，士大夫多之。六月，暴病卒，年九十二。上甚轸恻，赐赠加等。
url: null
note: >-
  今本《宋史》卒年作「年九十二」，系版本讹文：中华书局点校本校勘记据《东都事略》
  卷四七本传（作「年四十二」）、洪迈《容斋四笔》卷一四、俞正燮《癸巳存稿》卷八
  《书宋史梁颢传后》，定「九」乃「四」字之误。史臣赞语「中途夭谢」「中道而摧」
  （见《容斋四笔》引国史）亦与九十二岁高龄不相容。本传附梁固传：「大中祥符元年，
  举服勤词学科，擢甲第」——与名录作大中祥符二年己酉科状元异，两说并存。
