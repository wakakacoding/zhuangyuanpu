# 李迪 A 级主干出处：《宋史》卷三百一十·李迪传（维基文库核对，2026-10-25）
id: src_songshi_lidi
title: 宋史·卷三百一十·李迪传
tier: A
juan: 列传第六十九
quote: >-
  李迪，字復古，其先趙郡人，後徙幽州。曾祖在欽，避五代亂，又徙家濮。迪深厚有器局，
  嘗攜其所爲文見柳開，開奇之曰：「公輔材也。」舉進士第一，授將作監丞，歷通判徐、兗州。
  ……他日，又召對龍圖閣，命迪草詔，徐謂迪曰：「曹瑋在秦州，屢請益兵，未及遣，遽辭州事，
  第怯耳。誰可代瑋者？」迪對曰：「瑋知唃廝囉欲入寇，且窺關中，故請益兵爲備，非怯也。
  且瑋有謀略，諸將皆非其比，何可代？……」帝因問關右兵幾何，對曰：「臣向在陝西，以方寸
  小冊書兵糧數備調發，今猶置佩囊中。」帝令自探取，目黃門取紙筆，具疏某處當留兵若干，
  餘悉赴塞下。帝顧曰：「真所謂頗、牧在禁中矣。」未久，唃廝囉果犯邊。……居數日，奏至，
  瑋與敵戰三都谷，果大勝。……初，上將立章獻后，迪屢上疏諫，以章獻起於寒微，不可母天下。
  章獻深銜之。天禧中，拜給事中、參知政事。周懷政之誅，帝怒甚，欲責及太子，群臣莫敢言。
  迪從容奏曰：「陛下有幾子？乃欲爲此計。」上大寤，由是獨誅懷政等。……（寇準罷，帝欲相迪，
  迪固辭。）一日，對滋福殿，有頃，皇太子出拜曰：「陛下用賓客爲宰相，敢以謝。」帝顧謂迪曰：
  「尚可辭邪！」拜吏部侍郎兼太子少傅、同中書門下平章事、景靈宮使、集賢殿大學士。初，
  真宗不豫，寇準議皇太子總軍國事，迪贊其策，丁謂以爲不便……迪憤然語同列曰：「迪起布衣
  至宰相，有以報國，死猶不恨，安能附權幸爲自安計邪！」自此不協。……謂敗，起爲祕書監、
  知舒州，歷江寧府、兗州、青州，復兵部侍郎、知河南府。……太后崩，召爲資政殿學士、判
  尚書都省。未幾，復拜同中書門下平章事、集賢殿大學士。……元昊攻延州，武事久弛，守將
  或爲他名以避兵。迪願守邊，詔不許，然甚壯其意。除彰信軍節度使、知天雄軍，徙青州。
  逾年，之本鎮。請老，以太子太傅致仕，歸濮州。後其子柬之爲侍御史知雜事，奉迪來京師。
  帝數遣使問勞，欲召見，以疾辭。薨，年七十七。贈司空、侍中，諡文定。帝篆其墓碑曰
  「遺直之碑」，又改所葬鄧侯鄉曰遺直鄉。
url: https://zh.wikisource.org/wiki/宋史/卷310
note: >-
  元·脱脱等修。本传为「举进士第一」（景德二年 1005）、料曹玮三都谷之胜（「頗、
  牧在禁中」）、谏立章献后、救太子（「陛下有幾子」）、拜相、与丁谓之争、
  再相、元昊攻延州请守边、享年七十七、谥文定、帝篆「遺直之碑」诸事之主干
  依据。享年七十七逆推生 971（卒 1047），与卡一致。quote 据维基文库逐字
  核对（繁体原文照录），中略处以……标示。
