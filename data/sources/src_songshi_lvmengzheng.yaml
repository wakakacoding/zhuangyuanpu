# 吕蒙正 A 级主干出处：《宋史》卷二百六十五·吕蒙正传（维基文库核对，2026-10-25）
id: src_songshi_lvmengzheng
title: 宋史·卷二百六十五·吕蒙正传
tier: A
juan: 列传第二十四
quote: >-
  呂蒙正，字聖功，河南人。祖夢奇，戶部侍郎。父龜圖，起居郎。蒙正，太平興國二年，
  擢進士第一，授將作監丞，通判昇州。……初，龜圖多內寵，與妻劉氏不睦，並蒙正出之，
  頗淪躓窘乏，劉誓不復嫁。及蒙正登仕，迎二親，同堂異室，奉養備至。……蒙正初入朝堂，
  有朝士指之曰：「此子亦參政耶？」蒙正陽爲不聞而過之，同列不能平，詰其姓名，
  蒙正遽止之曰：「若一知其姓名，則終身不能忘，不若毋知之爲愈也。」時皆服其量。
  ……先是，盧多遜爲相，其子雍起家即授水部員外郎，後遂以爲常。至是，蒙正奏曰：
  「臣忝甲科及第，釋褐止授九品京官。況天下才能，老於巖穴，不霑寸祿者多矣。今臣男
  始離襁褓，膺此寵命，恐罹陰譴，乞以臣釋褐時官補之。」自是宰相子止授九品京官，
  遂爲定制。朝士有藏古鏡者，自言能照二百里，欲獻之蒙正以求知。蒙正笑曰：「吾面
  不過楪子大，安用照二百里哉？」聞者歎服。……嘗燈夕設宴，蒙正侍，上語之曰：
  「……乃知理亂在人。」蒙正避席曰：「乘輿所在，士庶走集，故繁盛如此。臣嘗見都城外
  不數里，饑寒而死者甚眾，不必盡然。願陛下視近以及遠，蒼生之幸也。」上變色不言。
  蒙正侃然復位，同列多其直諒。上嘗欲遣人使朔方……三問，三以其人對。上曰：「卿何執
  耶？」蒙正曰：「臣非執，蓋陛下未諒爾。」固稱：「其人可使，餘人不及。臣不欲用媚道
  妄隨人主意，以害國事。」……上退謂左右曰：「蒙正氣量，我不如。」……咸平四年，
  以本官同平章事、昭文館大學士。國朝以來三入相者，惟趙普與蒙正焉。……上謂蒙正曰：
  「卿諸子孰可用？」對曰：「諸子皆不足用。有侄夷簡，任潁州推官，宰相才也。」夷簡
  由是見知於上。……許國之命甫下而卒，年六十八。贈中書令，諡曰文穆。
url: https://zh.wikisource.org/wiki/宋史/卷265
note: >-
  元·脱脱等修。本传为太平兴国二年（977）进士第一、幼年被逐窘乏（「不患无人知」
  的寒门背景）、不记朝士姓名之量、奏定宰相子止授九品京官之制、古镜「安用照
  二百里」、灯夕直谏「都城外不数里饥寒而死者甚众」、三问三对不媚、三入相
  （与赵普并列）、荐侄夷简、荐富弼（「勋业远过于吾」）、卒年六十八谥文穆诸事
  之主干依据。享年六十八逆推生 944（卒 1011 大中祥符四年），与卡一致。
  quote 据维基文库逐字核对（繁体原文照录），中略处以……标示。
