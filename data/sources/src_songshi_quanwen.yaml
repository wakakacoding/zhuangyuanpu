id: src_songshi_quanwen
title: 宋史全文
tier: B
juan: 卷二十五上（孝宗朝）
quote: >-
  辛酉，校书郎萧国梁论汉武帝承富庶之后而有虚耗之弊，盖用之者多，不止为征伐也。上曰：
  「不独汉武帝为然。自古人君当艰难之运，未有不节俭；当承平之后，未有不奢侈。朕他无所为，
  止得节俭。」又论盐铁、商车、缗钱等事皆取民无艺。上曰：「正不必如此。」又论今日坑冶
  不必搜、茶盐不必多为之法。上曰：「祖宗茶法已尽善，诚不必更变。」
url: https://zh.wikisource.org/zh-hans/宋史全文_(四库全书本)/卷25上
note: >-
  南宋后期编刊的编年体宋代史，孝宗朝部分多直录《中兴圣政》《日历》等官修史文，
  故列 B 级。此条系于乾道五年（1169）五月辛酉，是萧国梁现存最实在的一段政论记录；
  清·毕沅《续资治通鉴》卷一百四十一全录之。同期史臣留正为之作赞语，谓寿皇
  「闻萧国梁用财之说，反复论议，深惩汉武之失」。
