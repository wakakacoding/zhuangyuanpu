note: >-
  元·脱脱等修。本传为籍贯（安州安陆、后徙开封雍丘）、开封试礼部皆第一、
  改名公案（庠初名郊）、两度执政、包拯弹劾去位、封莒国公/郑国公、
  谥元献诸事之主干依据。生卒：本传不载生年，卒于治平年间（通行说 1066）；
  生年两说（索引 996 / CBDB 997），persons 注记备考。quote 据维基文库
  逐字核对（繁体原文照录），中略处以……标示。
