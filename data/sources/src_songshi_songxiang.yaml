# 宋庠 A 级主干出处：《宋史》卷二百八十四·宋庠传（维基文库核对，2026-10-25）
id: src_songshi_songxiang
title: 宋史·卷二百八十四·宋庠传
tier: A
juan: 列传第四十三
quote: >-
  宋庠，字公序，安州安陸人，後徙開封之雍丘。父杞，嘗為九江掾，與其妻鐘禱於廬阜。
  鐘夢道士授以書曰：「以遺爾子。」視之，《小戴禮》也，已而庠生。他日見許真君像，
  即夢中見者。庠天聖初舉進士，開封試、禮部皆第一，擢大理評事、同判襄州。……庠初名郊，
  李淑恐其先己，以奇中之，言曰：「宋，受命之號；郊，交也。合姓名言之為不祥。」
  帝弗為意，他日以諭之，因改名庠。寶元中，以右諫議大夫參知政事。庠為相儒雅，練習故事，
  自執政，遇事輒分別是非。……庠與宰相呂夷簡論數不同，凡庠與善者，夷簡皆指為朋黨，
  如鄭戩、葉清臣等悉出之，乃以庠知揚州。未幾，以資政殿學士徙鄆州，進給事中。
  參知政事范仲淹去位，帝問宰相章得象，誰可代仲淹者，得象薦宋祁。帝雅意在庠，
  復召為參知政事。慶歷七年春旱，用漢災異策免三公故事，罷宰相賈昌朝，輔臣皆削一官，
  以庠為右諫議大夫。……明年，除尚書工部侍郎，充樞密使。皇祐中，拜兵部侍郎、
  同中書門下平章事、集賢殿大學士。……三年，祁子與越國夫人曹氏客張彥方游。而彥方偽造敕牒，
  為人補官，論死。諫官包拯奏庠不戢子弟，又言庠在政府無所建明，庠亦請去。乃以刑部尚書、
  觀文殿大學士知河南府，後徙許州，又徙河陽，再遷兵部尚書。入覲，詔綴中書門下班，
  出入視其儀物。以檢校太尉、同平章事充樞密使，封莒國公。……既而與副使程戡不協，
  戡罷，而御史言庠昏惰，乃以河陽三城節度、同平章事判鄭州，徙相州。以疾召還。
  英宗即位，移鎮武寧軍，改封鄭國公。庠在相州，即上章請老，至是請猶未已。帝以大臣故，
  未忍遽從，乃出判亳州。庠前後所至，以慎靜為治，及再登用，遂沉浮自安。晚愛信幼子，
  多與小人游，不謹。御史呂晦請敕庠不得以二子隨，帝曰：「庠老矣，奈何不使其子從之。」
  至亳，請老益堅，以司空致仕。卒，贈太尉兼侍中，諡元獻。帝為篆其墓碑曰「忠規德范之碑」。
  庠自應舉時，與祁俱以文學名擅天下，儉約不好聲色，讀書至老不倦。善正訛謬，嘗校定《國語》，
  撰《補音》三卷。又輯《紀年通譜》，區別正閏，為十二卷。《掖垣叢志》三卷，《尊號錄》一卷，
  別集四十卷。天資忠厚，嘗曰：「逆詐恃明，殘人矜才，吾終身不為也。」……人以此益稱其長者。
