# 王拱辰 A 级主干出处：《宋史》卷三百一十八·王拱辰传（维基文库核对，2026-10-25）
id: src_songshi_wanggongchen
title: 宋史·卷三百一十八·王拱辰传
tier: A
juan: 列传第七十七
quote: >-
  王拱辰，字君貺，開封咸平人。元名拱壽，年十九，舉進士第一，仁宗賜以今名。通判懷州，
  入直集賢院，歷鹽鐵判官、修起居注、知制誥。慶曆元年，爲翰林學士。契丹使劉六符嘗謂
  賈昌朝曰：「塘濼何爲者？一葦可杭，投箠可平；不然，決其堤，十萬土囊，即可路矣。」
  仁宗以問拱辰，對曰：「兵事尚詭，彼誠有謀，不應以語我，此誇言爾。設險守國，先王不廢，
  而祖宗所以限敵人也。」至是，又使六符來，求關南十縣，斥太宗伐燕爲無名，舉朝莫知所答。
  拱辰曰：「王師征河東，契丹既通使，而寇石嶺關以援賊。太宗怒，遂回軍伐之，豈謂無名？」
  乃作報書曰：「既交石嶺之鋒，遂有薊門之役。」契丹得報，遂繼好如初。帝喜，謂輔臣曰：
  「非拱辰深練故實，殆難答也。」權知開封府，拜御史中丞。夏竦除樞密使，拱辰言：「竦
  經略西師，無功稱而歸。今置諸二府，何以厲世？」因對，極論之。帝未省，遽起，拱辰前
  引裾，乃納其說，竦遂罷。……蘇舜欽會賓客於進奏院，王益柔醉作《傲歌》，拱辰風其僚
  魚周詢、劉元瑜舉劾之。兩人既竄廢，同席者俱逐。時杜衍、范仲淹爲政，多所更張，拱辰
  之黨不便。舜欽、益柔皆仲淹所薦，而舜欽，衍婿也，故因是傾之，由此爲公議所薄。……
  至和三年，復拜三司使。聘契丹，見其主混同江，設宴垂釣，每得魚，必酌拱辰酒，親鼓琵琶
  以侑飲。謂其相曰：「此南朝少年狀元也，入翰林十五年，故吾厚待之。」使還，御史趙抃
  論其輒當非正之禮……神宗登極，恩當轉僕射，歐陽脩以爲此宰相官，不應序進，但遷太子
  少保。熙寧元年，復以北院使召還。王安石參知政事，惡其異己，乘二相有故，出爲應天府。
  ……三路籍民爲保甲，日聚而教之，禁令苛急，往往去爲盜，郡縣不敢以聞。拱辰抗言其害曰：
  「非止困其財力，奪其農時，是以法驅之，使陷於罪罟也。浸淫爲大盜，其兆已見。縱未能
  盡罷，願財損下戶以紓之。」主者指拱辰爲沮法，拱辰曰：「此老臣所以報國也。」上章不已。
  帝悟，於是第五等戶得免。哲宗立，徙節彰德，加檢校太師。是年薨，年七十四。贈開府儀同
  三司，諡懿恪。
url: https://zh.wikisource.org/wiki/宋史/卷318
note: >-
  元·脱脱等修。本传为年十九举进士第一（天圣八年 1030，仁宗赐名拱辰）、
  驳契丹刘六符塘泊之论、答关南十县国书、引裾谏罢夏竦、进奏院风波倾范杜、
  混同江契丹主亲鼓琵琶、争保甲之害（第五等户得免）、哲宗立是年薨年七十四、
  谥懿恪诸事之主干依据。享年七十四逆推生 1012（卒 1085），与卡一致。
  quote 据维基文库逐字核对（繁体原文照录），中略处以……标示。
