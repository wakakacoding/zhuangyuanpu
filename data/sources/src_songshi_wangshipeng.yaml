id: src_songshi_wangshipeng
title: 宋史·王十朋传
tier: A
juan: 卷三百八十七·列传第一百四十六
quote: >-
  王十朋，字龜齡，溫州樂清人。資穎悟，日誦數千言。及長，有文行，聚徒梅溪，受業者以百數。
  入太學，主司異其文。秦檜死，上親政，策士，諭考官曰：「對策中有陳朝政切直者，並置上列。」
  十朋以「權」為對……上嘉其經學淹通，議論醇正，遂擢為第一。學者爭傳誦其策，以擬古晁、董。
  授紹興府簽判。既至，或以書生易之，十朋裁決如神，吏奸不行。……除侍御史。……
  改除吏部侍郎，力辭，出知饒州。……凡歷四郡，布上恩，恤民隱……所至人繪而祠之。……
  疾革，累章告老，以龍圖閣學士致仕，命下而卒，年六十。紹熙三年，諡曰「忠文」。
  十朋事親孝，終喪不處內，友愛二弟，郊恩先奏其名，沒而二子猶布衣。書室扁曰「不欺」，
  每以諸葛亮、顏真卿、寇準、范仲淹、韓琦、唐介自比，朱熹、張栻雅敬之。
url: null
note: >-
  元·脱脱等撰，中华书局点校本。本传为本站王十朋条目的主干出处。三处须注意：
  ① 科年不见本传明文，仅作「秦桧死，上亲政，策士」——绍兴二十七年（1157）系年据汪应辰
  《墓志铭》「绍兴二十七年，策进士于廷」与《宋史》卷内诸事（符离师溃、乾道七年除太子詹事）
  互考；
  ② 「绍熙三年，谥曰忠文」一句，《宋史》四库全书本作「绍兴三年」——绍兴三年（1133）在王十朋
  生前，四库本显系传写之讹，本站从点校本作「绍熙三年」；
  ③ 本传不载生年与生卒月日：生年据卒「年六十」逆推，月日据今人年谱与温州方志，均非本传明文。
