id: src_songshi_wangzeng
title: 宋史·王曾传
tier: A
juan: 卷三百一十·列传第六十九
quote: >-
  王曾，字孝先，青州益都人。少孤，鞠於仲父宗元，從學於里人張震，善為文辭。咸平中，
  由鄉貢試禮部、廷對皆第一。楊億見其賦，歎曰：「王佐器也。」……及帝既受符命，大建玉清
  昭應宮，下莫敢言者，曾陳五害以諫。……帝崩，曾奉命入殿廬草遺詔：「以明肅皇后輔立皇
  太子，權聽斷軍國大事。」丁謂入，去「權」字。曾曰：「皇帝沖年，太后臨朝，斯已國家否運。
  稱『權』，猶足示後。且增減制書有法，表則之地，先欲亂之邪？」遂不敢去。……群臣議太后
  臨朝儀，曾請如東漢故事，太后坐帝右，垂簾奏事……曾曰：「兩宮異處，而柄歸宦官，禍端兆
  矣。」……寶元元年冬，大星晨墜其寢，左右驚告。曾曰：「後一月當知之。」如期而薨，年六十
  一。贈侍中，諡文正。……皇祐中，仁宗為篆其碑曰「旌賢之碑」，後又改其鄉曰旌賢鄉。大臣賜
  碑篆自曾始。仁宗既祔廟，詔擇將相配享，以曾為第一。曾無子，養子曰縡。又以弟子融之
  子繹為後，尚書兵部郎中、秘閣校理致仕，卒。
url: null
note: >-
  元·脱脱等撰，中华书局点校本。本传为本站王曾条目的主干出处：籍贯、三元、遗诏留
  「权」字、定两宫垂帘之仪、逐丁谓、罢相判郓州、卒年谥号、子嗣诸事皆本此。三处需注意：
  ① 科年仅作「咸平中」未系年；② 卒年作「六十一」，与《隆平集》「六十」异；③ 子嗣作
  「养子曰縡」「弟子融之子绎为后」，与《隆平集》「子纬」「以侄绎为后」用字不同。
  另：配享仁宗庙之议，《宋会要辑稿·礼》载英宗嘉祐八年十月王珪等奏，称其「忠允清亮，
  履德经哲，致位上宰，燮和大政」，可为配享事之官方档案佐证（辑本册页待核）。
