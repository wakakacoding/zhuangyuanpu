# 吴潜 A 级主干出处：《宋史》卷四百一十八·吴潜传（维基文库核对，2026-10-25）
id: src_songshi_wuqian
title: 宋史·卷四百一十八·吴潜传
tier: A
juan: 列传第一百七十七
quote: >-
  吳潛，字毅夫，宣州寧國人。祕閣修撰柔勝之季子。嘉定十年進士第一，授承事郎、
  簽鎮東軍節度判官。……紹定四年，遷尚右郎官。都城大火，潛上疏論致災之由：
  「願陛下齋戒修省，恐懼對越，菲衣惡食，必使國人信之，毋徒減膳而已。……以培
  國家一線之脈，以救生民一旦之命。庶幾天意可回，天災可息，弭災爲祥，易亂爲治。」
  ……又告執政，論用兵復河南不可輕易，以爲：「金人既滅，與北爲鄰，法當以和爲形，
  以守爲實，以戰爲應。……今日之事，豈容輕議。」自後，興師入洛，潰敗失亡不貲，
  潛之言率驗。……端平元年，詔求直言，潛所陳九事：「一曰顧天命以新立國之意……
  九曰盜賊當探禍端而圖長策。」……淳祐十一年，入爲參知政事，拜右丞相兼樞密使。
  ……又積錢百四十七萬三千八百有奇，代民輸帛，前後所蠲五百四十九萬一千七百有奇。
  ……拜特進、左丞相，進封慶國公。……改封許國公。大元兵渡江攻鄂州……潛奏：
  「今鄂渚被兵，湖南擾動，推原禍根，良由近年姦臣憸士設爲虛議，迷國誤軍……
  臣年將七十，捐軀致命，所不敢辭。」……屬將立度宗爲太子，潛密奏云：「臣無彌遠
  之材，忠王無陛下之福。」帝怒潛，卒以炎論劾落職。……謫建昌軍，尋徙潮州，責授
  化州團練使、循州安置。潛預知死日，語人曰：「吾將逝矣，夜必雷風大作。」已而
  果然，四鼓開霽，撰遺表，作詩頌，端坐而逝。時景定三年五月也。循人聞之，咨嗟
  悲慟。德祐元年，追復元官，仍還執政恩數。明年，以太府卿柳岳請，贈諡，特贈少師。
url: https://zh.wikisource.org/wiki/宋史/卷418
note: >-
  元·脱脱等修。本传为嘉定十年（1217）进士第一、绍定四年论火灾疏、谏用兵
  复河南（后验）、端平九事、淳祐十一年拜右丞相、代民输帛蠲免五百四十九万、
  开庆元年左丞相当鄂州之围、密奏「臣无弥远之材，忠王无陛下之福」忤帝、
  谪循州端坐而逝（景定三年 1262）、德祐追复赠少师诸事之主干依据。
  生卒 1196–1262 为通行说（本传不载生年，享年可考「臣年将七十」与卒年合），
  persons 注记备考。quote 据维基文库逐字核对（繁体原文照录），中略处以……标示。
