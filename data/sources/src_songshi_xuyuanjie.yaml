# 徐元杰 A 级主干出处：《宋史》卷四百二十四·徐元杰传（维基文库核对，2026-10-25）
id: src_songshi_xuyuanjie
title: 宋史·卷四百二十四·徐元杰传
tier: A
juan: 列传第一百八十三
quote: >-
  徐元傑，字仁伯，信州上饒人。幼穎悟，誦書日數千言，每冥思精索。聞陳文蔚講書鉛山，
  實朱熹門人，往師之。後師事真德秀。紹定五年，進士及第。簽書鎮東軍節判官廳公事。
  嘉熙二年，召爲祕書省正字，遷校書郎。奏否泰、剝復之理，因及右轄久虛，非骨鯁耆艾，
  身足負荷斯世者，不可輕畀。……淳祐元年，差知南劍州。會峽陽寇作，擒渠魁八人斬之，
  餘釋不問。父老或相語曰：「侯不來，我輩魚肉矣。」郡有延平書院，率郡博士會諸生親爲
  講說。……丞相史嵩之丁父憂，有詔起復，中外莫敢言，惟學校叩閽力爭。元傑時適輪對，言：
  「……陛下烏得而不悔悟，大臣烏得而不堅忍？臣懇懇納忠，何敢詆訐，特爲陛下愛惜民彝，
  爲大臣愛惜名節而已。」疏出，朝野傳誦，帝亦察其忠亮，每從容訪天下事，經筵益申前議。
  未幾，夜降御筆黜四不才臺諫，起復之命遂寢。元老舊德次第收召，元傑亦兼右司郎官，拜
  太常少卿，兼給事中、國子祭酒，權中書舍人。杜範入相，復延議軍國事。爲書無慮數十，
  所言皆朝廷大政，邊鄙遠慮。每裁書至宗社隱憂處，輒閣筆揮涕，書就隨削稿，雖子弟無有
  知者。六月朔，輪當侍立，以暴疾謁告。特拜工部侍郎，隨乞納，詔轉一官致仕。夜四鼓。
  遂卒。……訃聞，帝震悼曰：「徐元傑前日方侍立，不聞有疾，何死之遽耶？」……已而太學
  諸生伏闕訴其爲中毒，且曰：「昔小人有傾君子者，不過使之自死於蠻烟瘴雨之鄉，今蠻烟
  瘴雨不在領海，而在陛下之朝廷。望奮發睿斷，大明典刑。」於是三學諸生相繼叩閽訟冤，
  臺諫交疏論奏，監學官亦合辭聞於朝。……然獄迄無成，海內人士傷之，帝悼念不已，
  賜官田五百畝、緡錢五千給其家。賜謚「忠愍」。
url: https://zh.wikisource.org/wiki/宋史/卷424
note: >-
  元·脱脱等修。本传为师承（陈文蔚、真德秀）、绍定五年进士及第（卡 exam_year 1232
  即绍定五年，与传合）、知南剑州擒寇兴学、轮对攻史嵩之起复、淳祐五年暴疾卒、
  太学讼冤中毒案、赐谥忠愍诸事之主干依据。卒年淳祐五年（1245）与卡一致；
  生年 1193 为通行逆推（本传不载年数）。quote 据维基文库逐字核对
  （繁体原文照录，原文「元𤇍」为异体字，此处作「元傑」从通行），中略处以……标示。
