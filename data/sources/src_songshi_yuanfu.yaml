id: src_songshi_yuanfu
title: 宋史·卷四百五·袁甫传
tier: A
juan: 列传第一百六十四
quote: >-
  袁甫，字廣微，寶文閣直學士燮之子。……嘉定七年進士第一。簽書建康軍節度判官廳公事，
  授祕書省正字。……（知徽州）請蠲減婺源綢絹萬七千餘匹，茶租折帛錢萬五千餘貫，月樁錢六千餘貫……
  丁父憂，服除，知衢州。立旬講，務以理義淑士心，歲撥助養士千緡。郡有義莊，買良田二百畝益之。
  移提舉江東常平。適歲旱，亟發庫庾之積……前後持節江東五年，所活殆不可數計。
  ……遷祕書少監。……所至詣學宮講說，創書院貴溪之南，祠先儒陸九淵。
  ……權兵部尚書，暫兼吏部尚書。卒，贈通奉大夫，諡「正肅」。
  有《孝說》、《孟子解》、《後省封駁》、《信安志》、《江東荒政錄》、《防拓錄》、《樂事錄》及文集行世。
url: https://zh.wikisource.org/wiki/宋史/卷405
note: >-
  元·脱脱等修。本传记嘉定七年进士第一、历官、贵溪创书院祀陆九渊、谥正肃；
  未载生卒具体年份——卒「年六十七」出自弘治《徽州府志》卷四（转引自《全宋诗》小传），
  与嘉熙四年（1240）三月卒于任之记年吻合，逆推生 1174。本卡生卒两说之辨见轶事栏。
