id: src_songshi_zhangjiucheng
title: 宋史·张九成传
tier: A
juan: 卷三百七十四·列传第一百三十三
quote: >-
  張九成，字子韶，其先開封人，徙居錢塘。游京師，從楊時學。權貴託人致幣曰：「肯從吾游，
  當薦之館閣。」九成笑曰：「王良尚羞與嬖奚乘，吾可為貴游客耶？」
  紹興二年，上將策進士，詔考官，直言者置高等。……擢置首選。楊時遺九成書曰：「廷對自中興
  以來未之有，非剛大之氣，不為得喪回屈，不能為也。」
  授鎮東軍簽判，吏不能欺。民冒鹺禁，提刑張宗臣欲逮捕數十人，九成爭之。宗臣曰：「此事左相
  封來。」九成曰：「主上屢下恤刑之詔，公不體聖意而觀望宰相耶？」宗臣怒，九成即投檄歸。
  從學者日眾，出其門者多為聞人。
  趙鼎薦於朝，遂以太常博士召。既至，改著作佐郎，遷著作郎……除浙東提刑，力辭，乃與祠以歸。
  未幾，召除宗正少卿、權禮部侍郎兼侍講，兼權刑部侍郎。法寺以大辟成案上，九成閱始末得其情，
  因請覆實，囚果誣服者。朝論欲以平反為賞，九成曰：「職在詳刑，可邀賞乎？」辭之。
  金人議和，九成謂趙鼎曰：「金實厭兵，而張虛聲以撼中國。」……鼎既罷，秦檜誘之曰：
  「且成檜此事。」九成曰：「九成胡為異議，特不可輕易以苟安耳。」檜曰：「立朝須優游委曲。」
  九成曰：「未有枉己而能直人。」上問以和議，九成曰：「敵情多詐，不可不察。」
  因在經筵言西漢災異事，檜甚惡之，謫守邵州。……中丞何鑄言其矯偽欺俗，傾附趙鼎，落職。
  ……檜恐其議己，令司諫詹大方論其與宗杲謗訕朝政，謫居南安軍。在南安十四年，每執書就明，
  倚立庭磚，歲久雙趺隱然。廣帥致籯金，九成曰：「吾何敢苟取。」悉歸之。檜死，起知溫州。
  戶部遣吏督軍糧，民苦之，九成移書痛陳其弊，戶部持之，九成即丐祠歸。數月，病卒。
  九成研思經學，多有訓解，然早與學佛者游，故其議論多偏。寶慶初，特贈太師，封崇國公，
  諡「文忠」。
url: https://zh.wikisource.org/wiki/宋史/卷374
note: >-
  元·脱脱等撰，中华书局点校本。本传为本站张九成条目之主干出处，然有两处须他源补足：
  ① **本传不载生年与去世年岁**，仅作「数（月），病卒」——卒年与享年据《建炎以来系年要录》
  卷一百八十二「绍兴二十九年……卒，年六十八」与《宋元学案·横浦学案》「二十九年六月四日，
  卒，年六十八」补，据此逆推生年 1092；
  ② **籍贯**：本传作「其先开封人，徙居钱塘」——《宋元学案》直作「钱塘人」，CBDB 亦作「钱塘」，
  本站取「钱塘」为本贯，开封为祖源、另存「盐官」一说（详见交付报告 §3.1）。
  另本传「早与学佛者游，故其议论多偏」为《宋史》对其学术之定评，可与朱子《杂学辨》、
  全祖望案语互参。
