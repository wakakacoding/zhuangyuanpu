# 张孝祥 A 级主干出处：《宋史》卷三百八十九·张孝祥传
id: src_songshi_zhangxiaoxiang
title: 宋史·卷三百八十九·张孝祥传
tier: A
juan: 列传第一百四十八
quote: >-
  张孝祥，字安国，历阳乌江人。读书过一目不忘，下笔顷刻数千言。年十六，领乡书，再举冠里选。
  绍兴二十四年，廷试第一。考官已定埙冠多士，孝祥次之。高宗读埙策皆秦桧语，于是擢孝祥第一，
  而埙第三。谕宰相曰：「张孝祥词翰俱美。」上之抑埙而擢孝祥也，秦桧已怒，既知孝祥乃祁之子，
  祁与胡寅厚，桧素憾寅。于是风言者诬祁有反谋，系诏狱。会桧死，魏良臣密奏散狱释罪，
  遂以孝祥为秘书省正字。……寻除知抚州。年未三十，莅事精确，老于州县者所不及。
  孝宗即位，知平江府。事繁剧，孝祥剖决，庭无滞讼。属邑大姓为奸利，孝祥捕治，籍其家得谷粟数万。
  明年，吴中大饥，迄赖以济。张浚自蜀还朝，荐孝祥，召赴行在。……会金再犯边，
  孝祥陈金之势不过欲要盟。宣谕使劾孝祥落职，罢。复集英殿修撰、知静江府，治有声绩，复以言者罢。
  俄起知潭州，为政简易，时以威济之，湖南遂以无事。复待制，徙荆湖北路安抚使。筑寸金堤，
  自是荆州无水患，置万盈仓以储诸漕之运。进显谟阁直学士致仕。请祠，以疾卒，年三十八。
  孝宗惜之，有用才不尽之叹。孝祥俊逸，文章过人，尤工翰墨，尝亲书奏札，高宗见之，曰：「必将名世。」
url: https://zh.wikisource.org/wiki/宋史/卷389
note: >-
  元·脱脱等修。本传为生卒、夺魁、系狱、历官之主干依据：绍兴二十四年（1154）廷试第一
  （高宗抑秦埙而擢之）；卒「年三十八」，乾道五年（1169）致仕归、中暑卒于芜湖（据《鄞县志》
  卷二十八「归次芜湖，中暑卒」），逆推生年 1132。本传未载上书为岳飞辩冤事，
  该事据《四朝见闻录》等笔记层材料，入轶事栏并注明性质。
