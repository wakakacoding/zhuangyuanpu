id: src_songshi_zhaokai
title: 宋史·宗室传三（郓王楷）
tier: A
juan: 卷二百四十六（列传第五·宗室三）
quote: >-
  郓王楷，帝第三子。初名焕。始封魏国公，进高密郡王、嘉王，历奉宁、镇安、镇东、武宁、
  保平、荆南、宁江、剑南西川、镇南、河东、宁海十一节度使。政和八年，廷策进士，唱名第一。
  母王妃方有宠，遂超拜太傅，改王郓，仍提举皇城司。……北伐之役，且将以为元帅，会白沟
  失利而止。钦宗立，改镇凤翔、彰德军。靖康初，与诸王皆北迁。
url: https://zh.wikisource.org/wiki/宋史/卷246
note: >-
  本传直书「唱名第一」，抑置第二之事则见《徽宗本纪》，二处合观方得本科名次之全貌。
  传中「北伐之役，且将以为元帅」指宣和年间联金攻辽之役，白沟失利后其议遂寝。
  又，徽宗三十一子之序，本传作「长钦宗，次衮王柽，次郓王楷」，次兄柽早薨，
  故赵楷在存活诸子中序次居前。
