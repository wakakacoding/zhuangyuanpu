id: src_songyuanxuean_hengpu
title: 宋元学案·横浦学案（黄氏原本、全氏修定）
tier: B
juan: 卷四十
quote: >-
  祖望謹案：龜山弟子以風節光顯者，無如橫浦，而駁學亦以橫浦為最。晦翁斥其書，比之洪水猛獸
  之災，其可畏哉！然橫浦之羽翼聖門者，正未可泯也。述《橫浦學案》。
  文忠張橫浦先生九成　張九成，字子韶，錢塘人。從學龜山。紹興二年廷對第一，僉判鎮東軍。
  與監司不合，投檄而歸，學士大夫簦笈雲集，多執贄門下。入為太常博士，改著作郎，除宗正少卿、
  禮部侍郎兼侍講經筵。論災異迕時相秦檜，謫守邵州。何鑄劾以依附趙公鼎，落職。……終父喪，
  取旨，與宮觀。詹大方論其與僧杲謗訕朝政，謫南安軍。檜死，起知溫州。戶部遣吏督軍糧，
  先生遺書痛陳其弊，戶部持之，即丐祠歸。先生在謫居十四年，解釋經義，目病，就明簷下，
  磚痕雙趺隱然。廣帥致籯金，先生曰：「吾雖遷徙困乏，何敢苟取！」卒不受。自號橫浦居士，
  亦稱無垢居士。二十九年六月四日，卒，年六十八。寶慶初，贈太師，封崇國公，謚文忠。
  （雲濠案：先生著有《尚書》《大學》《中庸》《孝經》《論語》《孟子說》、《無垢錄》、
  《橫浦心傳》。攷《四庫書目》採錄《孟子傳》二十九卷，《橫浦集》二十卷。）
url: https://m.guoxuedashi.com/a/2886y/132509c.html
note: >-
  明末清初黄宗羲原本、其子黄百家纂辑、清全祖望修定。价值有四：① **籍贯直作「钱塘人」**
  （与《宋史》「其先开封人，徙居钱塘」互证，为本站定本贯钱塘之第二源）；
  ② **卒日与享年**「二十九年六月四日，卒，年六十八」，较《宋史》本传为详，且与《要录》卷一百八十二
  互证；③ 全祖望案语「龟山弟子以风节光显者，无如横浦，而驳学亦以横浦为最」及其与朱熹
  《杂学辨》之对立，为南宋道学内部张九成定位之要据；④ 云濠案列其经学著作目，并可考《四库》所采两种。
  另：「先生尝谓高宗曰：『外议以臣为赵鼎之党，虽臣亦疑之。』帝问其故，曰：『臣每造鼎，
  见其议论无滞，不觉坐久，则人言无足怪也。』」一则可补本传「倾附赵鼎」之辩。
