id: src_taiping_yeshi
title: 太平天国野史
tier: C
juan: null
quote: >-
  太平朝既开科举，复举行考试女子之典，正主试为洪宣娇……题为「唯女子与小人为难养也」
  全章，应试者二百余人。金陵傅槐女善祥所作，独力辟难养之说，引古来贤女内助之功，
  卷荐后为天王所激赏，拔置第一，饰以花冠锦服，鼓吹游街三日，闾阎群呼为女状元。
url: null
note: >-
  民国间通俗史书。传说的第三次加详：考官（洪宣娇、张婉如、王自珍）、试题、应试人数、
  衣锦游街三日，皆自此书添出。商衍鎏《女状元傅善祥考伪》指其三处硬伤：太平天国只有
  杨宣娇而无洪宣娇；「主」字为太平天国避讳字，不能用作官名「主试」；《论语》为太平
  天国禁书，不会出作试题。
