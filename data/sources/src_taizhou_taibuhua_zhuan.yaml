id: src_taizhou_taibuhua_zhuan
title: 台州市委党史研究室·泰不华条（今人整理，据《元史》本传）
tier: B
juan: null
quote: >-
  泰不华（1304—1352），字兼善，初名达普化，元文宗赐今名。幼时家贫好学，
  被周仁荣收养教育，师从乐清李孝光。17 岁江浙乡试第一。至治元年（1321）对策大廷，
  赐进士及第。……大臣燕铁木儿、伯颜皆列土封王，不华联合大臣上章谏止。
  太后欲加杀害，不华对众人道：「此事是我发之，甘受诛戮，决不敢累诸公。」
  太后解怒说：「风宪有臣如此，岂不能守祖宗之法乎？」赐金币，表彰直言。
  ……至正十二年三月，发兵扼守黄岩澄江，被方国珍水军包围，于王林洋临阵中槊死。
  追赠荣禄大夫、江浙行省平章政事，封魏国公，谥忠介。
url: null
note: >-
  台州市委党史研究室官网人物条，内容与《元史》卷一百四十三本传逐段对应
  （元史 A 级本传已见 src_yuanshi_taibuhua）。本条用于「此事是我发之，甘受诛戮」
  直言掌故——其文出《元史》本传，此为今人移录，册页待核，列 B 级。
