id: src_tangcai_zhuanjiao_zhangyouxin
title: 中国文学家大辞典·唐五代卷·张又新条（吴汝煜撰）
tier: B
juan: null
quote: >-
  张又新（生卒年不详），字孔昭，深州陆泽人。工部侍郎张荐子。初为京兆解头，
  元和九年进士及第为状头，十二年举博学宏词科为敕头，时号「张三头」。
  ……长庆中，以凶险敢言，为宰相李逢吉所重用，合谋排挤朝士之不附李逢吉者。
  ……与李续之、刘栖楚等人朋党相结，时号「八关十六子」。……性嗜茶，
  曾尝天下煎茶之水，品第其名次，凡二十等，作《煎茶水记》以记之。
url: null
note: >-
  傅璇琮主编《中国文学家大辞典·唐五代卷》张又新条（吴汝煜撰），据两《唐书》本传、
  《唐诗纪事》《唐才子传校笺》综撰。「张三头」（京兆解头、进士状头、宏词敕头）
  之号出唐末五代王定保《唐摭言》，为本站「唐代三元」叙事的谱系本源。
  「八关十六子」见《旧唐书·裴度传》：「李逢吉之党李仲言、张又新、李续等，
  内结中官，外扇朝士，立朋党以沮度，时号『八关十六子』。」
