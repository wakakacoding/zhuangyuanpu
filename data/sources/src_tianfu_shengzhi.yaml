id: src_tianfu_shengzhi
title: 天父圣旨
tier: A
juan: null
quote: >-
  天父又召内簿书伏善详宣降圣旨，命书曰：「千古英雄不得除，流传全仗笥中书。」
url: null
note: >-
  太平天国官方印书（天父下凡圣旨的记录），此条系于甲寅四年（1854）正月二十七日。
  文中「伏善详」即傅善祥，职衔为东王府内簿书；同日至二更天父再下凡，召女师、女丞相
  宣谕「四书十三经……凡有合于正道忠孝者留之」，是针对焚禁古书之议的干预。
  参王庆成编注《天父天兄圣旨》（辽宁人民出版社 1986 年版，第 101–103 页）。
  异文备考：他处引作「伏善祥」，本录作「详」，音近传写之异。
