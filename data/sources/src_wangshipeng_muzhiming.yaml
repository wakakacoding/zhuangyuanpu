id: src_wangshipeng_muzhiming
title: 有宋龙图阁学士王公墓志铭（汪应辰撰）
tier: B
juan: 见《文定集》卷二十三；又附《梅溪集》后集卷二十九
quote: >-
  公諱十朋，字龜齡，姓王氏，溫州樂清人。曾祖信，祖格，父輔，父以公貴，贈左朝散郎，
  母萬氏，贈碩人。其先自錢塘徙，至朝散，公始業儒有聲。……紹興二十七年，策進士於廷，
  詔對策中有指陳時事、鯁亮切直者，並置上列……既而考官以公所對進，上臨定其文，
  以為經學淹通，議論純正，可第一。及唱名，則公也，士論翕然稱愜。……授左承事郎、
  僉書建康軍節度判官廳公事。又詔：王某係朕親擢第一人，欲試以民事……可特添差紹興府僉判。
  ……隆興元年四月，除起居舍人，改兼侍講。……越月，除侍御史。……乾道元年七月，
  移知夔州，尋除敷文閣待制。三年七月，移知湖州。未幾，得請，提舉江州太平興國宮。
  才數月，起知泉州，進直學士，又移知台州。公以病力辭，且乞致仕，乃復提舉太平興國宮。
  七年三月，除太子詹事。詔旨敦趣，公力疾造朝。……公三上章乞致仕，乃詔以龍圖閣學士致仕。
  命下而公薨矣，實七月丙子也。享年六十。……以十有二月丙午，葬公于縣之左原白巖。
  碩人賈氏，有賢行，先公二年卒，至是合祔焉。男三人：聞詩、聞禮，皆太學生。孟丙蚤卒。
  ……公有梅溪前後集五十卷，尚書、春秋、論語、孟子講義，皆指授學者，未成書也。
url: null
note: >-
  南宋汪应辰撰（署「端明殿学士、左朝议大夫、提举江州太平兴国宫、封饶郡开国侯」），
  张栻书，朱熹题盖；全文见《文定集》卷二十三，并附《梅溪集》后集卷二十九。属墓志类
  当事人同时代材料，列 B 级。本件是本站王十朋条目的第二主干，价值有四：
  ① 科年、殿试经过（「上临定其文」）与初授两诏（先授签书建康军节度判官厅公事，再特添差
  绍兴府签判）独详于此；
  ② 仕履全序列（校书郎、建王府小学教授、著作佐郎、大宗正丞、主管台州崇道观、知严州、
  司封员外郎兼国史院编修官、国子司业、起居舍人兼侍讲、侍御史、集英殿修撰知饶州、
  乾道元年七月移夔州、三年七月移湖州、起知泉州、移知台州）系年，为 events 的主要骨架；
  ③ 卒日「七月丙子」、享年六十、葬地左原白岩、与贾氏合祔，为卒葬两事的直接依据；
  ④ 「其先自钱塘徙」一句，说明乐清王氏的族源，与籍贯「温州乐清」不冲突。
  又：本件自述「梅溪前后集五十卷」，与四库本《梅溪集》五十四卷、诸家著录三十二卷并异，
  卷数三说见 src_siku_meixiji。
