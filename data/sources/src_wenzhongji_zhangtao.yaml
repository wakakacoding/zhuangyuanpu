id: src_wenzhongji_zhangtao
title: 文忠集·张忠定公焘神道碑
tier: B
juan: 卷六十四
quote: >-
  政和八年廷试，问五运六气。公对数千言，极论阴阳消长、天人精祲与夫财成辅相之道。
  天子嘉之，亲擢第三，授文林郎、辟雍学录。
url: https://zh.wikisource.org/wiki/文忠集_(周必大,_四庫全書本)/卷064
note: >-
  南宋·周必大撰。张焘为政和八年进士第三（探花）。碑传明记「亲擢第三」，与《宋史·
  徽宗本纪》所载王昂为榜首、赵楷被抑置第二相印证，可复原本科三鼎甲之序：
  王昂、赵楷、张焘。
