id: src_wenzhouzhi_wangshipeng
title: 温州市志·王十朋条（附《荆钗记》传说）
tier: C
juan: 温州市志（1998）人物卷，页 582
quote: >-
  相传史浩门客撰作《荆钗记》以诬十朋；清王应奎《柳南续笔》据传奇提及十朋「读书江心寺」、
  「书券舍土」、「钱玉莲投江自尽」；学者以为「诞谬不经」，盖王十朋中状元时已 46 岁，
  生有闻诗、闻礼二子，均已长大；妻贾氏出身乐清望族，司理贾如规侄女，先王氏卒于泉州。
url: null
note: >-
  现代方志叙述（温州图书馆「瓯越记忆·温州历史名人」栏转录，引自《温州市志》1998 年版
  第 582 页），属二手标目、原始出处待溯，列 C 级。本件仅用于轶事栏：记南戏《荆钗记》
  借王十朋、钱玉莲之名敷演一事，以及方志整理者对「门客撰剧以诬十朋」之说的反驳
  （以十朋夺魁之年已四十六、二子已长、妻贾氏为乐清望族三项为据）。不用作任何史实字段的依据。
