id: src_wuchuan_renwu_lin
title: 吴川市人民政府门户网站·林召棠（人物志）
tier: C
juan: null
quote: >-
  林召棠（1786~1872年）字爱封，号芾南，谥文恭，吴川吴阳霞街村人。
  嘉庆八年（1803年），17岁中秀才，学使姚文田称赞为「海滨俊才」。
  二十一年（1816年），应顺天乡试中举人。道光三年（1823年），状元及第。
  授职翰林院修撰，充任国史馆纂修官。五年（1825年），父丧返家丁忧。
  七年（1827年）就聘高州府高文书院主讲。十一年（1831年）被任命为陕甘正主考官。
  （道光十三年）受聘肇庆府端溪书院主讲，连续15年。
  道光十九年（1839年），林则徐来粤查禁鸦片，与召棠书信来往……并赠召棠一联：
  「綵衣荣似三公衮，珂第祥留五色云。」
  著作有《心亭亭居诗存》《文存》和《笔记》等。
url: https://www.gdwc.gov.cn/bmzz/wcsrmzfw/zjwc/wcmp/lsmr/content/post_373595.html
note: >-
  政府网站人物介绍页，内容与光绪《吴川县志》传同源（方志系统），但未标卷页、
  属二手标目转述，故列 C 级；关键史实（科年、及第、授修撰、陕甘主考、端溪十五年）
  已由 B 级县志影印条 src_wuchuan_xianzhi_lin 覆盖。本条用于年份细节（1786/1872、
  1825 丁忧、1827 高文书院、1839 林则徐赠联）与生卒的交叉旁证。核读于 2026-10-24。
