id: src_wuchuan_xianzhi_lin
title: 光绪吴川县志·林召棠传
tier: B
juan: 卷十·列传（影印本卷次待核）
quote: >-
  （传文影印本可辨者）年十八應童（試），學使姚文田……稱「海濱俊才」。
  （嘉慶）二十一年應順天鄉試中舉。道光三年癸未成進士，……一甲第一名及第，授翰林院修撰。
  （道光十一年）充陝甘鄉試正考官。……主講端溪（書院）十有五年。
  （同治）年五十九丁內艱……卒年凡八十（七）。所著有心亭亭居（詩存、文存、筆記）。
url: https://www.gdwc.gov.cn/bmzz/wcsrmzfw/zjwc/wcmp/lsmr/content/post_373595.html
note: >-
  影印传文见「方志广东」《状元林召棠：不拘一格选育人才》文末所附《广东历代方志集成》
  吴川县志书影，2026-10-24 核读；文字为残漫 OCR 释读，标点与括注为整理者所加。
  原书为光绪《吴川县志》（光绪二十三年校订重印本），属地方志，列 B 级。
  本站释读以吴川市政府「林召棠」人物志页为旁证（同源方志系统）。卷页俟核纸书后补。
