id: src_xianyangzhi_kanghai
title: 咸阳市地方志·康海条（附《平生忧国志 何惜酒中过》）
tier: B
juan: null
quote: >-
  康海(1475~1540) 字德涵，号对山，别号浒西山人、沜东渔父、太白山人。西安府武功县
  (今武功县西北武功镇)浒西庄人。……弘治十五年(1502)复参与会试，顺利通过殿试对策称旨，
  登进士第一。为翰林院修撰兼经筵讲官，参与修编宪宗、孝宗两朝实录。……武宗正德三年(1508)，
  李梦阳被权宦刘瑾下狱，为救文友，遂往见敬而远之的刘瑾，不日梦阳获释。正德五年(1510)八月，
  刘瑾事发，康海受株连，被削职为民。……嘉靖十九年(1540)十二月十四日去世，享年66岁。
  殁时，遗命以山人巾服成殓。检其遗资，「借金百余」，而大小鼓却存有300多副。
  ……所著《武功县志》，明清数百年推为第一。……其散曲有《沜东乐府》二卷……初刊本为
  嘉靖三年(1524)从弟康浩所刻，卷首有康海自序，后有康浩跋。此书收录小令230首，套数32套。
  ……《中山狼传》杂剧……取材于马中锡《中山狼传》小说……《王兰卿贞烈传》杂剧原题作
  《张于鹏为养仕青州，晁阳春嫁女辞烟花》，正名作《富家郎设计探姻亲，王兰卿服信明贞烈》。
url: null
note: >-
  现代方志叙述（咸阳市地方志办公室网站两篇：《康海》与《平生忧国志 何惜酒中过》），
  属地方志整理成果，列 B 级。用途限于补《明史》所无者：① 籍贯细化（西安府武功县浒西庄，
  今武功镇）；② 罢官后三十年行迹与散曲、杂剧著录（《沜东乐府》二卷嘉靖三年从弟康浩刻，
  收小令 230 首、套数 32 套；《中山狼传》《王兰卿贞烈传》两种杂剧，后者正名全称）；
  ③ 卒葬情节（遗命以山人巾服成殓，遗资「借金百余」而存大小鼓三百余副）。
  其「享年 66 岁」与《献征录》行状合、与无名氏传「年六十四」不合，三说并列见
  src_xianzhenglu_kanghai。本条不作史实字段的唯一依据。
