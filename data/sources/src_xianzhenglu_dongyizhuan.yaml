id: src_xianzhenglu_dongyizhuan
title: 国朝献征录·董大理怡传文末论引吕柟、马理语（黄佐）
tier: B
juan: 卷六十八（大理寺·少卿）
quote: >-
  予在史館閱□□見謝給諫彈事，會呂涇野至，問對山何如人，曰：直節人也，致孝於親，
  且篤交誼，嘗拯空同於死獄，然性度高邁，偘偘面斥人短，坐是致怨。比在留都，
  晤馬谿田，為余言：空同下獄時，瑾欲殺之，急乃書片紙出曰「對山救我」。家人往告康，
  康即上馬馳至瑾門，閽不為通，呼曰：我天下魁人也，汝公乃我鄉里。瑾素聞康名，
  冀一見不可得，聞之即攝衣迎康。康遽上坐，瑾留飲。康談笑睨瑾曰：自古三秦豪傑有幾？
  ……瑾謝曰：敬聞命矣。明日即敬出之。其後空同反嫉害對山，知者至為《中山狼》傳刺空同，
  然對山未嘗仇空同也。
url: null
note: >-
  明·黄佐撰《董大理怡传》（董怡字世良，上海人，嘉靖丁亥八月九日卒，年七十四），
  文末论中追述吕柟（泾野）、马理（谿田）之语。列 B 级。本件于本站的价值有三：
  ① **吕柟评康海**「直节人也，致孝于亲，且笃交谊，尝拯空同于死狱」——吕柟与康海
  同为陕西人、并称关中二状元，此为两人交谊的直接文献（另有吕柟为《武功县志》作序，
  见 src_siku_wugongxianzhi）；
  ② **马理所述康海见刘瑾救李梦阳的全过程**（阍人不为通，「我天下魁人也」之呼，
  瑾摄衣出迎，以「三秦豪杰」之说讽瑾而瑾竟释梦阳），细节远详于《明史》一句带过者；
  ③ 「其后空同反嫉害对山，知者至为《中山狼》传刺空同」——是「《中山狼》讥李梦阳」
  之说在明代文献中最早的记述之一，本站据此入轶事栏（C 级）并注明明清聚讼。
