id: src_xianzhenglu_kanghai
title: 国朝献征录·翰林院修撰康公海行状（张治道）及康公海传
tier: B
juan: 卷二十一（翰林院·修撰）
quote: >-
  （行状）嘉靖庚子十二月十四日前翰林院修撰對山康先生卒。……其先河南固始人……以詩經中
  弘治戊午鄉試，壬戌進士第一，除翰林院修撰。是時孝宗皇帝拔奇掄才，右文興治，
  厭一時為文之陋，思得為才雅士，見先生策，謂輔臣曰：我明百五十年無此文体，
  是可以變今追古矣。遂列置第一，而天下傳誦則效，文体為之一變。……在史館三年，
  凡論著必宗經而子史……後瑾敗，忌者謂海交瑾，故失財而復獲，遂罷其官而禁錮海。
  ……距生成化乙未六月二十日，享年六十有六。
  （传）康海字德涵，武功人……弘治戊午舉於鄉，壬戌狀元及第。……年六十四而卒。
  所著有武功志及張氏族譜、對（山）文集。
url: null
note: >-
  明·焦竑辑，卷二十一收张治道《翰林院修撰康公海行状》与无名氏《翰林院修撰康公海传》
  两篇，本件合录其要（原文「对□文集」缺字，据康海号对山补）。属行状、传记类
  当事人同时代材料，列 B 级。三点须注意：
  ① **享年三说**：行状作「六十有六」，无名氏传作「年六十四」，陕西方志又作「六十五」。
  本站从行状：其明记生于成化乙未（十一年）六月二十日、卒于嘉靖庚子（十九年）十二月十四日，
  虚岁正合六十六；且《康公海传》「薄而不」下疑有脱字，其「六十四」未必可据。三说并存备考。
  ② **公历跨年**：嘉靖十九年十二月十四日已入公历 1541 年 1 月，故后世有作「卒于 1541 年」者；
  本站仍系于嘉靖十九年（1540）。
  ③ 行状所记孝宗对康海殿试之策的评语，是「文体为之一变」一说的原始出处；
  「在史馆三年」与「遭内艰而归」（居丧期间在顺德遇盗失财，遂成忌者口实）为《明史》所无。
