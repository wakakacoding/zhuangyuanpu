id: src_xianzhenglu_lvnan
title: 国朝献征录·泾野吕公柟行状（马汝骥撰）
tier: B
juan: 卷三十七
quote: >-
  歷官翰林院修撰、解州判官、南京吏部考功郎中、南京尚寶司卿、南京太常寺少卿、國子監祭酒、
  南京禮部右侍郎。
url: null
note: >-
  明·焦竑辑《国朝献征录》。所收马汝骥《南京礼部右侍郎泾野吕公柟行状》为当事人同时代之
  传记材料。本件据通行转录录入（原始册页待核），核心价值在于仕履全序列：其中「南京太常寺
  少卿」为太常/太仆之辨的第三证，与《明儒学案》一致而异于《明史》本传。同书另收马理
  《南京礼部右侍郎泾野吕先生墓志铭》，可互参。
