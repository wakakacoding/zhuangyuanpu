# 《新唐书·王维传》—— 补两《唐书》本传另一半：太乐丞与济州司仓参军
id: src_xin_tangshu_wang
title: 新唐书·王维传（文艺传中）
tier: A
juan: 卷二百二
quote: >-
  王维，字摩诘。九岁知属辞，与弟缙齐名，资孝友。开元初，擢进士，调太乐丞，
  坐累为济州司仓参军。张九龄执政，擢右拾遗。历监察御史。母丧，毁几不生。
  服除，累迁给事中。……下迁太子中允。久之，迁中庶子，三迁尚书右丞。
url: null
note: >-
  《旧唐书》本传止记「历右拾遗、监察御史、左补阙、库部郎中」，不载初授与贬谪；
  太乐丞、济州司仓参军、右拾遗三事唯见《新唐书》，故两传并引以补全仕履链。
  《旧唐书》记「乾元二年七月卒」，《新唐书》作「上元初卒，年六十一」，
  卒年两说并存（本站从《旧唐书》系公元 761）。
