# 李春芳 B 级出处：兴化地方志与「状元宰相」乡里叙事（元霄灯联传说层）
id: src_xinghua_lichunfang
title: 兴化县志与乡里叙事合条（李春芳）
tier: B
quote: null
url: null
note: >-
  兴化地方文献系统：①「状元宰相」之誉与「李府」第宅为兴化县志与乡邦文献
  常设条目（未核原刻，待补卷次页码）；②《西游记》作者托名说——
  今存明刊本《西游记》题「华阳洞天主人校」，华阳洞在句容茅山，
  李春芳少时曾读书茅山华阳洞，故有「校者即李春芳」之说（清人已发端，
  鲁迅《中国小说史略》持保留）。两事均属乡邦叙事层，列 B/C 之间，从 B
  以为掌故，作者公案不强断。
