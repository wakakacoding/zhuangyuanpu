# 姚勉 B 级出处：《雪坡舍人集》五十卷本体与四库提要评语
id: src_xuepoji_yaomian
title: 雪坡舍人集·文及翁序与四库总目评语合条（姚勉）
tier: B
quote: >-
  观其所上封事、奏札以及廷对诸篇，论时政之谬、辨宰相之奸，皆侃侃而不阿。
url: null
note: >-
  合条出处：①《雪坡舍人集》五十卷（侄姚龙起编，文及翁序；今存影宋抄本、
  四库全书本、豫章丛书本）；②《四库全书总目》卷一百六十四评语（quote 即出此，
  据宜丰县政府人物页转引，原提要未核，待补全条）；③文及翁「愤世嫉邪，
  排奸指佞，磊磊落落」评语。三项互证立说。
