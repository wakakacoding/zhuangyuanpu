id: src_yeshi_daguan_qindashi
title: 清朝野史大观·清人逸事·秦大士
tier: C
juan: 卷六
quote: >-
  秦殿撰大士在朝时，一日上偶问曰：「汝家果秦桧后人乎？」秦无他言，但对曰：
  「一朝天子一朝臣。」
url: null
note: >-
  民国·佚名辑，1915 年出版。乾隆问秦大士是否秦桧后人之掌故的本源记载。
  野史笔记，采信须慎：秦大士是否确为秦桧直系后裔，正史无文——野史一派记为
  秦桧兄秦梓之后；2000 年代南京江宁洪幕山（秦桧家族墓葬区内）发现秦大士墓碑，
  考古意见倾向其为秦桧一系之后。诸说并存，本站不独断。
