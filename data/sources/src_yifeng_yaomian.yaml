# 姚勉 B/C 级出处：宜丰县政府人物页与《新昌县志》《盐乘》系统（姚勉）
id: src_yifeng_yaomian
title: 宜丰县政府《姚勉》条与地方志叙事合条
tier: B
quote: null
url: https://www.jxyf.gov.cn/yfxrmzf/rwls/pc/content/2016230884965662720/content_2016230884965662720.html
note: >-
  合条出处：①宜丰县人民政府官网人物页（今人汇编，生于 1216、卒于 1262、
  「初生时曾被弃之山野雪地，故成年后自号雪坡以志不忘」等）；②《新昌县志》
  「少颖悟，日诵数千言，居常作文有魁天下之志」（转引）；③胡思敬《盐乘》
  廷对「言朝政纲领，惟在用人、听言，兼及守帅数易之弊。群小闻者侧目」（转引）。
  ②③为清代方志，①为今人汇编，综合定 B；「弃之雪地」传说无原始文献，
  只入轶事栏并标传说性质。
