# 张孝祥 B 级出处：墓志与卒地细节（归次芜湖，中暑卒）
id: src_yinxianzhi_zhangxiaoxiang
title: 鄞县志·卷二十八·张孝祥条
tier: B
quote: >-
  孝祥文章政事，皆过人远甚。在建康留守席上赋《六州歌头》一阕，感激淋漓，主人为之罢席。
  尤工翰墨，其作字多得古人用笔意。尝亲书奏札，高宗见之曰：必将名世。其卒年三十八，
  孝宗惜之，有用才不尽之叹。……请祠，进显谟阁直学士致仕。归次芜湖，中暑卒。
url: null
note: >-
  清代县志（民国重刊本）。补正史所无之两点：卒地为「归次芜湖」（中暑卒），
  六州歌头创作情境与卒年三十八并入本传。生于鄞县桃源乡（今宁波海曙横街）之说
  亦以鄞县志系统为主，本传只书历阳乌江——籍贯两说处置见 persons 注释。
  引文据识典古籍《鄞县志》卷二十八页面转录，未核原刻本，待核。
