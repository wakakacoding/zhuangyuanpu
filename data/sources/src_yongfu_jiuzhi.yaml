id: src_yongfu_jiuzhi
title: 永福旧志
tier: B
juan: null
quote: >-
  陈山：南离县四十里。山如龙形，龙屿十八溪之水出焉，宋状元萧国梁居此。／宋侍讲萧公
  国梁宅在十二都陈山，故址犹存。／其东门外翀峰，乃读书处也。／宋侍讲萧公国梁墓在
  龙溪县东厢，新亭道左。／东状元坊：在县治东，为宋乾道二年状元之萧国梁立。
url: null
note: >-
  福建永福县（今永泰）旧志，今据今人辑录转引，原刻本卷次待补，故列 B 级并注明转引。
  同书另载其职「太子侍讲兼礼部郎官」，及乾道二年榜「萧国梁，第一人」。其故居、读书处、
  墓与状元坊四条，是本站系年与地理取材的唯一方志依据。
