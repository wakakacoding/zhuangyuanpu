id: src_zhidian_niujizhi_bang
title: 识典古籍·咸淳四年庚辰陈文龙榜附案（清人方志考据）
tier: B
juan: null
quote: >-
  元至正十四年甲午，牛继志榜。……但考是年进士右榜蒙古色目人状元乃薛朝晤，
  左榜汉人、南人状元系牛继志。且终元之世，左榜状元十六人，见于帝纪、选举志
  及科目附录诸篇，可复按也。
url: https://www.shidianguji.com/mid-page/7522222458959609906
note: >-
  清人方志考据（识典古籍收录），辨万历志误以钱用壬为甲午状元之案，
  顺带确证至正十四年科「右榜薛朝晤、左榜牛继志」的左右榜分立。
  《元史》顺帝纪本只书「赐薛朝晤、牛继志进士及第」不标榜次，
  左右榜之判定即赖此类考据。
