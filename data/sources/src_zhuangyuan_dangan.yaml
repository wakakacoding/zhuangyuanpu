  王昂：生卒年 1090~1132；字 叔兴；籍贯（古称）江都；籍贯（今称）江苏江都县；
  及第时间 宋徽宗政和八年（1118）；科别 戊戌科；名次 进士第一人；授官 提举江州太平观；
