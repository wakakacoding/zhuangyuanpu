# 毕沅著作（R4-T1 批次 5，2026-10-25）
person_id: bi_yuan
works:
- title: 续资治通鉴
  type: 编年史
  status: 存世
  note: 二百二十卷，上承《资治通鉴》记宋辽金元史事。毕沅领衔，实多出幕客 （邵晋涵、章学诚等先后与力）之手，清人续《通鉴》诸本中最称善本。 成书细节为通行学术叙述（本传不载），待核原序跋。
- title: 经训堂丛书
  type: 丛书
  status: 存世
  note: 毕沅自刻丛书，汇刻经史小学及金石诸种，以其堂名「经训堂」名之。 清代私家刻书的代表之一（今人书目通行著录）。
- title: 关中金石记
  type: 金石
  status: 存世
  note: 抚陕期间收碑碣储学宫的学术结晶，著录关中金石并加考订， 与本传「收碑碣储学宫」事相表里。
- title: 中州金石记
  type: 金石
  status: 存世
  note: 任河南巡抚间所成，与《关中金石记》体例相续。两金石记为清代 地域金石学开创性著作（著录见今人书目）。
- title: 灵岩山人诗文集
  type: 别集
  status: 存世
  note: 毕沅自著诗文集，以其号灵岩山人称（persons 卡 hao 字段已录）。 卷帙与版本待核。
- title: 释名疏证（毕沅校释）
  type: 小学
  status: 存世
  note: 汉刘熙《释名》之毕沅校释本，经训堂刊。清代训诂学要籍 （通行著录；成于幕客与力之说亦有，待核）。
