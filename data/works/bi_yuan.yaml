# 毕沅著作（R4-T1 批次 5，2026-10-25）
person_id: bi_yuan
works:
- title: 续资治通鉴
  type: 编年史
  status: 存世
  note: 幕客参与确证（2026-10-25 已核）：乾隆三十七年（1772）始，历二十年，乾隆五十七年（1792）成书二百二十卷，乾隆六十年苏州开雕。邵晋涵覆审（贡献最大）、孙星衍、洪亮吉、钱坫佐毕公分筹；钱大昕覆勘增补考异；章学诚商定义例（未被采纳）。张之洞评「有此续通鉴，皆可废」。
- title: 经训堂丛书
  type: 丛书
  status: 存世
  note: 毕沅自刻丛书，汇刻经史小学及金石诸种，以其堂名「经训堂」名之。 清代私家刻书的代表之一（今人书目通行著录）。
- title: 关中金石记
  type: 金石
  status: 存世
  note: 抚陕期间收碑碣储学宫的学术结晶，著录关中金石并加考订， 与本传「收碑碣储学宫」事相表里。
- title: 中州金石记
  type: 金石
  status: 存世
  note: 任河南巡抚间所成，与《关中金石记》体例相续。两金石记为清代 地域金石学开创性著作（著录见今人书目）。
- title: 灵岩山人诗文集
  type: 别集
  status: 存世
  note: 通行著录《灵岩山人诗集》（毕沅自订，幕客所助诸著之一，今人书目通行）。卷帙待查原书（中国国家图书馆等有藏），版本详情仍待核。
- title: 释名疏证（毕沅校释）
  type: 小学
  status: 存世
  note: 汉刘熙《释名》之毕沅校释本，经训堂刊。清代训诂学要籍 （通行著录；成于幕客与力之说亦有，待核）。
