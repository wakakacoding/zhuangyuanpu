person_id: chen_liang
works:
  - title: 龙川集
    type: 别集
    status: 存世
    note: >-
      陈亮文集，以其号龙川名集。今通行本为中华书局 1987 年《陈亮集》（增订本，邓广铭点校）。
      集内含上孝宗四书、《中兴五论》及与朱熹论义利王霸往复书信。
  - title: 酌古论
    type: 学术
    status: 存世
    note: >-
      考古人用兵成败之迹而成，本传：「嘗考古人用兵成敗之跡，著《酌古論》。」
      郡守周葵得之曰「他日國士也」。收入《龙川集》。
  - title: 中兴五论
    type: 奏议
    status: 存世
    note: >-
      隆兴初与金约和，亮独持不可，因上《中兴五论》，「奏入，不報」。
      南宋主战派政论代表作，收入《龙川集》。
