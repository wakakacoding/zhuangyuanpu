# 方逢辰著作（R4-T1 批次 4，2026-10-24）
person_id: fang_feng_chen
works:
  - title: 蛟峰先生文集
    type: 别集
    status: 存世
    note: >-
      作品多散佚，五世从孙方渊辑为八卷，七世孙方中续辑外集四卷；
      明天顺七年方中刻本（藏国家图书馆）、文渊阁四库全书本并行。
      其诗以天顺本为底本入《全宋诗》。
