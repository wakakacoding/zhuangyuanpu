# 顾鼎臣著作（R4-T1 批次 5，2026-10-25）
person_id: gu_ding_chen
works:
- title: 未斋集
  type: 别集
  status: 存世（四库存目）
  note: 二十二卷（《四库全书总目》别集类存目，卷176，浙江巡抚采进本，2026-10-25 已核原条）。《明史·艺文志》载鼎臣集二十四卷，今存二本：其孙晋璠等辑《顾文康集》（文稿六诗六续稿六，较史志少六卷），本集多三集四卷亦止二十二卷——或集本残缺或史文偶误，提要称莫之详矣。提要并记步虚词七章、享庙捧主之争与谏筑昆山城事。
- title: 步虚词（七章）
  type: 词章
  status: 存文（见本传著录）
  note: 嘉靖中进于内殿斋醮的七首步虚词，「帝优诏褒答」——非独立传世著作， 系「青词结主知」之始的标志性文本，本传明文著录。
- title: （传）昆山筑城之议
  type: 政议
  status: 存事（非著作）
  note: 「昆山无城，言于当事为筑城」，及东南赋役失均之屡陈——非著述， 录于 works 以存其经世之业，不计入确定著作。
