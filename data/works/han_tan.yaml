# 韩菼著作（R4-T1 批次 6，2026-10-25）
person_id: han_tan
works:
- title: 有怀堂诗文稿
  type: 别集
  status: 存世
  note: 二十八卷（《四库全书总目》别集类存目，卷183，内府藏本，2026-10-25 已核原条）——菼所自编：诗六卷（分蹢躅、归愚、病坊、击迷四集）、文二十二卷；《清史稿·艺文志》同。康熙四十二年（1702）有怀堂精写刻本传世（诗稿文稿前皆有韩菼手书上板自序）。
- title: 孝经衍义（专任纂修）
  type: 御纂经解
  status: 存世
  note: 康熙二十一年（1682）成书进呈，康熙三十年（1691）颁于各省（2026-10-25 已核）。凡例目录一卷、《经旨总要》二卷、《衍义》一百卷；顺治命纂未成，康熙命叶方蔼、张英、韩菼等主持纂修，韩菼接管后组织儒臣通力合作完成。
- title: 大清一统志（总裁）
  type: 官修总志
  status: 存世（乾隆后续修）
  note: 本传明文：三十四年「召至京，命以原官总裁一统志」。康熙朝首修《大清 一统志》的总裁官（韩菼卒后历三朝始成，今本为乾隆续修）。
- title: 制义（时文）选本诸刻
  type: 制义
  status: 存世（选本流传）
  note: 「特工制举文」，康熙间制义风气的开创者（乾隆谕语），坊刻选本极多， 具体书目待考，录为著作类型存档。
