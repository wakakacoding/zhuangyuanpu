# 韩菼著作（R4-T1 批次 6，2026-10-25）
person_id: han_tan
works:
- title: 有怀堂诗文稿
  type: 别集
  status: 存世
  note: 韩菼诗文集（卷帙与版本待核，今人著录通行）。乾隆谕奖其「所撰制义， 清真雅正，开风气之先，为艺林楷则」。
- title: 孝经衍义（专任纂修）
  type: 御纂经解
  status: 存世
  note: 本传明文：初世祖命纂孝经衍义未成，「至是以菼专任纂修」。康熙朝御纂 经学工程，韩菼专任其事（成书卷帙待核）。
- title: 大清一统志（总裁）
  type: 官修总志
  status: 存世（乾隆后续修）
  note: 本传明文：三十四年「召至京，命以原官总裁一统志」。康熙朝首修《大清 一统志》的总裁官（韩菼卒后历三朝始成，今本为乾隆续修）。
- title: 制义（时文）选本诸刻
  type: 制义
  status: 存世（选本流传）
  note: 「特工制举文」，康熙间制义风气的开创者（乾隆谕语），坊刻选本极多， 具体书目待考，录为著作类型存档。
