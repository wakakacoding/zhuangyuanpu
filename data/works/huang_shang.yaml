# 黄裳著作（R4-T1 批次 7，2026-10-25）
person_id: huang_shang
works:
- title: 演山集
  type: 别集
  status: 存世（宋刊原帙，四库著录）
  note: 六十卷，见陈振孙《直斋书录解题》卷数相符，「盖犹宋时原本」。乾道初 季子黄玠裒辑、廖挺订误刻于建昌军学，王悦序称其「渊源六经，议论一出于正」。 四库馆臣评「其诗文俱骨力坚劲，不为委靡之音」。国史经籍志作兼山集
    四十卷，提要断为焦竑传录之讹。
- title: 词（减字木兰花诸阕）
  type: 词
  status: 存世（附集中）
  note: 黄裳词存于《演山集》，宋人词选亦收（具体存词数量待核）。 自称紫元翁，「往往爱作尘外语」，词风近道家气。
