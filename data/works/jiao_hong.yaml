person_id: jiao_hong
works:
  - title: 国朝献征录
    type: 史料汇编
    status: 存世
    note: >-
      一百二十卷，一称《献征录》。《明儒学案》记：「史事中止，私成《献征录》百二十卷。」
      采摭明初以来名臣行状、碑传、志状、家传之属，分门类编次，为明代人物文献之总汇，
      后世稽考明人行事多取资于此。今有影印本行世。
  - title: 玉堂丛语
    type: 笔记
    status: 存世
    note: >-
      八卷。仿《世说新语》之体，采摭明初以来翰林诸臣遗言往行，分五十四类，而终以「雠隙」。
      《四库全书总目》卷一百四十三子部小说家类存目著录（江苏巡抚采进本），馆臣谓其所以以
      雠隙终篇，乃感《养正图说》进呈与《闺范》序二事而借以寓意（详见轶事栏）。
  - title: 焦氏笔乘
    type: 学术笔记
    status: 存世
    note: >-
      正集八卷、续集八卷（一称正续集十四卷）。读书札记，考订经史、辨正文字、杂记见闻，
      为晚明博洽之学之代表。其考据名物、纠驳旧说处，清人亦多采之。
  - title: 澹园集、澹园续集
    type: 别集
    status: 存世
    note: >-
      集名《澹园》，为焦竑自号（《明史》本传作「淡园」，通假）。本传称其「善为古文，
      典正驯雅，卓然名家」。通行本《澹园集》四十九卷、《续集》三十五卷，卷数诸本不一
      （今人整理本作正集四十九卷、续集二十七卷）。
  - title: 庄子翼
    type: 学术
    status: 存世
    note: >-
      八卷，附《庄子阙误》一卷、《附录》一卷，成于万历十六年戊子，体例同《老子翼》。
      前列所载书目自郭象注以下二十二家，旁引他说互相发明者自支遁以下十六家。《四库全书总目》
      子部道家类著录（安徽巡抚采进本），馆臣谓「明代自杨慎以后，博洽者无过于竑，
      其所引据究多古书，固较流俗注本为有根柢矣」（引文并卷次详见 `src_siku_zhuangziyi`）。
  - title: 老子翼、老子考异
    type: 学术
    status: 存世
    note: >-
      三卷，附《老子考异》一卷。辑韩非以下解《老子》者六十四家，附以己之《笔乘》，
      共六十五家，各采精语，其首尾完具者仿李鼎祚《周易集解》之例标举姓名，
      音义训诂一字一句者仿裴骃《史记集解》之例联贯缀于章末。《四库全书总目》子部道家类著录
      （浙江巡抚采进本），馆臣称其「去取亦特精审」，「于二氏之学本深于儒学」。
  - title: 国史经籍志
    type: 目录
    status: 存世
    note: >-
      六卷，一名《经籍志》。万历中开史局议修国史，焦竑专领其事所撰初稿，《明史》本传
      「乃先撰《经籍志》，其他率无所撰，馆亦竟罢」即指此。其为《明史·艺文志》之前身之一，
      今通行本题《国史经籍志》。
