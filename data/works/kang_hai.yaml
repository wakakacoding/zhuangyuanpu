person_id: kang_hai
works:
  - title: 对山集
    type: 别集
    status: 存世
    note: >-
      《四库全书总目》卷一百七十一集部别集类著录十卷（湖北巡抚采进本），别有十九卷本。
      馆臣记其诗文集「自明以来凡四刻」：一为张太微选本，一为王世懋选本，康熙中
      其里人马氏裒全集刻于江宁，乾隆辛巳里人编修孙景烈就张太微本再加刊削，即四库所据之本。
      馆臣评曰「明人论海集者是非不一，要以俞汝成『文过于诗』一语为不易之评」，又谓
      其《拟廷臣论宁夏事状》《铸钱论》诸篇「尤颇切时弊」，「其逸气往来，翛然自异，
      固在李梦阳等割剥秦汉者上也」；并记「崔铣、吕柟皆以司马迁比之，诚为太过」。
  - title: 武功县志
    type: 地理
    status: 存世
    note: >-
      三卷，七篇（地理、建置、祠祀、田赋、官师、人物、选举），《四库全书》史部地理类
      著录。其书削地志繁滥之例：山川城郭古迹宅墓并入地理，官署学校津梁市集归入建置，
      祠庙寺观总以祠祀，户口物产附于田赋，艺文用《吴郡志》例散附各条，官师则善恶并著
      以寓劝惩。王士禛称其「文简事核，训词尔雅」；石邦教称「乡国之史莫良于此」。
      志刻于正德己卯（十四年，1519），卷首有吕柟序（自称「吾友康子德涵」）与何景明序。
      明清数百年推为名志第一，乾隆二十六年武功知县玛星阿得抄本于孙景烈重刊。
  - title: 沜东乐府
    type: 散曲
    status: 存世
    note: >-
      二卷（《续修四库全书·集部·曲类》著录作一卷）。初刊本为嘉靖三年（1524）其从弟
      康浩所刻，卷首有康海自序、后有康浩跋，收小令 230 首、套数 32 套，多为叹世、闲适之作。
      另有《沜东乐府后录》，今人陈靝沅整理、孙崇涛审订，与本书合编为《康海散曲集校笺》
      （浙江古籍出版社，2011）。康海家设家班，自操琵琶，与王九思同被目为明代北曲一支劲军。
  - title: 东郭先生误救中山狼
    type: 戏曲
    status: 存世
    note: >-
      杂剧，一卷四折，简名《中山狼》。取材于其师马中锡《中山狼传》，演东郭先生救狼而
      险被狼噬、终赖杖藜老人设计杀狼之事；剧中狼、老杏、老牛皆能言，为古戏中所独创。
      《远山堂剧品》著录，今存《盛明杂剧》本与孟称舜《酹江集》本。世传其讥李梦阳
      （参见轶事栏），本站作传说层备录，不作定论。
  - title: 王兰卿贞烈传
    type: 戏曲
    status: 存世
    note: >-
      杂剧。原题作《张于鹏为养仕青州，晁阳春嫁女辞烟花》，正名作《富家郎设计探姻亲，
      王兰卿服信明贞烈》。演盩厔乐户女王兰卿与张于鹏相守之事，与其《中山狼》同为
      康海罢官后制乐造曲的产物。
  - title: 张氏族谱
    type: 谱牒
    status: 待考
    note: >-
      《国朝献征录》卷二十一《翰林院修撰康公海传》著录其著述为「武功志及张氏族谱、
      对（山）文集」三书。传本未见四库著录，status 记「待考」。
