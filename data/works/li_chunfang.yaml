# 李春芳著作（R4-T1 批次 4，2026-10-24）
person_id: li_chunfang
works:
  - title: 宗藩条例
    type: 政书
    status: 存世
    note: >-
      任礼部尚书时考订宗藩故事为书进呈，世宗嘉之赐名颁行。明代宗禄制度化的
      关键文献，《明史》本传特书。
  - title: 贻安堂集
    type: 别集
    status: 存世（四库存目）
    note: >-
      十卷，《四库全书总目》别集类存目著录。以北京赐第「贻安堂」名集
      （堂号来源今人叙述，待核）。提要全条待核。
  - title: （传）西游记校者「华阳洞天主人」
    type: 校刊
    status: 存疑
    note: >-
      明刊本《西游记》题「华阳洞天主人校」，有说即春芳（清人发端，无定论）。
      录为存疑托名，不计入确定著作。
