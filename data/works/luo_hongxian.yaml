person_id: luo_hongxian
works:
  - title: 广舆图
    type: 地理
    status: 存世
    note: >-
      二卷。《明史·艺文志》著录作「增补朱思本广舆图」。其本据元人朱思本《舆地图》
      （以计里画方之法绘成，原图已佚）增订而成，凡为图四十、副图六十有八，缩小改绘
      两直隶十三布政司图，又增九边、诸边、黄河、漕河、海运、朝鲜、朔漠、安南、
      西域及东南、西南海夷诸图，并首列图例符号二十四种，为我国现存最早的刻本综合地图集。
      诸家书目于初刻之年皆无定说（国图藏本著录即称「自序不署年月，初刻于何时今不可考」）；
      嘉靖四十三年（1564）其同年胡松以稿本付梓并增日本、琉球二图，此后万历七年（1579）
      钱岱等递有翻刻，明清舆图多据此为底本。
  - title: 念庵集
    type: 别集
    status: 存世
    note: >-
      二十二卷，《四库全书总目》卷一百七十二集部别集类著录（江西巡抚采进本）。
      其集初刻于抚州，再刻于应天，最后由诸门人编定；四库所据本为雍正癸卯（元年）
      其六世孙继洪等重刻本。馆臣谓其「不及见王守仁，而受学于其乡人李中，中之学出于杨珠，
      故其说仍以良知为宗」，又评其学「惟静观本体，亦究不免于入禅」，而「人品高洁，
      严嵩欲荐之而不得」。集内门人序称其「学凡三变，文亦因之」。
  - title: 别本罗念庵集
    type: 别集
    status: 存世
    note: >-
      十三卷，《四库全书总目》卷一百七十七集部别集类存目著录（浙江汪汝瑮家藏本）。
      为嘉靖癸亥（四十二年，1563）其同年滁阳胡松所刻，凡书二卷、杂著一卷、序记、
      传状、铭、表各一卷、祭文及杂文二卷、古律诗二卷。馆臣称「盖初刊之本，非其全帙也」
      ——刻于其卒前一年。
  - title: 冬游记
    type: 游记
    status: 存世
    note: >-
      一卷，经《四库全书》著录（《念庵集》提要及《别本罗念庵集》提要两处均称
      「洪先有《冬游记》已著录」；其本书卷次待核）。记其出游访学之行，为研究罗洪先
      交游与讲学行迹的第一手材料。另据今人整理，其游南岳所作诗文及「状元松」等遗迹
      亦与此行相关。
  - title: 易解
    type: 学术
    status: 待考
    note: >-
      一卷，《明史·艺文志》志第七十二（艺文一·经部易类）著录。传本未见四库著录，
      status 记「待考」。
  - title: 周礼疑
    type: 学术
    status: 待考
    note: >-
      一卷，《明史·艺文志》志第七十二（艺文一·经部礼类）著录。传本未见四库著录，
      status 记「待考」。
