person_id: luo_lun
works:
  - title: 一峰集
    type: 别集
    status: 存世
    note: >-
      十卷。《四库全书总目》卷一百七十一集部别集类著录（浙江汪汝瑮家藏本），馆臣评曰：
      「今览其文，刚毅之气，形于楮墨。诗亦磊砢不凡，虽执义过坚，时或失于迂阔。又喜排叠
      先儒传注成语，少淘汰之功，或失于繁冗。然亦多心得之言，非外强中干者比也。」其集以
      「其人足重」，故所附《梦稿》亦得并存。《明儒学案》卷四十五录其「要语」一门（如
      「治己必先治心，心者舟之柁也」等），即出自此集。
  - title: 梦稿
    type: 别集
    status: 存世
    note: >-
      二卷，附《一峰集》以传。《四库全书总目》：「后载《梦稿》二卷，记梦之词至三百馀首，
      隐约幻渺，几莫测其用意所在，亦文集中罕见之体。以其人足重，故得附本集以传。」
      此为明人文集中极罕见之专记录梦之作，可资研究其心迹与明人梦观。
  - title: 周易传注、礼记集注、春秋说
    type: 学术
    status: 待考
    note: >-
      归隐金牛山后「注意经学」之撰述。《明儒学案》记：「《周易》多修传注，间补己意；
      《礼记》汇集儒先之见，而分章记礼，则先生独裁；《春秋》则不取褒贬凡例之说，以为
      《春秋》缘人以立法，因时以措宜，犹化工焉，因物而赋物也，以凡例求《春秋》者，
      犹以画笔摹化工，其能肖乎？」其《春秋》说不取褒贬凡例之义，在明人《春秋》学中
      自成一说。三种皆未见传本著录，故 status 记「待考」，不强断存佚。
