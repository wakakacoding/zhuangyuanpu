person_id: lv_nan
works:
  - title: 四书因问
    type: 学术
    status: 存世
    note: 《明史》本传作「四书因问」；《四库全书总目》经部四书类著录六卷。
  - title: 易说翼
    type: 学术
    status: 存世
    note: 《明史》本传作「易说翼」；《四库全书总目》著录作《周易说翼》三卷，书名小异。
  - title: 书说要
    type: 学术
    status: 存世
    note: 《四库全书总目》著录五卷。
  - title: 诗说序
    type: 学术
    status: 存世
    note: 《四库全书总目》著录作《毛诗序说》六卷，书名小异。
  - title: 春秋说志
    type: 学术
    status: 存世
    note: 《四库全书总目》著录五卷。
  - title: 礼问内外篇
    type: 学术
    status: 存世
    note: 《四库全书总目》著录作《礼问》二卷，即内外篇。
  - title: 史约
    type: 史部
    status: 待考
    note: 本传著录，未见四库著录，传本待考。
  - title: 小学释
    type: 学术
    status: 待考
    note: 本传著录，未见四库著录，传本待考。
  - title: 寒暑经图解
    type: 学术
    status: 待考
    note: 《明史》本传作「寒暑经图解」；《明史·艺文志》著录一卷。
  - title: 史馆献纳
    type: 奏议
    status: 待考
    note: 本传著录，为其在史馆时所上，传本待考。
  - title: 宋四子抄释
    type: 学术
    status: 存世
    note: >-
      摘抄注释宋四子（周、程、张、朱）之书。《四库全书总目》分著为《周子抄释》三卷、
      《张子抄释》六卷、《朱子抄释》二卷。
  - title: 南省奏槁
    type: 奏议
    status: 待考
    note: 本传作「南省奏槁」，一作「南省奏稿」，在南都时所上奏疏，传本待考。
  - title: 泾野诗文集
    type: 诗文
    status: 存世
    note: >-
      《四库全书总目》别集类著录作《泾野集》三十六卷，提要称其学「大旨不失醇正」，
      而「颇刻意于字句，好以诘屈奥涩为高古」。另有《泾野文集》《泾野诗集》之分。
  - title: 泾野子内篇
    type: 学术
    status: 存世
    note: >-
      二十七卷，《四库全书总目》子部儒家类著录（陕西巡抚采进本）。门人所编语录，
      分云槐精舍语、东林书屋语、端溪问答、解梁书院语、柳湾精舍语、鹫峰东所语、
      太常南所附邵伯舟中语、太学语、春官外署语、礼部北所语等目，其子吕畇等类次刻之。
