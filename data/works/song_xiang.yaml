# 宋庠著作（R4-T1 批次 5，2026-10-25）
person_id: song_xiang
works:
- title: 国语补音
  type: 经史校释
  status: 存世（辑本通行）
  note: 本传明文：「善正讹谬，尝校定《国语》，撰《补音》三卷。」 宋庠《国语补音》三卷为《国语》音义之学的要籍，今有传本。
- title: 纪年通谱
  type: 编年
  status: 佚（辑存）
  note: 本传明文：「又辑《纪年通谱》，区别正闰，为十二卷。」区别正统与 闰位的编年谱，宋人正统论的代表性文献之一。原书久佚， 有后人辑引（存佚详情待核）。
- title: 掖垣丛志
  type: 掌故
  status: 佚
  note: 本传明文著录三卷，知制诰任上所记翰林掌故。久佚。
- title: 尊号录
  type: 掌故
  status: 佚
  note: 本传明文著录一卷。久佚。
- title: 宋元宪集（宋庠集）
  type: 别集
  status: 存世
  note: 本传「别集四十卷」即宋人所谓《元宪集》。宋庠封莒国公（元宪为谥前 所进号，旧题或作元宪），今通行本《宋元宪集》从《永乐大典》辑出， 与本传四十卷本非全帙（辑本卷数待核）。
