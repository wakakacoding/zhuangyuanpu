# 宋庠著作（R4-T1 批次 5，2026-10-25）
person_id: song_xiang
works:
- title: 国语补音
  type: 经史校释
  status: 存世（辑本通行）
  note: 本传明文：「善正讹谬，尝校定《国语》，撰《补音》三卷。」 宋庠《国语补音》三卷为《国语》音义之学的要籍，今有传本。
- title: 纪年通谱
  type: 编年
  status: 佚（辑存）
  note: 本传明文：「又辑《纪年通谱》，区别正闰，为十二卷。」区别正统与 闰位的编年谱，宋人正统论的代表性文献之一。原书久佚， 有后人辑引（存佚详情待核）。
- title: 掖垣丛志
  type: 掌故
  status: 佚
  note: 本传明文著录三卷，知制诰任上所记翰林掌故。久佚。
- title: 尊号录
  type: 掌故
  status: 佚
  note: 本传明文著录一卷。久佚。
- title: 宋元宪集（宋庠集）
  type: 别集
  status: 存世
  note: 四十卷（永乐大典本，《四库全书总目》卷152，2026-10-25 已核原条）。《直斋书录解题》《文献通考》作四十四卷（疑并《掖垣丛志》《尊号录》编入集中）；提要：「以类排比仍可得四十卷，疑当时全部收入也。」今通行本即四库辑本（商务国学基本丛书本作三十六卷）。
