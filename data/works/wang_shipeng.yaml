person_id: wang_shipeng
works:
  - title: 梅溪集
    type: 别集
    status: 存世
    note: >-
      五十四卷。其子闻诗、闻礼编次，正统五年（1440）温州教授何㶇校、知府刘谦刻，黄淮为序；
      凡奏议五卷冠以廷试策，前集二十卷、后集二十九卷，附汪应辰所撰墓志。卷数三说并存：
      《四库全书总目》据家藏本作五十四卷，《文献通考》作三十二卷续集五卷（载刘珙序），
      汪应辰墓志则称「梅溪前后集五十卷」——馆臣疑为初稿、晚年续增稿与身后定稿之别。
      今《文渊阁四库全书》收录。又集中《尚书》《春秋》《论语》《孟子》讲义皆未成书，
      后集第二十七卷所载数条系后人搜辑续入。
  - title: 会稽三赋
    type: 诗赋
    status: 存世
    note: >-
      三卷，于《梅溪集》外别行。一篇为《会稽风俗赋》（仿《三都赋》体，历叙其地山川、
      物产、人物、古迹），一篇为《民事堂赋》（民事堂即绍兴中添差签判厅之公堂，
      十朋始重建于车水坊），一篇为《蓬莱阁赋》（阁以元稹诗「谪居犹得住蓬莱」得名）。
      初嵊县周世则注《会稽风俗赋》，郡人史铸为之增注并注后二赋，末有嘉定丁丑（1217）
      史铸自跋。《四库全书总目》卷七十著录（礼部尚书曹秀先家藏本）。
  - title: 东坡诗集注
    type: 学术
    status: 待考
    note: >-
      三十二卷，一称《集注分类东坡先生诗》，旧本题王十朋撰，《四库全书》据以著录。
      四库馆臣考其书为「一时书肆所为，借十朋之名以行」——据《梅溪集》前后集载序十一篇
      而无此书序、集中读苏文三则无一字及苏诗、赵夔序所述与苏过游从之年与苏过卒年不合
      三条立论。此考为后世聚讼之始，今人研究对王十朋与「百家注东坡诗」之关系仍有异说，
      本站两说并存，status 记「待考」。参见轶事栏该条。
  - title: 尚书、春秋、论语、孟子讲义
    type: 学术
    status: 佚
    note: >-
      汪应辰所撰墓志云：「公有梅溪前后集五十卷，尚书、春秋、论语、孟子讲义，皆指授学者，
      未成书也。」《四库全书总目》据此辨《梅溪集》后集所载讲义数条为后人搜辑续入。
      以其未成书，故传本无考，status 记「佚」。
