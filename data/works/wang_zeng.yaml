person_id: wang_zeng
works:
  - title: 王文正笔录
    type: 笔记
    status: 存世
    note: >-
      一卷，记太祖、太宗、真宗朝旧闻三十余条。《宋史·艺文志》未收，《四库全书总目》
      入子部小说家类（江苏巡抚采进本），馆臣称「曾练习掌故，所言多确凿可据」，
      李焘作《续资治通鉴长编》往往全采其文。四库本目皆题《王文正笔录》，
      后世亦题《笔录》或《王文正公笔录》。
  - title: 九域图
    type: 地理
    status: 佚
    note: 三卷，《宋史·艺文志》卷二百四地理类著录。
  - title: 契丹志
    type: 地理
    status: 佚
    note: 一卷，《宋史·艺文志》卷二百四地理类著录。
  - title: 有物混成赋
    type: 诗赋
    status: 佚
    note: >-
      咸平五年（1002）殿试所试之赋。《隆平集》称「所试有物混成赋，天下以为赋格」，
      为当时场屋范本。原文今不存。
  - title: 文集
    type: 别集
    status: 佚
    note: >-
      卷数两说：《隆平集》作「有文集五十卷」，后世著录多作五十七卷——两说并存备考。
      《宋史·艺文志》未著录其文集。
