person_id: wu_kuan
works:
  - title: 匏翁家藏集
    type: 别集
    status: 存世
    note: >-
      又称《匏庵集》，七十卷（诗三十卷、文四十卷），明正德刻本。
      《明史·艺文志》著录。吴宽为文不事雕琢，「纾徐则有欧之态，老成则有韩之格」（今人评语），
      为成化、弘治间吴门文苑领袖，书法尤工，最好苏学。
  - title: 家藏集
    type: 别集
    status: 存世
    note: >-
      《匏翁家藏集》之省称，同书异名，著录于《明史·艺文志》。本条为避免漏检而立，
      与上条为同一部书。
