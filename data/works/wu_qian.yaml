# 吴潜著作（R4-T1 批次 8，2026-10-25）
person_id: wu_qian
works:
- title: 履斋遗集
  type: 别集
  status: 存世（四库存目）
  note: 四库本名《履斋遗稿》（2026-10-25 已核）。词在卷二「诗余」；明末梅鼎祚编校《履斋先生遗集》四卷（诗一卷词一卷杂文二卷）；《彊村丛书》本《履斋先生诗余》一卷、续集一卷、别集二卷，收词二百五十余首。嘉庆宁国府志载吴潜另著《论语士说》《许国公奏稿》《鸦涂集》。
- title: 履斋先生诗余
  type: 词集
  status: 存世
  note: 存词二百五十余首（《彊村丛书》本，2026-10-25 已核）。名篇《满江红·豫章滕王阁》《满江红·送李御带珙》等见《履斋遗稿》卷二「诗余」（维基文库核对）；「报国无门空自怨，济时有策从谁吐」为其壮志未酬的自况名句。
- title: 许国公奏议
  type: 奏议
  status: 存世（辑本）
  note: 封许国公，故后人辑其奏议为编（今人著录，辑本详情待核）。 端平九事、谏用兵复河南诸疏为其政论代表，原文多存《宋史》本传。
