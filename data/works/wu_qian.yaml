# 吴潜著作（R4-T1 批次 8，2026-10-25）
person_id: wu_qian
works:
- title: 履斋遗集
  type: 别集
  status: 存世（四库存目）
  note: 吴潜号履斋，《履斋遗集》四库存目著录（卷帙与提要内容待核）。 其《履斋先生诗余》（词集）别行。
- title: 履斋先生诗余
  type: 词集
  status: 存世
  note: 南宋重要词人，存词二百六十余首（今人辑校著录通行），与姜夔、吴文英 并见南宋词史。名篇如《满江红·豫章滕王阁》等（篇目待核原集）。
- title: 许国公奏议
  type: 奏议
  status: 存世（辑本）
  note: 封许国公，故后人辑其奏议为编（今人著录，辑本详情待核）。 端平九事、谏用兵复河南诸疏为其政论代表，原文多存《宋史》本传。
