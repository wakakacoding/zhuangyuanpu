# 徐元杰著作（R4-T1 批次 6，2026-10-25）
person_id: xu_yuan_jie
works:
- title: 梅野集
  type: 别集
  status: 存世（四库辑本）
  note: 十二卷（永乐大典本，《四库全书总目》卷164，2026-10-25 已核原条）。原二十五卷，景定二年其子直谅知兴化州时刊（旧有赵汝腾序），世久失传；四库馆臣从《永乐大典》辑为杂文十一卷、诗词一卷，「仅存十之五六」。
- title: （奏议）史嵩之起复疏
  type: 奏议
  status: 存文（见本传著录）
  note: 淳祐四年轮对攻史嵩之起复疏，「疏出，朝野传诵」——南宋政论文名篇， 本传大段录其原文。
