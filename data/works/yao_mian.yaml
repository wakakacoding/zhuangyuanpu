# 姚勉著作（R4-T1 批次 4，2026-10-24）
person_id: yao_mian
works:
  - title: 雪坡舍人集
    type: 别集
    status: 存世
    note: >-
      五十卷，遗著由侄姚龙起编次，文及翁序。今存影宋抄本（藏南京图书馆）、
      文渊阁四库全书本、《豫章丛书》本（附胡仲云祭文）。词三十二首见《全宋词》，
      诗十一卷见《全宋诗》，文二十一卷见《全宋文》。以自号雪坡名集。
  - title: （札）论时政封事诸篇
    type: 奏议
    status: 存世（入集）
    note: >-
      弹劾丁大全封事及廷对诸篇收在《雪坡舍人集》内，《四库总目》特举为
      「论时政之谬、辨宰相之奸，皆侃侃而不阿」。单行本未见著录，
      归入别集不计独立种数。
