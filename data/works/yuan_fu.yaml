person_id: yuan_fu
works:
  - title: 蒙斋集
    type: 别集
    status: 存世（辑本）
    note: >-
      原集四十卷久佚，清四库馆臣自《永乐大典》辑为《蒙斋集》二十卷（诗二卷），
      另有武英殿聚珍版本增拾遗一卷。以其号蒙斋名集。
  - title: 江东荒政录
    type: 政书
    status: 佚
    note: >-
      本传著录：「有《孝說》、《孟子解》、《後省封駁》、《信安志》、《江東荒政錄》、
      《防拓錄》、《樂事錄》及文集行世。」江东荒政为其治绩之最，此录即持节江东五年
      赈荒之政务记录，今佚。
  - title: 蒙斋中庸讲义
    type: 学术
    status: 存世
    note: 四卷，《四库全书》本。陆学一脉的经解著作。
