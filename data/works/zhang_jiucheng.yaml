person_id: zhang_jiucheng
works:
  - title: 横浦集（横浦先生文集）
    type: 别集
    status: 存世
    note: >-
      二十卷，门人郎晔（一作郎昱）编次，凡赋诗四卷、杂文十六卷；集中如《书传统论》
      《春秋讲义》《孟子拾遗》亦多说经之作。《四库全书总目》卷一百五十八集部别集类著录
      （江苏巡抚采进本），馆臣称其「立身自有本末」，廷试对策「可称谠论」，并辨陆游所记
      「桂子飘香」之嘲与洪迈所记南安祭洪皓之文（详见轶事栏）。原本附刻《心传》《日新》二录，
      馆臣以其已有单本别行，从删。
  - title: 孟子传
    type: 学术
    status: 存世
    note: >-
      二十九卷，一作《孟子解》十四卷（《文献通考》所载，实系传写之误）。今本《尽心篇》已佚，
      《告子篇》以上存二十九卷。《四库全书总目》卷三十五经部四书类著录（内府藏本），
      馆臣考其撰书之由——因冯休《删孟子》、李觏《常语》、司马光《疑孟》、晁说之《诋孟》等
      排斥孟子之作，而「特发明于义利经权之辨，著《孟子》尊王贱霸有大功，拨乱反正有大用」，
      并定评曰「在九成诸著作中，此为最醇」。《宋史·艺文志》另载《孟子拾遗》一卷，
      今附载《横浦集》中。
  - title: 中庸说
    type: 学术
    status: 存世
    note: >-
      三卷。此为其「以未发之中为主」之学的核心文本（《四库总目》云「少受业于杨时，
      以未发之中为主」）。朱熹撰《杂学辨》，所驳正者凡四家，其一即《张无垢中庸解》
      ——《四库总目》记「朱子作《杂学辨》，所驳正者凡四家，九成实居其一」；全祖望则谓
      「龟山弟子以风节光显者，无如横浦，而驳学亦以横浦为最。晦翁斥其书，比之洪水猛兽之灾」。
      此书包、朱之争，为南宋道学内部一大公案。
  - title: 横浦心传录
    type: 学术
    status: 存世
    note: >-
      与《横浦日新》同为语录体。《四库总目》谓「所作《心传》、《日新》二录，大抵以禅机诂儒理」，
      故朱子《杂学辨》颇议其非；馆臣又谓其原本附刻于《横浦集》后，以其已有单本别行，
      故从《横浦集》中删削不更复出。《宋元学案》卷四十「横浦心传」一门，即摘录其语录
      （如「学问于平淡处得味，方可以入道」之类）。
  - title: 横浦日新（一称无垢录）
    type: 学术
    status: 存世
    note: >-
      语录体，与《横浦心传录》并行。《宋元学案》云濠案列其目作《无垢录》，《四库总目》
      作《日新》二录之一。以「禅机诂儒理」而遭朱子之讥，然亦可见其学杂糅儒释之实。
  - title: 尚书详说、大学说、孝经解、论语解
    type: 学术
    status: 佚
    note: >-
      四种并为经解。《宋元学案》卷四十云濠案：「先生著有《尚书》《大学》《中庸》《孝经》
      《论语》《孟子说》、《无垢录》、《横浦心传》。」《四库总目》谓「九成研精经学，
      于诸经皆有训释……今所作经解惟《孟子传》仅存」，余皆散佚；今人整理本《横浦集》
      之《书传统论》《论语解》诸条，系后人辑存之残篇。故四者并列，status 记「佚」。
