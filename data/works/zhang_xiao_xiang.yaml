# 张孝祥著作（R4-T1 批次 4，2026-10-24）
person_id: zhang_xiao_xiang
works:
  - title: 于湖居士文集
    type: 别集
    status: 存世
    note: >-
      四十卷（诗三十七卷、附录一卷等，今人徐鹏校点本据宋本整理）。
      以其号于湖居士名集。谢尧仁序称「自渡江以来，将近百年，惟先生文章翰墨，
      为当代独步」。
  - title: 于湖词
    type: 词集
    status: 存世
    note: >-
      存词一百七十余首。《四库总目》谓其词「屏去浮艳，独存本色」；
      与张元干并称南渡初期词坛双璧，上承苏轼、下开辛弃疾爱国词派先河。
      代表作《六州歌头·长淮望断》《念奴娇·过洞庭》《水调歌头·闻采石矶战胜》。
  - title: 克斋文集（一说）
    type: 别集
    status: 待考
    note: >-
      今人叙述偶见「克斋」为其斋名之说，文集卷数与刊本未核，
      不强断存佚，存此备考。
