# 张元忭著作（R4-T1 批次 6，2026-10-25）
person_id: zhang_yuan_bian
works:
- title: 不二斋文选（张阳和集）
  type: 别集
  status: 存世（四库存目）
  note: 七卷（《四库全书总目》别集类存目，卷179，浙江巡抚采进本，2026-10-25 已核原条）——文六卷诗一卷，「亦无语录粗鄙之习」。四库存目丛书集部154据湖北省图书馆藏明万历张汝霖张汝懋刻本影印（附附录一卷）。提要并录明史儒林传评语（矩矱俨然无蹈入禅寂之病）。
